name: Test Jupyter Notebooks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  math-compatibility:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Test math compatibility checks
      run: python -m unittest tools.tests.test_math_formula_compatibility
    - name: Test migrated test entry points
      run: python -m unittest tools.tests.test_test_entrypoints
    - name: Check reviewed topic math without Node or network
      run: >-
        python tools/check_math_formula_symbols.py
        --github-compatible --static-only
        --dir topic_discussion/post_training_optimization
        --dir topic_discussion/operator_optimization

  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/torch-cpu.txt
        pip install -r requirements.txt
        pip install nbconvert termcolor
        
    - name: Check shared contracts and project structure (CPU-only)
      run: >-
        python -m unittest
        tools.tests.test_project_contracts
        tools.tests.test_part02_project_structure
        tools.tests.test_quantization_project_contracts
        tools.tests.test_project_contract_entrypoints
        tools.tests.test_part05_integrated_projects

    - name: Run notebook verification (CPU-only, skip GPU-dependent notebooks)
      run: |
        python verify.py part0_1 --no-build
        python verify.py part2 --no-build
        python verify.py part3 --no-build
        python verify.py part4 --no-build
