  <text x="135" y="245" font-family="Arial, sans-serif" font-size="15" fill="#334433">Multilingual coverage</text>
  <text x="145" y="266" font-family="Arial, sans-serif" font-size="15" fill="#334433">Engineering-stable tokenizer</text>
  <text x="165" y="287" font-family="Arial, sans-serif" font-size="15" fill="#334433">Long-context baseline</text>

