<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">同一份共享子块，保护两段不同依赖</title><desc id="desc">线程先协作装入两路数据，第一次同步后读取共享子块。第二次同步保证所有读取结束，再覆盖下一轮子块。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:24px;fill:#1e293b}.title{font-size:30px;font-weight:700}.small{font-size:21px}.label{font-size:23px;font-weight:700}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="45" y="54" class="title">同一份共享子块，保护两段不同依赖</text><rect x="45" y="200" width="270" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="240" text-anchor="middle" class="label">协作装载 A / B</text><text x="180" y="277" text-anchor="middle" class="small">每线程搬运两个元素</text><rect x="425" y="200" width="270" height="110" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="560" y="240" text-anchor="middle" class="label">第一次同步</text><text x="560" y="277" text-anchor="middle" class="small">整块写入完成后再读</text><rect x="805" y="200" width="270" height="110" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="940" y="240" text-anchor="middle" class="label">共享子块乘加</text><text x="940" y="277" text-anchor="middle" class="small">多个输出复用同一输入</text><rect x="1185" y="200" width="270" height="110" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="1320" y="240" text-anchor="middle" class="label">第二次同步</text><text x="1320" y="277" text-anchor="middle" class="small">整块读取完成后再覆盖</text><path d="M315 255 H425" class="edge"/><path d="M695 255 H805" class="edge"/><path d="M1075 255 H1185" class="edge"/><path d="M1320 310 V395 H180 V310" class="edge"/><text x="750" y="431" class="small" text-anchor="middle">下一段 K：复用共享数组，保留输出部分和</text></svg>
