<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">双缓冲按地址轮换，等待约束实际读取</title><desc id="desc">一个线程独占两块缓冲区中的对应位置。先提交下一批，再等待当前批次完成后消费，最后进入下一轮。图表示依赖次序，不表示实测重叠。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:24px;fill:#1e293b}.title{font-size:30px;font-weight:700}.small{font-size:21px}.label{font-size:23px;font-weight:700}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="45" y="54" class="title">双缓冲按地址轮换，等待约束实际读取</text><rect x="45" y="185" width="270" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="225" text-anchor="middle" class="label">预先提交 tile 0</text><text x="180" y="262" text-anchor="middle" class="small">写入 buffer[0][tid]</text><rect x="425" y="185" width="270" height="110" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="560" y="225" text-anchor="middle" class="label">提交 tile 1</text><text x="560" y="262" text-anchor="middle" class="small">写入 buffer[1][tid]</text><rect x="805" y="185" width="270" height="110" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="940" y="225" text-anchor="middle" class="label">等待并读取 tile 0</text><text x="940" y="262" text-anchor="middle" class="small">当前批次完成才可消费</text><rect x="1185" y="185" width="270" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="1320" y="225" text-anchor="middle" class="label">进入下一轮</text><text x="1320" y="262" text-anchor="middle" class="small">提交 tile 2，复用 buffer[0]</text><path d="M315 240 H425" class="edge"/><path d="M695 240 H805" class="edge"/><path d="M1075 240 H1185" class="edge"/><text x="1130" y="220" class="small" text-anchor="middle">读取完成</text><text x="45" y="390" class="small">作用域：thread_scope_thread。每线程只读自己的位置；不是块级生产者／消费者队列。</text><text x="45" y="430" class="small">填充时先有第一批；稳态轮换两块地址；排空时只消费最后一批，不再提交。</text></svg>
