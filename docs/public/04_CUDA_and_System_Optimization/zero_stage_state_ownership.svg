<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">ZeRO-2 与 ZeRO-3 的状态归属比较</title>
<desc id="desc">构造的两rank模型，A与B表示模型位置分片。ZeRO-2中两rank都保有完整参数，梯度和优化器状态已按A与B分片；ZeRO-3再分片参数。箭头比较改变stage后的归属，不是运行时数据迁移，也不表示内存峰值减半。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:21px}.note{font-size:19px}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#fff"/>
<text class="title" x="750" y="43" text-anchor="middle">梯度与优化器状态已分片，参数还可以继续分片</text>
<text class="note" x="750" y="80" text-anchor="middle">两 rank 示例；A／B是模型位置，P／G／O分别表示参数、梯度和优化器状态</text>
<text class="head" x="310" y="124" text-anchor="middle">ZeRO-2：参数仍完整</text>
<text class="head" x="1190" y="124" text-anchor="middle">ZeRO-3：参数也分片</text>
<rect x="40" y="150" width="540" height="115" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="310" y="181" text-anchor="middle">rank0</text><text class="body" x="310" y="216" text-anchor="middle">参数：P[A]、P[B]</text><text class="body" x="310" y="248" text-anchor="middle">梯度 G[A]；优化器状态 O[A]</text>
<rect x="40" y="300" width="540" height="115" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="310" y="331" text-anchor="middle">rank1</text><text class="body" x="310" y="366" text-anchor="middle">参数：P[A]、P[B]</text><text class="body" x="310" y="398" text-anchor="middle">梯度 G[B]；优化器状态 O[B]</text>
<rect x="920" y="150" width="540" height="115" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text class="head" x="1190" y="181" text-anchor="middle">rank0</text><text class="body" x="1190" y="216" text-anchor="middle">参数：P[A]</text><text class="body" x="1190" y="248" text-anchor="middle">梯度 G[A]；优化器状态 O[A]</text>
<rect x="920" y="300" width="540" height="115" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text class="head" x="1190" y="331" text-anchor="middle">rank1</text><text class="body" x="1190" y="366" text-anchor="middle">参数：P[B]</text><text class="body" x="1190" y="398" text-anchor="middle">梯度 G[B]；优化器状态 O[B]</text>
<path class="edge" d="M580 208 H920"/><path class="edge" d="M580 358 H920"/>
<text class="note" x="750" y="191" text-anchor="middle">比较改选 stage 后的归属</text><text class="note" x="750" y="341" text-anchor="middle">不是一次数据迁移</text>
</svg>
