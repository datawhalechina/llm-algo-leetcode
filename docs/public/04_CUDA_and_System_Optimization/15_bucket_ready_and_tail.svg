<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">通信总工作量相同，桶的就绪时刻改变尾部等待</title>
<desc id="desc">构造两种两桶时间线。反向均为0到10毫秒，每桶通信4毫秒且同流串行。早就绪为3到7与8到12，完成于12；晚就绪为6到10与10到14，完成于14。不表示真实设备收益。</desc>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.h{font-size:23px;font-weight:700}.s{font-size:21px}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="55" y="48" class="title">两桶通信都需八毫秒，晚就绪仍会拉长最后的等待</text>
<text x="55" y="87" class="s">构造时间线：反向10 ms、每桶通信4 ms；同一通信流串行，阶段耗时暂不考虑竞争。</text>
<g stroke="#cbd5e1" stroke-width="1"><path d="M230 105V395M390 105V395M550 105V395M710 105V395M870 105V395M1030 105V395M1190 105V395M1350 105V395"/></g>
<text x="55" y="150" class="h">较早就绪·反向</text><rect x="230" y="115" width="800" height="45" fill="#dbeafe" stroke="#2563eb"/>
<text x="55" y="210" class="s">通信A／B</text><rect x="470" y="175" width="320" height="45" fill="#fef3c7" stroke="#d97706"/><text x="630" y="207" text-anchor="middle" class="s">A：3–7</text>
<rect x="870" y="175" width="320" height="45" fill="#fef3c7" stroke="#d97706"/><text x="1030" y="207" text-anchor="middle" class="s">B：8–12</text>
<path d="M470 115V175M870 115V175" class="guide"/><text x="1220" y="207" class="s">完成12 ms</text>
<text x="55" y="300" class="h">较晚就绪·反向</text><rect x="230" y="265" width="800" height="45" fill="#dbeafe" stroke="#2563eb"/>
<text x="55" y="360" class="s">通信A／B</text><rect x="710" y="325" width="320" height="45" fill="#fef3c7" stroke="#d97706"/><text x="870" y="357" text-anchor="middle" class="s">A：6–10</text>
<rect x="1030" y="325" width="320" height="45" fill="#fef3c7" stroke="#d97706"/><text x="1190" y="357" text-anchor="middle" class="s">B：10–14</text>
<path d="M710 265V325M1030 265V325" class="guide"/>
<g class="s" text-anchor="middle"><text x="230" y="410">0</text><text x="390" y="410">2</text><text x="550" y="410">4</text><text x="710" y="410">6</text><text x="870" y="410">8</text><text x="1030" y="410">10</text><text x="1190" y="410">12</text><text x="1350" y="410">14 ms</text></g>
<text x="55" y="450" class="s">早就绪：尾部2 ms；晚就绪：尾部4 ms。扩大重叠仍需整步计时核对竞争与额外调用。</text>
</svg>
