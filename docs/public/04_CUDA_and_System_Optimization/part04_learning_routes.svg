<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">从内核、运行时或分布式问题进入，不必串行读完五组</title><desc id="desc">根据当前问题选入口；实线为推荐先后或进入关系，虚线为按需选型。各组按问题独立进入；选型只回看相关证据，不要求完成全部实验</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:19px}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.choice{stroke-dasharray:7 5}</style>
<rect width="1500" height="600" fill="#fff"/>
<text class="title" x="750" y="43" text-anchor="middle">从内核、运行时或分布式问题进入，不必串行读完五组</text>
<text class="note" x="750" y="80" text-anchor="middle">根据当前问题选入口；实线为推荐先后或进入关系，虚线为按需选型</text>
<g id="kernel"><rect x="40" y="130" width="340" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text class="head" x="210" y="169" text-anchor="middle">线程与内核</text><text class="body" x="210" y="204" text-anchor="middle">工作怎样映射、数据怎样复用</text></g>
<g id="g41"><rect x="520" y="130" width="340" height="100" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="690" y="169" text-anchor="middle">4.1 执行、访存与资源</text><text class="body" x="690" y="204" text-anchor="middle">索引、地址、协作与驻留</text></g>
<g id="g42"><rect x="1020" y="130" width="440" height="100" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="1240" y="169" text-anchor="middle">4.2 分块与数据复用</text><text class="body" x="1240" y="204" text-anchor="middle">共享内存、矩阵片段与内核流水</text></g>
<g id="runtime"><rect x="40" y="290" width="340" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text class="head" x="210" y="329" text-anchor="middle">任务之间的等待或占用</text><text class="body" x="210" y="364" text-anchor="middle">看提交、传输与数据寿命</text></g>
<g id="g43"><rect x="520" y="290" width="340" height="100" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="690" y="329" text-anchor="middle">4.3 运行时与显存</text><text class="body" x="690" y="364" text-anchor="middle">依赖、提交与缓冲寿命</text></g>
<g id="distributed"><rect x="40" y="450" width="340" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text class="head" x="210" y="489" text-anchor="middle">跨进程或状态驻留</text><text class="body" x="210" y="524" text-anchor="middle">看交换、归属与搬运</text></g>
<g id="g44"><rect x="520" y="450" width="340" height="100" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="690" y="489" text-anchor="middle">4.4 分布式训练系统</text><text class="body" x="690" y="524" text-anchor="middle">集合通信、分片与卸载</text></g>
<g id="g45"><rect x="1020" y="365" width="440" height="110" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text class="head" x="1240" y="404" text-anchor="middle">4.5 实现与硬件选型</text><text class="body" x="1240" y="439" text-anchor="middle">完整调用收益／同业务量成本</text></g>
<path class="edge" d="M380 180 H520" data-from="kernel" data-to="g41"/>
<path class="edge" d="M860 180 H1020" data-from="g41" data-to="g42"/>
<path class="edge" d="M380 340 H520" data-from="runtime" data-to="g43"/>
<path class="edge" d="M380 500 H520" data-from="distributed" data-to="g44"/>
<path class="edge choice" d="M1240 230 V365" data-from="g42" data-to="g45"/>
<path class="edge choice" d="M860 340 H940 V405 H1020" data-from="g43" data-to="g45"/>
<path class="edge choice" d="M860 500 H960 V445 H1020" data-from="g44" data-to="g45"/>
<text class="note" x="940" y="160" text-anchor="middle">块内协作与复用</text>
<text class="note" x="1260" y="300" text-anchor="start">需要实现／成本判断</text>
<text class="note" x="750" y="583" text-anchor="middle">各组按问题独立进入；选型只回看相关证据，不要求完成全部实验</text>
</svg>
