<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">比较线程地址，而不只看索引是否正确</title><desc id="desc">上排连续访问让八个 lane 共享一个 sector；下排跨步访问使各 lane 位于不同 sector。这是有明确假设的地址模型。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:24px;fill:#1e293b}.title{font-size:30px;font-weight:700}.small{font-size:21px}.label{font-size:23px;font-weight:700}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="45" y="54" class="title">比较线程地址，而不只看索引是否正确</text><text x="45" y="100" class="small">地址模型：32 个活跃 lane，每线程读 4 字节；sector 为 32 字节，起点对齐</text><text x="45" y="155" class="label">连续地址</text><text x="45" y="335" class="label">跨步地址</text><rect x="270" y="120" width="250" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="395" y="160" text-anchor="middle" class="label">lane 0–7</text><text x="395" y="197" text-anchor="middle" class="small">共享 1 个 sector</text><rect x="270" y="300" width="250" height="100" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="395" y="340" text-anchor="middle" class="label">lane 0</text><text x="395" y="377" text-anchor="middle" class="small">单独占用 1 个 sector</text><rect x="560" y="120" width="250" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="685" y="160" text-anchor="middle" class="label">lane 8–15</text><text x="685" y="197" text-anchor="middle" class="small">共享 1 个 sector</text><rect x="560" y="300" width="250" height="100" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="685" y="340" text-anchor="middle" class="label">lane 1</text><text x="685" y="377" text-anchor="middle" class="small">单独占用 1 个 sector</text><rect x="850" y="120" width="250" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="975" y="160" text-anchor="middle" class="label">lane 16–23</text><text x="975" y="197" text-anchor="middle" class="small">共享 1 个 sector</text><rect x="850" y="300" width="250" height="100" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="975" y="340" text-anchor="middle" class="label">lane 2</text><text x="975" y="377" text-anchor="middle" class="small">单独占用 1 个 sector</text><rect x="1140" y="120" width="250" height="100" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="1265" y="160" text-anchor="middle" class="label">lane 24–31</text><text x="1265" y="197" text-anchor="middle" class="small">共享 1 个 sector</text><rect x="1140" y="300" width="250" height="100" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="1265" y="340" text-anchor="middle" class="label">lane 3</text><text x="1265" y="377" text-anchor="middle" class="small">单独占用 1 个 sector</text><text x="270" y="260" class="small">32 个线程共涉及 4 个 sector</text><text x="270" y="445" class="small">相邻地址相隔 32 个元素：其余 lane 同样分散，共涉及 32 个 sector（非实测）</text></svg>
