<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">驻留块数取多个容量上界的最小值</title>
<desc id="desc">两种共享预留使用相同的线程槽和块数限制；最紧约束决定简化上界，多个约束可以并列。</desc>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:23px;fill:#1e293b}.title{font-size:30px;font-weight:700}.label{font-weight:700}.small{font-size:21px}.note{font-size:19px}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="53" class="title" text-anchor="start">驻留块数取多个容量上界的最小值</text>
<text x="45" y="95" class="small" text-anchor="start">简化构造模型：每块 256 线程；SM 有 2048 线程槽、64 KiB，最多 16 块</text>
<rect x="45" y="125" width="680" height="295" rx="8" fill="#fff" stroke="#94a3b8" data-layout-role="panel"/>
<text x="385" y="158" class="label" text-anchor="middle">每块共享预留 8 KiB</text>
<rect x="65" y="180" width="190" height="75" rx="8" fill="#dbeafe" stroke="#94a3b8" data-layout-role="node"/>
<text x="160" y="209" class="small" text-anchor="middle">线程槽约束</text>
<text x="160" y="241" text-anchor="middle">8 块</text>
<path d="M160 255 L285 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="290" y="180" width="190" height="75" rx="8" fill="#dbeafe" stroke="#94a3b8" data-layout-role="node"/>
<text x="385" y="209" class="small" text-anchor="middle">块数约束</text>
<text x="385" y="241" text-anchor="middle">16 块</text>
<path d="M385 255 L385 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="515" y="180" width="190" height="75" rx="8" fill="#fef3c7" stroke="#94a3b8" data-layout-role="node"/>
<text x="610" y="209" class="small" text-anchor="middle">共享容量约束</text>
<text x="610" y="241" text-anchor="middle">8 块</text>
<path d="M610 255 L485 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="235" y="315" width="300" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" data-layout-role="node"/>
<text x="385" y="345" class="label" text-anchor="middle">min(8, 16, 8) = 8</text>
<text x="385" y="375" class="small" text-anchor="middle">线程槽与共享容量并列</text>
<rect x="775" y="125" width="680" height="295" rx="8" fill="#fff" stroke="#94a3b8" data-layout-role="panel"/>
<text x="1115" y="158" class="label" text-anchor="middle">每块共享预留 16 KiB</text>
<rect x="795" y="180" width="190" height="75" rx="8" fill="#dbeafe" stroke="#94a3b8" data-layout-role="node"/>
<text x="890" y="209" class="small" text-anchor="middle">线程槽约束</text>
<text x="890" y="241" text-anchor="middle">8 块</text>
<path d="M890 255 L1015 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1020" y="180" width="190" height="75" rx="8" fill="#dbeafe" stroke="#94a3b8" data-layout-role="node"/>
<text x="1115" y="209" class="small" text-anchor="middle">块数约束</text>
<text x="1115" y="241" text-anchor="middle">16 块</text>
<path d="M1115 255 L1115 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1245" y="180" width="190" height="75" rx="8" fill="#fef3c7" stroke="#94a3b8" data-layout-role="node"/>
<text x="1340" y="209" class="small" text-anchor="middle">共享容量约束</text>
<text x="1340" y="241" text-anchor="middle">4 块</text>
<path d="M1340 255 L1215 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="965" y="315" width="300" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" data-layout-role="node"/>
<text x="1115" y="345" class="label" text-anchor="middle">min(8, 16, 4) = 4</text>
<text x="1115" y="375" class="small" text-anchor="middle">共享容量给出更紧上界</text>
<text x="750" y="451" class="small" text-anchor="middle">未计寄存器与分配粒度；这里算的是驻留上界，不是运行时平均占用率。</text>
</svg>
