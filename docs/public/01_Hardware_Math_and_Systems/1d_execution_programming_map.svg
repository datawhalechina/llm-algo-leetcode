<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">1D：执行映射与异步调度两条阅读支线</title>
<desc id="desc">执行映射从08编程模型分别进入CUDA的15执行层级、16块内协作，或Triton的18程序块映射。异步调度从07阶段放置依次进入17Stream基础与29高级调度。七节各自独立成节点，所有箭头连接具体小节并表示推荐阅读。</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.note{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}</style>
</defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">1D：执行映射与异步调度两条阅读支线</text>
<text class="note" x="640" y="76" text-anchor="middle">箭头表示推荐阅读；执行映射按 CUDA 或 Triton 选择路径，异步调度单独展开。</text>
<text class="head" x="200" y="145" text-anchor="middle">执行映射：工作怎样组织</text>
<rect x="50" y="210" width="300" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="200" y="242" text-anchor="middle">08 编程模型</text>
<text class="note" x="200" y="268" text-anchor="middle">框架、CUDA 与 Triton 的控制范围</text>
<rect x="490" y="130" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text class="head" x="640" y="162" text-anchor="middle">15 CUDA 执行层级</text>
<text class="note" x="640" y="188" text-anchor="middle">任务怎样覆盖线程与线程块</text>
<rect x="930" y="130" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text class="head" x="1080" y="162" text-anchor="middle">16 块内协作与复用</text>
<text class="note" x="1080" y="188" text-anchor="middle">共享内存、同步与资源限制</text>
<rect x="490" y="290" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text class="head" x="640" y="322" text-anchor="middle">18 Triton 程序块映射</text>
<text class="note" x="640" y="348" text-anchor="middle">Program、分块与边界掩码</text>
<path class="edge" d="M350 230H420V170H490"/>
<path class="edge" d="M350 270H450V330H490"/>
<path class="edge" d="M790 170H930"/>
<text class="note" x="418" y="155" text-anchor="middle">CUDA</text>
<text class="note" x="407" y="317" text-anchor="middle">Triton</text>
<text class="head" x="200" y="420" text-anchor="middle">异步调度：工作何时执行</text>
<rect x="50" y="450" width="300" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="200" y="482" text-anchor="middle">07 阶段放置</text>
<text class="note" x="200" y="508" text-anchor="middle">主机计算、设备计算与搬运</text>
<rect x="490" y="450" width="300" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
<text class="head" x="640" y="482" text-anchor="middle">17 Stream 基础</text>
<text class="note" x="640" y="508" text-anchor="middle">提交顺序、依赖与可重叠区间</text>
<rect x="930" y="450" width="300" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
<text class="head" x="1080" y="482" text-anchor="middle">29 高级调度</text>
<text class="note" x="1080" y="508" text-anchor="middle">Event、优先级与 Graph 回放</text>
<path class="edge" d="M350 490H490"/>
<path class="edge" d="M790 490H930"/>
</svg>
