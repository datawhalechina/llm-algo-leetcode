<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">同一张计算图，为什么会形成不同的执行路径？</title><desc id="desc">固定矩阵乘、加偏置和激活的计算语义。一方面比较图变换减少的调用与中间读写，另一方面检查目标支持的算子、数据类型、形状与工作区；两类条件共同决定可继续验证的执行路径。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#52677f"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.edge{stroke:#52677f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/>
<text x="640" y="45" text-anchor="middle" class="title">同一张计算图，为什么会形成不同的执行路径？</text>
<text x="640" y="76" text-anchor="middle" class="sub">先保留计算语义，再检查改写与目标条件；声明满足后仍需加载、数值对照和计时</text>
<rect x="350" y="110" width="580" height="80" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="640" y="141" text-anchor="middle" class="head">固定计算：矩阵乘 → 加偏置 → 激活</text><text x="640" y="168" text-anchor="middle" class="body">输入、输出与数值要求保持一致</text>
<rect x="200" y="280" width="350" height="80" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="375" y="311" text-anchor="middle" class="head">检查图变换改变了什么</text><text x="375" y="338" text-anchor="middle" class="body">启动次数、中间读写与布局代价</text>
<rect x="730" y="280" width="350" height="80" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text x="905" y="311" text-anchor="middle" class="head">检查目标能否执行</text><text x="905" y="338" text-anchor="middle" class="body">算子、精度、形状与工作区</text>
<rect x="450" y="430" width="380" height="70" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text x="640" y="461" text-anchor="middle" class="head">保留可行的执行路径</text><text x="640" y="488" text-anchor="middle" class="body">原始或融合调用 → 实际验证</text>
<path d="M500 190V235H375V280" class="edge"/>
<path d="M780 190V235H905V280" class="edge"/>
<path d="M375 360V465H450" class="edge"/>
<path d="M905 360V465H830" class="edge"/>
</svg>
