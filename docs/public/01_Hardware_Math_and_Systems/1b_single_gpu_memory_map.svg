<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">1B 单设备执行、内存与访存</title>
  <desc id="desc">从共同资源模型按问题选择注意力状态、临时工作集、低精度矩阵、片上复用或稀疏执行分支，再汇合到性能证据与判别实验。</desc>
  <defs>
    <marker id="a1b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:19px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2;rx:16}.item{stroke:#cbd5e1;stroke-width:1.5;rx:10}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a1b)}
    </style>
  </defs>
  <rect width="1280" height="680" fill="#f8fafc"/>
  <text x="640" y="42" text-anchor="middle" class="title">1B 单设备执行、内存与访存：按问题选择分析分支</text>
  <text x="640" y="70" text-anchor="middle" class="sub">共同资源模型提供坐标，各分支回答不同问题，最后用性能证据核对瓶颈</text>

  <rect x="40" y="205" width="235" height="260" fill="#e0f2fe" class="panel"/>
  <text x="157" y="245" text-anchor="middle" class="group">03 共同入口</text>
  <rect x="68" y="280" width="179" height="62" fill="#fff" class="item"/>
  <text x="157" y="307" text-anchor="middle" class="head">资源模型</text><text x="157" y="329" text-anchor="middle" class="small">计算 · 带宽 · 容量</text>
  <rect x="68" y="365" width="179" height="62" fill="#fff" class="item"/>
  <text x="157" y="392" text-anchor="middle" class="head">内存层级</text><text x="157" y="414" text-anchor="middle" class="small">寄存器 · SRAM · HBM</text>

  <rect x="335" y="105" width="610" height="470" fill="#f1f5f9" class="panel"/>
  <text x="640" y="142" text-anchor="middle" class="group">按当前问题选择分支</text>

  <rect x="375" y="170" width="240" height="105" fill="#dcfce7" class="item"/>
  <text x="495" y="198" text-anchor="middle" class="head">Attention 长期状态</text>
  <text x="495" y="225" text-anchor="middle" class="body">04 → 11</text>
  <text x="495" y="250" text-anchor="middle" class="small">表示方式 · KV Cache 容量</text>

  <rect x="665" y="170" width="240" height="105" fill="#dcfce7" class="item"/>
  <text x="785" y="198" text-anchor="middle" class="head">Attention 临时工作集</text>
  <text x="785" y="225" text-anchor="middle" class="body">04 → 14</text>
  <text x="785" y="250" text-anchor="middle" class="small">中间结果 · 分块 · I/O</text>

  <rect x="375" y="310" width="240" height="95" fill="#fef3c7" class="item"/>
  <text x="495" y="340" text-anchor="middle" class="head">低精度矩阵路径</text>
  <text x="495" y="366" text-anchor="middle" class="body">12 → 23</text>
  <text x="495" y="389" text-anchor="middle" class="small">dtype · 累加 · shape · MMA</text>

  <rect x="665" y="310" width="240" height="95" fill="#fef3c7" class="item"/>
  <text x="785" y="340" text-anchor="middle" class="head">片上复用</text>
  <text x="785" y="366" text-anchor="middle" class="body">24</text>
  <text x="785" y="389" text-anchor="middle" class="small">tile · shared memory · 同步</text>

  <rect x="520" y="440" width="240" height="95" fill="#fce7f3" class="item"/>
  <text x="640" y="470" text-anchor="middle" class="head">稀疏执行</text>
  <text x="640" y="496" text-anchor="middle" class="body">25</text>
  <text x="640" y="519" text-anchor="middle" class="small">对象 · 模式 · 可跳过工作量</text>

  <rect x="1005" y="205" width="235" height="260" fill="#ede9fe" class="panel"/>
  <text x="1122" y="245" text-anchor="middle" class="group">13 证据汇合</text>
  <text x="1122" y="292" text-anchor="middle" class="body">原始记录</text>
  <text x="1122" y="324" text-anchor="middle" class="body">派生指标</text>
  <text x="1122" y="356" text-anchor="middle" class="body">候选瓶颈</text>
  <text x="1122" y="388" text-anchor="middle" class="body">判别实验</text>
  <text x="1122" y="430" text-anchor="middle" class="small">性能分析 → 性能优化</text>

  <path d="M275 335H325" class="flow"/>
  <path d="M945 335H995" class="flow"/>
  <text x="300" y="317" text-anchor="middle" class="small">选择问题</text>
  <text x="970" y="317" text-anchor="middle" class="small">核对证据</text>
  <text x="640" y="622" text-anchor="middle" class="sub">各分支不是固定流水线：只选择与当前问题有关的路径，再回到统一证据口径</text>
</svg>
