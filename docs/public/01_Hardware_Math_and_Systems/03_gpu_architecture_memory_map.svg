<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">GPU 计算与数据供给：组成关系和资源检查分开看</title><desc id="desc">GPU芯片中有多个SM与共享L2缓存。图中展开一个SM，包含CUDA计算单元、Tensor Core、寄存器文件与共享内存。Warp是线程执行分组，不画作物理计算单元。独立显存采用HBM或GDDR；实线仅示意显存经L2向SM供给全局数据，省略L1及指令细节。右侧从任务工作量分别进行容量与计算带宽上限检查，虚线不表示数据流。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.note{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.analysis{stroke-dasharray:6 5}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">GPU 计算与数据供给：组成关系和资源检查分开看</text>
<text class="note" x="640" y="76" text-anchor="middle">嵌套：硬件组成；实线：全局数据供给示意；虚线：分析分支。省略 L1 与具体指令路径。</text>
<rect x="30" y="110" width="820" height="300" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" data-layout-role="container"/>
<text class="head" x="440" y="139" text-anchor="middle">GPU 芯片：多个 SM 与共享的 L2 缓存</text>
<rect x="50" y="160" width="510" height="230" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" data-layout-role="container"/>
<text class="head" x="305" y="187" text-anchor="middle">一个 SM：调度线程块与 Warp</text>
<rect x="70" y="205" width="220" height="70" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="180" y="233" text-anchor="middle">CUDA 计算单元</text><text class="note" x="180" y="259" text-anchor="middle">通用线程级运算</text>
<rect x="320" y="205" width="220" height="70" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="430" y="233" text-anchor="middle">Tensor Core</text><text class="note" x="430" y="259" text-anchor="middle">受支持的矩阵乘加</text>
<rect x="70" y="305" width="220" height="70" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="180" y="333" text-anchor="middle">寄存器文件</text><text class="note" x="180" y="359" text-anchor="middle">保存线程的局部工作数据</text>
<rect x="320" y="305" width="220" height="70" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="430" y="333" text-anchor="middle">共享内存</text><text class="note" x="430" y="359" text-anchor="middle">线程块内的协作与复用</text>
<rect x="620" y="240" width="200" height="75" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="720" y="268" text-anchor="middle">L2 缓存</text><text class="note" x="720" y="294" text-anchor="middle">缓冲全局数据访问</text>
<rect x="620" y="435" width="200" height="70" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="720" y="463" text-anchor="middle">独立显存</text><text class="note" x="720" y="489" text-anchor="middle">HBM 或 GDDR</text>
<path class="edge" d="M720 435V315"/>
<text class="note" x="792" y="380" text-anchor="middle">全局数据</text>
<path class="edge" d="M620 277.5H560"/>
<rect x="900" y="125" width="340" height="80" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text class="head" x="1070" y="153" text-anchor="middle">给定任务的工作量</text><text class="note" x="1070" y="179" text-anchor="middle">运算量、访问字节与驻留字节</text>
<rect x="900" y="270" width="340" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="1070" y="298" text-anchor="middle">容量检查</text><text class="note" x="1070" y="324" text-anchor="middle">驻留需求与可用存储分别比较</text>
<rect x="900" y="420" width="340" height="80" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text class="head" x="1070" y="448" text-anchor="middle">计算与搬运时间下界</text><text class="note" x="1070" y="474" text-anchor="middle">FLOPs / 峰值；Bytes / 带宽</text>
<path class="edge analysis" d="M1040 205V270"/>
<path class="edge analysis" d="M1240 165H1260V460H1240"/>
<text class="note" x="305" y="446" text-anchor="middle">Warp：线程执行分组；CUDA / Tensor Core：计算资源</text>
</svg>
