<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">固定同一批输入，分桶也可能增加填充</title><desc id="desc">两个输入长度分别为65和66，总有效长度131。直接补到本批最大长度66，共132个位置，填充1个。若固定桶边界为128，共256个位置，填充125个。两种方式处理同一批输入，图中未改变组批顺序或等待时间。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#52677f"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.edge{stroke:#52677f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/>
<text x="640" y="45" text-anchor="middle" class="title">固定同一批输入，分桶也可能增加填充</text>
<text x="640" y="76" text-anchor="middle" class="sub">固定两个输入与批次，比较填充位置数；缓存复用和真实延迟需要另外记录</text>
<rect x="40" y="220" width="220" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="150" y="251" text-anchor="middle" class="head">原始长度</text><text x="150" y="278" text-anchor="middle" class="body">65、66</text>
<rect x="400" y="140" width="350" height="80" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="575" y="171" text-anchor="middle" class="head">补到本批最大长度</text><text x="575" y="198" text-anchor="middle" class="body">两条输入都补到 66</text>
<rect x="400" y="340" width="350" height="80" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text x="575" y="371" text-anchor="middle" class="head">固定桶边界</text><text x="575" y="398" text-anchor="middle" class="body">两条输入都补到 128</text>
<rect x="900" y="140" width="340" height="80" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="1070" y="171" text-anchor="middle" class="head">填充 1 个位置</text><text x="1070" y="198" text-anchor="middle" class="body">2 × 66 − (65 + 66) = 1</text>
<rect x="900" y="340" width="340" height="80" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text x="1070" y="371" text-anchor="middle" class="head">填充 125 个位置</text><text x="1070" y="398" text-anchor="middle" class="body">2 × 128 − (65 + 66) = 125</text>
<path d="M260 245H320V180H400" class="edge"/>
<path d="M260 295H350V380H400" class="edge"/>
<path d="M750 180H900" class="edge"/>
<path d="M750 380H900" class="edge"/>
</svg>
