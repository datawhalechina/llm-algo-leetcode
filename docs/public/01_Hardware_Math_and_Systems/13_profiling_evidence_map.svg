<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}
      .head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.small{font-size:13px;fill:#475569}
      .panel{stroke-width:2}.flow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .label{font-size:13px;fill:#475569;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1500" height="470" rx="24" fill="#f8fafc"/>
  <text x="750" y="45" text-anchor="middle" class="title">性能归因：从已有证据到判别实验</text>
  <text x="750" y="72" text-anchor="middle" class="sub">不重新采集工作负载；统一单位、判断关键路径，再用单变量实验验证或推翻假设</text>

  <rect x="45" y="120" width="300" height="245" rx="18" fill="#eff6ff" stroke="#60a5fa" class="panel"/>
  <text x="70" y="155" class="head">1. 输入已有证据</text>
  <text x="70" y="190" class="body">阶段 / 计算内核时间</text>
  <text x="70" y="220" class="body">FLOPs 与 DRAM 字节</text>
  <text x="70" y="250" class="body">搬运、同步与启动时间</text>
  <text x="70" y="292" class="small">来源：性能剖析、系统时间线、内核指标</text>
  <text x="70" y="322" class="small">前提：工作负载与测量方法已经固定</text>

  <rect x="420" y="120" width="300" height="245" rx="18" fill="#f0fdf4" stroke="#4ade80" class="panel"/>
  <text x="445" y="155" class="head">2. 派生资源指标</text>
  <text x="445" y="190" class="body">算术强度：FLOPs / bytes</text>
  <text x="445" y="220" class="body">实际 TFLOP/s 与 GB/s</text>
  <text x="445" y="250" class="body">暴露时间及关键路径占比</text>
  <text x="445" y="292" class="small">统一数量级和单位</text>
  <text x="445" y="322" class="small">避免用预设“压力分数”代替证据</text>

  <rect x="795" y="120" width="300" height="245" rx="18" fill="#fffbeb" stroke="#f59e0b" class="panel"/>
  <text x="820" y="155" class="head">3. 形成瓶颈假设</text>
  <text x="820" y="190" class="body">机器平衡点 ↔ 算术强度</text>
  <text x="820" y="220" class="body">计算内核 ↔ 搬运 ↔ 同步 ↔ 启动</text>
  <text x="820" y="250" class="body">对照上界效率与最大暴露项</text>
  <text x="820" y="292" class="small">输出：计算、访存、搬运或调度假设</text>
  <text x="820" y="322" class="small">远离上界时继续检查执行限制</text>

  <rect x="1170" y="120" width="285" height="245" rx="18" fill="#faf5ff" stroke="#a855f7" class="panel"/>
  <text x="1195" y="155" class="head">4. 设计判别实验</text>
  <text x="1195" y="190" class="body">固定工作负载与测量口径</text>
  <text x="1195" y="220" class="body">只改变一个机制变量</text>
  <text x="1195" y="250" class="body">同时观察收益与代价</text>
  <text x="1195" y="292" class="small">结果支持假设：进入候选复测</text>
  <text x="1195" y="322" class="small">结果不支持：返回时间线重新归因</text>

  <path d="M345 242H420" class="flow"/><text x="383" y="226" text-anchor="middle" class="label">换算</text>
  <path d="M720 242H795" class="flow"/><text x="758" y="226" text-anchor="middle" class="label">比较</text>
  <path d="M1095 242H1170" class="flow"/><text x="1133" y="226" text-anchor="middle" class="label">证伪</text>

  <text x="750" y="425" text-anchor="middle" class="sub">Part 00 · 17 负责采集，Part 01 · 13 负责资源归因，Part 00 · 20 负责回归与实验协议</text>
</svg>
