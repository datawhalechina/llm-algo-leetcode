<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">1C：通信与容量分别检查，再进入调度和恢复</title>
<desc id="desc">05切分对象与拓扑先引入20集合通信。20通信量及06状态容量分别作为26筛选输入；26再通向27通信调度与28保存恢复两条阅读分支。每条分支使用独立端点与线身。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.note{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.detail{stroke-dasharray:7 5}</style></defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">1C：通信与容量分别检查，再进入调度和恢复</text>
<text class="note" x="640" y="76" text-anchor="middle">实线：推荐阅读；虚线：提供筛选条件。通信调度与保存恢复按问题分别进入。</text>
<rect x="80" y="115" width="300" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="230" y="147" text-anchor="middle">05 切分对象与拓扑</text><text class="note" x="230" y="173" text-anchor="middle">交换什么数据，经过哪些链路</text>
<rect x="80" y="285" width="300" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="230" y="317" text-anchor="middle">20 集合通信</text><text class="note" x="230" y="343" text-anchor="middle">通信量与理论传输时间</text>
<rect x="900" y="285" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="1050" y="317" text-anchor="middle">06 状态复制与分片</text><text class="note" x="1050" y="343" text-anchor="middle">参数、梯度与优化器状态</text>
<rect x="490" y="285" width="300" height="80" rx="12" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text class="head" x="640" y="317" text-anchor="middle">26 筛选并行方案</text><text class="note" x="640" y="343" text-anchor="middle">容量、互连与模型结构</text>
<rect x="80" y="450" width="300" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="230" y="482" text-anchor="middle">27 通信调度</text><text class="note" x="230" y="508" text-anchor="middle">就绪时间、重叠与暴露等待</text>
<rect x="900" y="450" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="1050" y="482" text-anchor="middle">28 保存与恢复</text><text class="note" x="1050" y="508" text-anchor="middle">保存间隔与恢复后的正确性</text>
<path class="edge" d="M230 195V285"/>
<path class="edge detail" d="M380 325H490"/>
<text class="note" x="435" y="308" text-anchor="middle">通信条件</text>
<path class="edge detail" d="M900 325H790"/>
<text class="note" x="845" y="308" text-anchor="middle">容量条件</text>
<path class="edge" d="M550 365V410H230V450"/>
<text class="note" x="350" y="398" text-anchor="middle">分析通信等待</text>
<path class="edge" d="M730 365V410H1050V450"/>
<text class="note" x="950" y="398" text-anchor="middle">检查中断恢复</text>
</svg>
