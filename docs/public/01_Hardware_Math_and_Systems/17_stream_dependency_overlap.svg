<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Stream 与依赖：依赖输入要等待，独立工作可重叠</title><desc id="desc">同一批A先搬入10毫秒再计算20毫秒，末尾同步4毫秒，总计34毫秒。对照中A输入已就绪，搬运B10毫秒与计算A20毫秒相互独立，末尾同步4毫秒，理想总长24毫秒。统一时间轴，所有结果是构造估算，资源独立且忽略其他开销。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.dep{stroke-dasharray:6 5}.axis{stroke:#94a3b8;stroke-width:1.5}.tick{font-size:14px;fill:#475569}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">Stream 与依赖：依赖输入要等待，独立工作可重叠</text>
<text class="body" x="640" y="76" text-anchor="middle">构造估算：搬入 10 ms、计算 20 ms、末尾同步 4 ms；跨批重叠还要求队列与资源允许并发。</text>
<text class="head" x="40" y="122" text-anchor="start">同批：A 的计算依赖 A 的输入</text>
<text class="body" x="190" y="169" text-anchor="middle">顺序执行</text>
<rect x="300" y="145" width="250" height="36" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="body" x="425" y="169" text-anchor="middle">搬入 A</text>
<rect x="550" y="145" width="500" height="36" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="body" x="800" y="169" text-anchor="middle">计算 A</text>
<rect x="1050" y="145" width="100" height="36" rx="5" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text class="body" x="1100" y="169" text-anchor="middle">同步 4</text>
<text class="body" x="640" y="222" text-anchor="middle">A 输入就绪于 10 ms；完成于 34 ms</text>
<text class="head" x="40" y="279" text-anchor="start">跨批：A 输入已就绪，搬入 B 与计算 A 独立</text>
<text class="body" x="190" y="329" text-anchor="middle">搬运资源</text>
<rect x="300" y="305" width="250" height="36" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="body" x="425" y="329" text-anchor="middle">搬入 B</text>
<text class="body" x="190" y="391" text-anchor="middle">计算资源</text>
<rect x="300" y="367" width="500" height="36" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="body" x="550" y="391" text-anchor="middle">计算 A</text>
<text class="body" x="190" y="453" text-anchor="middle">末尾同步</text>
<rect x="800" y="429" width="100" height="36" rx="5" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text class="body" x="850" y="453" text-anchor="middle">4 ms</text>
<path class="edge dep" d="M800 403V429"/>
<text class="body" x="1030" y="330" text-anchor="middle">固定页内存、独立数据与并发资源</text>
<text class="body" x="1030" y="393" text-anchor="middle">计算 A 不等待 B</text>
<text class="body" x="1030" y="453" text-anchor="middle">理想完成于 24 ms</text>
<path class="axis" d="M300 482H1150"/>
<path class="axis" d="M300 478V488"/><text class="tick" x="300" y="510" text-anchor="middle">0</text>
<path class="axis" d="M550 478V488"/><text class="tick" x="550" y="510" text-anchor="middle">10</text>
<path class="axis" d="M800 478V488"/><text class="tick" x="800" y="510" text-anchor="middle">20</text>
<path class="axis" d="M900 478V488"/><text class="tick" x="900" y="510" text-anchor="middle">24</text>
<path class="axis" d="M1050 478V488"/><text class="tick" x="1050" y="510" text-anchor="middle">30</text>
<path class="axis" d="M1150 478V488"/><text class="tick" x="1150" y="510" text-anchor="middle">34</text>
<text class="body" x="1210" y="485" text-anchor="middle">时间 / ms</text>
</svg>
