<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">1F：同一模型迁移设备时的阅读路线</title>
<desc id="desc">基本阅读顺序为设备与软件条件、分阶段检查、成功请求成本。多个任务共享设备时，从分阶段检查进入资源隔离分支，再回到成本计算。箭头仅表示阅读顺序，不表示已经完成真实加载或性能测试。</desc>
<defs>
<marker id="main-arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#315b7d"/></marker>
<marker id="branch-arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#8064ae"/></marker>
<style>
text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}
.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#475569}
.heading{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}
.node{stroke-width:2}.edge{fill:none;stroke-width:3;stroke-linejoin:round}
.panel{stroke:#cbd5e1;stroke-width:1.5}
</style>
</defs>
<rect width="1280" height="520" fill="#f8fafc" data-layout-role="decoration"/>
<text x="640" y="43" text-anchor="middle" class="title">同一模型换设备：查运行条件，再算单位成本</text>
<text x="640" y="75" text-anchor="middle" class="subtitle">蓝色实线：基本阅读顺序　　紫色虚线：多任务共享时补读</text>

<rect id="device" x="40" y="150" width="240" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" class="node"/>
<text x="160" y="189" text-anchor="middle" class="heading">10 设备与软件条件</text>
<text x="160" y="222" text-anchor="middle" class="body">缺容量、操作还是软件支持？</text>

<rect id="stage" x="350" y="150" width="250" height="100" rx="14" fill="#f0fdf4" stroke="#4ade80" class="node"/>
<text x="475" y="189" text-anchor="middle" class="heading">34 分阶段检查</text>
<text x="475" y="222" text-anchor="middle" class="body">各阶段的内存与运行时需求</text>

<rect id="cost" x="990" y="150" width="250" height="100" rx="14" fill="#faf5ff" stroke="#a855f7" class="node"/>
<text x="1115" y="189" text-anchor="middle" class="heading">33 成功请求成本</text>
<text x="1115" y="222" text-anchor="middle" class="body">总支出与成功处理量分别算</text>

<rect id="isolation" x="655" y="350" width="250" height="100" rx="14" fill="#fff7ed" stroke="#fb923c" class="node"/>
<text x="780" y="389" text-anchor="middle" class="heading">31 多任务共享</text>
<text x="780" y="422" text-anchor="middle" class="body">比较吞吐、P99 与资源余量</text>

<path data-source="device" data-target="stage" d="M280 200H350" class="edge" stroke="#315b7d" marker-end="url(#main-arrow)"/>
<path data-source="stage" data-target="cost" d="M600 200H990" class="edge" stroke="#315b7d" marker-end="url(#main-arrow)"/>
<text x="795" y="177" text-anchor="middle" class="body">单任务：直接进入成本计算</text>
<path data-source="stage" data-target="isolation" d="M475 250V400H655" class="edge" stroke="#8064ae" stroke-dasharray="8 5" marker-end="url(#branch-arrow)"/>
<text x="490" y="325" class="body">多个任务共享设备</text>
<path data-source="isolation" data-target="cost" d="M905 400H1115V250" class="edge" stroke="#8064ae" stroke-dasharray="8 5" marker-end="url(#branch-arrow)"/>
<text x="1129" y="326" class="small">把隔离后的</text>
<text x="1129" y="350" class="small">处理量带入成本</text>
</svg>
