<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">分区能限制争用，也可能留下无法借用的空闲容量</title><desc id="desc">同样两个任务需要八 GB 和二 GB。共享十二 GB 时总容量足够但仍有资源争用；理想等分为两个六 GB 分区时，A 无法放入而 B 留有四 GB 空闲。本图不是实际 MIG 配置或性能结果。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.edge{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1280" height="520" rx="24" fill="#f8fafc"/>
<text x="640" y="45" text-anchor="middle" class="title">分区能限制争用，也可能留下无法借用的空闲容量</text>
<text x="640" y="76" text-anchor="middle" class="sub">理想容量示例，单位为 GB；任意等分不代表真实 MIG 配置，也不预设隔离后的性能收益</text>
<rect x="40" y="110" width="580" height="365" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" data-layout-role="panel"/>
<rect x="660" y="110" width="580" height="365" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2" data-layout-role="panel"/>
<text x="330" y="144" text-anchor="middle" class="head">共享同一资源池</text>
<text x="950" y="144" text-anchor="middle" class="head">固定划分两个资源区</text>
<rect x="70" y="170" width="240" height="75" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="190" y="201" text-anchor="middle" class="head">任务 A</text><text x="190" y="228" text-anchor="middle" class="body">峰值需求 8 GB</text>
<rect x="350" y="170" width="240" height="75" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="470" y="201" text-anchor="middle" class="head">任务 B</text><text x="470" y="228" text-anchor="middle" class="body">峰值需求 2 GB</text>
<rect x="690" y="170" width="240" height="75" rx="14" fill="#fff" stroke="#a78bfa" stroke-width="2"/><text x="810" y="201" text-anchor="middle" class="head">任务 A</text><text x="810" y="228" text-anchor="middle" class="body">峰值需求 8 GB</text>
<rect x="970" y="170" width="240" height="75" rx="14" fill="#fff" stroke="#a78bfa" stroke-width="2"/><text x="1090" y="201" text-anchor="middle" class="head">任务 B</text><text x="1090" y="228" text-anchor="middle" class="body">峰值需求 2 GB</text>
<rect x="70" y="300" width="520" height="95" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="330" y="331" text-anchor="middle" class="head">共享容量 12 GB ≥ 总需求 10 GB</text><text x="330" y="358" text-anchor="middle" class="body">容量可容纳；计算、带宽与调度仍可能争用</text>
<rect x="690" y="300" width="240" height="95" rx="14" fill="#fef2f2" stroke="#f87171" stroke-width="2"/><text x="810" y="331" text-anchor="middle" class="head">分区 A：6 GB</text><text x="810" y="358" text-anchor="middle" class="body">需求超限，无法放入</text>
<rect x="970" y="300" width="240" height="95" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text x="1090" y="331" text-anchor="middle" class="head">分区 B：6 GB</text><text x="1090" y="358" text-anchor="middle" class="body">留有 4 GB，不能借给 A</text>
<path d="M190 245V300" class="edge"/>
<path d="M470 245V300" class="edge"/>
<path d="M810 245V300" class="edge"/>
<path d="M1090 245V300" class="edge"/>
<text x="330" y="438" text-anchor="middle" class="small">实测：吞吐、P99，以及并发任务带来的波动</text>
<text x="950" y="438" text-anchor="middle" class="small">实测：容量拒绝、闲置资源，以及各任务的 P99</text>
</svg>
