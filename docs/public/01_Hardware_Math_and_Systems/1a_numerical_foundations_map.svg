<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">1A：从数据类型与模型规模，进入量化或 MoE</title>
<desc id="desc">01数据类型与精度通向02参数量与FLOPs。需要低比特表示时从01进入21量化；需要稀疏激活时从02进入22MoE。两条分支再展开各自的成本比较，不要求量化必须先完成02。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.note{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.detail{stroke-dasharray:7 5}</style></defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">1A：从数据类型与模型规模，进入量化或 MoE</text>
<text class="note" x="640" y="76" text-anchor="middle">实线：推荐阅读；虚线：本节展开。量化从数值表示进入，MoE 从模型规模进入。</text>
<rect x="100" y="130" width="420" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="310" y="162" text-anchor="middle">01 数据类型与精度</text><text class="note" x="310" y="188" text-anchor="middle">每元素字节数与数值范围</text>
<rect x="760" y="130" width="420" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text class="head" x="970" y="162" text-anchor="middle">02 参数量与 FLOPs</text><text class="note" x="970" y="188" text-anchor="middle">模型参数规模与计算量</text>
<rect x="100" y="300" width="420" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="310" y="332" text-anchor="middle">21 量化表示</text><text class="note" x="310" y="358" text-anchor="middle">位宽、缩放参数与量化粒度</text>
<rect x="760" y="300" width="420" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="970" y="332" text-anchor="middle">22 MoE 稀疏激活</text><text class="note" x="970" y="358" text-anchor="middle">总参数与每次激活的参数</text>
<rect x="100" y="440" width="420" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/><text class="head" x="310" y="472" text-anchor="middle">比较表示成本</text><text class="note" x="310" y="498" text-anchor="middle">存储字节、元数据与数值误差</text>
<rect x="760" y="440" width="420" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text class="head" x="970" y="472" text-anchor="middle">比较常驻与活跃开销</text><text class="note" x="970" y="498" text-anchor="middle">常驻参数、活跃计算与专家通信</text>
<path class="edge" d="M520 170H760"/>
<text class="note" x="640" y="155" text-anchor="middle">基础阅读</text>
<path class="edge" d="M310 210V300"/>
<text class="note" x="400" y="260" text-anchor="middle">低比特表示</text>
<path class="edge" d="M970 210V300"/>
<text class="note" x="1060" y="260" text-anchor="middle">稀疏激活</text>
<path class="edge detail" d="M310 380V440"/>
<path class="edge detail" d="M970 380V440"/>
</svg>
