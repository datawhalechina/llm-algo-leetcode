<text x="500" y="125" text-anchor="middle" class="small">中间结果反复写出</text>
<text x="500" y="410" text-anchor="middle" class="small">输入长度或批次变化</text>
<text x="470" y="550" text-anchor="middle" class="small">需深入目标计划时选读</text>
