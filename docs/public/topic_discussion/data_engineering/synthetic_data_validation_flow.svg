<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">合成数据验证流程</title><desc id="desc">按任务要求生成候选，验证后分别保留通过、拒绝和待复核记录；通过的候选继续检查重复与评测隔离。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526579"/></marker></defs>
  <rect width="1200" height="520" fill="#f7f9fc"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M250 130H422"/><path d="M650 130H822"/></g>
    <path d="M940 185V280M220 280H980" fill="none" stroke="#526579" stroke-width="3"/>
    <g fill="none" stroke="#526579" stroke-width="3" marker-end="url(#a)"><path d="M220 280V322"/><path d="M600 280V322"/><path d="M980 280V322"/></g>
    <g stroke-width="2"><rect x="70" y="75" width="180" height="110" rx="18" fill="#e8f1ff" stroke="#3976b8"/><rect x="430" y="75" width="220" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="830" y="75" width="220" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/><rect x="80" y="330" width="280" height="110" rx="18" fill="#e9f7ef" stroke="#31845a"/><rect x="460" y="330" width="280" height="110" rx="18" fill="#fdecec" stroke="#b85151"/><rect x="840" y="330" width="280" height="110" rx="18" fill="#fff3dc" stroke="#b9791f"/></g>
    <g fill="#183047"><text x="160" y="115" font-size="24" font-weight="700">补充目标任务</text><text x="160" y="150" font-size="18">范围与训练用途</text><text x="540" y="115" font-size="24" font-weight="700">约定检查规则</text><text x="540" y="150" font-size="18">格式、答案、成功条件</text><text x="940" y="115" font-size="24" font-weight="700">生成候选</text><text x="940" y="150" font-size="18">版本与采样配置</text><text x="220" y="372" font-size="24" font-weight="700">验证通过</text><text x="220" y="407" font-size="18">继续去重与隔离检查</text><text x="600" y="372" font-size="24" font-weight="700">拒绝当前候选</text><text x="600" y="407" font-size="18">保留已确认错误与原因</text><text x="980" y="372" font-size="24" font-weight="700">待复核或重试</text><text x="980" y="407" font-size="18">超时、分歧或检查未完成</text></g>
    <text x="600" y="253" font-size="19" fill="#526579">按任务使用规则、执行测试或人工复核</text>
  </g>
</svg>
