<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">按四类用途查找数据处理与验证方法</title>
  <desc id="desc">四行分别展示训练语料、在线采样、检索文档和测试数据，各自从输入连接到组织与检查，再连接到验证对象。四行并列，没有先后依赖。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker>
    <style>text{font-family:'Noto Sans CJK SC',Arial,sans-serif;fill:#183047}.title{font-size:26px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:17px}.note{font-size:16px;fill:#526579}.edge{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="600" rx="20" fill="#f7f9fc"/>
  <text x="40" y="42" class="title">拿到什么数据，决定怎样组织和检查</text>
  <text x="40" y="72" class="note">四行按用途并列：从实际输入找到处理重点，再选择验证对象。</text>
  <g class="edge"><path d="M280 155H365"/><path d="M785 155H880"/></g>
  <rect x="40" y="110" width="240" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" class="h">语料、示范与偏好对</text>
  <text x="160" y="177" text-anchor="middle" class="s">预训练／SFT／偏好学习</text>
  <rect x="365" y="110" width="420" height="90" rx="14" fill="#edf8f8" stroke="#328388" stroke-width="2"/>
  <text x="575" y="145" text-anchor="middle" class="h">序列、标签与样本边界</text>
  <text x="575" y="177" text-anchor="middle" class="s">来源比例、有效目标、打包与隔离</text>
  <rect x="880" y="110" width="280" height="90" rx="14" fill="#e9f7ef" stroke="#31845a" stroke-width="2"/>
  <text x="1020" y="145" text-anchor="middle" class="h">检查目标与任务质量</text>
  <text x="1020" y="177" text-anchor="middle" class="s">训练机制与独立评测</text>
  <g class="edge"><path d="M280 265H365"/><path d="M785 265H880"/></g>
  <rect x="40" y="220" width="240" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8" stroke-width="2"/>
  <text x="160" y="255" text-anchor="middle" class="h">采样回答与工具记录</text>
  <text x="160" y="287" text-anchor="middle" class="s">在线RL／Agentic RL／OPD</text>
  <rect x="365" y="220" width="420" height="90" rx="14" fill="#edf8f8" stroke="#328388" stroke-width="2"/>
  <text x="575" y="255" text-anchor="middle" class="h">生成版本、反馈与有效位置</text>
  <text x="575" y="287" text-anchor="middle" class="s">奖励或教师反馈、动作与结束状态</text>
  <rect x="880" y="220" width="280" height="90" rx="14" fill="#e9f7ef" stroke="#31845a" stroke-width="2"/>
  <text x="1020" y="255" text-anchor="middle" class="h">检查轨迹与训练使用</text>
  <text x="1020" y="287" text-anchor="middle" class="s">记录完整性与算法使用条件</text>
  <g class="edge"><path d="M280 375H365"/><path d="M785 375H880"/></g>
  <rect x="40" y="330" width="240" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8" stroke-width="2"/>
  <text x="160" y="365" text-anchor="middle" class="h">文档与查询</text>
  <text x="160" y="397" text-anchor="middle" class="s">检索语料与索引</text>
  <rect x="365" y="330" width="420" height="90" rx="14" fill="#edf8f8" stroke="#328388" stroke-width="2"/>
  <text x="575" y="365" text-anchor="middle" class="h">片段来源、访问范围与索引</text>
  <text x="575" y="397" text-anchor="middle" class="s">结构切块、更新删除与查询检查</text>
  <rect x="880" y="330" width="280" height="90" rx="14" fill="#e9f7ef" stroke="#31845a" stroke-width="2"/>
  <text x="1020" y="365" text-anchor="middle" class="h">比较召回与回答</text>
  <text x="1020" y="397" text-anchor="middle" class="s">固定查询与相关依据</text>
  <g class="edge"><path d="M280 485H365"/><path d="M785 485H880"/></g>
  <rect x="40" y="440" width="240" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8" stroke-width="2"/>
  <text x="160" y="475" text-anchor="middle" class="h">评测、请求与校准样本</text>
  <text x="160" y="507" text-anchor="middle" class="s">质量／性能／量化</text>
  <rect x="365" y="440" width="420" height="90" rx="14" fill="#edf8f8" stroke="#328388" stroke-width="2"/>
  <text x="575" y="475" text-anchor="middle" class="h">隔离、长度与到达方式</text>
  <text x="575" y="507" text-anchor="middle" class="s">用途分开，保留实际输入与配置</text>
  <rect x="880" y="440" width="280" height="90" rx="14" fill="#e9f7ef" stroke="#31845a" stroke-width="2"/>
  <text x="1020" y="475" text-anchor="middle" class="h">比较质量与运行成本</text>
  <text x="1020" y="507" text-anchor="middle" class="s">任务效果、延迟与吞吐</text>
  <text x="40" y="570" class="note">共同保存：来源与使用范围、内容版本、处理配置、成员与失败记录。</text>
</svg>
