<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">数据工程的入门路径与按需分支</title>
  <desc id="desc">已有问答沿Task0、Task2、Task5、Task6入门。原始文档先经Task1解析，配比和任务采样按需进入Task3，人工示范、合成与在线采集经Task4后回到Task2检查。Task5按用途组织训练、检索或测试输入。在线采集前先确认字段和任务采样方案，版本与处理记录贯穿各阶段。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker>
    <style>text{font-family:'Noto Sans CJK SC',Arial,sans-serif;fill:#183047}.title{font-size:26px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:16px}.note{font-size:16px;fill:#526579}.main{fill:none;stroke:#3976b8;stroke-width:3;marker-end:url(#arrow)}.branch{fill:none;stroke:#7657b5;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="670" rx="20" fill="#f7f9fc"/>
  <text x="40" y="43" class="title">按用途准备数据，再比较训练、检索或模型回答</text>
  <text x="40" y="72" class="note">蓝色实线：公共入门路径；紫色虚线：按需进入或返回。评测可直接读09 → 10。</text>
  <g class="main"><path d="M260 295H340"/><path d="M560 295H640"/><path d="M860 295H940"/></g>
  <g class="branch">
    <path d="M150 250V145H340"/><path d="M450 190V250"/>
    <path d="M450 340V440"/><path d="M560 485H750V340"/>
    <path d="M150 340V440"/><path d="M260 485H300V320H340"/>
  </g>
  <g stroke-width="2">
    <rect x="40" y="250" width="220" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8"/>
    <rect x="340" y="100" width="220" height="90" rx="14" fill="#fff3dc" stroke="#b9791f"/>
    <rect x="340" y="250" width="220" height="90" rx="14" fill="#e9f7ef" stroke="#31845a"/>
    <rect x="640" y="250" width="220" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8"/>
    <rect x="940" y="250" width="220" height="90" rx="14" fill="#e8f1ff" stroke="#3976b8"/>
    <rect x="340" y="440" width="220" height="90" rx="14" fill="#f1ecff" stroke="#7657b5"/>
    <rect x="40" y="440" width="220" height="90" rx="14" fill="#f1ecff" stroke="#7657b5"/>
  </g>
  <g text-anchor="middle">
    <text x="150" y="285" class="h">Task0 来源与用途</text><text x="150" y="315" class="s">使用范围、检查与评测</text>
    <text x="450" y="135" class="h">Task1 采集与解析</text><text x="450" y="165" class="s">结构、来源、失败记录</text>
    <text x="450" y="285" class="h">Task2 清洗与隔离</text><text x="450" y="315" class="s">敏感信息、重复与覆盖</text>
    <text x="750" y="285" class="h">Task5 组织输入与结果</text><text x="750" y="315" class="s">训练／检索／逐题评分</text>
    <text x="1050" y="285" class="h">Task6 比较与保留版本</text><text x="1050" y="315" class="s">质量、成本与按需恢复</text>
    <text x="450" y="475" class="h">Task3 配比与采样</text><text x="450" y="505" class="s">来源、长度、任务与预算</text>
    <text x="150" y="475" class="h">Task4 示范与采集</text><text x="150" y="505" class="s">人工／合成／RL／OPD</text>
  </g>
  <text x="40" y="580" class="note">评测分支：Task0目标 → Task2隔离 → Task5评分（09）→ Task6比较（10）。</text>
  <text x="40" y="610" class="note">在线采集前先读Task5字段要求和Task3采样方案，采集后再检查实际记录。</text>
  <text x="40" y="640" class="note">最终测试集与训练、合成及规则调参隔离；验证集用于选择规则与配置。</text>
</svg>
