<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">训练候选从正确性到性能决策的证据门槛</title>
  <desc id="desc">候选策略依次通过输入监督、梯度、更新、数值和质量门槛，最后才比较性能并形成决策。</desc>
  <style>.bg{fill:#f8fafc}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}.gate{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.quality{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.decision{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.n{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#0f172a}.s{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:14px;fill:#475569}.tag{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;fill:#2563eb}.t{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}</style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 3L0 6z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="500" rx="20"/><text x="50" y="52" class="t">训练候选先证明语义正确，再进入性能排名</text>
  <path class="line" d="M230 160H280"/><path class="line" d="M460 160H510"/><path class="line" d="M690 160H740"/>
  <path class="line" d="M830 220V270H280V320"/><path class="line" d="M460 380H540"/><path class="line" d="M760 380H840"/>
  <g><rect class="gate" x="50" y="105" width="180" height="110" rx="15"/><text x="70" y="133" class="tag">G0</text><text x="70" y="162" class="n">输入与监督</text><text x="70" y="190" class="s">同一 workload</text></g>
  <g><rect class="gate" x="280" y="105" width="180" height="110" rx="15"/><text x="300" y="133" class="tag">G1</text><text x="300" y="162" class="n">梯度正确性</text><text x="300" y="190" class="s">输出 / 输入 / 参数梯度</text></g>
  <g><rect class="gate" x="510" y="105" width="180" height="110" rx="15"/><text x="530" y="133" class="tag">G2</text><text x="530" y="162" class="n">更新语义</text><text x="530" y="190" class="s">累计与更新时钟</text></g>
  <g><rect class="gate" x="740" y="105" width="180" height="110" rx="15"/><text x="760" y="133" class="tag">G3</text><text x="760" y="162" class="n">数值稳定</text><text x="760" y="190" class="s">有限值 / 溢出 / 范数</text></g>
  <g><rect class="quality" x="280" y="320" width="180" height="110" rx="15"/><text x="300" y="348" class="tag">G4</text><text x="300" y="377" class="n">质量门槛</text><text x="300" y="405" class="s">验证损失 / 任务指标</text></g>
  <g><rect class="quality" x="540" y="320" width="220" height="110" rx="15"/><text x="560" y="348" class="tag">G5</text><text x="560" y="377" class="n">性能证据</text><text x="560" y="405" class="s">峰值 / 时间 / 吞吐</text></g>
  <g><rect class="decision" x="840" y="320" width="280" height="110" rx="15"/><text x="865" y="365" class="n">accept / tune / reject</text><text x="865" y="397" class="s">记录条件、原因与下一步</text></g>
</svg>
