<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">训练状态生命周期与峰值重叠</title>
  <desc id="desc">参数、激活、反向保存张量、梯度、优化器状态和工作区在训练阶段中的驻留区间决定峰值。</desc>
  <style>.bg{fill:#f8fafc}.axis{stroke:#64748b;stroke-width:2}.tick{stroke:#94a3b8;stroke-width:1.5}.bar1{fill:#dbeafe;stroke:#60a5fa}.bar2{fill:#ffedd5;stroke:#fb923c}.bar3{fill:#d1fae5;stroke:#34d399}.n{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#0f172a}.s{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:14px;fill:#475569}.t{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}</style>
  <rect class="bg" width="1200" height="520" rx="20"/><text x="50" y="52" class="t">峰值来自同一阶段仍在驻留的状态重叠</text>
  <line class="axis" x1="260" y1="105" x2="1130" y2="105"/>
  <g class="s"><text x="285" y="88">前向开始</text><text x="475" y="88">前向末尾</text><text x="670" y="88">反向中段</text><text x="860" y="88">反向结束</text><text x="1040" y="88">更新</text></g>
  <g class="tick"><line x1="320" y1="98" x2="320" y2="455"/><line x1="510" y1="98" x2="510" y2="455"/><line x1="700" y1="98" x2="700" y2="455"/><line x1="890" y1="98" x2="890" y2="455"/><line x1="1080" y1="98" x2="1080" y2="455"/></g>
  <g class="n"><text x="50" y="158">参数</text><text x="50" y="218">优化器状态</text><text x="50" y="278">激活 / 保存张量</text><text x="50" y="338">参数梯度</text><text x="50" y="398">工作区</text></g>
  <rect class="bar1" x="260" y="130" width="870" height="38" rx="10"/><rect class="bar1" x="260" y="190" width="870" height="38" rx="10"/>
  <rect class="bar2" x="320" y="250" width="570" height="38" rx="10"/><rect class="bar3" x="650" y="310" width="480" height="38" rx="10"/>
  <rect class="bar2" x="330" y="370" width="130" height="38" rx="10"/><rect class="bar2" x="650" y="370" width="100" height="38" rx="10"/><rect class="bar2" x="1020" y="370" width="110" height="38" rx="10"/>
  <rect x="620" y="435" width="300" height="55" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="645" y="468" class="n">重点检查：激活与梯度重叠阶段</text>
</svg>
