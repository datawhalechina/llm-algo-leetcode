<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">反向传播与训练机制学习路线</title>
  <desc id="desc">训练闭环依次进入计算图、Transformer 局部反向、有效更新和状态生命周期；状态压力分成激活检查点与卸载两条并列策略，在统一内存账本汇合后进入正确性、数值稳定和性能证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}
      .tag{font-family:"Noto Sans CJK SC",sans-serif;font-size:13px;font-weight:700;fill:#2563eb}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#0f172a}
      .body{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:400;fill:#475569}
      .panel-title{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;font-weight:700;fill:#9a3412}
      .card{stroke-width:2;rx:16;ry:16}
      .core{fill:#eff6ff;stroke:#60a5fa}
      .strategy{fill:#fff7ed;stroke:#fb923c}
      .ledger{fill:#f0fdf4;stroke:#22c55e}
      .evidence{fill:#ecfdf5;stroke:#34d399}
      .panel{fill:#fffaf0;stroke:#fdba74;stroke-width:2;rx:20;ry:20}
      .line{stroke:#64748b;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1500" height="650" rx="22" fill="#f8fafc"/>
  <text x="48" y="53" class="title">训练机制：先确认梯度与更新，再比较重算、搬运和真实代价</text>

  <g>
    <rect x="45" y="92" width="245" height="145" class="card core"/>
    <text x="67" y="123" class="tag">TASK 0</text>
    <text x="67" y="155" class="head">训练闭环与梯度信号</text>
    <text x="67" y="185" class="body">初始化 → 前向 → 损失</text>
    <text x="67" y="210" class="body">→ 反向 → 参数更新</text>
  </g>

  <g>
    <rect x="365" y="92" width="245" height="145" class="card core"/>
    <text x="387" y="123" class="tag">TASK 1</text>
    <text x="387" y="155" class="head">计算图与梯度边界</text>
    <text x="387" y="185" class="body">VJP、分支汇合</text>
    <text x="387" y="210" class="body">detach() / no_grad()</text>
  </g>

  <g>
    <rect x="685" y="92" width="260" height="145" class="card core"/>
    <text x="707" y="123" class="tag">TASK 2</text>
    <text x="707" y="155" class="head">Transformer 局部反向</text>
    <text x="707" y="185" class="body">激活、损失、Attention</text>
    <text x="707" y="210" class="body">与反向保存张量</text>
  </g>

  <g>
    <rect x="1020" y="92" width="430" height="145" class="card core"/>
    <text x="1042" y="123" class="tag">TASK 3</text>
    <text x="1042" y="155" class="head">监督、梯度尺度与有效更新</text>
    <text x="1042" y="185" class="body">有效 Token 分母 → 累积梯度 → step / skip</text>
    <text x="1042" y="210" class="body">→ 调度时钟 → 参数位移</text>
  </g>

  <path d="M290 164H365" class="line"/>
  <path d="M610 164H685" class="line"/>
  <path d="M945 164H1020" class="line"/>
  <path d="M1235 237V280H170V375" class="line"/>

  <g>
    <rect x="45" y="375" width="250" height="140" class="card core"/>
    <text x="67" y="407" class="tag">TASK 4</text>
    <text x="67" y="440" class="head">状态生命周期与峰值</text>
    <text x="67" y="470" class="body">创建、最后消费与释放</text>
    <text x="67" y="495" class="body">决定同阶段驻留量</text>
  </g>

  <rect x="355" y="320" width="700" height="270" class="panel" data-layout-role="panel"/>
  <text x="385" y="354" class="tag">TASK 5</text>
  <text x="470" y="354" class="panel-title">两条并列策略在统一账本汇合</text>

  <g>
    <rect x="400" y="382" width="245" height="82" class="card strategy"/>
    <text x="422" y="415" class="head">19 · Checkpoint</text>
    <text x="422" y="443" class="body">用反向重算减少保存</text>
  </g>

  <g>
    <rect x="400" y="488" width="245" height="82" class="card strategy"/>
    <text x="422" y="521" class="head">42 · Offload</text>
    <text x="422" y="549" class="body">用传输降低 GPU 驻留</text>
  </g>

  <g>
    <rect x="775" y="420" width="235" height="118" class="card ledger"/>
    <text x="797" y="454" class="head">43 · 统一内存账本</text>
    <text x="797" y="484" class="body">比较策略后峰值</text>
    <text x="797" y="509" class="body">与新增计算 / 搬运时间</text>
  </g>

  <path d="M295 420H345V423H400" class="line"/>
  <path d="M295 475H345V529H400" class="line"/>
  <path d="M645 423H710V455H775" class="line"/>
  <path d="M645 529H710V503H775" class="line"/>

  <g>
    <rect x="1135" y="390" width="315" height="160" class="card evidence"/>
    <text x="1157" y="423" class="tag">TASK 6</text>
    <text x="1157" y="456" class="head">正确性、数值与性能证据</text>
    <text x="1157" y="486" class="body">输入 → 梯度 → 更新 → 质量</text>
    <text x="1157" y="511" class="body">→ 峰值 / 时间 / 吞吐</text>
    <text x="1157" y="536" class="body">形成 accept / tune / reject</text>
  </g>

  <path d="M1010 479H1135" class="line"/>
</svg>
