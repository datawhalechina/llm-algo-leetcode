<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">直接实现与 FlashAttention 风格反向传播对照</title>
  <desc id="desc">两种实现使用相同的 Attention 梯度关系，但直接实现保存完整中间状态，FlashAttention 风格实现保存归一化统计量并在反向阶段分块重算。</desc>
  <style>
    .bg{fill:#f8fafc}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    .direct{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.flash{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.shared{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}
    .title{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
    .name{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;fill:#0f172a}
    .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:14px;fill:#475569}
    .tag{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;font-weight:700;fill:#2563eb}
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 3L0 6z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="540" rx="20"/>
  <text x="50" y="52" class="title">Attention 梯度关系相同，保存状态与执行路径不同</text>

  <g>
    <rect class="shared" x="50" y="105" width="240" height="135" rx="16"/>
    <text x="75" y="135" class="tag">共同输入</text>
    <text x="75" y="166" class="name">Q、K、V 与 dO</text>
    <text x="75" y="196" class="text">mask 与缩放规则一致</text>
    <text x="75" y="220" class="text">目标都是得到 dQ、dK、dV</text>
  </g>

  <path class="line" d="M290 172H360"/>
  <path class="line" d="M290 172H325V383H360"/>

  <g>
    <rect class="direct" x="360" y="85" width="330" height="175" rx="16"/>
    <text x="385" y="120" class="name">直接反向实现</text>
    <text x="385" y="151" class="text">保存：Q、K、V、完整 S / P</text>
    <text x="385" y="178" class="text">执行：dO → dV / dP → dS → dQ / dK</text>
    <text x="385" y="205" class="text">内核：多个阶段分别读取和写回中间量</text>
    <text x="385" y="232" class="text">代价：较高的状态驻留与全局内存流量</text>
  </g>

  <g>
    <rect class="flash" x="360" y="295" width="330" height="175" rx="16"/>
    <text x="385" y="330" class="name">FlashAttention 风格实现</text>
    <text x="385" y="361" class="text">保存：Q、K、V 与归一化统计量</text>
    <text x="385" y="388" class="text">执行：分块重算 S / P，再形成局部梯度</text>
    <text x="385" y="415" class="text">内核：融合局部 dP / dS 与结果写回</text>
    <text x="385" y="442" class="text">代价：增加计算，降低状态驻留与 I/O</text>
  </g>

  <path class="line" d="M690 172H770V242H835"/>
  <path class="line" d="M690 383H770V262H835"/>

  <g>
    <rect class="shared" x="835" y="170" width="315" height="165" rx="16"/>
    <text x="860" y="205" class="name">统一核对项</text>
    <text x="860" y="238" class="text">梯度：dQ、dK、dV 与参考实现一致</text>
    <text x="860" y="266" class="text">状态：记录保存对象及其生命周期</text>
    <text x="860" y="294" class="text">性能：比较峰值显存、时间和 I/O</text>
    <text x="860" y="319" class="text">边界：固定 shape、mask、dtype 与设备</text>
  </g>
</svg>
