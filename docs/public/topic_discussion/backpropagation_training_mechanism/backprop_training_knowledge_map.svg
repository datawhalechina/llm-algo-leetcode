<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">反向传播与训练机制知识地图</title>
  <desc id="desc">训练信号沿反向依赖进入更新语义与正确性门槛，保存状态沿生命周期进入状态策略，两条证据在性能决策处汇合。</desc>
  <style>
    .bg{fill:#f8fafc}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}
    .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.orange{fill:#fff7ed;stroke:#fb923c}
    .n{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:18px;font-weight:700;fill:#0f172a}.s{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:14px;fill:#475569}.t{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
  </style>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 3L0 6z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="470" rx="20"/>
  <text x="50" y="52" class="t">机制链：监督定义梯度，依赖形成状态，证据约束策略</text>

  <path class="line" d="M270 150H315"/><path class="line" d="M535 150H580"/><path class="line" d="M800 150H845"/>
  <path class="line" d="M425 210V285"/><path class="line" d="M970 210V285"/>
  <path class="line" d="M535 345H580"/><path class="line" d="M800 345H845"/>

  <g><rect class="box blue" x="50" y="90" width="220" height="120" rx="16"/><text x="75" y="128" class="n">训练信号</text><text x="75" y="157" class="s">标签 / 损失 / 掩码</text><text x="75" y="181" class="s">定义监督对象</text></g>
  <g><rect class="box blue" x="315" y="90" width="220" height="120" rx="16"/><text x="340" y="128" class="n">反向依赖</text><text x="340" y="157" class="s">VJP / 局部导数 / 汇合</text><text x="340" y="181" class="s">决定梯度路径</text></g>
  <g><rect class="box blue" x="580" y="90" width="220" height="120" rx="16"/><text x="605" y="128" class="n">更新语义</text><text x="605" y="157" class="s">损失归约 / 梯度累积</text><text x="605" y="181" class="s">决定梯度尺度与更新步</text></g>
  <g><rect class="box" x="845" y="90" width="250" height="120" rx="16"/><text x="870" y="128" class="n">正确性门槛</text><text x="870" y="157" class="s">梯度 / 有限值 / 质量</text><text x="870" y="181" class="s">先确认训练语义</text></g>

  <g><rect class="box green" x="315" y="285" width="220" height="120" rx="16"/><text x="340" y="323" class="n">状态生命周期</text><text x="340" y="352" class="s">参数 / 激活 / 梯度</text><text x="340" y="376" class="s">决定峰值与释放时点</text></g>
  <g><rect class="box orange" x="580" y="285" width="220" height="120" rx="16"/><text x="605" y="323" class="n">状态策略</text><text x="605" y="352" class="s">激活检查点 / 卸载</text><text x="605" y="376" class="s">交换计算、传输与容量</text></g>
  <g><rect class="box green" x="845" y="285" width="250" height="120" rx="16"/><text x="870" y="323" class="n">性能证据</text><text x="870" y="352" class="s">峰值显存 / 单步时间</text><text x="870" y="376" class="s">形成受工作负载限制的决策</text></g>
</svg>
