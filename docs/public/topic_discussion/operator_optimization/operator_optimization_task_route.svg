<rect x="330" y="125" width="250" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="350" y="159" class="head">Task1 · 图编译与融合</text><text x="350" y="190" class="body">Part01 原理 / Part03 三路径</text><text x="350" y="215" class="small">中间读写、准备与稳态成本</text>
<rect x="330" y="300" width="250" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="350" y="334" class="head">Task2 · 布局与归约</text><text x="350" y="364" class="body">步长、融合与有效范围</text><text x="350" y="389" class="small">Part04 对照访存与线程协作</text>
