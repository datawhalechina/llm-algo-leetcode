<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">算子优化 Task0–6 学习路线</title>
<desc id="desc">从向量加法建立输出与耗时对照，再按成本选择图编译、基础内核、矩阵注意力或运行时干预。RoPE、变长、分页、量化与适配器按各自前置选学，不整体归入Task3。配置与实际执行在Task4核对，Part03的接口与同权重Block是Task6主验证出口，独立综合项目为后续扩展。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:15px;fill:#475569}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.branch{fill:none;stroke:#475569;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="650" rx="24" fill="#f8fafc"/>
<text x="40" y="48" class="title">按成本选择改动，再核对实际执行与负载收益</text>
<text x="40" y="82" class="body">实线：进入核对或复测；虚线：按问题选择。Part01 解释原理，Part02 核对模型计算语义。</text>
<text x="40" y="108" class="small">RoPE、变长、分页、量化与适配器按前置选学；数值测试与计时入口见主表。</text>
