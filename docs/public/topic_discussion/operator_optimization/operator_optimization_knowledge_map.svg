<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">算子优化知识地图</title><desc id="desc">Part03 向量加法是起步练习，Part01与Part02提供原理和语义参考。Part03、Part04分别按问题提供内核、编译、CUDA和Runtime核对，主线以接口与同权重Block验证为出口；Part05独立负载为可选扩展。</desc>
  <style>.bg{fill:#f8fafc}.panel{stroke-width:2;rx:20}.box{stroke-width:2;rx:16}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#34d399}.orange{fill:#fff7ed;stroke:#fb923c}.slate{fill:#f1f5f9;stroke:#94a3b8}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}.title{font-family:"Noto Sans CJK SC",sans-serif;font-size:25px;font-weight:700;fill:#0f172a}.h{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#0f172a}.s{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:400;fill:#475569}.tag{font-family:"Noto Sans CJK SC",sans-serif;font-size:13px;font-weight:700;fill:#2563eb}</style>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#64748b"/></marker></defs>
