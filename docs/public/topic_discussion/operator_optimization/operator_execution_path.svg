<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">搬运、提交与缓冲区各自等待什么</title><desc id="desc">内核之间的运行成本分成分批传输、重复提交和缓冲区复用三类。分别检查传输计算依赖与真实重叠、提交复用的输入更新与准备成本、引用和在途访问结束后的释放条件；三类检查不是依次执行的优化步骤。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486581"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.x{font-size:16px;font-weight:400;fill:#334e68}.note{font-size:14px;font-weight:400;fill:#486581}.b{stroke:#829ab1;stroke-width:2;rx:12}.l{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#486581;stroke-width:2.5;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}</style>
  <rect width="1100" height="430" fill="#f7fafc"/>
  <text x="550" y="44" text-anchor="middle" class="title">搬运、提交与缓冲区各自等待什么</text>
  <rect x="35" y="185" width="220" height="100" fill="#e6f6f5" class="b"/>
  <text x="145" y="219" text-anchor="middle" class="h">内核之间的运行成本</text>
  <text x="145" y="250" text-anchor="middle" class="x">搬运、提交与内存</text>
  <rect x="405" y="85" width="300" height="90" fill="#fff4e6" class="b"/>
  <text x="555" y="119" text-anchor="middle" class="h">分批传输</text>
  <text x="555" y="150" text-anchor="middle" class="x">传输与计算的先后</text>
  <rect x="405" y="205" width="300" height="90" fill="#fff4e6" class="b"/>
  <text x="555" y="239" text-anchor="middle" class="h">重复提交</text>
  <text x="555" y="270" text-anchor="middle" class="x">记录操作，重复执行</text>
  <rect x="405" y="325" width="300" height="90" fill="#fff4e6" class="b"/>
  <text x="555" y="359" text-anchor="middle" class="h">缓冲区复用</text>
  <text x="555" y="390" text-anchor="middle" class="x">张量引用与在途访问</text>
  <rect x="845" y="85" width="220" height="90" fill="#eef2ff" class="b"/>
  <text x="955" y="119" text-anchor="middle" class="h">核对真实重叠</text>
  <text x="955" y="150" text-anchor="middle" class="x">依赖 · 等待 · 时间线</text>
  <rect x="845" y="205" width="220" height="90" fill="#eef2ff" class="b"/>
  <text x="955" y="239" text-anchor="middle" class="h">核对重放成本</text>
  <text x="955" y="270" text-anchor="middle" class="x">输入更新 · 准备 · 稳态</text>
  <rect x="845" y="325" width="220" height="90" fill="#eef2ff" class="b"/>
  <text x="955" y="359" text-anchor="middle" class="h">核对安全释放</text>
  <text x="955" y="390" text-anchor="middle" class="x">引用 · 完成 · 活跃与预留</text>
  <path d="M145 185V130H405" class="l"/>
  <path d="M255 235H330V250H405" class="l"/>
  <path d="M145 285V370H405" class="l"/>
  <path d="M705 130H845" class="l"/>
  <path d="M705 250H845" class="l"/>
  <path d="M705 370H845" class="l"/>
</svg>
