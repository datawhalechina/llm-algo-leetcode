<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">从局部内核到独立工作负载的证据升级</title><desc id="desc">正确性和局部计时分别提供数值及性能证据；同权重Block检查替换影响；综合项目自行生成输入，测量两层解码器预填充，并依据本负载门槛作决定。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486581"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.x{font-size:16px;font-weight:400;fill:#334e68}.note{font-size:14px;font-weight:400;fill:#486581}.b{stroke:#829ab1;stroke-width:2;rx:12}.l{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#486581;stroke-width:2.5;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}</style>
  <rect width="1100" height="430" fill="#f7fafc"/>
  <text x="550" y="44" text-anchor="middle" class="title">从局部内核到独立工作负载的证据升级</text>
  <text x="550" y="77" text-anchor="middle" class="note">实线：当前范围的验证；虚线：可复用实现代码，项目独立生成输入与测量。</text>
  <rect x="40" y="115" width="220" height="90" fill="#e6f6f5" class="b"/>
  <text x="150" y="149" text-anchor="middle" class="h">参考与候选同输入</text>
  <text x="150" y="180" text-anchor="middle" class="x">边界 · 掩码 · 数值阈值</text>
  <rect x="340" y="115" width="220" height="90" fill="#fff4e6" class="b"/>
  <text x="450" y="149" text-anchor="middle" class="h">局部内核配对测量</text>
  <text x="450" y="180" text-anchor="middle" class="x">准备与稳态分别记录</text>
  <rect x="640" y="115" width="220" height="90" fill="#eef2ff" class="b"/>
  <text x="750" y="149" text-anchor="middle" class="h">同权重 Block 对照</text>
  <text x="750" y="180" text-anchor="middle" class="x">输出与组件时间</text>
  <path d="M260 160H340" class="l"/>
  <path d="M560 160H640" class="l"/>
  <rect x="640" y="300" width="220" height="90" fill="#eef2ff" class="b"/>
  <text x="750" y="334" text-anchor="middle" class="h">独立负载复测</text>
  <text x="750" y="365" text-anchor="middle" class="x">两层解码器预填充</text>
  <rect x="40" y="300" width="220" height="90" fill="#e6f6f5" class="b"/>
  <text x="150" y="334" text-anchor="middle" class="h">项目自行生成输入</text>
  <text x="150" y="365" text-anchor="middle" class="x">固定形状 · 精度 · 门槛</text>
  <rect x="900" y="300" width="160" height="90" fill="#eef2ff" class="b"/>
  <text x="980" y="334" text-anchor="middle" class="h">按负载作判断</text>
  <text x="980" y="365" text-anchor="middle" class="x">采用 · 调整 · 拒绝</text>
  <path d="M750 205V300" class="d"/>
  <text x="780" y="252" class="note">可复用代码，报告不作输入</text>
  <path d="M260 345H640" class="l"/>
  <path d="M860 345H900" class="l"/>
</svg>
