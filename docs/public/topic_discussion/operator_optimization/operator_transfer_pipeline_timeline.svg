<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">三批输入：先画依赖，再判断哪些传输被计算覆盖</title><desc id="desc">上下两组共用0到30毫秒刻度，串行30毫秒，对照双缓冲理想流水22毫秒。C等待A计算结束后复用缓冲0。</desc><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:15px}.small{font-size:13px}.line{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#a)}.blue{fill:#dbeafe;stroke:#60a5fa}.orange{fill:#ffedd5;stroke:#fb923c}.green{fill:#dcfce7;stroke:#4ade80}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#526579"/></marker></defs><rect width="1120" height="550" fill="#f8fafc"/><text x="35" y="43" class="title">三批输入：先画依赖，再判断哪些传输被计算覆盖</text><text x="35" y="78" class="s">同一时间刻度，单位 ms；每批传输4 ms、计算6 ms。理想构造，不是设备实测。</text><path d="M200 110V440" stroke="#e2e8f0"/><text x="195" y="103" class="small">0</text><path d="M256 110V440" stroke="#e2e8f0"/><text x="251" y="103" class="small">2</text><path d="M312 110V440" stroke="#e2e8f0"/><text x="307" y="103" class="small">4</text><path d="M368 110V440" stroke="#e2e8f0"/><text x="363" y="103" class="small">6</text><path d="M424 110V440" stroke="#e2e8f0"/><text x="419" y="103" class="small">8</text><path d="M480 110V440" stroke="#e2e8f0"/><text x="475" y="103" class="small">10</text><path d="M536 110V440" stroke="#e2e8f0"/><text x="531" y="103" class="small">12</text><path d="M592 110V440" stroke="#e2e8f0"/><text x="587" y="103" class="small">14</text><path d="M648 110V440" stroke="#e2e8f0"/><text x="643" y="103" class="small">16</text><path d="M704 110V440" stroke="#e2e8f0"/><text x="699" y="103" class="small">18</text><path d="M760 110V440" stroke="#e2e8f0"/><text x="755" y="103" class="small">20</text><path d="M816 110V440" stroke="#e2e8f0"/><text x="811" y="103" class="small">22</text><path d="M872 110V440" stroke="#e2e8f0"/><text x="867" y="103" class="small">24</text><path d="M928 110V440" stroke="#e2e8f0"/><text x="923" y="103" class="small">26</text><path d="M984 110V440" stroke="#e2e8f0"/><text x="979" y="103" class="small">28</text><path d="M1040 110V440" stroke="#e2e8f0"/><text x="1035" y="103" class="small">30</text><text x="35" y="146" class="h">串行传输</text><text x="35" y="197" class="h">串行计算</text><rect x="200" y="120" width="112" height="35" class="blue" rx="5"/><text x="210" y="144" class="s">A</text><rect x="480" y="120" width="112" height="35" class="blue" rx="5"/><text x="490" y="144" class="s">B</text><rect x="760" y="120" width="112" height="35" class="blue" rx="5"/><text x="770" y="144" class="s">C</text><rect x="312" y="171" width="168" height="35" class="orange" rx="5"/><text x="322" y="195" class="s">A</text><rect x="592" y="171" width="168" height="35" class="orange" rx="5"/><text x="602" y="195" class="s">B</text><rect x="872" y="171" width="168" height="35" class="orange" rx="5"/><text x="882" y="195" class="s">C</text><text x="35" y="292" class="h">流水传输</text><text x="35" y="343" class="h">流水计算</text><rect x="200" y="266" width="112" height="35" class="blue" rx="5"/><text x="210" y="290" class="s">A · 缓冲0</text><rect x="312" y="266" width="112" height="35" class="blue" rx="5"/><text x="322" y="290" class="s">B · 缓冲1</text><rect x="480" y="266" width="112" height="35" class="blue" rx="5"/><text x="490" y="290" class="s">C · 缓冲0</text><rect x="312" y="317" width="168" height="35" class="orange" rx="5"/><text x="322" y="341" class="s">A · 缓冲0</text><rect x="480" y="317" width="168" height="35" class="orange" rx="5"/><text x="490" y="341" class="s">B · 缓冲1</text><rect x="648" y="317" width="168" height="35" class="orange" rx="5"/><text x="658" y="341" class="s">C · 缓冲0</text><path d="M312 301V317" class="line"/><path d="M424 301V308H480V317" class="line"/><path d="M592 301V308H648V317" class="line"/><text x="200" y="396" class="s">C在10 ms后复用缓冲0：此时A计算已结束。</text><text x="200" y="430" class="s">B、C传输与前批计算重叠；每批计算仍等待本批传输完成。</text><text x="35" y="485" class="s">串行：3 × (4 + 6) = 30 ms；理想流水：4 + 6 + 2 × 6 = 22 ms。</text><text x="35" y="515" class="s">首尾阶段仍在总时间内；实际并发还取决于设备、锁页内存、提交和资源竞争。</text></svg>
