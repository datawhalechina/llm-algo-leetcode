<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">更大的输出块：复用机会增加，部分和也增多</title><desc id="desc">相同逻辑格尺度比较16乘16和32乘32输出块；每格代表4乘4输出。部分和数量不等于实际寄存器分配。</desc><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:15px}.small{font-size:13px}.line{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#a)}.blue{fill:#dbeafe;stroke:#60a5fa}.orange{fill:#ffedd5;stroke:#fb923c}.green{fill:#dcfce7;stroke:#4ade80}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#526579"/></marker></defs><rect width="1120" height="520" fill="#f8fafc"/><text x="35" y="43" class="title">更大的输出块：复用机会增加，部分和也增多</text><text x="35" y="78" class="s">构造比较：每格代表 4 × 4 个输出，不表示物理线程或寄存器。</text><text x="70" y="123" class="h">候选 A · 16 × 16</text><rect x="70" y="145" width="19" height="19" class="blue" rx="5"/><rect x="92" y="145" width="19" height="19" class="blue" rx="5"/><rect x="114" y="145" width="19" height="19" class="blue" rx="5"/><rect x="136" y="145" width="19" height="19" class="blue" rx="5"/><rect x="70" y="167" width="19" height="19" class="blue" rx="5"/><rect x="92" y="167" width="19" height="19" class="blue" rx="5"/><rect x="114" y="167" width="19" height="19" class="blue" rx="5"/><rect x="136" y="167" width="19" height="19" class="blue" rx="5"/><rect x="70" y="189" width="19" height="19" class="blue" rx="5"/><rect x="92" y="189" width="19" height="19" class="blue" rx="5"/><rect x="114" y="189" width="19" height="19" class="blue" rx="5"/><rect x="136" y="189" width="19" height="19" class="blue" rx="5"/><rect x="70" y="211" width="19" height="19" class="blue" rx="5"/><rect x="92" y="211" width="19" height="19" class="blue" rx="5"/><rect x="114" y="211" width="19" height="19" class="blue" rx="5"/><rect x="136" y="211" width="19" height="19" class="blue" rx="5"/><text x="250" y="170" class="h">逻辑部分和：256个</text><rect x="250" y="192" width="65" height="25" class="blue" rx="5"/><text x="250" y="254" class="s">较小的局部工作集</text><text x="250" y="286" class="s">单块可复用的输出范围较小</text><text x="610" y="123" class="h">候选 B · 32 × 32</text><rect x="610" y="145" width="19" height="19" class="orange" rx="5"/><rect x="632" y="145" width="19" height="19" class="orange" rx="5"/><rect x="654" y="145" width="19" height="19" class="orange" rx="5"/><rect x="676" y="145" width="19" height="19" class="orange" rx="5"/><rect x="698" y="145" width="19" height="19" class="orange" rx="5"/><rect x="720" y="145" width="19" height="19" class="orange" rx="5"/><rect x="742" y="145" width="19" height="19" class="orange" rx="5"/><rect x="764" y="145" width="19" height="19" class="orange" rx="5"/><rect x="610" y="167" width="19" height="19" class="orange" rx="5"/><rect x="632" y="167" width="19" height="19" class="orange" rx="5"/><rect x="654" y="167" width="19" height="19" class="orange" rx="5"/><rect x="676" y="167" width="19" height="19" class="orange" rx="5"/><rect x="698" y="167" width="19" height="19" class="orange" rx="5"/><rect x="720" y="167" width="19" height="19" class="orange" rx="5"/><rect x="742" y="167" width="19" height="19" class="orange" rx="5"/><rect x="764" y="167" width="19" height="19" class="orange" rx="5"/><rect x="610" y="189" width="19" height="19" class="orange" rx="5"/><rect x="632" y="189" width="19" height="19" class="orange" rx="5"/><rect x="654" y="189" width="19" height="19" class="orange" rx="5"/><rect x="676" y="189" width="19" height="19" class="orange" rx="5"/><rect x="698" y="189" width="19" height="19" class="orange" rx="5"/><rect x="720" y="189" width="19" height="19" class="orange" rx="5"/><rect x="742" y="189" width="19" height="19" class="orange" rx="5"/><rect x="764" y="189" width="19" height="19" class="orange" rx="5"/><rect x="610" y="211" width="19" height="19" cla