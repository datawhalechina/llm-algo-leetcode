"742" y="277" width="19" height="19" class="orange" rx="5"/><rect x="764" y="277" width="19" height="19" class="orange" rx="5"/><rect x="610" y="299" width="19" height="19" class="orange" rx="5"/><rect x="632" y="299" width="19" height="19" class="orange" rx="5"/><rect x="654" y="299" width="19" height="19" class="orange" rx="5"/><rect x="676" y="299" width="19" height="19" class="orange" rx="5"/><rect x="698" y="299" width="19" height="19" class="orange" rx="5"/><rect x="720" y="299" width="19" height="19" class="orange" rx="5"/><rect x="742" y="299" width="19" height="19" class="orange" rx="5"/><rect x="764" y="299" width="19" height="19" class="orange" rx="5"/><text x="820" y="170" class="h">逻辑部分和：1024个</text><rect x="820" y="192" width="260" height="25" class="orange" rx="5"/><text x="820" y="254" class="s">部分和数量为 A 的4倍</text><text x="820" y="286" class="s">输入可供更多输出复用</text><path d="M280 330V375H450" class="line"/><path d="M900 330V375H670" class="line"/><text x="460" y="380" class="h">共同观察</text><text x="150" y="430" class="s">编译资源：寄存器、共享内存与溢出；执行：可驻留预测、等待与配对耗时。</text><text x="150" y="466" class="s">实际分配由映射和编译决定；不能从逻辑部分和数直接推出占用率或速度。</text></svg>
