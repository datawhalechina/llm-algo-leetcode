<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">步长决定取哪个值，掩码决定哪些值参与归约</title><desc id="desc">上排用转置视图说明寻址，下排用三元素补齐说明归约范围；两行是独立例子。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d;font-weight:400}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:16px}.note{font-size:14px;fill:#475569}.box{stroke:#829ab1;stroke-width:2;rx:12}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#475569;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#a)}</style>
<rect width="1100" height="430" fill="#f8fafc"/>
<text x="40" y="42" class="title">步长决定取哪个值，掩码决定哪些值参与归约</text>
<text x="40" y="78" class="note">上排：转置只改变视图；下排：补齐零不改变平方和，但不能增加真实计数。</text>
<text x="40" y="111" class="h">原矩阵 2 × 3</text><text x="310" y="111" class="h">转置视图 3 × 2</text><rect x="40" y="130" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="56" y="153" class="s">1</text><rect x="86" y="130" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="102" y="153" class="s">2</text><rect x="132" y="130" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="148" y="153" class="s">3</text><rect x="40" y="166" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="56" y="189" class="s">4</text><rect x="86" y="166" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="102" y="189" class="s">5</text><rect x="132" y="166" width="43" height="33" rx="3" fill="#fed7aa" stroke="#60a5fa"/><text x="148" y="189" class="s">6</text><rect x="310" y="123" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="326" y="146" class="s">1</text><rect x="356" y="123" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="372" y="146" class="s">4</text><rect x="310" y="159" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="326" y="182" class="s">2</text><rect x="356" y="159" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="372" y="182" class="s">5</text><rect x="310" y="195" width="43" height="33" rx="3" fill="#dbeafe" stroke="#60a5fa"/><text x="326" y="218" class="s">3</text><rect x="356" y="195" width="43" height="33" rx="3" fill="#fed7aa" stroke="#60a5fa"/><text x="372" y="218" class="s">6</text><text x="40" y="229" class="s">步长 (3,1)</text><text x="310" y="249" class="s">步长 (1,3)</text><path d="M195 160H290" class="line"/><path d="M420 160H560" class="line"/><text x="580" y="145" class="h">同色元素：视图 (2,1) → 原矩阵 (1,2)</text><text x="580" y="178" class="s">元素偏移 = 2 × 1 + 1 × 3 = 5</text><text x="580" y="211" class="s">存储：[1,2,3,4,5,6]；偏移5仍取到6</text>
<rect x="40" y="285" width="230" height="90" fill="#e0f2fe" class="box"/><text x="155" y="317" text-anchor="middle" class="h">真实输入：[1,2,3]</text><text x="155" y="345" text-anchor="middle" class="s">有效计数 = 3</text>
<rect x="305" y="285" width="230" height="90" fill="#fef3c7" class="box"/><text x="420" y="317" text-anchor="middle" class="h">块宽补齐到 4</text><text x="420" y="345" text-anchor="middle" class="s">加载：[1,2,3,0]</text>
<rect x="570" y="285" width="230" height="90" fill="#e0f2fe" class="box"/><text x="685" y="317" text-anchor="middle" class="h">平方和 = 14</text><text x="685" y="345" text-anchor="middle" class="s">按真实计数归约</text>
<rect x="835" y="285" width="225" height="90" fill="#dcfce7" class="box"/><text x="947.5" y="317" text-anchor="middle" class="h">均方值 = 14 / 3</text><text x="947.5" y="345" text-anchor="middle" class="s">不是按块宽得到 14 / 4</text>
<path d="M270 330H305" class="line"/>
<path d="M535 330H570" class="line"/>
<path d="M800 330H835" class="line"/>
</svg>
