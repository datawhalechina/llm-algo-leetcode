<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">融合对照：中间激活在哪里被消费</title><desc id="desc">上方分离路径将激活写回显存并由乘法读取；下方融合路径在内核局部直接消费激活。两条路径都计算 z=SiLU(x)*y。</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486581"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.h{font-size:18px;font-weight:700}.x{font-size:16px;font-weight:400;fill:#334e68}.note{font-size:14px;font-weight:400;fill:#486581}.b{stroke:#829ab1;stroke-width:2;rx:12}.l{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#486581;stroke-width:2.5;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}</style>
  <rect width="1100" height="480" fill="#f7fafc"/>
  <text x="550" y="44" text-anchor="middle" class="title">融合对照：中间激活在哪里被消费</text>
  <text x="95" y="110" text-anchor="middle" class="note">分离执行</text>
  <rect x="40" y="135" width="240" height="95" fill="#e6f6f5" class="b"/>
  <text x="160" y="169" text-anchor="middle" class="h">激活内核</text>
  <text x="160" y="200" text-anchor="middle" class="x">u = SiLU(x)</text>
  <rect x="430" y="135" width="240" height="95" fill="#fff4e6" class="b"/>
  <text x="550" y="169" text-anchor="middle" class="h">显存中间张量</text>
  <text x="550" y="200" text-anchor="middle" class="x">写入 u，再读取 u</text>
  <rect x="820" y="135" width="240" height="95" fill="#e6f6f5" class="b"/>
  <text x="940" y="169" text-anchor="middle" class="h">乘法内核</text>
  <text x="940" y="200" text-anchor="middle" class="x">z = u × y</text>
  <path d="M280 182H430" class="l"/>
  <path d="M670 182H820" class="l"/>
  <text x="95" y="283" text-anchor="middle" class="note">融合执行</text>
  <rect x="40" y="305" width="240" height="95" fill="#e6f6f5" class="b"/>
  <text x="160" y="339" text-anchor="middle" class="h">输入 x、y</text>
  <text x="160" y="370" text-anchor="middle" class="x">读取有效元素</text>
  <rect x="430" y="305" width="240" height="95" fill="#fff4e6" class="b"/>
  <text x="550" y="339" text-anchor="middle" class="h">融合内核</text>
  <text x="550" y="370" text-anchor="middle" class="x">局部 u → 直接乘 y</text>
  <rect x="820" y="305" width="240" height="95" fill="#e6f6f5" class="b"/>
  <text x="940" y="339" text-anchor="middle" class="h">输出 z</text>
  <text x="940" y="370" text-anchor="middle" class="x">只写回最终结果</text>
  <path d="M280 352H430" class="l"/>
  <path d="M670 352H820" class="l"/>
<text x="40" y="255" class="x">分离：读 x、写 u、读 u、读 y、写 z → 5N 次元素级读写</text>
<text x="40" y="435" class="x">融合：读 x、读 y、写 z → 3N 次元素级读写</text>
<text x="40" y="466" class="note">同类型的 N 个元素，中间值仅此消费者；逻辑读写次数不等于实测 HBM 事务。</text>
</svg>
