<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">局部省下的时间，可能被布局转换抵消</title><desc id="desc">同一权重Block的构造成本100、101、98毫秒，分别区分其他计算、注意力和新增转换。</desc><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:15px}.small{font-size:13px}.line{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#a)}.blue{fill:#dbeafe;stroke:#60a5fa}.orange{fill:#ffedd5;stroke:#fb923c}.green{fill:#dcfce7;stroke:#4ade80}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#526579"/></marker></defs><rect width="1120" height="520" fill="#f8fafc"/><text x="35" y="43" class="title">局部省下的时间，可能被布局转换抵消</text><text x="35" y="78" class="s">构造的串行成本，单位 ms；三行共用刻度，其余计算均为90 ms，不是实测结果。</text><text x="35" y="167" class="h">原 Block</text><rect x="245" y="140" width="540" height="48" class="blue" rx="5"/><text x="455" y="171" class="s">其余计算 90</text><rect x="785" y="140" width="60" height="48" class="orange" rx="5"/><text x="785" y="130" class="small">Attention 10</text><text x="1005" y="171" class="h">合计 100</text><text x="35" y="282" class="h">候选：转换较多</text><rect x="245" y="255" width="540" height="48" class="blue" rx="5"/><text x="455" y="286" class="s">其余计算 90</text><rect x="785" y="255" width="36" height="48" class="orange" rx="5"/><text x="785" y="245" class="small">Attention 6</text><rect x="821" y="255" width="30" height="48" class="green" rx="5"/><text x="900" y="286" class="s">转换 5</text><text x="1005" y="286" class="h">合计 101</text><text x="35" y="397" class="h">候选：减少转换</text><rect x="245" y="370" width="540" height="48" class="blue" rx="5"/><text x="455" y="401" class="s">其余计算 90</text><rect x="785" y="370" width="36" height="48" class="orange" rx="5"/><text x="785" y="360" class="small">Attention 6</text><rect x="821" y="370" width="12" height="48" class="green" rx="5"/><text x="900" y="401" class="s">转换 2</text><text x="1005" y="401" class="h">合计 98</text><text x="35" y="464" class="s">内核从10降到6，省4；转换增加5时总计101，转换降到2时总计98。</text><text x="35" y="495" class="s">先比较完整调用，再按输出误差、资源预算与目标负载判断采用、调整或回退。</text></svg>
