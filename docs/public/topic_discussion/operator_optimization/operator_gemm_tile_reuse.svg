<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">同一输入子块参与多个输出，部分和沿 K 维保留</title><desc id="desc">构造2乘2输出块，每轮A和B各加载一个2乘2子块。四个输出各累加两个乘积，下一K段继续加到同一累加器，不重置。</desc><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172b4d}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:15px}.small{font-size:13px}.line{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#a)}.blue{fill:#dbeafe;stroke:#60a5fa}.orange{fill:#ffedd5;stroke:#fb923c}.green{fill:#dcfce7;stroke:#4ade80}</style><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#526579"/></marker></defs><rect width="1120" height="520" fill="#f8fafc"/><text x="35" y="43" class="title">同一输入子块参与多个输出，部分和沿 K 维保留</text><text x="35" y="78" class="s">构造示例：M = N = 2，K = 4；每轮处理两个 K 位置，框内是矩阵元素或部分和。</text><text x="70" y="124" class="h">A：两行 × 四个 K 位置</text><rect x="70" y="145" width="62" height="62" class="blue" rx="5"/><text x="82" y="174" class="s">a00</text><rect x="135" y="145" width="62" height="62" class="blue" rx="5"/><text x="147" y="174" class="s">a01</text><rect x="200" y="145" width="62" height="62" class="blue" style="fill:#93c5fd" rx="5"/><text x="212" y="174" class="s">a02</text><rect x="265" y="145" width="62" height="62" class="blue" style="fill:#93c5fd" rx="5"/><text x="277" y="174" class="s">a03</text><rect x="70" y="210" width="62" height="62" class="blue" rx="5"/><text x="82" y="239" class="s">a10</text><rect x="135" y="210" width="62" height="62" class="blue" rx="5"/><text x="147" y="239" class="s">a11</text><rect x="200" y="210" width="62" height="62" class="blue" style="fill:#93c5fd" rx="5"/><text x="212" y="239" class="s">a12</text><rect x="265" y="210" width="62" height="62" class="blue" style="fill:#93c5fd" rx="5"/><text x="277" y="239" class="s">a13</text><text x="435" y="124" class="h">B：四个 K 位置 × 两列</text><rect x="435" y="145" width="49" height="49" class="orange" rx="5"/><text x="447" y="174" class="s">b00</text><rect x="487" y="145" width="49" height="49" class="orange" rx="5"/><text x="499" y="174" class="s">b01</text><rect x="435" y="197" width="49" height="49" class="orange" rx="5"/><text x="447" y="226" class="s">b10</text><rect x="487" y="197" width="49" height="49" class="orange" rx="5"/><text x="499" y="226" class="s">b11</text><rect x="435" y="249" width="49" height="49" class="orange" style="fill:#fdba74" rx="5"/><text x="447" y="278" class="s">b20</text><rect x="487" y="249" width="49" height="49" class="orange" style="fill:#fdba74" rx="5"/><text x="499" y="278" class="s">b21</text><rect x="435" y="301" width="49" height="49" class="orange" style="fill:#fdba74" rx="5"/><text x="447" y="330" class="s">b30</text><rect x="487" y="301" width="49" height="49" class="orange" style="fill:#fdba74" rx="5"/><text x="499" y="330" class="s">b31</text><text x="740" y="124" class="h">C：同一个 2 × 2 累加器</text><rect x="740" y="145" width="82" height="82" class="green" rx="5"/><text x="752" y="174" class="s">c00</text><rect x="825" y="145" width="82" height="82" class="green" rx="5"/><text x="837" y="174" class="s">c01</text><rect x="740" y="230" width="82" height="82" class="green" rx="5"/><text x="752" y="259" class="s">c10</text><rect x="825" y="230" width="82" height="82" class="green" rx="5"/><text x="837" y="259" class="s">c11</text><text x="365" y="211" font-family="sans-serif" font-size="30" fill="#172b4d">×</text><path d="M550 205H720" class="line"/><text x="70" y="320" class="s">第1轮：A前两列 × B前两行</text><text x="70" y="352" class="s">c00 ← a00·b00 + a01·b10</text><text x="70" y="384" class="s">A的一行供两个输出列使用；B的一列供两个输出行使用。</text><text x="625" y="352" class="s">第2轮：读取后两个 K 位置</text><text x="625" y="384" class="s">c00 ← c00 + a02·b20 + a03·b30</text><text x="70" y="420" class="s">A、B中的浅色格用于首轮，深色格用于次轮；C跨轮保留。</text><text x="70" y="459" class="s">其余三个输出同样累加；新输出块才清零。扩大输出块增加复用，也增加同时保存的部分和。</text></svg>
