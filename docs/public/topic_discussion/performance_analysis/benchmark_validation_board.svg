<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">配对基准与回归验证</title>
  <desc id="desc">在同一运行身份下交替采集基线与候选样本，保留失败运行，比较差异分布并检查守护条件。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526581}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.node{stroke-width:2;rx:16}.line{stroke:#475569;stroke-width:2.8;fill:none;marker-end:url(#arrow)}.bar{stroke-width:1.8;rx:8}</style></defs>
  <rect id="node-0" width="1280" height="620" fill="#f8fafc"/>
  <text x="640" y="46" text-anchor="middle" class="title">配对基准：比较多轮差异与置信区间</text>
  <text x="640" y="74" text-anchor="middle" class="sub">基线与候选共享工作负载、环境和测量协议，失败运行进入同一判断</text>

  <rect id="node-1" x="55" y="120" width="250" height="105" fill="#dbeafe" stroke="#60a5fa" class="node"/><text x="180" y="158" text-anchor="middle" class="head">固定运行身份</text><text x="180" y="188" text-anchor="middle" class="body">环境 · 工作负载 · 统计协议</text>
  <rect id="node-2" x="360" y="120" width="250" height="105" fill="#dcfce7" stroke="#4ade80" class="node"/><text x="485" y="158" text-anchor="middle" class="head">交替配对采样</text><text x="485" y="188" text-anchor="middle" class="body">基线 ↔ 候选 · 顺序轮换</text>
  <rect id="node-3" x="665" y="120" width="250" height="105" fill="#fef3c7" stroke="#f59e0b" class="node"/><text x="790" y="158" text-anchor="middle" class="head">样本与失败分开记录</text><text x="790" y="188" text-anchor="middle" class="body">有效配对 · 失败数与总数</text>
  <rect id="node-4" x="970" y="120" width="250" height="105" fill="#ede9fe" stroke="#a78bfa" class="node"/><text x="1095" y="158" text-anchor="middle" class="head">形成配对分布</text><text x="1095" y="188" text-anchor="middle" class="body">配对比值 · 区间 · 样本数</text>
  <path d="M305 172H360" data-source="node-1" data-target="node-2" class="line"/><path d="M610 172H665" data-source="node-2" data-target="node-3" class="line"/><path d="M915 172H970" data-source="node-3" data-target="node-4" class="line"/>

  <rect id="node-5" x="80" y="330" width="350" height="180" fill="#eff6ff" stroke="#60a5fa" class="node"/>
  <text x="255" y="366" text-anchor="middle" class="head">配对样本</text>
  <text x="115" y="405" class="body">第 1 轮</text><rect id="node-6" x="185" y="387" width="105" height="24" fill="#93c5fd" stroke="#3b82f6" class="bar"/><rect id="node-7" x="300" y="387" width="92" height="24" fill="#86efac" stroke="#22c55e" class="bar"/>
  <text x="115" y="445" class="body">第 2 轮</text><rect id="node-8" x="185" y="427" width="98" height="24" fill="#86efac" stroke="#22c55e" class="bar"/><rect id="node-9" x="293" y="427" width="108" height="24" fill="#93c5fd" stroke="#3b82f6" class="bar"/>
  <text x="115" y="485" class="body">第 3 轮</text><rect id="node-10" x="185" y="467" width="106" height="24" fill="#93c5fd" stroke="#3b82f6" class="bar"/><rect id="node-11" x="301" y="467" width="95" height="24" fill="#86efac" stroke="#22c55e" class="bar"/>

  <rect id="node-12" x="485" y="330" width="300" height="180" fill="#fff7ed" stroke="#fb923c" class="node"/>
  <text x="635" y="366" text-anchor="middle" class="head">回归与收益分别检查</text><text x="635" y="397" text-anchor="middle" class="body">时间比值：候选 / 基线</text><text x="635" y="426" text-anchor="middle" class="body">回归通过：比值上界 ≤ 1 + δ</text><text x="635" y="455" text-anchor="middle" class="body">收益达标：比值上界 ≤ 1 − ε</text><text x="635" y="487" text-anchor="middle" class="body">δ：允许退化；ε：最低收益</text>
  <rect id="node-13" x="840" y="330" width="360" height="180" fill="#fdf2f8" stroke="#f472b6" class="node"/>
  <text x="1020" y="366" text-anchor="middle" class="head">守护条件与判断</text><text x="1020" y="407" text-anchor="middle" class="body">正确性 · 质量 · 容量 · 尾延迟</text><text x="1020" y="440" text-anchor="middle" class="body">失败率与成本不能越界</text><text x="1020" y="473" text-anchor="middle" class="body">通过 / 复测 / 拒绝</text>
  <path d="M430 420H485" data-source="node-5" data-target="node-12" class="line"/><path d="M785 420H840" data-source="node-12" data-target="node-13" class="line"/>
  <path d="M485 225V270H255V330" data-source="node-2" data-target="node-5" class="line"/>
  <path d="M1095 225V290H635V330" data-source="node-4" data-target="node-12" class="line"/>
  <text x="255" y="548" text-anchor="middle" class="body">示意样本：蓝色基线 / 绿色候选</text>
</svg>
