<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">性能分析知识地图</title>
  <desc id="desc">阶段、工作负载和质量门槛定义比较对象；可重复基线分出时间、驻留和资源上界证据，在可证伪归因处汇合，最后形成配对回归判断和诊断交接。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#526581}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.node{stroke-width:2}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.label{font-size:13px;font-weight:600;fill:#64748b}
    </style>
  </defs>
  <rect id="node-0" width="1280" height="680" fill="#F8FAFC"/>
  <text x="640" y="46" text-anchor="middle" class="title">性能分析知识地图</text>
  <text x="640" y="74" text-anchor="middle" class="sub">一份可复查诊断必须连起比较对象、观测证据、资源解释与复测判断</text>

  <path d="M230 192L490 230" data-source="node-1" data-target="node-4" class="flow"/>
  <path d="M530 192V230" data-source="node-2" data-target="node-4" class="flow"/>
  <path d="M830 192L790 230" data-source="node-3" data-target="node-4" class="flow"/>
  <path d="M510 312L210 360" data-source="node-4" data-target="node-5" class="flow"/>
  <path d="M640 312V360" data-source="node-4" data-target="node-6" class="flow"/>
  <path d="M770 312L1070 360" data-source="node-4" data-target="node-7" class="flow"/>
  <path d="M210 430V465H510V500" data-source="node-5" data-target="node-8" class="flow"/>
  <path d="M560 430V500" data-source="node-6" data-target="node-8" class="flow"/>
  <path d="M1070 430V465H650V500" data-source="node-7" data-target="node-8" class="flow"/>
  <path d="M690 537H730" data-source="node-8" data-target="node-9" class="flow"/>
  <path d="M970 537H1000" data-source="node-9" data-target="node-10" class="flow"/>

  <rect id="node-1" x="80" y="112" width="300" height="80" rx="16" fill="#DBEAFE" stroke="#2563EB" class="node"/>
  <text x="230" y="145" text-anchor="middle" class="head">阶段与目标指标</text>
  <text x="230" y="170" text-anchor="middle" class="body">训练步、TTFT、TPOT、峰值或扩展效率</text>
  <rect id="node-2" x="380" y="112" width="300" height="80" rx="16" fill="#DBEAFE" stroke="#2563EB" class="node"/>
  <text x="530" y="145" text-anchor="middle" class="head">工作负载与运行身份</text>
  <text x="530" y="170" text-anchor="middle" class="body">模型、输入、环境、后端、精度与种子</text>
  <rect id="node-3" x="680" y="112" width="300" height="80" rx="16" fill="#DBEAFE" stroke="#2563EB" class="node"/>
  <text x="830" y="145" text-anchor="middle" class="head">质量与有效性门槛</text>
  <text x="830" y="170" text-anchor="middle" class="body">正确性、质量、失败率、OOM 与 SLO</text>

  <rect id="node-4" x="420" y="230" width="440" height="82" rx="16" fill="#DCFCE7" stroke="#16A34A" class="node"/>
  <text x="640" y="263" text-anchor="middle" class="head">可重复基线</text>
  <text x="640" y="289" text-anchor="middle" class="body">预热、重复、原始样本、同步方式与失败记录</text>

  <text x="210" y="344" text-anchor="middle" class="label">时间证据</text>
  <text x="700" y="344" text-anchor="middle" class="label">驻留证据</text>
  <text x="1070" y="344" text-anchor="middle" class="label">资源解释</text>
  <rect id="node-5" x="80" y="360" width="260" height="70" rx="14" fill="#E0F2FE" stroke="#0284C7" class="node"/>
  <text x="210" y="390" text-anchor="middle" class="head">事件与关键路径</text>
  <text x="210" y="414" text-anchor="middle" class="body">计算、搬运、I/O、同步与等待</text>
  <rect id="node-6" x="510" y="360" width="260" height="70" rx="14" fill="#FEF3C7" stroke="#D97706" class="node"/>
  <text x="640" y="390" text-anchor="middle" class="head">对象驻留与峰值</text>
  <text x="640" y="414" text-anchor="middle" class="body">状态、缓冲区、生命周期与复用</text>
  <rect id="node-7" x="940" y="360" width="260" height="70" rx="14" fill="#FEF3C7" stroke="#D97706" class="node"/>
  <text x="1070" y="390" text-anchor="middle" class="head">经验参考与载荷</text>
  <text x="1070" y="414" text-anchor="middle" class="body">FLOPs、字节、容量、通信与队列</text>

  <rect id="node-8" x="430" y="500" width="260" height="74" rx="16" fill="#EDE9FE" stroke="#7C3AED" class="node"/>
  <text x="560" y="531" text-anchor="middle" class="head">可证伪归因</text>
  <text x="560" y="557" text-anchor="middle" class="body">主约束、判别实验、反例与未知项</text>
  <rect id="node-9" x="730" y="500" width="240" height="74" rx="16" fill="#FCE7F3" stroke="#DB2777" class="node"/>
  <text x="850" y="531" text-anchor="middle" class="head">配对回归判断</text>
  <text x="850" y="557" text-anchor="middle" class="body">差异、阈值、守护条件与失败</text>
  <rect id="node-10" x="1000" y="500" width="240" height="74" rx="16" fill="#EDE9FE" stroke="#7C3AED" class="node"/>
  <text x="1120" y="531" text-anchor="middle" class="head">诊断交接</text>
  <text x="1120" y="557" text-anchor="middle" class="body">候选类别、复测条件与未知项</text>
</svg>
