<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">诊断记录与行动交接</title>
  <desc id="desc">把测量条件、原始记录、可能原因和质量要求整理为诊断。记录不足时补测，主要限制已确认时选择候选，已有局部收益时扩大复测，触发停止条件时回退改动。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526581}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.node{stroke-width:2;rx:16}.line{stroke:#475569;stroke-width:2.8;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect id="node-0" width="1280" height="620" fill="#f8fafc"/>
  <text x="640" y="46" text-anchor="middle" class="title">诊断之后：补测、选候选、扩大复测或回退</text>
  <text x="640" y="74" text-anchor="middle" class="sub">保留输入与测量条件、原始记录及待查问题，按现有结果选择下一次操作</text>

  <rect id="node-1" x="60" y="120" width="250" height="92" fill="#dbeafe" stroke="#60a5fa" class="node"/><text x="185" y="154" text-anchor="middle" class="head">测量对象与条件</text><text x="185" y="183" text-anchor="middle" class="body">阶段 · 指标 · 输入 · 环境</text>
  <rect id="node-2" x="60" y="245" width="250" height="92" fill="#dcfce7" stroke="#4ade80" class="node"/><text x="185" y="279" text-anchor="middle" class="head">原始记录</text><text x="185" y="308" text-anchor="middle" class="body">基线 · 轨迹 · 驻留 · 回归</text>
  <rect id="node-3" x="60" y="370" width="250" height="92" fill="#fef3c7" stroke="#f59e0b" class="node"/><text x="185" y="404" text-anchor="middle" class="head">质量与资源要求</text><text x="185" y="433" text-anchor="middle" class="body">质量 · 失败率 · 容量 · SLO</text>

  <rect id="node-4" x="420" y="155" width="400" height="270" fill="#f8fafc" stroke="#64748b" class="node"/>
  <text x="620" y="195" text-anchor="middle" class="head">诊断记录</text>
  <rect id="node-5" x="465" y="225" width="310" height="58" fill="#fff" stroke="#cbd5e1" class="node"/><text x="620" y="261" text-anchor="middle" class="body">可能原因及支持它的对照</text>
  <rect id="node-6" x="465" y="305" width="310" height="58" fill="#fff" stroke="#cbd5e1" class="node"/><text x="620" y="341" text-anchor="middle" class="body">反例、待查问题与适用范围</text>
  <path d="M310 166H380V240H420" data-source="node-1" data-target="node-4" class="line"/><path d="M310 291H420" data-source="node-2" data-target="node-4" class="line"/><path d="M310 416H380V370H420" data-source="node-3" data-target="node-4" class="line"/>

  <rect id="node-7" x="930" y="90" width="280" height="96" fill="#eff6ff" stroke="#60a5fa" class="node"/><text x="1070" y="126" text-anchor="middle" class="head">继续补测</text><text x="1070" y="156" text-anchor="middle" class="body">条件不全，或记录存在未解释冲突</text>
  <rect id="node-8" x="930" y="220" width="280" height="96" fill="#f0fdf4" stroke="#4ade80" class="node"/><text x="1070" y="256" text-anchor="middle" class="head">选择优化候选</text><text x="1070" y="286" text-anchor="middle" class="body">已确认主要限制，比较改动及代价</text>
  <rect id="node-10" x="930" y="350" width="280" height="96" fill="#faf5ff" stroke="#a78bfa" class="node"/><text x="1070" y="386" text-anchor="middle" class="head">扩大范围复测</text><text x="1070" y="416" text-anchor="middle" class="body">当前负载有收益，继续检查适用范围</text>
  <rect id="node-9" x="930" y="480" width="280" height="96" fill="#fef2f2" stroke="#fb7185" class="node"/><text x="1070" y="516" text-anchor="middle" class="head">回退已有改动</text><text x="1070" y="546" text-anchor="middle" class="body">触发停止条件、明确回归或质量失败</text>
  <path d="M820 210H850V138H930" data-source="node-4" data-target="node-7" class="line"/>
  <path d="M820 268H930" data-source="node-4" data-target="node-8" class="line"/>
  <path d="M820 330H890V398H930" data-source="node-4" data-target="node-10" class="line"/>
  <path d="M820 390H850V528H930" data-source="node-4" data-target="node-9" class="line"/>
</svg>
