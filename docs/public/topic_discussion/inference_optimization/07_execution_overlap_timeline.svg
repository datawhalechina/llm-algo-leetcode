<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">Serving 执行关键路径与重叠</title>
  <desc id="desc">CPU 准备、GPU Prefill/Decode、KV handoff 和下一轮调度在时间线上重叠，显示通信暴露与隐藏的区别。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.lane{font-size:17px;font-weight:700;fill:#334155}.label{font-size:15px;font-weight:700}.small{font-size:13px}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="620" fill="#f8fafc"/>
  <rect x="36" y="28" width="1088" height="564" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="72" class="title">执行关键路径：哪些等待可以被隐藏？</text>
  <text x="70" y="102" class="sub">四层调度决定任务，执行与通信重叠决定等待是否暴露给请求。</text>

  <line x1="180" y1="150" x2="1050" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <text x="180" y="135" class="small" fill="#64748b">时间 →</text>

  <text x="70" y="205" class="lane">CPU</text>
  <line x1="180" y1="198" x2="1050" y2="198" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="220" y="176" width="190" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="203" text-anchor="middle" class="label" fill="#1e3a8a">准备下一批请求</text>
  <rect x="690" y="176" width="190" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="785" y="203" text-anchor="middle" class="label" fill="#1e3a8a">准备 Decode 状态</text>

  <text x="70" y="300" class="lane">GPU</text>
  <line x1="180" y1="293" x2="1050" y2="293" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="260" y="271" width="250" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="385" y="298" text-anchor="middle" class="label" fill="#92400e">Prefill chunk</text>
  <rect x="540" y="271" width="150" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="298" text-anchor="middle" class="label" fill="#166534">Decode</text>
  <rect x="770" y="271" width="190" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="865" y="298" text-anchor="middle" class="label" fill="#166534">下一轮 Decode</text>

  <text x="70" y="395" class="lane">通信 / 搬运</text>
  <line x1="180" y1="388" x2="1050" y2="388" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="430" y="366" width="180" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="520" y="393" text-anchor="middle" class="label" fill="#075985">H2D / KV handoff</text>
  <rect x="820" y="366" width="170" height="44" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="905" y="393" text-anchor="middle" class="label" fill="#5b21b6">通信 / 同步</text>

  <path d="M410 198 C470 198 470 250 470 271" class="flow"/>
  <path d="M690 198 C720 198 720 250 720 271" class="flow"/>
  <path d="M510 315 C510 340 520 340 520 366" class="flow"/>
  <path d="M610 366 C650 366 650 315 650 315" class="flow"/>
  <path d="M960 315 C1000 315 1000 250 1000 220" class="flow"/>

  <rect x="220" y="468" width="760" height="78" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="250" y="500" class="label" fill="#9a3412">判断关键路径</text>
  <text x="250" y="527" class="small" fill="#7c2d12">被计算覆盖的通信不等于零成本；要同时记录 transfer bytes、exposed communication、idle gap 和池利用率。</text>
</svg>
