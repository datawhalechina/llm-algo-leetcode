<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
<title id="title">准备、搬运与计算的就绪时间</title><desc id="desc">两批次构造时间线：A准备0至2、传输2至4、计算4至10；B准备2至4、传输4至6、计算10至16。B传输与A计算重叠，两批计算分别等待各自输入。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-weight:400;fill:#17324d}.title{font-size:26px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:16px}.note{font-size:15px;fill:#475569}.task{stroke:#829ab1;stroke-width:2;rx:8}.lane{stroke:#cbd5e1;stroke-width:1.5}.axis{stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="1160" height="620" fill="#f8fafc"/>
<text x="40" y="48" class="title">输入就绪后才能计算，独立批次可以提前搬运</text>
<text x="40" y="86" class="note">构造示例，统一毫秒比例；假设传输与计算支持并发，忽略带宽争用与提交开销。</text>
<line x1="240" y1="130" x2="1080" y2="130" class="axis"/>
<text x="240" y="119" text-anchor="middle" class="note">0</text><text x="340" y="119" text-anchor="middle" class="note">2</text><text x="440" y="119" text-anchor="middle" class="note">4</text><text x="540" y="119" text-anchor="middle" class="note">6</text><text x="740" y="119" text-anchor="middle" class="note">10</text><text x="1040" y="119" text-anchor="middle" class="note">16 ms</text>
<text x="40" y="208" class="h">CPU 准备</text><line x1="240" y1="200" x2="1040" y2="200" class="lane"/>
<rect x="240" y="175" width="100" height="50" fill="#dbeafe" class="task"/><text x="290" y="206" text-anchor="middle" class="s">批 A</text>
<rect x="340" y="175" width="100" height="50" fill="#dbeafe" class="task"/><text x="390" y="206" text-anchor="middle" class="s">批 B</text>
<text x="40" y="328" class="h">主机到设备传输</text><line x1="240" y1="320" x2="1040" y2="320" class="lane"/>
<rect x="340" y="295" width="100" height="50" fill="#fef3c7" class="task"/><text x="390" y="326" text-anchor="middle" class="s">批 A</text>
<rect x="440" y="295" width="100" height="50" fill="#fef3c7" class="task"/><text x="490" y="326" text-anchor="middle" class="s">批 B</text>
<text x="40" y="448" class="h">GPU 计算</text><line x1="240" y1="440" x2="1040" y2="440" class="lane"/>
<rect x="240" y="415" width="200" height="50" fill="#e2e8f0" class="task"/><text x="340" y="446" text-anchor="middle" class="s">等待首批输入</text>
<rect x="440" y="415" width="300" height="50" fill="#dcfce7" class="task"/><text x="590" y="446" text-anchor="middle" class="s">批 A：4–10 ms</text>
<rect x="740" y="415" width="300" height="50" fill="#dcfce7" class="task"/><text x="890" y="446" text-anchor="middle" class="s">批 B：10–16 ms</text>
<line x1="440" y1="345" x2="440" y2="405" class="lane" stroke-dasharray="5 5"/><line x1="540" y1="345" x2="540" y2="405" class="lane" stroke-dasharray="5 5"/>
<text x="720" y="530" text-anchor="middle" class="note">4–6 ms：批 B 的传输与批 A 的计算重叠</text>
<text x="720" y="565" text-anchor="middle" class="note">批 B 输入在 6 ms 就绪，等待 GPU 到 10 ms 后开始计算</text>
</svg>
