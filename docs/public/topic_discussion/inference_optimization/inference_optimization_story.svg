<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">推理服务的观察、归因与候选复测</title><desc id="desc">推理服务的观察、归因与候选复测；对象与适用条件见图前正文，图示不代表实测结果。</desc>
<rect width="1500" height="560" fill="#f7fafc"/><style>.t{font-family:"Noto Sans CJK SC",sans-serif;font-size:32px;font-weight:700;fill:#172b4d}.h{font-family:"Noto Sans CJK SC",sans-serif;font-size:21px;font-weight:700;fill:#172b4d}.s{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;font-weight:400;fill:#243b53}.b{stroke-width:2;rx:16}.a{stroke:#627d98;stroke-width:3;marker-end:url(#m)}</style><defs><marker markerUnits="userSpaceOnUse" id="m" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#627d98"/></marker></defs>
<text x="750" y="52" text-anchor="middle" class="t">推理优化要解决什么问题</text><text x="750" y="82" text-anchor="middle" class="s">从“服务为什么慢”出发，沿请求链路定位瓶颈，再选择机制和部署方案。</text>
<rect x="55" y="150" width="210" height="150" fill="#fee2e2" stroke="#dc2626" class="b"/><text x="160" y="192" text-anchor="middle" class="h">服务问题</text><text x="160" y="230" text-anchor="middle" class="s">TTFT 高？</text><text x="160" y="256" text-anchor="middle" class="s">TPOT 高？</text><text x="160" y="282" text-anchor="middle" class="s">吞吐低或 OOM？</text>
<path d="M265 225h65" class="a"/><rect x="330" y="150" width="210" height="150" fill="#e8f1fb" stroke="#4c8eda" class="b"/><text x="435" y="192" text-anchor="middle" class="h">请求观测</text><text x="435" y="230" text-anchor="middle" class="s">阶段等待</text><text x="435" y="256" text-anchor="middle" class="s">KV 状态变化</text><text x="435" y="282" text-anchor="middle" class="s">批次与执行路径</text>
<path d="M540 225h65" class="a"/><rect x="605" y="150" width="210" height="150" fill="#fff5e6" stroke="#e0a23b" class="b"/><text x="710" y="192" text-anchor="middle" class="h">瓶颈定位</text><text x="710" y="230" text-anchor="middle" class="s">计算 / 访存</text><text x="710" y="256" text-anchor="middle" class="s">状态增长 / 排队</text><text x="710" y="282" text-anchor="middle" class="s">容量 / 传输等待</text>
<path d="M815 225h65" class="a"/><rect x="880" y="150" width="210" height="150" fill="#e8f7ef" stroke="#45a36b" class="b"/><text x="985" y="192" text-anchor="middle" class="h">机制选择</text><text x="985" y="230" text-anchor="middle" class="s">注意力 / FFN / 专家</text><text x="985" y="256" text-anchor="middle" class="s">生成 / 缓存 / 调度</text><text x="985" y="282" text-anchor="middle" class="s">精度 / 实际执行路径</text>
<path d="M1090 225h65" class="a"/><rect x="1155" y="150" width="290" height="150" fill="#f0eefb" stroke="#8069b5" class="b"/><text x="1300" y="192" text-anchor="middle" class="h">实验验证与部署决策</text><text x="1300" y="230" text-anchor="middle" class="s">同请求协议配对</text><text x="1300" y="256" text-anchor="middle" class="s">质量、资源与完整请求</text><text x="1300" y="282" text-anchor="middle" class="s">采用 / 调整 / 拒绝</text>
</svg>
