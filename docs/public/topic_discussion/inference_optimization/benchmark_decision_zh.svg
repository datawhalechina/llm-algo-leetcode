<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">同一组请求怎样从两份测量走到采用判断</title>
<desc id="desc">共同请求分别进入基线和候选，按请求对应保存结果。先核对比较有效性，无效则修复测量；有效时按预先声明的质量、失败、资源和性能门槛判断。构造例子吞吐提高但违反首词元延迟门槛。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d;font-size:19px}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.note{font-size:17px;fill:#475569}.box{stroke:#829ab1;stroke-width:1.5;rx:12}.flow{fill:none;stroke:#52606d;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="980" fill="#f7fafc"/>
<text x="40" y="44" class="title">先让两份结果能够对应，再判断候选是否满足目标</text>
<text x="40" y="79" class="note">配对指同一请求或请求集合在两侧对应保留，不要求同时运行，也不要求形成相同批次。</text>
<rect x="220" y="110" width="760" height="84" fill="#dbeafe" class="box"/>
<text x="600" y="144" text-anchor="middle" class="head">共同请求：q1、q2、…；事先声明比较协议与门槛</text>
<text x="600" y="175" text-anchor="middle" class="note">共用输入、到达与生成规则，记录本次要改变的配置</text>
<path d="M450 194V217H290V240" class="flow"/><path d="M750 194V217H910V240" class="flow"/>
<rect x="40" y="240" width="500" height="100" fill="#ecfdf5" class="box"/>
<text x="64" y="276" class="head">基线配置 → q1、q2、… 的结果</text><text x="64" y="311">保留时间、输出长度、停止、失败与质量</text>
<rect x="660" y="240" width="500" height="100" fill="#ede9fe" class="box"/>
<text x="684" y="276" class="head">候选配置 → q1、q2、… 的结果</text><text x="684" y="311">明确改了缓存、并发、精度或执行后端</text>
<path d="M290 340V369H440V395" class="flow"/><path d="M910 340V369H760V395" class="flow"/>
<rect x="340" y="395" width="520" height="97" fill="#fff" class="box"/>
<text x="600" y="430" text-anchor="middle" class="head">按相同请求分组，保留各轮与失败样本</text>
<text x="600" y="464" text-anchor="middle" class="note">分别汇总等待、吞吐、任务质量与资源代价</text>
<path d="M600 492V530" class="flow"/>
<rect x="390" y="530" width="420" height="70" fill="#fef3c7" class="box"/>
<text x="600" y="573" text-anchor="middle" class="head">请求、状态与测量条件是否可比？</text>
<path d="M390 565H300" class="flow"/><text x="345" y="550" text-anchor="middle" class="note">否</text>
<rect x="40" y="530" width="260" height="70" fill="#fff" class="box"/><text x="170" y="559" text-anchor="middle" class="head">先修复测量</text><text x="170" y="586" text-anchor="middle" class="note">修复后重新运行比较</text>
<path d="M600 600V645" class="flow"/><text x="618" y="629" class="note">是</text>
<rect x="320" y="645" width="560" height="80" fill="#dbeafe" class="box"/>
<text x="600" y="677" text-anchor="middle" class="head">对照预先声明的硬性门槛与负载目标</text>
<text x="600" y="706" text-anchor="middle" class="note">质量、失败率、容量、等待与有效吞吐逐项判断</text>
<path d="M450 725V754H200V785" class="flow"/><path d="M600 725V785" class="flow"/><path d="M750 725V754H1000V785" class="flow"/>
<rect x="40" y="785" width="320" height="90" fill="#dcfce7" class="box"/><text x="200" y="819" text-anchor="middle" class="head">采用</text><text x="200" y="852" text-anchor="middle" class="note">各项门槛通过，保留适用负载</text>
<rect x="440" y="785" width="320" height="90" fill="#fef3c7" class="box"/><text x="600" y="819" text-anchor="middle" class="head">调整或补证</text><text x="600" y="852" text-anchor="middle" class="note">评估未齐、差异待查或收益待改善</text>
<rect x="840" y="785" width="320" height="90" fill="#fee2e2" class="box"/><text x="1000" y="819" text-anchor="middle" class="head">拒绝当前候选</text><text x="1000" y="852" text-anchor="middle" class="note">有效比较已确认违反硬性门槛</text>
<text x="40" y="920">构造例子：吞吐 100 → 130 词元／秒，但首词元 P95 为 200 → 350 ms，超过交互门槛 300 ms。</text>
<text x="40" y="954" class="note">吞吐提高仍不满足这项交互要求；离线任务按自己的等待、质量与成本门槛另作判断。</text>
</svg>
