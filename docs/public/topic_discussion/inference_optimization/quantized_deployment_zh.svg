<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">按瓶颈选择权重、激活计算或KV低精度分支</title>
<desc id="desc">从同模型同任务和请求协议的浮点基线出发，按主要瓶颈选择低精度对象。权重检查加载与矩阵路径，激活计算检查缩放转换和累加精度，KV检查追加恢复与读取。各自回到质量、完整调用、容量和请求收益比较，不要求三条分支全部实施。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d;font-size:19px}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.note{font-size:17px;fill:#475569}.box{stroke:#829ab1;stroke-width:1.5;rx:12}.flow{fill:none;stroke:#52606d;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="620" fill="#f7fafc"/>
<text x="40" y="44" class="title">先确定要减少哪类数据，再追踪它怎样进入实际计算</text>
<text x="40" y="79" class="note">按当前瓶颈选择分支，单项比较后再组合；权重、运行张量和历史状态的低精度路径分别检查。</text>
<rect x="300" y="115" width="600" height="80" fill="#dbeafe" class="box"/>
<text x="600" y="148" text-anchor="middle" class="head">同模型、同任务与请求协议的浮点基线</text>
<text x="600" y="178" text-anchor="middle" class="note">先区分权重驻留、计算读写与上下文容量的主要成本</text>
<path d="M450 195V222H210V255" class="flow"/><path d="M600 195V255" class="flow"/><path d="M750 195V222H990V255" class="flow"/>
<rect x="40" y="255" width="340" height="160" fill="#eaf2ff" class="box"/>
<text x="64" y="292" class="head">权重：参数驻留与读取</text><text x="64" y="331">参数及缩放信息 → 加载器</text><text x="64" y="370">实际矩阵路径与反量化成本</text>
<rect x="430" y="255" width="340" height="160" fill="#ecfdf5" class="box"/>
<text x="454" y="292" class="head">激活与计算：运行张量</text><text x="454" y="331">缩放与转换 → 矩阵计算</text><text x="454" y="370">输入、累加精度与转换成本</text>
<rect x="820" y="255" width="340" height="160" fill="#fef3c7" class="box"/>
<text x="844" y="292" class="head">KV：持续增长的历史状态</text><text x="844" y="331">量化状态与元数据 → 读取</text><text x="844" y="370">追加、恢复与长上下文质量</text>
<path d="M210 415V446H440V480" class="flow"/><path d="M600 415V480" class="flow"/><path d="M990 415V446H760V480" class="flow"/>
<rect x="280" y="480" width="640" height="82" fill="#ede9fe" class="box"/>
<text x="600" y="513" text-anchor="middle" class="head">回到任务质量、完整调用与请求收益</text>
<text x="600" y="544" text-anchor="middle" class="note">分别记录容量、转换开销、等待、吞吐及输出变化</text>
<text x="40" y="599" class="note">权重分支核对产物与加载；运行精度或 KV 配置按对应执行路径比较，无需统一经过权重文件流程。</text>
</svg>
