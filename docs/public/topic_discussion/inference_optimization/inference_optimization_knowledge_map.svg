<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
<title id="title">推理优化：计算、生成、缓存与调度的反馈</title><desc id="desc">计算产生生成所需分数，生成与验证决定推进及回退需求，缓存提供可用容量，调度选择下一轮工作并改变计算形状。低精度同时影响计算与缓存，所有结果返回请求等待、质量和资源比较。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font:19px "Noto Sans CJK SC",sans-serif;fill:#17324d}.head{font-size:21px;font-weight:700}.title{font-size:28px;font-weight:700}.note{font-size:17px;fill:#475569}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style>
<rect width="1500" height="800" fill="#f7fafc"/>
<text x="40" y="46" class="title">推理优化：计算、生成、缓存与调度的反馈</text>
<text x="40" y="86" class="note">共同比较条件：模型身份、输入与生成规则、到达负载和设备；实线表示影响或状态反馈。</text>
<rect x="520" y="130" width="460" height="110" rx="14" fill="#ede9fe" stroke="#829ab1" stroke-width="2"/>
<text x="750" y="166" text-anchor="middle" class="head">低精度表示与执行</text>
<text x="750" y="202" text-anchor="middle">权重 / 激活与计算 / KV</text>
<path d="M560 240V275H195V330" class="edge"/>
<path d="M940 240V275H935V330" class="edge"/>
<rect x="40" y="330" width="310" height="120" rx="14" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/>
<text x="195" y="366" text-anchor="middle" class="head">模型计算</text>
<text x="195" y="402" text-anchor="middle">投影 / 注意力 / FFN / 专家</text>
<text x="195" y="431" text-anchor="middle">产生分数，写入当前 KV</text>
<rect x="410" y="330" width="310" height="120" rx="14" fill="#ecfdf5" stroke="#829ab1" stroke-width="2"/>
<text x="565" y="366" text-anchor="middle" class="head">生成与验证</text>
<text x="565" y="402" text-anchor="middle">采样 / 草稿 / 停止</text>
<text x="565" y="431" text-anchor="middle">有效提交量与临时位置</text>
<rect x="780" y="330" width="310" height="120" rx="14" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/>
<text x="935" y="366" text-anchor="middle" class="head">KV 状态管理</text>
<text x="935" y="402" text-anchor="middle">追加 / 回退 / 共享 / 回收</text>
<text x="935" y="431" text-anchor="middle">可用块与恢复成本</text>
<rect x="1150" y="330" width="310" height="120" rx="14" fill="#fef3c7" stroke="#829ab1" stroke-width="2"/>
<text x="1305" y="366" text-anchor="middle" class="head">请求调度</text>
<text x="1305" y="402" text-anchor="middle">选择成员与阶段预算</text>
<text x="1305" y="431" text-anchor="middle">按容量与等待目标安排工作</text>
<path d="M350 390H410" class="edge"/>
<path d="M720 390H780" class="edge"/>
<path d="M1090 390H1150" class="edge"/>
<path d="M1150 425H1110V535H195V450" class="edge"/>
<text x="650" y="515" text-anchor="middle" class="note">成员与阶段预算改变下一轮的计算形状和工作量</text>
<text x="195" y="305" text-anchor="middle" class="note">改变权重读写与计算成本</text><text x="935" y="305" text-anchor="middle" class="note">改变缓存字节与恢复成本</text>
<rect x="350" y="650" width="800" height="110" rx="14" fill="#f1f5f9" stroke="#829ab1" stroke-width="2"/>
<text x="750" y="686" text-anchor="middle" class="head">用执行记录与请求结果检查整体变化</text>
<text x="750" y="722" text-anchor="middle">首词元与生成间隔 / 有效吞吐 / 显存 / 任务质量 / 失败</text>
<path d="M1460 390H1480V705H1150" class="edge"/>
<text x="750" y="610" text-anchor="middle" class="note">生成推进与状态回退改变容量；容量限制准入，调度又决定下一轮怎样执行。</text>
</svg>
