<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L0 7 L7 3.5 Z" fill="#52606d"/></marker>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L0 7 L7 3.5 Z" fill="#4c8eda"/></marker>
    <marker id="arrowMap" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L0 6 L6 3 Z" fill="#829ab1"/></marker>
    <marker id="arrowState" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L0 6 L6 3 Z" fill="#45a36b"/></marker>
    <style>
      .title{font:700 30px sans-serif;fill:#172b4d}.section{font:700 21px sans-serif;fill:#172b4d}
      .group-title{font:700 16px sans-serif;fill:#36526f}.task{font:700 18px sans-serif;fill:#172b4d}
      .text{font:16px sans-serif;fill:#243b53}.small{font:14px sans-serif;fill:#52606d}.tiny{font:13px sans-serif;fill:#52606d}
      .box{stroke-width:2;rx:14}.group-bg{stroke-width:2;rx:20}
      .flow{stroke:#52606d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .map{stroke:#829ab1;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowMap)}
      .state{stroke:#45a36b;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowState)}
      .sequence{stroke:#4c8eda;stroke-width:2.8;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f7fafc"/>
  <text x="750" y="42" text-anchor="middle" class="title">推理优化路线图：从请求链路到部署决策</text>

  <rect x="12" y="78" width="1476" height="168" fill="#eef6ff" stroke="#8ab4df" class="group-bg"/>
  <text x="30" y="104" class="group-title">请求生命周期</text>
  <rect x="35" y="120" width="190" height="70" fill="#e8f1fb" stroke="#4c8eda" class="box"/>
  <text x="130" y="150" text-anchor="middle" class="task">输入请求</text><text x="130" y="174" text-anchor="middle" class="small">Prompt / batch / seq_len</text>
  <rect x="275" y="120" width="190" height="70" fill="#fff5e6" stroke="#e0a23b" class="box"/>
  <text x="370" y="150" text-anchor="middle" class="task">Prefill</text><text x="370" y="174" text-anchor="middle" class="small">处理输入，建立初始状态</text>
  <rect x="755" y="120" width="190" height="70" fill="#fce7f3" stroke="#db2777" class="box"/>
  <text x="850" y="150" text-anchor="middle" class="task">Decode</text><text x="850" y="174" text-anchor="middle" class="small">逐 token 读取并追加 K/V</text>
  <rect x="995" y="120" width="190" height="70" fill="#f0eefb" stroke="#8069b5" class="box"/>
  <text x="1090" y="150" text-anchor="middle" class="task">Serving</text><text x="1090" y="174" text-anchor="middle" class="small">组织批处理与队列</text>
  <rect x="1235" y="120" width="190" height="70" fill="#eef2f5" stroke="#829ab1" class="box"/>
  <text x="1330" y="150" text-anchor="middle" class="task">输出与评估</text><text x="1330" y="174" text-anchor="middle" class="small">延迟 / 吞吐 / 质量</text>
  <path d="M225 155 H275" class="flow"/><path d="M465 155 H755" class="flow"/><path d="M945 155 H995" class="flow"/><path d="M1185 155 H1235" class="flow"/>
  <rect x="515" y="195" width="190" height="48" fill="#e8f7ef" stroke="#45a36b" class="box"/>
  <text x="610" y="216" text-anchor="middle" class="task">KV Cache 状态</text><text x="610" y="235" text-anchor="middle" class="tiny">Prefill 生成，Decode 读写</text>
  <path d="M440 190 V219 H515" class="state"/><path d="M705 219 H800 V190" class="state"/>
  <text x="250" y="215" text-anchor="middle" class="tiny">输入处理</text><text x="970" y="215" text-anchor="middle" class="tiny">组织请求</text><text x="1210" y="215" text-anchor="middle" class="tiny">返回与评估</text>

  <rect x="12" y="248" width="1476" height="122" fill="#f4f7fa" stroke="#a7b7c8" class="group-bg"/>
  <text x="30" y="270" class="group-title">问题对象与学习任务</text>
  <rect x="20" y="280" width="330" height="72" fill="#ffffff" stroke="#829ab1" class="box"/>
  <text x="185" y="310" text-anchor="middle" class="task">输入与 Prefill</text><text x="185" y="335" text-anchor="middle" class="small">对应 Task0 / Task1</text>
  <rect x="390" y="280" width="430" height="72" fill="#ffffff" stroke="#829ab1" class="box"/>
  <text x="605" y="310" text-anchor="middle" class="task">Decode 与 KV Cache</text><text x="605" y="335" text-anchor="middle" class="small">逐 token 读取、追加与复用；对应 Task2 / Task3</text>
  <rect x="860" y="280" width="270" height="72" fill="#ffffff" stroke="#829ab1" class="box"/>
  <text x="995" y="310" text-anchor="middle" class="task">Serving 与调度</text><text x="995" y="335" text-anchor="middle" class="small">对应 Task4：请求、I/O 与批处理</text>
  <rect x="1170" y="280" width="310" height="72" fill="#ffffff" stroke="#829ab1" class="box"/>
  <text x="1325" y="310" text-anchor="middle" class="task">部署、输出与证据</text><text x="1325" y="335" text-anchor="middle" class="small">对应 Task5 / Task6</text>
  <path d="M130 190 V280" class="map"/><path d="M300 190 V280" class="map"/>
  <path d="M900 190 V260 H700 V280" class="map"/><path d="M1090 190 V280" class="map"/><path d="M1330 190 V280" class="map"/>
  <path d="M610 243 V280" class="state"/>

  <rect x="12" y="378" width="1476" height="250" fill="#f1f8f3" stroke="#8bc39c" class="group-bg"/>
  <rect x="20" y="440" width="180" height="140" fill="#e8f7ef" stroke="#45a36b" class="box"/>
  <text x="110" y="472" text-anchor="middle" class="task">Task 0</text><text x="110" y="500" text-anchor="middle" class="text">Attention 与请求</text><text x="110" y="524" text-anchor="middle" class="text">链路</text><text x="110" y="554" text-anchor="middle" class="small">Prefill、Decode · TTFT / TPOT</text>
  <rect x="230" y="440" width="180" height="140" fill="#e8f7ef" stroke="#45a36b" class="box"/>
  <text x="320" y="472" text-anchor="middle" class="task">Task 1</text><text x="320" y="506" text-anchor="middle" class="text">硬件与 Prefill</text><text x="320" y="550" text-anchor="middle" class="small">访存：分块与 FlashAttention</text>
  <rect x="440" y="440" width="180" height="140" fill="#e8f7ef" stroke="#45a36b" class="box"/>
  <text x="530" y="472" text-anchor="middle" class="task">Task 2</text><text x="530" y="506" text-anchor="middle" class="text">Decode 与单步生成</text><text x="530" y="550" text-anchor="middle" class="small">KV 读取、采样与推测</text>
  <rect x="650" y="440" width="180" height="140" fill="#fff5e6" stroke="#e0a23b" class="box"/>
  <text x="740" y="472" text-anchor="middle" class="task">Task 3</text><text x="740" y="506" text-anchor="middle" class="text">KV Cache 管理与复用</text><text x="740" y="550" text-anchor="middle" class="small">分页、复用与容量边界</text>
  <rect x="860" y="440" width="180" height="140" fill="#fff5e6" stroke="#e0a23b" class="box"/>
  <text x="950" y="472" text-anchor="middle" class="task">Task 4</text><text x="950" y="506" text-anchor="middle" class="text">Serving 与多请求调度</text><text x="950" y="550" text-anchor="middle" class="small">批处理、I/O 与 PD 分离</text>
  <rect x="1070" y="440" width="180" height="140" fill="#f0eefb" stroke="#8069b5" class="box"/>
  <text x="1160" y="472" text-anchor="middle" class="task">Task 5</text><text x="1160" y="506" text-anchor="middle" class="text">量化与 backend 部署</text><text x="1160" y="550" text-anchor="middle" class="small">权重、KV Cache 与质量</text>
  <rect x="1280" y="440" width="180" height="140" fill="#f0eefb" stroke="#8069b5" class="box"/>
  <text x="1370" y="472" text-anchor="middle" class="task">Task 6</text><text x="1370" y="506" text-anchor="middle" class="text">综合基准、并行与决策</text><text x="1370" y="550" text-anchor="middle" class="small">通信、部署与证据</text>
  <path d="M200 527 H230" class="sequence"/><path d="M410 527 H440" class="sequence"/><path d="M620 527 H650" class="sequence"/><path d="M830 527 H860" class="sequence"/><path d="M1040 527 H1070" class="sequence"/><path d="M1250 527 H1280" class="sequence"/>
  <path d="M110 352 V440" class="map"/><path d="M320 352 V440" class="map"/><path d="M530 352 V440" class="map"/><path d="M740 352 V440" class="map"/><path d="M950 352 V440" class="map"/><path d="M1090 352 V440" class="map"/><path d="M1370 352 V440" class="map"/>

  <rect x="12" y="636" width="1476" height="150" fill="#f5f2fc" stroke="#a795d0" class="group-bg"/>
  <text x="30" y="660" class="group-title">项目验证与决策</text><text x="750" y="678" text-anchor="middle" class="section">主题项目 → 综合决策</text>
  <rect x="230" y="696" width="320" height="52" fill="#eef6ff" stroke="#4c8eda" class="box"/>
  <text x="390" y="718" text-anchor="middle" class="task">建立统一基线</text><text x="390" y="739" text-anchor="middle" class="tiny">固定模型、后端、workload、指标</text>
  <rect x="590" y="696" width="320" height="52" fill="#fff8eb" stroke="#e0a23b" class="box"/>
  <text x="750" y="718" text-anchor="middle" class="task">比较单项策略</text><text x="750" y="739" text-anchor="middle" class="tiny">一次只改一个条件，记录代价与收益</text>
  <rect x="950" y="696" width="320" height="52" fill="#f2effc" stroke="#8069b5" class="box"/>
  <text x="1110" y="718" text-anchor="middle" class="task">形成决策结论</text><text x="1110" y="739" text-anchor="middle" class="tiny">核对质量、速度、资源和证据等级</text>
  <path d="M550 722 H590" class="sequence"/><path d="M910 722 H950" class="sequence"/>
  <path d="M1370 580 V615 H1110 V696" class="sequence"/>

  <rect x="200" y="808" width="1100" height="48" fill="#ffffff" stroke="#c5d1de" class="box"/>
  <path d="M230 832 H290" class="flow"/><text x="305" y="837" class="small">实线：生命周期</text>
  <path d="M500 832 H560" class="map"/><text x="575" y="837" class="small">虚线：对象 / Task 映射</text>
  <path d="M820 832 H880" class="sequence"/><text x="895" y="837" class="small">蓝色箭头：学习顺序 / 产物流</text>
  <path d="M1160 832 H1220" class="state"/><text x="1235" y="837" class="small">绿色虚线：KV 状态关系</text>
</svg>
