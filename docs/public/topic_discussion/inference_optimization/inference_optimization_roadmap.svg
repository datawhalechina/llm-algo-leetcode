<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">推理优化：学习顺序、共同基线与资源选择</title><desc id="desc">Task0至Task6表示首次学习顺序，不表示所有优化必须依次启用。每阶段使用共同负载比较。实例复制分担不同请求，跨设备切分让同一实例协作执行；两者在建立基线和复测时按条件选择。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font:19px "Noto Sans CJK SC",sans-serif;fill:#17324d}.head{font-size:21px;font-weight:700}.title{font-size:28px;font-weight:700}.note{font-size:17px;fill:#475569}.edge{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style>
<rect width="1500" height="940" fill="#f7fafc"/>
<text x="40" y="46" class="title">推理优化：学习顺序、共同基线与资源选择</text>
<text x="40" y="85" class="note">实线表示首次学习顺序；各阶段的方案按瓶颈选择，不要求依次启用全部优化。</text>
<rect x="40" y="145" width="310" height="110" rx="14" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/>
<text x="195" y="181" text-anchor="middle" class="head">Task0 · 请求基线</text>
<text x="195" y="217" text-anchor="middle">请求事件 / 单并发测量</text>
<path d="M350 200H410" class="edge"/>
<rect x="410" y="145" width="310" height="110" rx="14" fill="#ecfdf5" stroke="#829ab1" stroke-width="2"/>
<text x="565" y="181" text-anchor="middle" class="head">Task1 · 前向执行</text>
<text x="565" y="217" text-anchor="middle">注意力 / FFN / 专家执行</text>
<path d="M720 200H780" class="edge"/>
<rect x="780" y="145" width="310" height="110" rx="14" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/>
<text x="935" y="181" text-anchor="middle" class="head">Task2 · 自回归与投机</text>
<text x="935" y="217" text-anchor="middle">采样停止 / 接受与修正</text>
<path d="M1090 200H1150" class="edge"/>
<rect x="1150" y="145" width="310" height="110" rx="14" fill="#ecfdf5" stroke="#829ab1" stroke-width="2"/>
<text x="1305" y="181" text-anchor="middle" class="head">Task3 · KV 管理与复用</text>
<text x="1305" y="217" text-anchor="middle">物理块 / 引用 / 前缀</text>
<path d="M1305 255V330H195V405" class="edge"/>
<rect x="40" y="405" width="310" height="110" rx="14" fill="#ecfdf5" stroke="#829ab1" stroke-width="2"/>
<text x="195" y="441" text-anchor="middle" class="head">Task4 · 多请求调度</text>
<text x="195" y="477" text-anchor="middle">准入 / 连续组批 / 阶段预算</text>
<rect x="600" y="405" width="310" height="110" rx="14" fill="#fef3c7" stroke="#829ab1" stroke-width="2"/>
<text x="755" y="441" text-anchor="middle" class="head">Task5 · 低精度执行</text>
<text x="755" y="477" text-anchor="middle">权重 / 激活与计算 / KV</text>
<rect x="1150" y="405" width="310" height="110" rx="14" fill="#ede9fe" stroke="#829ab1" stroke-width="2"/>
<text x="1305" y="441" text-anchor="middle" class="head">Task6 · 组合方案复测</text>
<text x="1305" y="477" text-anchor="middle">质量 / SLO / 资源 / 失败</text>
<path d="M350 460H600" class="edge"/>
<path d="M910 460H1150" class="edge"/>
<rect x="40" y="565" width="1420" height="90" rx="14" fill="#f1f5f9" stroke="#829ab1" stroke-width="2"/>
<text x="750" y="601" text-anchor="middle" class="head">共同比较线：固定负载与质量要求</text>
<text x="750" y="637" text-anchor="middle">每项机制与基线比较；将新增代价和单项结果放回目标负载，再判断整套配置是否采用。</text>
<text x="40" y="705" class="head">执行资源：建立基线时和复测时都检查，不是 Task6 之后才进入的阶段</text>
<rect x="40" y="740" width="680" height="160" rx="14" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/>
<text x="380" y="776" text-anchor="middle" class="head">请求压力超过实例能力，或需要服务隔离</text>
<text x="380" y="812" text-anchor="middle">复制完整模型实例，分别接收请求并维护缓存</text>
<text x="380" y="841" text-anchor="middle">通过请求路由分担压力，检查排队、热点与缓存局部性</text>
<rect x="780" y="740" width="680" height="160" rx="14" fill="#fef3c7" stroke="#829ab1" stroke-width="2"/>
<text x="1120" y="776" text-anchor="middle" class="head">模型或目标状态超出单卡容量</text>
<text x="1120" y="812" text-anchor="middle">让一个实例跨设备切分模型或状态</text>
<text x="1120" y="841" text-anchor="middle">检查每卡容量、通信、负载与同一请求的执行时间</text>
</svg>
