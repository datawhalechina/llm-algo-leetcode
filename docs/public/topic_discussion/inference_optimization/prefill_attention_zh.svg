<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">一次模型前向：层内数据流与三类执行成本</title><desc id="desc">示例层先经过归一化、注意力和残差，再经过归一化、前馈和第二次残差。下方区分注意力读写、投影前馈形状和提交成本。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d;font-size:19px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.note{font-size:17px;fill:#475569}.box{stroke:#829ab1;stroke-width:2;rx:14}.flow{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style>
<rect width="1500" height="560" fill="#f7fafc"/>
<text x="40" y="46" class="title">一次模型前向：层内数据流与三类执行成本</text>
<text x="40" y="84" class="note">以 LLaMA 类层为例，归一化位于各子层之前；注意力与前馈分别更新位置和通道信息。</text><rect x="40" y="130" width="210" height="120" fill="#dbeafe" class="box"/><text x="145" y="168" text-anchor="middle" class="head">层输入</text><text x="145" y="205" text-anchor="middle">T 个位置 × D 维</text><rect x="300" y="130" width="250" height="120" fill="#dbeafe" class="box"/><text x="425" y="168" text-anchor="middle" class="head">归一化 → 注意力</text><text x="425" y="205" text-anchor="middle">投影与历史读取</text><rect x="600" y="130" width="230" height="120" fill="#ecfdf5" class="box"/><text x="715" y="168" text-anchor="middle" class="head">第一次残差更新</text><text x="715" y="205" text-anchor="middle">原状态 + 注意力输出</text><rect x="880" y="130" width="300" height="120" fill="#dbeafe" class="box"/><text x="1030" y="168" text-anchor="middle" class="head">归一化 → 前馈 FFN</text><text x="1030" y="205" text-anchor="middle">门控、上投影与下投影</text><rect x="1230" y="130" width="230" height="120" fill="#ecfdf5" class="box"/><text x="1345" y="168" text-anchor="middle" class="head">第二次残差更新</text><text x="1345" y="205" text-anchor="middle">得到本层输出</text><path d="M145 130V110H715V130" class="flow"/><path d="M715 250V275H1345V250" class="flow"/><path d="M250 190H300" class="flow"/><path d="M550 190H600" class="flow"/><path d="M830 190H880" class="flow"/><path d="M1180 190H1230" class="flow"/><text x="40" y="302" class="note">两次残差更新均加回各自子层输入。下面分别检查读写、矩阵形状与提交成本，再比较完整前向。</text><rect x="40" y="340" width="440" height="170" fill="#ecfdf5" class="box"/><text x="260" y="378" text-anchor="middle" class="head">注意力读写</text><text x="260" y="415" text-anchor="middle">逐块更新归一化统计</text><text x="260" y="445" text-anchor="middle">减少分数矩阵写回显存</text><rect x="530" y="340" width="440" height="170" fill="#dbeafe" class="box"/><text x="750" y="378" text-anchor="middle" class="head">投影与前馈形状</text><text x="750" y="415" text-anchor="middle">预填充多行 / 普通解码少行</text><text x="750" y="445" text-anchor="middle">权重复用、门控中间量与专家分组</text><rect x="1020" y="340" width="440" height="170" fill="#ede9fe" class="box"/><text x="1240" y="378" text-anchor="middle" class="head">计算之间的提交</text><text x="1240" y="415" text-anchor="middle">编译融合：减少调用与中间读写</text><text x="1240" y="445" text-anchor="middle">Graph 重放：减少重复提交</text>
</svg>
