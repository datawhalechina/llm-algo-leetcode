<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">普通解码与线性投机：接受、修正与状态回退</title><desc id="desc">普通循环读取历史、前向、选择、输出与停止。投机先提出候选并批量验证，再按首个拒绝修正或全接受追加，状态和提交量保持对应。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d;font-size:19px}.title{font-size:28px;font-weight:700}.head{font-size:21px;font-weight:700}.note{font-size:17px;fill:#475569}.box{stroke:#829ab1;stroke-width:2;rx:14}.flow{fill:none;stroke:#52606d;stroke-width:2.5;marker-end:url(#a)}</style>
<rect width="1500" height="760" fill="#f7fafc"/>
<text x="40" y="46" class="title">普通解码与线性投机：接受、修正与状态回退</text>
<text x="40" y="84" class="note">上方是普通生成循环；下方展开标准线性投机。接受与修正规则随候选位置的上下文计算。</text><rect x="40" y="130" width="250" height="110" fill="#dbeafe" class="box"/><text x="165" y="168" text-anchor="middle" class="head">读取历史 KV</text><text x="165" y="205" text-anchor="middle">已处理的位置</text><path d="M290 185H330" class="flow"/><rect x="330" y="130" width="250" height="110" fill="#dbeafe" class="box"/><text x="455" y="168" text-anchor="middle" class="head">单步前向</text><text x="455" y="205" text-anchor="middle">写入当前 KV · 得到分数</text><path d="M580 185H620" class="flow"/><rect x="620" y="130" width="250" height="110" fill="#dbeafe" class="box"/><text x="745" y="168" text-anchor="middle" class="head">选择词元</text><text x="745" y="205" text-anchor="middle">贪心或随机采样</text><path d="M870 185H910" class="flow"/><rect x="910" y="130" width="250" height="110" fill="#dbeafe" class="box"/><text x="1035" y="168" text-anchor="middle" class="head">追加输出</text><text x="1035" y="205" text-anchor="middle">保留已选词元</text><path d="M1160 185H1200" class="flow"/><rect x="1200" y="130" width="250" height="110" fill="#dbeafe" class="box"/><text x="1325" y="168" text-anchor="middle" class="head">停止判断</text><text x="1325" y="205" text-anchor="middle">EOS 或长度上限</text><path d="M1325 130V106H165V130" class="flow"/><text x="735" y="124" text-anchor="middle" class="note">未停止：新词元成为下一轮输入</text><rect x="40" y="320" width="350" height="110" fill="#ecfdf5" class="box"/><text x="215" y="358" text-anchor="middle" class="head">草稿提出候选</text><text x="215" y="395" text-anchor="middle">记录各位置的草稿分布</text><rect x="450" y="320" width="350" height="110" fill="#ecfdf5" class="box"/><text x="625" y="358" text-anchor="middle" class="head">目标模型批量验证</text><text x="625" y="395" text-anchor="middle">按候选上下文计算目标分布</text><rect x="860" y="320" width="550" height="110" fill="#ede9fe" class="box"/><text x="1135" y="358" text-anchor="middle" class="head">从左到右检查连续接受前缀</text><text x="1135" y="395" text-anchor="middle">在首个拒绝位置停止接受后续草稿</text><path d="M390 375H450" class="flow"/><path d="M800 375H860" class="flow"/><rect x="620" y="520" width="440" height="120" fill="#fef3c7" class="box"/><text x="840" y="558" text-anchor="middle" class="head">发生拒绝</text><text x="840" y="595" text-anchor="middle">正残差采样修正词元</text><text x="840" y="625" text-anchor="middle">撤销后续未提交候选 KV</text><rect x="1110" y="520" width="340" height="120" fill="#ecfdf5" class="box"/><text x="1280" y="558" text-anchor="middle" class="head">草稿全部接受</text><text x="1280" y="595" text-anchor="middle">再采出一个目标词元</text><text x="1280" y="625" text-anchor="middle">提交接受前缀与追加词元</text><path d="M1135 430V470H840V520" class="flow"/><path d="M1135 470H1280V520" class="flow"/><text x="40" y="555" class="note">拒绝分支保留此前接受的草稿。</text><text x="40" y="585" class="note">两分支均受 EOS 与剩余长度限制。</text><text x="40" y="710">提交后检查停止条件，再进入下一轮；比较最终提交量与草稿、验证、修正的总耗时。</text>
</svg>
