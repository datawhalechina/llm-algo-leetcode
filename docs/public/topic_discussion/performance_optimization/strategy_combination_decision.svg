<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">局部候选到组合决策</title>
  <desc id="desc">固定比较条件，从已观察到的限制提出改动，检查单项的执行、质量和资源安全后开展组合对照。比较边际收益，重新定位瓶颈；证据不足时返回资源检查，失败时按记录回退。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <marker id="loop-arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker>
    <style>.bg{fill:#f8fafc}.box{stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb}.cyan{fill:#e0f2fe;stroke:#0284c7}.amber{fill:#fef3c7;stroke:#d97706}.green{fill:#dcfce7;stroke:#16a34a}.violet{fill:#f3e8ff;stroke:#9333ea}.line{fill:none;stroke:#475569;stroke-width:3.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#loop-arrow)}.title{font-family:"Noto Sans CJK SC",sans-serif;font-size:26px;font-weight:700;fill:#0f172a}.head{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;font-weight:700;fill:#172033}.body{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#475569}.note{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#6d28d9}</style>
  </defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="title">比较单项与组合，再检查瓶颈是否变化</text>

  <rect id="conditions" class="box blue" x="25" y="205" width="195" height="110" rx="15"/>
  <text x="122" y="240" text-anchor="middle" class="head">固定比较条件</text><text x="122" y="271" text-anchor="middle" class="body">工作负载 · 环境</text><text x="122" y="296" text-anchor="middle" class="body">指标 · 守护条件</text>
  <rect id="hypothesis" class="box cyan" x="260" y="205" width="195" height="110" rx="15"/>
  <text x="357" y="240" text-anchor="middle" class="head">根据限制提出改动</text><text x="357" y="271" text-anchor="middle" class="body">作用对象 · 减少量</text><text x="357" y="296" text-anchor="middle" class="body">新增代价 · 证伪条件</text>
  <rect id="single" class="box amber" x="495" y="205" width="195" height="110" rx="15"/>
  <text x="592" y="240" text-anchor="middle" class="head">检查单项结果</text><text x="592" y="271" text-anchor="middle" class="body">执行 · 质量 · 回归</text><text x="592" y="296" text-anchor="middle" class="body">资源安全 · 成本 · 回退</text>
  <rect id="combination" class="box green" x="730" y="205" width="195" height="110" rx="15"/>
  <text x="827" y="240" text-anchor="middle" class="head">组合复测</text><text x="827" y="271" text-anchor="middle" class="body">基线 · 单项 · 组合</text><text x="827" y="296" text-anchor="middle" class="body">配对分布 · 边际收益</text>
  <rect id="review" class="box violet" x="965" y="205" width="210" height="110" rx="15"/>
  <text x="1070" y="240" text-anchor="middle" class="head">重新归因与决策</text><text x="1070" y="271" text-anchor="middle" class="body">新主约束 · 适用范围</text><text x="1070" y="296" text-anchor="middle" class="body">接受 / 调优 / 拒绝</text>

  <path class="line" d="M220 260H260" data-source="conditions" data-target="hypothesis" marker-end="url(#arrow)"/><path class="line" d="M455 260H495" data-source="hypothesis" data-target="single" marker-end="url(#arrow)"/><path class="line" d="M690 260H730" data-source="single" data-target="combination" marker-end="url(#arrow)"/><path class="line" d="M925 260H965" data-source="combination" data-target="review" marker-end="url(#arrow)"/>
  <path class="loop" d="M1070 315V445H357V315" data-source="review" data-target="hypothesis" marker-end="url(#loop-arrow)"/>
  <text x="714" y="485" text-anchor="middle" class="note">虚线：资源或依赖变化时重新检查；失败按记录回退</text>
</svg>
