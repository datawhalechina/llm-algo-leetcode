<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">请求分布与 KV 表示共同限制服务容量</title>
  <desc id="desc">请求长度、活跃数量和共享前缀形成逻辑状态需求；模型结构、数据类型与压缩配置决定每词元的状态字节。两类输入共同进入物理分配与复用，再影响可用并发与服务指标。箭头表示影响关系，不是所有对象依次执行的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.box{stroke-width:2.5}.blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#16a34a}.amber{fill:#fef3c7;stroke:#d97706}.violet{fill:#f3e8ff;stroke:#9333ea}.line{fill:none;stroke:#475569;stroke-width:3.5}.title{font-family:"Noto Sans CJK SC",sans-serif;font-size:26px;font-weight:700;fill:#0f172a}.head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.body{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1200" height="540" rx="24"/>
  <text x="600" y="48" text-anchor="middle" class="title">请求需求与每词元字节共同决定状态占用</text>
  <text x="600" y="77" text-anchor="middle" class="body">箭头表示影响关系；固定请求比较容量，再另做并发扫描</text>

  <rect id="requests" class="box blue" x="25" y="155" width="285" height="110" rx="16"/>
  <text x="167" y="191" text-anchor="middle" class="head">请求与逻辑状态需求</text>
  <text x="167" y="222" text-anchor="middle" class="body">活跃数量 · 长度 · 到达率</text>
  <text x="167" y="247" text-anchor="middle" class="body">共享前缀 · 输出终止条件</text>

  <rect id="representation" class="box green" x="25" y="355" width="285" height="110" rx="16"/>
  <text x="167" y="391" text-anchor="middle" class="head">模型结构与 KV 表示</text>
  <text x="167" y="422" text-anchor="middle" class="body">层数 · KV 头数 · 数据类型</text>
  <text x="167" y="447" text-anchor="middle" class="body">压缩 · 每词元字节 · 缩放元数据</text>

  <rect id="allocation" class="box amber" x="390" y="255" width="230" height="110" rx="16"/>
  <text x="505" y="291" text-anchor="middle" class="head">实际驻留与物理分配</text>
  <text x="505" y="322" text-anchor="middle" class="body">分页 · 尾块 · 空闲块</text>
  <text x="505" y="347" text-anchor="middle" class="body">复用 · 驱逐 · 回收</text>

  <rect id="capacity" class="box blue" x="680" y="255" width="230" height="110" rx="16"/>
  <text x="795" y="291" text-anchor="middle" class="head">容量与调度</text>
  <text x="795" y="322" text-anchor="middle" class="body">可用并发 · 迭代批量</text>
  <text x="795" y="347" text-anchor="middle" class="body">排队 · 抢占 · 拒绝</text>

  <rect id="metrics" class="box violet" x="965" y="255" width="210" height="110" rx="16"/>
  <text x="1070" y="291" text-anchor="middle" class="head">服务指标</text>
  <text x="1070" y="322" text-anchor="middle" class="body">吞吐 · TTFT · TPOT · P99</text>
  <text x="1070" y="347" text-anchor="middle" class="body">质量 · 失败率 · 峰值显存</text>

  <path class="line" d="M310 210H350V280H390" data-source="requests" data-target="allocation" marker-end="url(#arrow)"/>
  <path class="line" d="M310 410H350V340H390" data-source="representation" data-target="allocation" marker-end="url(#arrow)"/>
  <path class="line" d="M620 310H680" data-source="allocation" data-target="capacity" marker-end="url(#arrow)"/>
  <path class="line" d="M910 310H965" data-source="capacity" data-target="metrics" marker-end="url(#arrow)"/>
</svg>
