<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="title desc"><title id="title">固定条件后比较基线与候选</title><desc id="desc">固定工作负载和环境，分别运行基线与候选，再经约束门槛形成比较结论。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker></defs><rect width="1200" height="620" rx="28" fill="#f8fafc"/><text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700">先固定输入与测量方法，再比较改动</text><g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle"><rect id="conditions" x="390" y="95" width="420" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="600" y="138" font-size="22" font-weight="700">固定比较条件</text><text x="600" y="172" font-size="17">工作负载 / 环境 / 指标 / 重复规则</text><rect id="baseline" x="155" y="285" width="330" height="115" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="320" y="330" font-size="22" font-weight="700">比较基线</text><text x="320" y="366" font-size="17">现有路径与结果分布</text><rect id="candidate" x="715" y="285" width="330" height="115" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="880" y="330" font-size="22" font-weight="700">候选方案</text><text x="880" y="366" font-size="17">单一改动与结果分布</text><path d="M520 200 V245 H320 V285" data-source="conditions" data-target="baseline" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M680 200 V245 H880 V285" data-source="conditions" data-target="candidate" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect id="comparison" x="390" y="485" width="420" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="600" y="525" font-size="21" font-weight="700">检查目标收益与守护条件</text><text x="600" y="556" font-size="16">质量 / 正确性 / SLO / 容量 / 成本</text><path d="M320 400 V450 H520 V485" data-source="baseline" data-target="comparison" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M880 400 V450 H680 V485" data-source="candidate" data-target="comparison" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"/></g></svg>
