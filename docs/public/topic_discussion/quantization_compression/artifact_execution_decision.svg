    <text x="640" y="470" text-anchor="middle" font-size="17">质量 · 峰值容量 · 延迟 · 吞吐 · 失败记录</text>

    <path d="M640 484 V532" stroke="#344054" stroke-width="3"/>
    <path d="M632 522 L640 534 L648 522 Z" fill="#344054"/>
