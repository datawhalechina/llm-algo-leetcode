    <text x="990" y="250" text-anchor="middle" font-size="16">命中目标路径或记录 Fallback</text>

    <path d="M990 280 V338 H640 V370" fill="none" stroke="#344054" stroke-width="3"/>
    <path d="M632 360 L640 372 L648 360 Z" fill="#344054"/>
    <rect x="350" y="372" width="580" height="112" rx="20" fill="#E8F5FF" stroke="#3783B8" stroke-width="2.5"/>
