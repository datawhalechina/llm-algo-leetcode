    <text x="435" y="250" text-anchor="middle" font-size="16">格式与量化元数据可识别</text>
    <path d="M530 228 H598" stroke="#344054" stroke-width="3"/><path d="M586 221 L600 228 L586 235 Z" fill="#344054"/>
