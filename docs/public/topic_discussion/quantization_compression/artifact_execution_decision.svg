    <path d="M270 228 H338" stroke="#344054" stroke-width="3"/><path d="M326 221 L340 228 L326 235 Z" fill="#344054"/>
    <rect x="340" y="176" width="190" height="104" rx="18" fill="#EAF2FF" stroke="#3973B7" stroke-width="2.5"/>
