    <path d="M790 228 H858" stroke="#344054" stroke-width="3"/><path d="M846 221 L860 228 L846 235 Z" fill="#344054"/>
    <rect x="860" y="176" width="260" height="104" rx="18" fill="#E7F6E9" stroke="#4B8E55" stroke-width="2.5"/>
