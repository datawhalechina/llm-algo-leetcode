    <text x="80" y="124" font-size="18" fill="#526076">文件变小只是起点；每一道门都要补充可检查证据。</text>

    <rect x="80" y="176" width="190" height="104" rx="18" fill="#FFF0C7" stroke="#C98718" stroke-width="2.5"/>
