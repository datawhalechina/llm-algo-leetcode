    <text x="80" y="124" font-size="18" fill="#526076">先识别问题发生在哪里，再回到对应机制页补证据。</text>

    <rect x="490" y="154" width="300" height="68" rx="18" fill="#EAF2FF" stroke="#3973B7" stroke-width="2.5"/>
