    <path d="M164 276 L170 286 L176 276 Z M352 276 L358 286 L364 276 Z M540 276 L546 286 L552 276 Z M728 276 L734 286 L740 276 Z M916 276 L922 286 L928 276 Z M1104 276 L1110 286 L1116 276 Z" fill="#344054"/>

    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="80" y="286" width="180" height="84" rx="16" fill="#FFF0C7" stroke="#C98718" stroke-width="2"/>
      <text x="170" y="321">装不进显存</text><text x="170" y="349" font-size="15" font-weight="400">对象账本 · 加载峰值</text>
