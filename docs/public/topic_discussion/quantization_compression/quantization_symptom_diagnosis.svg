      <rect x="456" y="286" width="180" height="84" rx="16" fill="#EEE8FF" stroke="#7457B7" stroke-width="2"/>
      <text x="546" y="321">没有加速</text><text x="546" y="349" font-size="15" font-weight="400">Kernel · 反量化 · Fallback</text>
      <rect x="644" y="286" width="180" height="84" rx="16" fill="#E7F6E9" stroke="#4B8E55" stroke-width="2"/>
      <text x="734" y="321">长上下文受限</text><text x="734" y="349" font-size="15" font-weight="400">KV Cache · TPOT</text>
      <rect x="832" y="286" width="180" height="84" rx="16" fill="#E8F5FF" stroke="#3783B8" stroke-width="2"/>
      <text x="922" y="321">训练不稳定</text><text x="922" y="349" font-size="15" font-weight="400">计算 dtype · 状态账本</text>
      <rect x="1020" y="286" width="180" height="84" rx="16" fill="#F1F3F5" stroke="#667085" stroke-width="2"/>
      <text x="1110" y="321">结果不可比</text><text x="1110" y="349" font-size="15" font-weight="400">模型 · 输入 · 环境契约</text>
    </g>

