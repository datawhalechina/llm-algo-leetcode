<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Pre-Norm 块的两次残差相加</title><desc id="desc">注意力增量先与输入相加，前馈分支读取相加后的状态，再完成第二次残差相加。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4L0 8Z" fill="#52606d"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:24px;font-weight:700}.label{font-size:17px;text-anchor:middle}.small{font-size:14px;text-anchor:middle}.box{fill:#e8f1ff;stroke:#4c78a8;stroke-width:2}.edge{stroke:#52606d;stroke-width:2.5;fill:none;marker-end:url(#a)}.skip{stroke-dasharray:6 5}</style>
<rect width="1120" height="360" rx="18" fill="#f7f9fc"/><text x="35" y="44" class="title">先完成注意力残差相加，再进入前馈分支</text><text x="35" y="74" font-size="15">以单个 Pre-Norm 块为例：实线是分支计算，虚线保留残差主干。</text>
<g class="box"><rect x="35" y="145" width="150" height="80" rx="12"/><rect x="230" y="145" width="190" height="80" rx="12"/><rect x="490" y="145" width="130" height="80" rx="12"/><rect x="680" y="145" width="190" height="80" rx="12"/><rect x="940" y="145" width="145" height="80" rx="12"/></g>
<g class="label"><text x="110" y="180">输入状态</text><text x="110" y="205">h</text><text x="325" y="180">归一化 + 注意力</text><text x="555" y="180">第一次相加</text><text x="555" y="205">h + a</text><text x="775" y="180">归一化 + FFN</text><text x="1012" y="180">第二次相加</text><text x="1012" y="205">h + a + m</text></g>
<g class="small"><text x="325" y="205">产生增量 a</text><text x="775" y="205">读取 h + a，产生 m</text></g>
<g class="edge"><path d="M185 185H230"/><path d="M420 185H490"/><path d="M620 185H680"/><path d="M870 185H940"/><path class="skip" d="M110 145V105H555V145"/><path class="skip" d="M555 225V275H1012V225"/></g>
<text x="560" y="329" class="small">分支增量、归一化位置与层数共同影响状态和梯度传播。</text>
</svg>
