    <g fill="#172b4d"><text x="190" y="137" font-size="18">Dense FFN</text><text x="190" y="165" font-size="14">up → GELU/ReLU → down</text><text x="190" y="188" font-size="14">统一参数路径</text><text x="560" y="137" font-size="18">SwiGLU</text><text x="560" y="165" font-size="14">gate ⊙ up → down</text><text x="560" y="188" font-size="14">内容相关门控</text><text x="930" y="137" font-size="18">MoE-FFN</text><text x="930" y="165" font-size="14">router → experts → combine</text><text x="930" y="188" font-size="14">稀疏激活容量</text></g>
