<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 860" role="img" aria-labelledby="title desc">
  <title id="title">Cross Module Knowledge Map</title>
  <desc id="desc">Knowledge navigation map for model architecture pages showing the order of core modules, representative models, MoE, and visual assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <style>
      .title { font: 700 32px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 13px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .warm { fill: #fff7ed; stroke: #f59e0b; }
      .blue { fill: #eff6ff; stroke: #3b82f6; }
      .green { fill: #ecfccb; stroke: #65a30d; }
      .purple { fill: #f5f3ff; stroke: #8b5cf6; }
      .rose { fill: #fff1f2; stroke: #e11d48; }
      .neutral { fill: #ffffff; stroke: #94a3b8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1720" height="860" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Cross Module Knowledge Map</text>
  <text x="64" y="98" class="sub">How the topic pages connect: input, core block, model choices, sparse routing, and visual assets</text>

  <rect x="70" y="160" width="260" height="110" class="box warm"/>
  <text x="200" y="204" text-anchor="middle" class="label">01 Transformer Decoder</text>
  <text x="200" y="232" text-anchor="middle" class="small">decoder-only / causal mask</text>
  <text x="200" y="252" text-anchor="middle" class="small">the main structural origin</text>

  <rect x="390" y="160" width="260" height="110" class="box blue"/>
  <text x="520" y="204" text-anchor="middle" class="label">02 Tokenization / Embedding</text>
  <text x="520" y="232" text-anchor="middle" class="small">tokens into hidden state</text>
  <text x="520" y="252" text-anchor="middle" class="small">input representation layer</text>

  <rect x="710" y="160" width="260" height="110" class="box blue"/>
  <text x="840" y="204" text-anchor="middle" class="label">03 Norm Evolution</text>
  <text x="840" y="232" text-anchor="middle" class="small">BatchNorm -> LayerNorm -> RMSNorm -> DyT</text>
  <text x="840" y="252" text-anchor="middle" class="small">stability and depth control</text>

  <rect x="1030" y="160" width="260" height="110" class="box green"/>
  <text x="1160" y="204" text-anchor="middle" class="label">04 Attention Evolution</text>
  <text x="1160" y="232" text-anchor="middle" class="small">MHA -> GQA -> MLA -> sparse attention</text>
  <text x="1160" y="252" text-anchor="middle" class="small">cache, routing, long context</text>

  <rect x="1350" y="160" width="300" height="110" class="box purple"/>
  <text x="1500" y="204" text-anchor="middle" class="label">05 RoPE / Position Encoding</text>
  <text x="1500" y="232" text-anchor="middle" class="small">position meets attention</text>
  <text x="1500" y="252" text-anchor="middle" class="small">default modern choice</text>

  <path d="M 330 215 L 390 215" class="arrow"/>
  <path d="M 650 215 L 710 215" class="arrow"/>
  <path d="M 970 215 L 1030 215" class="arrow"/>
  <path d="M 1290 215 L 1350 215" class="arrow"/>

  <rect x="210" y="360" width="300" height="120" class="box neutral"/>
  <text x="360" y="404" text-anchor="middle" class="label">06 Block / Residual Path</text>
  <text x="360" y="432" text-anchor="middle" class="small">how the parts are wired together</text>
  <text x="360" y="454" text-anchor="middle" class="small">norm -> attention -> MLP -> residual</text>

  <rect x="590" y="360" width="300" height="120" class="box neutral"/>
  <text x="740" y="404" text-anchor="middle" class="label">07 MLP / FFN Evolution</text>
  <text x="740" y="432" text-anchor="middle" class="small">dense -> gated -> MoE-ready</text>
  <text x="740" y="454" text-anchor="middle" class="small">capacity and compute trade-off</text>

  <rect x="970" y="360" width="350" height="120" class="box rose"/>
  <text x="1145" y="404" text-anchor="middle" class="label">08 Representative Models</text>
  <text x="1145" y="432" text-anchor="middle" class="small">LLaMA / Mistral / Qwen / Gemma / DeepSeek</text>
  <text x="1145" y="454" text-anchor="middle" class="small">how the modules are selected in practice</text>

  <rect x="1380" y="360" width="260" height="120" class="box rose"/>
  <text x="1510" y="404" text-anchor="middle" class="label">09 MoE / Sparsity</text>
  <text x="1510" y="432" text-anchor="middle" class="small">router / experts / top-k</text>
  <text x="1510" y="454" text-anchor="middle" class="small">dense path turned sparse</text>

  <path d="M 510 310 C 510 340 360 338 360 360" class="arrow"/>
  <path d="M 840 310 C 840 340 740 338 740 360" class="arrow"/>
  <path d="M 1160 310 C 1160 340 1145 338 1145 360" class="arrow"/>
  <path d="M 1500 310 C 1500 340 1510 338 1510 360" class="arrow"/>

  <rect x="120" y="570" width="420" height="170" class="box neutral"/>
  <text x="330" y="612" text-anchor="middle" class="label">10 Visual Assets</text>
  <text x="150" y="648" class="small">Timeline, block overview, DeepSeek attention, MoE sparsity</text>
  <text x="150" y="674" class="small">These are the visual anchors that compress the whole topic</text>
  <text x="150" y="700" class="small">Use them as the entry point before jumping into detailed pages</text>

  <rect x="620" y="570" width="470" height="170" class="box neutral"/>
  <text x="855" y="612" text-anchor="middle" class="label">Suggested reading flow</text>
  <text x="650" y="648" class="small">01 -> 02 -> 03 -> 04 -> 05 -> 06 -> 07</text>
  <text x="650" y="674" class="small">Then move to 08 for real models, 09 for sparse routing, 10 for charts</text>
  <text x="650" y="700" class="small">This is a knowledge map, not a strict file list</text>

  <rect x="1150" y="570" width="420" height="170" class="box neutral"/>
  <text x="1360" y="612" text-anchor="middle" class="label">Cross links</text>
  <text x="1180" y="648" class="small">02, 03, 04, 05 feed into 06</text>
  <text x="1180" y="674" class="small">07 and 09 explain why dense FFN becomes sparse</text>
  <text x="1180" y="700" class="small">08 joins module choices to actual model families</text>
</svg>
