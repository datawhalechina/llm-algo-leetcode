<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Decoder Block Overview</title>
  <desc id="desc">Modern decoder block showing token embedding, norm, attention, residual, MLP, and optional MoE replacement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #374151; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .res { stroke: #ef4444; stroke-width: 4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <text x="64" y="64" class="title">Modern Decoder Block</text>
  <text x="64" y="96" class="sub">A stable path from token embedding to attention, MLP, residual, and optional sparse experts</text>

  <rect x="70" y="205" width="170" height="78" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="155" y="238" text-anchor="middle" class="label">Token Embedding</text>
  <text x="155" y="262" text-anchor="middle" class="small">id → hidden state</text>

  <rect x="290" y="205" width="150" height="78" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="365" y="238" text-anchor="middle" class="label">Norm 1</text>
  <text x="365" y="262" text-anchor="middle" class="small">RMSNorm</text>

  <rect x="495" y="180" width="230" height="130" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="610" y="214" text-anchor="middle" class="label">Attention</text>
  <text x="610" y="240" text-anchor="middle" class="small">MHA / GQA / MLA</text>
  <text x="610" y="266" text-anchor="middle" class="small">+ RoPE + KV cache</text>

  <rect x="775" y="205" width="120" height="78" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="835" y="238" text-anchor="middle" class="label">Residual</text>
  <text x="835" y="262" text-anchor="middle" class="small">add</text>

  <rect x="950" y="205" width="150" height="78" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="1025" y="238" text-anchor="middle" class="label">Norm 2</text>
  <text x="1025" y="262" text-anchor="middle" class="small">RMSNorm</text>

  <rect x="1165" y="180" width="230" height="130" class="box" fill="#f3e8ff" stroke="#8b5cf6"/>
  <text x="1280" y="214" text-anchor="middle" class="label">MLP / FFN</text>
  <text x="1280" y="240" text-anchor="middle" class="small">GELU → SwiGLU</text>
  <text x="1280" y="266" text-anchor="middle" class="small">or MoE experts</text>

  <path d="M 240 244 L 290 244" class="arrow"/>
  <path d="M 440 244 L 495 244" class="arrow"/>
  <path d="M 725 244 L 775 244" class="arrow"/>
  <path d="M 895 244 L 950 244" class="arrow"/>
  <path d="M 1100 244 L 1165 244" class="arrow"/>

  <path d="M 610 312 C 610 382 830 382 835 283" class="res"/>
  <path d="M 1280 312 C 1280 402 610 402 610 312" class="res"/>

  <rect x="430" y="430" width="260" height="80" class="box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="560" y="462" text-anchor="middle" class="label">Optional Sparse Route</text>
  <text x="560" y="488" text-anchor="middle" class="small">router + experts + top-k dispatch</text>

  <path d="M 1280 310 C 1280 392 690 392 690 470" class="arrow"/>
  <path d="M 690 470 L 690 470" class="arrow"/>
</svg>
