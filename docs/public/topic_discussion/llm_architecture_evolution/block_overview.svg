<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="640" viewBox="0 0 1760 640" role="img" aria-labelledby="title desc">
  <title id="title">解码器块主干结构</title>
  <desc id="desc">展示输入表示、两次前置归一化、注意力、MLP 与两条残差更新，以及可选的 MoE 专家替换。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font-family:"Noto Sans CJK SC",sans-serif;font-size:30px;font-weight:700; fill: #111827; }
      .sub { font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;font-weight:500; fill: #4b5563; }
      .box { stroke-width: 3; rx: 16; ry: 16; }
      .label { font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700; fill: #111827; }
      .small { font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:500; fill: #374151; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .res { stroke: #ef4444; stroke-width: 4; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
      .alt { stroke: #8b5cf6; stroke-width: 3; fill: none; stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1760" height="640" fill="url(#bg)"/>
  <text x="64" y="64" class="title">现代解码器块：两条分支更新同一残差主干</text>
  <text x="64" y="96" class="sub">注意力先产生增量，更新后的主干再进入前馈分支；图中只展开一个前置归一化块</text>

  <rect x="70" y="205" width="170" height="78" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="155" y="238" text-anchor="middle" class="label">词元表示</text>
  <text x="155" y="262" text-anchor="middle" class="small">id → 隐状态</text>

  <rect x="290" y="205" width="150" height="78" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="365" y="238" text-anchor="middle" class="label">第一次归一化</text>
  <text x="365" y="262" text-anchor="middle" class="small">RMSNorm</text>

  <rect x="495" y="180" width="230" height="130" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="610" y="214" text-anchor="middle" class="label">注意力</text>
  <text x="610" y="240" text-anchor="middle" class="small">MHA / GQA / MLA</text>
  <text x="610" y="266" text-anchor="middle" class="small">RoPE + KV Cache</text>

  <rect x="775" y="205" width="150" height="78" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="850" y="238" text-anchor="middle" class="label">第一次残差更新</text>
  <text x="850" y="262" text-anchor="middle" class="small">主干 + 注意力增量</text>

  <rect x="980" y="205" width="150" height="78" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="1055" y="238" text-anchor="middle" class="label">第二次归一化</text>
  <text x="1055" y="262" text-anchor="middle" class="small">RMSNorm</text>

  <rect x="1190" y="180" width="230" height="130" class="box" fill="#f3e8ff" stroke="#8b5cf6"/>
  <text x="1305" y="214" text-anchor="middle" class="label">MLP / FFN</text>
  <text x="1305" y="240" text-anchor="middle" class="small">可选普通或门控前馈</text>
  <text x="1305" y="266" text-anchor="middle" class="small">产生第二个分支增量</text>

  <rect x="1470" y="205" width="220" height="78" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="1580" y="238" text-anchor="middle" class="label">第二次残差更新</text>
  <text x="1580" y="262" text-anchor="middle" class="small">主干 + MLP 增量</text>

  <path d="M 240 244 L 290 244" class="arrow"/>
  <path d="M 440 244 L 495 244" class="arrow"/>
  <path d="M 725 244 L 775 244" class="arrow"/>
  <path d="M 925 244 L 980 244" class="arrow"/>
  <path d="M 1130 244 L 1190 244" class="arrow"/>
  <path d="M 1420 244 L 1470 244" class="arrow"/>

  <path d="M 240 283 C 240 365 850 365 850 283" class="res"/>
  <path d="M 925 283 C 925 400 1580 400 1580 283" class="res"/>

  <rect x="1175" y="450" width="260" height="80" class="box" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="1305" y="482" text-anchor="middle" class="label">可选：MoE 专家替换 FFN</text>
  <text x="1305" y="508" text-anchor="middle" class="small">路由器 + 专家 + Top-k 分发</text>

  <path d="M 1305 310 V450" class="alt"/>
</svg>
