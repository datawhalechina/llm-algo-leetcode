<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <rect width="1200" height="460" fill="#f4f1e8"/>
  <text x="60" y="52" font-family="Georgia, serif" font-size="30" fill="#2a2233">DeepSeek Version Split</text>
  <text x="60" y="82" font-family="Georgia, serif" font-size="16" fill="#5b4f67">Separate structure generations from reasoning/post-training branches</text>

  <text x="88" y="140" font-family="Arial, sans-serif" font-size="20" fill="#352a41">V-series: base-model / architecture generations</text>
  <line x1="120" y1="190" x2="1060" y2="190" stroke="#4c3861" stroke-width="4"/>

  <circle cx="220" cy="190" r="18" fill="#b99cd6"/>
  <text x="176" y="156" font-family="Arial, sans-serif" font-size="24" fill="#2f2440">V2</text>
  <text x="158" y="225" font-family="Arial, sans-serif" font-size="15" fill="#433556">MLA</text>
  <text x="132" y="246" font-family="Arial, sans-serif" font-size="15" fill="#433556">Latent KV compression</text>

  <circle cx="430" cy="190" r="18" fill="#a57ecc"/>
  <text x="386" y="156" font-family="Arial, sans-serif" font-size="24" fill="#2f2440">V3</text>
  <text x="362" y="225" font-family="Arial, sans-serif" font-size="15" fill="#433556">MoE + system integration</text>

  <circle cx="650" cy="190" r="18" fill="#9365c0"/>
  <text x="590" y="156" font-family="Arial, sans-serif" font-size="24" fill="#2f2440">V3.2</text>
  <text x="600" y="225" font-family="Arial, sans-serif" font-size="15" fill="#433556">DSA</text>
  <text x="552" y="246" font-family="Arial, sans-serif" font-size="15" fill="#433556">Sparse long-context attention</text>

  <circle cx="870" cy="190" r="18" fill="#7a4dad"/>
  <text x="826" y="156" font-family="Arial, sans-serif" font-size="24" fill="#2f2440">V4</text>
  <text x="794" y="225" font-family="Arial, sans-serif" font-size="15" fill="#433556">Next architecture checkpoint</text>
  <text x="792" y="246" font-family="Arial, sans-serif" font-size="15" fill="#433556">Attention / MoE / system bundle</text>

  <text x="88" y="318" font-family="Arial, sans-serif" font-size="20" fill="#352a41">R-series: post-training / reasoning branch</text>
  <line x1="650" y1="208" x2="650" y2="320" stroke="#4c3861" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="650" y1="320" x2="910" y2="320" stroke="#4c3861" stroke-width="3"/>
  <rect x="920" y="275" width="190" height="88" rx="18" fill="#e6daf5" stroke="#4c3861" stroke-width="2"/>
  <text x="980" y="308" font-family="Arial, sans-serif" font-size="24" fill="#2f2440">R1</text>
  <text x="944" y="333" font-family="Arial, sans-serif" font-size="15" fill="#433556">Reasoning / post-training branch</text>
  <text x="957" y="353" font-family="Arial, sans-serif" font-size="15" fill="#433556">Not a new block generation</text>

  <text x="120" y="398" font-family="Arial, sans-serif" font-size="14" fill="#54486a">Use V-series to discuss attention, KV cache, MoE, and system efficiency.</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="14" fill="#54486a">Use R-series to discuss reasoning reinforcement, post-training, and inference style.</text>
</svg>
