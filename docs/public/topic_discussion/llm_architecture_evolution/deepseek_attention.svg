<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Attention Evolution</title>
  <desc id="desc">Evolution from MHA and GQA to MLA and sparse attention, showing indexer-selector and parallel branches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .accent { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .accent2 { stroke: #7c3aed; stroke-width: 4; fill: none; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="64" y="64" class="title">DeepSeek Attention Evolution</text>
  <text x="64" y="96" class="sub">From head-sharing to latent compression and sparse selection under long-context pressure</text>

  <rect x="70" y="160" width="320" height="92" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="230" y="196" text-anchor="middle" class="label">MHA / GQA</text>
  <text x="230" y="222" text-anchor="middle" class="small">head sharing reduces KV duplication</text>

  <rect x="440" y="160" width="320" height="92" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="600" y="196" text-anchor="middle" class="label">MLA</text>
  <text x="600" y="222" text-anchor="middle" class="small">KV compressed into latent memory</text>

  <rect x="810" y="160" width="320" height="92" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="970" y="196" text-anchor="middle" class="label">Indexer + Selector</text>
  <text x="970" y="222" text-anchor="middle" class="small">top-k selection before fine attention</text>

  <rect x="1180" y="160" width="320" height="92" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="1340" y="196" text-anchor="middle" class="label">DSA / NSA</text>
  <text x="1340" y="222" text-anchor="middle" class="small">hardware-aligned sparse attention</text>

  <path d="M 390 206 L 440 206" class="arrow"/>
  <path d="M 760 206 L 810 206" class="accent"/>
  <path d="M 1130 206 L 1180 206" class="accent2"/>

  <rect x="90" y="360" width="430" height="240" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="305" y="398" text-anchor="middle" class="label">MLA: latent KV cache</text>
  <text x="120" y="438" class="small">1. Project full KV into a low-rank latent space</text>
  <text x="120" y="470" class="small">2. Cache the compact latent state instead of full per-head KV</text>
  <text x="120" y="502" class="small">3. Reconstruct or route the needed information at decode time</text>
  <text x="120" y="534" class="small">Result: less memory, less bandwidth, similar or better quality</text>

  <rect x="575" y="360" width="430" height="240" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="790" y="398" text-anchor="middle" class="label">Indexer + Selector</text>
  <text x="605" y="438" class="small">1. Lightning Indexer scores history tokens quickly</text>
  <text x="605" y="470" class="small">2. Selector keeps only the Top-k relevant tokens</text>
  <text x="605" y="502" class="small">3. Fine attention runs only on the selected subset</text>
  <text x="605" y="534" class="small">Result: long-context decoding behaves like “scan then read”</text>

  <rect x="1060" y="360" width="450" height="240" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1285" y="398" text-anchor="middle" class="label">Parallel sparse branches</text>
  <text x="1090" y="438" class="small">Compression branch: coarse global summary</text>
  <text x="1090" y="470" class="small">Selection branch: precision on high-score tokens</text>
  <text x="1090" y="502" class="small">Sliding branch: preserve local detail and continuity</text>
  <text x="1090" y="534" class="small">Result: sparse attention matches hardware and long context</text>

  <path d="M 600 252 C 600 300 305 300 305 360" class="accent"/>
  <path d="M 970 252 C 970 300 790 300 790 360" class="accent2"/>
  <path d="M 1340 252 C 1340 300 1285 300 1285 360" class="arrow"/>
</svg>
