<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">MoE and Sparsity Evolution</title>
  <desc id="desc">Dense FFN compared with MoE sparse routing, top-k experts, load balancing, and expert parallel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf8"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke-width: 3; rx: 16; ry: 16; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dense { stroke: #f97316; }
      .sparse { stroke: #7c3aed; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <text x="64" y="64" class="title">MoE / Sparsity Evolution</text>
  <text x="64" y="96" class="sub">How router, experts, top-k selection, load balancing, and expert parallel replace a dense FFN</text>

  <rect x="70" y="160" width="280" height="96" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="210" y="198" text-anchor="middle" class="label">Dense FFN</text>
  <text x="210" y="224" text-anchor="middle" class="small">every token follows the same path</text>

  <rect x="410" y="160" width="280" height="96" class="box" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="550" y="198" text-anchor="middle" class="label">Router</text>
  <text x="550" y="224" text-anchor="middle" class="small">scores tokens against experts</text>

  <rect x="750" y="124" width="300" height="164" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="900" y="160" text-anchor="middle" class="label">Experts</text>
  <text x="900" y="188" text-anchor="middle" class="small">E1   E2   E3   E4</text>
  <text x="900" y="214" text-anchor="middle" class="small">top-k sparse activation</text>
  <text x="900" y="240" text-anchor="middle" class="small">higher total capacity</text>

  <rect x="1110" y="160" width="300" height="96" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="1260" y="198" text-anchor="middle" class="label">Combine</text>
  <text x="1260" y="224" text-anchor="middle" class="small">weighted expert outputs</text>

  <path d="M 350 208 L 410 208" class="arrow dense"/>
  <path d="M 690 208 L 750 208" class="arrow sparse"/>
  <path d="M 1050 208 L 1110 208" class="arrow"/>

  <rect x="80" y="360" width="440" height="230" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="300" y="398" text-anchor="middle" class="label">Why MoE exists</text>
  <text x="110" y="438" class="small">• Dense FFN is simple and stable, but every token pays the full cost.</text>
  <text x="110" y="470" class="small">• MoE keeps total parameter capacity growing while activation cost stays sparse.</text>
  <text x="110" y="502" class="small">• The router decides where the token goes; experts do the actual transform.</text>
  <text x="110" y="534" class="small">• Top-k routing avoids evaluating every expert for every token.</text>
  <text x="110" y="566" class="small">• Load balancing keeps routing from collapsing into a few hot experts.</text>

  <rect x="580" y="360" width="460" height="230" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="810" y="398" text-anchor="middle" class="label">Parallel system concerns</text>
  <text x="610" y="438" class="small">• Token dispatch and gather are communication-heavy.</text>
  <text x="610" y="470" class="small">• Expert parallel splits experts across devices.</text>
  <text x="610" y="502" class="small">• Training and inference both need stable routing behavior.</text>
  <text x="610" y="534" class="small">• Sparse patterns help only when hardware and layout are aligned.</text>
  <text x="610" y="566" class="small">• The model problem becomes a systems problem very quickly.</text>

  <rect x="1090" y="360" width="440" height="230" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1310" y="398" text-anchor="middle" class="label">MoE in one sentence</text>
  <text x="1120" y="448" class="small">Router picks a few experts for each token,</text>
  <text x="1120" y="482" class="small">experts provide capacity without making every token pay the full price,</text>
  <text x="1120" y="516" class="small">and load balancing + expert parallel keep the whole thing trainable.</text>
  <text x="1120" y="550" class="small">This is how dense MLP becomes sparse routing.</text>
</svg>
