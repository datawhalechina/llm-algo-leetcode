<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 940" role="img" aria-labelledby="title desc">
  <title id="title">Representative Models Matrix</title>
  <desc id="desc">Comparison matrix for LLaMA, Mistral, Qwen, Gemma, and DeepSeek across tokenizer, norm, attention, RoPE, MLP, and structural focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      .title { font: 700 32px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .head { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .cell { font: 600 16px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .tiny { font: 500 13px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .row { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .grid { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
      .band { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 14; ry: 14; }
      .pill { stroke-width: 2; rx: 14; ry: 14; }
    </style>
  </defs>

  <rect width="1760" height="940" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Representative Models Matrix</text>
  <text x="70" y="102" class="sub">A compact view of how mainstream LLMs choose tokenizer, norm, attention, position encoding, and FFN style</text>

  <rect x="80" y="150" width="1600" height="720" class="grid"/>

  <!-- header -->
  <rect x="110" y="185" width="190" height="72" class="band"/>
  <text x="205" y="228" text-anchor="middle" class="head">Model</text>

  <rect x="320" y="185" width="250" height="72" class="band"/>
  <text x="445" y="217" text-anchor="middle" class="head">Tokenizer / Embedding</text>
  <text x="445" y="240" text-anchor="middle" class="tiny">input representation</text>

  <rect x="590" y="185" width="190" height="72" class="band"/>
  <text x="685" y="228" text-anchor="middle" class="head">Norm</text>

  <rect x="800" y="185" width="250" height="72" class="band"/>
  <text x="925" y="217" text-anchor="middle" class="head">Attention</text>
  <text x="925" y="240" text-anchor="middle" class="tiny">cache, sparsity, head sharing</text>

  <rect x="1070" y="185" width="210" height="72" class="band"/>
  <text x="1175" y="228" text-anchor="middle" class="head">Position Encoding</text>

  <rect x="1300" y="185" width="190" height="72" class="band"/>
  <text x="1395" y="228" text-anchor="middle" class="head">FFN / MLP</text>

  <rect x="1510" y="185" width="140" height="72" class="band"/>
  <text x="1580" y="217" text-anchor="middle" class="head">Focus</text>
  <text x="1580" y="240" text-anchor="middle" class="tiny">what to learn</text>

  <!-- rows -->
  <rect x="110" y="280" width="190" height="94" class="pill" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="205" y="324" text-anchor="middle" class="row">LLaMA</text>
  <text x="205" y="348" text-anchor="middle" class="tiny">modern baseline</text>

  <rect x="320" y="280" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="318" text-anchor="middle" class="cell">SentencePiece / subword</text>
  <text x="445" y="344" text-anchor="middle" class="tiny">stable token boundary</text>

  <rect x="590" y="280" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="325" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="348" text-anchor="middle" class="tiny">simple and stable</text>

  <rect x="800" y="280" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="318" text-anchor="middle" class="cell">MHA / GQA</text>
  <text x="925" y="344" text-anchor="middle" class="tiny">mainstream dense attention</text>

  <rect x="1070" y="280" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="325" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="348" text-anchor="middle" class="tiny">default modern choice</text>

  <rect x="1300" y="280" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="318" text-anchor="middle" class="cell">SwiGLU</text>
  <text x="1395" y="344" text-anchor="middle" class="tiny">gated FFN</text>

  <rect x="1510" y="280" width="140" height="94" class="pill" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1580" y="318" text-anchor="middle" class="cell">Reference</text>
  <text x="1580" y="344" text-anchor="middle" class="tiny">baseline</text>

  <rect x="110" y="404" width="190" height="94" class="pill" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="205" y="448" text-anchor="middle" class="row">Mistral</text>
  <text x="205" y="472" text-anchor="middle" class="tiny">efficiency focus</text>

  <rect x="320" y="404" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="442" text-anchor="middle" class="cell">subword + long-context aware</text>
  <text x="445" y="468" text-anchor="middle" class="tiny">tokenization kept practical</text>

  <rect x="590" y="404" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="449" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="472" text-anchor="middle" class="tiny">clean modern norm</text>

  <rect x="800" y="404" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="442" text-anchor="middle" class="cell">Sliding / local attention</text>
  <text x="925" y="468" text-anchor="middle" class="tiny">reduce attention cost</text>

  <rect x="1070" y="404" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="449" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="472" text-anchor="middle" class="tiny">paired with long context</text>

  <rect x="1300" y="404" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="442" text-anchor="middle" class="cell">SwiGLU</text>
  <text x="1395" y="468" text-anchor="middle" class="tiny">same dense shape</text>

  <rect x="1510" y="404" width="140" height="94" class="pill" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1580" y="442" text-anchor="middle" class="cell">efficiency</text>
  <text x="1580" y="468" text-anchor="middle" class="tiny">deployable</text>

  <rect x="110" y="528" width="190" height="94" class="pill" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="205" y="572" text-anchor="middle" class="row">Qwen</text>
  <text x="205" y="596" text-anchor="middle" class="tiny">engineering breadth</text>

  <rect x="320" y="528" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="566" text-anchor="middle" class="cell">broad subword coverage</text>
  <text x="445" y="592" text-anchor="middle" class="tiny">multilingual / deployment</text>

  <rect x="590" y="528" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="573" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="596" text-anchor="middle" class="tiny">stable and simple</text>

  <rect x="800" y="528" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="566" text-anchor="middle" class="cell">MHA / GQA</text>
  <text x="925" y="592" text-anchor="middle" class="tiny">practical dense attention</text>

  <rect x="1070" y="528" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="573" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="596" text-anchor="middle" class="tiny">long-context friendly</text>

  <rect x="1300" y="528" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="566" text-anchor="middle" class="cell">SwiGLU</text>
  <text x="1395" y="592" text-anchor="middle" class="tiny">good quality-cost tradeoff</text>

  <rect x="1510" y="528" width="140" height="94" class="pill" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1580" y="566" text-anchor="middle" class="cell">coverage</text>
  <text x="1580" y="592" text-anchor="middle" class="tiny">many tasks</text>

  <rect x="110" y="652" width="190" height="94" class="pill" fill="#ecfccb" stroke="#65a30d"/>
  <text x="205" y="696" text-anchor="middle" class="row">Gemma</text>
  <text x="205" y="720" text-anchor="middle" class="tiny">compact and stable</text>

  <rect x="320" y="652" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="690" text-anchor="middle" class="cell">modern subword pipeline</text>
  <text x="445" y="716" text-anchor="middle" class="tiny">kept conservative</text>

  <rect x="590" y="652" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="697" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="720" text-anchor="middle" class="tiny">stable training</text>

  <rect x="800" y="652" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="690" text-anchor="middle" class="cell">MHA / GQA</text>
  <text x="925" y="716" text-anchor="middle" class="tiny">balanced dense path</text>

  <rect x="1070" y="652" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="697" text-anchor="middle" class="cell">RoPE</text>
  <text x="1175" y="720" text-anchor="middle" class="tiny">standard position choice</text>

  <rect x="1300" y="652" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="690" text-anchor="middle" class="cell">Gated FFN</text>
  <text x="1395" y="716" text-anchor="middle" class="tiny">compact capacity</text>

  <rect x="1510" y="652" width="140" height="94" class="pill" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1580" y="690" text-anchor="middle" class="cell">stability</text>
  <text x="1580" y="716" text-anchor="middle" class="tiny">cost control</text>

  <rect x="110" y="776" width="190" height="94" class="pill" fill="#fff1f2" stroke="#e11d48"/>
  <text x="205" y="820" text-anchor="middle" class="row">DeepSeek</text>
  <text x="205" y="844" text-anchor="middle" class="tiny">frontier restructuring</text>

  <rect x="320" y="776" width="250" height="94" class="pill" fill="#fff"/>
  <text x="445" y="814" text-anchor="middle" class="cell">subword + engineering focus</text>
  <text x="445" y="840" text-anchor="middle" class="tiny">practical scaling</text>

  <rect x="590" y="776" width="190" height="94" class="pill" fill="#fff"/>
  <text x="685" y="821" text-anchor="middle" class="cell">RMSNorm</text>
  <text x="685" y="844" text-anchor="middle" class="tiny">kept lean</text>

  <rect x="800" y="776" width="250" height="94" class="pill" fill="#fff"/>
  <text x="925" y="814" text-anchor="middle" class="cell">MLA / DSA / sparse</text>
  <text x="925" y="840" text-anchor="middle" class="tiny">cache + select + route</text>

  <rect x="1070" y="776" width="210" height="94" class="pill" fill="#fff"/>
  <text x="1175" y="821" text-anchor="middle" class="cell">RoPE variants</text>
  <text x="1175" y="844" text-anchor="middle" class="tiny">long-context pressure</text>

  <rect x="1300" y="776" width="190" height="94" class="pill" fill="#fff"/>
  <text x="1395" y="814" text-anchor="middle" class="cell">MoE / sparse FFN</text>
  <text x="1395" y="840" text-anchor="middle" class="tiny">capacity via routing</text>

  <rect x="1510" y="776" width="140" height="94" class="pill" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="1580" y="814" text-anchor="middle" class="cell">frontier</text>
  <text x="1580" y="840" text-anchor="middle" class="tiny">structural change</text>
</svg>
