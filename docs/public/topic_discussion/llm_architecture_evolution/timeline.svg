<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">LLM Architecture Evolution Timeline</title>
  <desc id="desc">Timeline of tokenization, normalization, attention, position encoding, FFN, and sparsity evolution in large language models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="100%" stop-color="#efe8dd"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #1f2937; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #4b5563; }
      .label { font: 600 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #374151; }
      .axis { stroke: #6b7280; stroke-width: 4; stroke-linecap: round; }
      .node { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .chip { fill: #fdfdfd; stroke: #c4b7a6; stroke-width: 2; rx: 12; ry: 12; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="520" fill="url(#bg)"/>
  <text x="64" y="64" class="title">LLM Architecture Evolution</text>
  <text x="64" y="96" class="sub">From basic sequence modeling to decoder-only, sparse routing, and long-context attention</text>

  <line x1="110" y1="260" x2="1490" y2="260" class="axis"/>
  <circle cx="140" cy="260" r="10" fill="#9c6b43"/>
  <circle cx="380" cy="260" r="10" fill="#c97c4e"/>
  <circle cx="620" cy="260" r="10" fill="#d19b45"/>
  <circle cx="860" cy="260" r="10" fill="#6b8e5a"/>
  <circle cx="1100" cy="260" r="10" fill="#4f7cac"/>
  <circle cx="1340" cy="260" r="10" fill="#8c5a9e"/>

  <rect x="70" y="130" width="170" height="80" class="node" fill="#fff7ed" stroke="#d97706"/>
  <text x="155" y="162" text-anchor="middle" class="label">Tokenization</text>
  <text x="155" y="188" text-anchor="middle" class="small">BPE / SentencePiece</text>

  <rect x="290" y="340" width="180" height="80" class="node" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="372" text-anchor="middle" class="label">Normalization</text>
  <text x="380" y="398" text-anchor="middle" class="small">BatchNorm → RMSNorm</text>

  <rect x="530" y="130" width="180" height="80" class="node" fill="#ecfccb" stroke="#65a30d"/>
  <text x="620" y="162" text-anchor="middle" class="label">Attention</text>
  <text x="620" y="188" text-anchor="middle" class="small">MHA → GQA → MLA</text>

  <rect x="770" y="340" width="180" height="80" class="node" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="860" y="372" text-anchor="middle" class="label">Position</text>
  <text x="860" y="398" text-anchor="middle" class="small">Absolute → RoPE</text>

  <rect x="1010" y="130" width="180" height="80" class="node" fill="#ecfeff" stroke="#0891b2"/>
  <text x="1100" y="162" text-anchor="middle" class="label">Block / MLP</text>
  <text x="1100" y="188" text-anchor="middle" class="small">FFN → SwiGLU → MoE</text>

  <rect x="1245" y="340" width="190" height="80" class="node" fill="#fdf2f8" stroke="#db2777"/>
  <text x="1340" y="372" text-anchor="middle" class="label">Sparsity</text>
  <text x="1340" y="398" text-anchor="middle" class="small">Router / Top-k / DSA</text>

  <g>
    <rect x="104" y="448" width="92" height="32" class="chip"/>
    <text x="150" y="469" text-anchor="middle" class="small">入口</text>
    <rect x="340" y="448" width="92" height="32" class="chip"/>
    <text x="386" y="469" text-anchor="middle" class="small">稳定性</text>
    <rect x="580" y="448" width="92" height="32" class="chip"/>
    <text x="626" y="469" text-anchor="middle" class="small">上下文</text>
    <rect x="820" y="448" width="92" height="32" class="chip"/>
    <text x="866" y="469" text-anchor="middle" class="small">顺序感</text>
    <rect x="1060" y="448" width="92" height="32" class="chip"/>
    <text x="1106" y="469" text-anchor="middle" class="small">主干</text>
    <rect x="1288" y="448" width="124" height="32" class="chip"/>
    <text x="1350" y="469" text-anchor="middle" class="small">稀疏化</text>
  </g>
</svg>
