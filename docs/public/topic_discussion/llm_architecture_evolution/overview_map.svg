<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 980" role="img" aria-labelledby="title desc">
  <title id="title">Model Architecture Overview Map</title>
  <desc id="desc">A top-level map showing how the model architecture topic flows from decoder and tokenization through norm, attention, RoPE, block assembly, model comparisons, MoE, and visual assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <style>
      .title { font: 700 34px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke-width: 3; rx: 18; ry: 18; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 13px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .blue { fill: #eff6ff; stroke: #3b82f6; }
      .green { fill: #ecfccb; stroke: #65a30d; }
      .purple { fill: #f5f3ff; stroke: #8b5cf6; }
      .rose { fill: #fff1f2; stroke: #e11d48; }
      .warm { fill: #fff7ed; stroke: #f59e0b; }
      .neutral { fill: #ffffff; stroke: #94a3b8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1760" height="980" fill="url(#bg)"/>
  <text x="68" y="70" class="title">Model architecture topic overview</text>
  <text x="68" y="102" class="sub">A compact entry map for the whole topic: structure origin, modules, model choices, sparsity, and visual assets</text>

  <rect x="80" y="150" width="300" height="110" class="box warm"/>
  <text x="230" y="190" text-anchor="middle" class="label">01 Transformer Decoder</text>
  <text x="230" y="218" text-anchor="middle" class="small">decoder-only origin</text>
  <text x="230" y="240" text-anchor="middle" class="small">causal generation path</text>

  <rect x="430" y="150" width="300" height="110" class="box blue"/>
  <text x="580" y="190" text-anchor="middle" class="label">02 Tokenization / Embedding</text>
  <text x="580" y="218" text-anchor="middle" class="small">BPE and input representation</text>
  <text x="580" y="240" text-anchor="middle" class="small">text -> token -> hidden state</text>

  <rect x="780" y="150" width="300" height="110" class="box blue"/>
  <text x="930" y="190" text-anchor="middle" class="label">03 Norm Evolution</text>
  <text x="930" y="218" text-anchor="middle" class="small">BatchNorm -> LayerNorm -> RMSNorm -> DyT</text>
  <text x="930" y="240" text-anchor="middle" class="small">training stability</text>

  <rect x="1130" y="150" width="300" height="110" class="box green"/>
  <text x="1280" y="190" text-anchor="middle" class="label">04 Attention Evolution</text>
  <text x="1280" y="218" text-anchor="middle" class="small">MHA -> GQA -> MLA -> sparse attention</text>
  <text x="1280" y="240" text-anchor="middle" class="small">cache, routing, long context</text>

  <rect x="1480" y="150" width="200" height="110" class="box purple"/>
  <text x="1580" y="190" text-anchor="middle" class="label">05 RoPE</text>
  <text x="1580" y="218" text-anchor="middle" class="small">position in Q / K</text>
  <text x="1580" y="240" text-anchor="middle" class="small">context extension</text>

  <path d="M 380 205 L 430 205" class="arrow"/>
  <path d="M 730 205 L 780 205" class="arrow"/>
  <path d="M 1080 205 L 1130 205" class="arrow"/>
  <path d="M 1430 205 L 1480 205" class="arrow"/>

  <rect x="150" y="340" width="300" height="120" class="box neutral"/>
  <text x="300" y="384" text-anchor="middle" class="label">06 Block / Residual Path</text>
  <text x="300" y="412" text-anchor="middle" class="small">how modules are wired together</text>
  <text x="300" y="434" text-anchor="middle" class="small">norm -> attention -> MLP -> residual</text>

  <rect x="520" y="340" width="300" height="120" class="box neutral"/>
  <text x="670" y="384" text-anchor="middle" class="label">07 MLP / FFN Evolution</text>
  <text x="670" y="412" text-anchor="middle" class="small">dense -> gated -> MoE-ready</text>
  <text x="670" y="434" text-anchor="middle" class="small">capacity and compute trade-off</text>

  <rect x="890" y="340" width="360" height="120" class="box rose"/>
  <text x="1070" y="384" text-anchor="middle" class="label">08 Representative Models</text>
  <text x="1070" y="412" text-anchor="middle" class="small">LLaMA / Mistral / Qwen / Gemma / DeepSeek</text>
  <text x="1070" y="434" text-anchor="middle" class="small">what the module choices look like in real models</text>

  <rect x="1310" y="340" width="340" height="120" class="box rose"/>
  <text x="1480" y="384" text-anchor="middle" class="label">09 MoE / Sparsity</text>
  <text x="1480" y="412" text-anchor="middle" class="small">router / experts / top-k</text>
  <text x="1480" y="434" text-anchor="middle" class="small">dense path turns sparse</text>

  <path d="M 580 260 C 580 300 300 300 300 340" class="arrow"/>
  <path d="M 930 260 C 930 300 670 300 670 340" class="arrow"/>
  <path d="M 1280 260 C 1280 300 1070 300 1070 340" class="arrow"/>
  <path d="M 1580 260 C 1580 300 1480 300 1480 340" class="arrow"/>

  <rect x="220" y="520" width="500" height="170" class="box neutral"/>
  <text x="470" y="582" text-anchor="middle" class="label">10 Visual Assets</text>
  <text x="250" y="620" class="small">timeline, block overview, model matrix, cross-module map</text>
  <text x="250" y="648" class="small">these are the quick-entry assets for the whole topic</text>
  <text x="250" y="676" class="small">they compress the topic into a glanceable set of diagrams</text>

  <rect x="820" y="520" width="760" height="170" class="box neutral"/>
  <text x="1200" y="582" text-anchor="middle" class="label">Suggested reading order</text>
  <text x="860" y="620" class="small">01 -> 02 -> 03 -> 04 -> 05 -> 06 -> 07</text>
  <text x="860" y="648" class="small">then 08 for real models, 09 for sparse routing, 10 for the diagram set</text>
  <text x="860" y="676" class="small">the topic is organized as a knowledge path, not a loose file list</text>

  <rect x="220" y="720" width="1360" height="140" class="box neutral"/>
  <text x="900" y="760" text-anchor="middle" class="label">How to use this page</text>
  <text x="250" y="796" class="small">Use it when you want the whole topic in one glance.</text>
  <text x="250" y="822" class="small">Then jump into a single module page or the visual asset page depending on the question you are solving.</text>
  <text x="250" y="848" class="small">This is the top of the topic hierarchy, not a replacement for the detailed pages.</text>
</svg>
