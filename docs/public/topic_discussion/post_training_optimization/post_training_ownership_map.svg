<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">后训练需要的输入、机制与采用证据</title>
  <desc id="desc">基座模型与数据反馈共同进入学习信号，经过训练执行形成候选，再由后训练问题中的质量与成本要求判断是否采用。模型架构、数据、反向传播、Agent、通信、性能和部署专题分别提供对应条件与证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node-title { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .node-sub { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #e2e8f0; }
      .owner-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .owner-text { font: 400 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .support-title { font: 700 15px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .support-text { font: 400 12.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .flow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .link { stroke: #94a3b8; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="610" rx="20" fill="#f8fafc"/>
  <text x="48" y="44" class="title">后训练需要哪些输入、机制与采用证据</text>
  <text x="48" y="72" class="subtitle">基座与样本共同确定学习目标；训练形成候选，独立质量与执行成本支持采用判断。</text>

  <path d="M143 105V90H603V105" class="flow"/>
  <path d="M468 150 H508" class="flow"/>
  <path d="M698 150 H738" class="flow"/>
  <path d="M928 150 H968" class="flow"/>

  <g>
    <rect x="48" y="105" width="190" height="90" rx="14" fill="#475569"/>
    <text x="143" y="140" text-anchor="middle" class="node-title">基座模型</text>
    <text x="143" y="166" text-anchor="middle" class="node-sub">能力与模型身份</text>
  </g>
  <g>
    <rect x="278" y="105" width="190" height="90" rx="14" fill="#0f766e"/>
    <text x="373" y="140" text-anchor="middle" class="node-title">数据与反馈</text>
    <text x="373" y="166" text-anchor="middle" class="node-sub">示范、偏好、轨迹</text>
  </g>
  <g>
    <rect x="508" y="105" width="190" height="90" rx="14" fill="#2563eb"/>
    <text x="603" y="140" text-anchor="middle" class="node-title">学习信号</text>
    <text x="603" y="166" text-anchor="middle" class="node-sub">损失、奖励、优势</text>
  </g>
  <g>
    <rect x="738" y="105" width="190" height="90" rx="14" fill="#7c3aed"/>
    <text x="833" y="140" text-anchor="middle" class="node-title">训练执行</text>
    <text x="833" y="166" text-anchor="middle" class="node-sub">监督更新 / 在线采样与更新</text>
  </g>
  <g>
    <rect x="968" y="105" width="184" height="90" rx="14" fill="#b45309"/>
    <text x="1060" y="140" text-anchor="middle" class="node-title">候选交付</text>
    <text x="1060" y="166" text-anchor="middle" class="node-sub">评测、产物、回滚</text>
  </g>

  <path d="M143 195 V245" class="link"/>
  <path d="M373 195 V245" class="link"/>
  <path d="M603 195 V245" class="link"/>
  <path d="M833 195 V245" class="link"/>
  <path d="M1060 195 V245" class="link"/>

  <g>
    <rect x="48" y="245" width="190" height="155" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="275" class="owner-title">模型架构提供</text>
    <text x="64" y="302" class="owner-text">结构与上下文能力解释</text>
    <text x="64" y="334" class="owner-title">固定基座条件</text>
    <text x="64" y="361" class="owner-text">读取模型、词表、</text>
    <text x="64" y="382" class="owner-text">上下文与版本身份</text>
  </g>
  <g>
    <rect x="278" y="245" width="190" height="155" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
    <text x="294" y="275" class="owner-title">数据工程提供</text>
    <text x="294" y="302" class="owner-text">来源、清洗与切分</text>
    <text x="294" y="334" class="owner-title">确定训练输入</text>
    <text x="294" y="361" class="owner-text">样本格式、标签与反馈，</text>
    <text x="294" y="382" class="owner-text">检查身份与数据隔离</text>
  </g>
  <g>
    <rect x="508" y="245" width="190" height="155" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="524" y="275" class="owner-title">后训练确定</text>
    <text x="524" y="302" class="owner-text">损失、奖励与更新方法</text>
    <text x="524" y="334" class="owner-title">机制支撑</text>
    <text x="524" y="361" class="owner-text">反向传播核对梯度、</text>
    <text x="524" y="382" class="owner-text">更新时钟与训练状态</text>
  </g>
  <g>
    <rect x="738" y="245" width="190" height="155" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="754" y="275" class="owner-title">后训练组织</text>
    <text x="754" y="302" class="owner-text">采样、更新与恢复</text>
    <text x="754" y="334" class="owner-title">Agent 提供环境</text>
    <text x="754" y="361" class="owner-text">工具、沙盒与交互记录；</text>
    <text x="754" y="382" class="owner-text">多卡扩展再查通信并行</text>
  </g>
  <g>
    <rect x="968" y="245" width="184" height="155" rx="14" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <text x="984" y="275" class="owner-title">后训练判断</text>
    <text x="984" y="302" class="owner-text">质量收益与能力保持</text>
    <text x="984" y="334" class="owner-title">结合执行证据</text>
    <text x="984" y="361" class="owner-text">成本、加载、服务，</text>
    <text x="984" y="382" class="owner-text">记录适用范围与回滚点</text>
  </g>

  <g>
    <rect x="80" y="458" width="310" height="104" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="100" y="489" class="support-title">量化与压缩</text>
    <text x="100" y="515" class="support-text">解释低比特基座、教师与学生表示，</text>
    <text x="100" y="537" class="support-text">提供压缩产物与质量、成本比较方法。</text>
  </g>
  <g>
    <rect x="445" y="458" width="310" height="104" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="465" y="489" class="support-title">通信并行与性能分析</text>
    <text x="465" y="515" class="support-text">解释多模型驻留、工作进程通信、等待、</text>
    <text x="465" y="537" class="support-text">用时间线和资源记录定位执行代价。</text>
  </g>
  <g>
    <rect x="810" y="458" width="310" height="104" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="830" y="489" class="support-title">推理优化与异构部署</text>
    <text x="830" y="515" class="support-text">验证模型进入后端后的延迟、吞吐、</text>
    <text x="830" y="537" class="support-text">资源兼容性和真实服务收益。</text>
  </g>
</svg>
