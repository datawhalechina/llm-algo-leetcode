<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
<title id="title">PPO：轨迹、奖励与价值怎样形成受约束更新</title>
<desc id="desc">灰线：数据；橙色虚线：冻结参考约束；紫线：更新对象；蓝色虚线：下一轮采样。</desc>
<defs>
<marker id="flow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0284C7"/></marker>
<marker id="constraint" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="failure" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
<marker id="gradient" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#9333EA"/></marker>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#334155}.title{font-size:27px;font-weight:700;fill:#172033}.sub{font-size:15px;fill:#475569}.head{font-size:17px;font-weight:700;fill:#172033}.body{font-size:15px}.label{font-size:14px;fill:#475569}</style>
</defs>
<rect width="1280" height="700" fill="#F8FAFC" data-layout-role="decoration"/>
<rect x="28" y="24" width="1224" height="652" rx="24" fill="white" stroke="#CBD5E1" data-layout-role="panel"/>
<text x="60" y="69" class="title">PPO：轨迹、奖励与价值怎样形成受约束更新</text>
<text x="60" y="101" class="sub">灰线：数据；橙色虚线：冻结参考约束；紫线：更新对象；蓝色虚线：下一轮采样。</text>
<rect id="policy" x="60" y="150" width="230" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="80" y="182" class="head">当前策略</text>
<text x="80" y="210" class="body">固定本轮行为策略版本</text>
<text x="80" y="235" class="body">生成回答或动作</text>
<rect id="trace" x="350" y="150" width="230" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="370" y="182" class="head">采样轨迹</text>
<text x="370" y="210" class="body">回复、动作与终止状态</text>
<text x="370" y="235" class="body">保留采样时的对数概率</text>
<rect id="reward" x="640" y="150" width="230" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="660" y="182" class="head">奖励模型或验证器</text>
<text x="660" y="210" class="body">对当前轨迹评分</text>
<text x="660" y="235" class="body">登记奖励与失败状态</text>
<rect id="adv" x="930" y="150" width="290" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="950" y="182" class="head">回报与优势</text>
<text x="950" y="210" class="body">奖励形成回报</text>
<text x="950" y="235" class="body">价值基线参与优势估计</text>
<rect id="critic" x="930" y="345" width="290" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="950" y="377" class="head">价值模型</text>
<text x="950" y="405" class="body">对轨迹状态估计价值</text>
<text x="950" y="430" class="body">价值损失训练该模型</text>
<rect id="reference" x="640" y="345" width="230" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="660" y="377" class="head">冻结参考策略</text>
<text x="660" y="405" class="body">约束相对参考策略的漂移</text>
<text x="660" y="430" class="body">提供 KL 项</text>
<rect id="objective" x="350" y="345" width="230" height="100" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="370" y="377" class="head">受约束 PPO 目标</text>
<text x="370" y="405" class="body">新旧策略比率与裁剪</text>
<text x="370" y="430" class="body">策略损失、价值损失</text>
<rect id="updated" x="60" y="345" width="230" height="100" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="80" y="377" class="head">参数更新</text>
<text x="80" y="405" class="body">更新策略与价值模型</text>
<text x="80" y="430" class="body">形成新策略版本</text>
<rect id="eval" x="60" y="535" width="230" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="80" y="567" class="head">独立评测与回滚</text>
<text x="80" y="595" class="body">按计划检查任务与安全</text>
<text x="80" y="620" class="body">决定采用、调整或恢复</text>
<path data-source="policy" data-target="trace" d="M290 200H350" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="trace" data-target="reward" d="M580 200H640" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="reward" data-target="adv" d="M870 200H930" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="trace" data-target="objective" d="M465 250V345" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="critic" data-target="adv" d="M1140 345V250" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="adv" data-target="objective" d="M1000 250V310H550V345" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="updated" data-target="eval" d="M175 445V535" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="reference" data-target="objective" d="M640 395H580" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#constraint)" stroke-dasharray="7 5"/>
<path data-source="objective" data-target="updated" d="M350 395H290" fill="none" stroke="#9333EA" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gradient)"/>
<path data-source="updated" data-target="critic" d="M245 445V490H1075V445" fill="none" stroke="#9333EA" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#gradient)"/>
<text x="645" y="480" class="label">价值模型参数</text>
<path data-source="updated" data-target="policy" d="M175 345V250" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#feedback)" stroke-dasharray="7 5"/>
<text x="190" y="300" class="label">下一轮</text>
</svg>
