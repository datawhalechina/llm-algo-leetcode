<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">采用决策：先检查硬约束，再比较收益与退化</title>
<desc id="desc">冻结基线、候选和评分协议；硬约束失败直接停止采用，信息不足或可修复退化进入调整。</desc>
<defs>
<marker id="flow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0284C7"/></marker>
<marker id="constraint" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="failure" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
<marker id="gradient" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#9333EA"/></marker>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#334155}.title{font-size:27px;font-weight:700;fill:#172033}.sub{font-size:15px;fill:#475569}.head{font-size:17px;font-weight:700;fill:#172033}.body{font-size:15px}.label{font-size:14px;fill:#475569}</style>
</defs>
<rect width="1280" height="760" fill="#F8FAFC" data-layout-role="decoration"/>
<rect x="28" y="24" width="1224" height="712" rx="24" fill="white" stroke="#CBD5E1" data-layout-role="panel"/>
<text x="60" y="69" class="title">采用决策：先检查硬约束，再比较收益与退化</text>
<text x="60" y="101" class="sub">冻结基线、候选和评分协议；硬约束失败直接停止采用，信息不足或可修复退化进入调整。</text>
<rect id="quality" x="60" y="145" width="220" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="80" y="177" class="head">目标任务质量</text>
<text x="80" y="205" class="body">正确性、有用性与失败样本</text>
<rect id="retention" x="295" y="145" width="220" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="315" y="177" class="head">能力保持</text>
<text x="315" y="205" class="body">基础能力与灾难性遗忘</text>
<rect id="safety" x="530" y="145" width="220" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="550" y="177" class="head">安全与鲁棒性</text>
<text x="550" y="205" class="body">高风险类别与分布变化</text>
<rect id="judge" x="765" y="145" width="220" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="785" y="177" class="head">评分一致性</text>
<text x="785" y="205" class="body">人工、评审模型与验证器</text>
<rect id="cost" x="1000" y="145" width="220" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="1020" y="177" class="head">资源与恢复</text>
<text x="1020" y="205" class="body">成本、延迟、产物与回滚</text>
<rect id="evidence" x="60" y="315" width="1160" height="80" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<text x="80" y="347" class="head">配对评测记录</text>
<text x="80" y="375" class="body">固定基线与候选、数据版本、评分规则和运行环境；保留各类指标及逐样本结果。</text>
<path data-source="quality" data-target="evidence" d="M170 245V315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="retention" data-target="evidence" d="M405 245V315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="safety" data-target="evidence" d="M640 245V315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="judge" data-target="evidence" d="M875 245V315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="cost" data-target="evidence" d="M1110 245V315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<rect id="gate" x="170" y="465" width="250" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="190" y="497" class="head">硬约束检查</text>
<text x="190" y="525" class="body">质量、安全与资源下限</text>
<text x="190" y="550" class="body">按预先登记的规则判断</text>
<rect id="review" x="540" y="465" width="250" height="100" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="560" y="497" class="head">收益与失败切片</text>
<text x="560" y="525" class="body">任务收益、能力保持与成本</text>
<text x="560" y="550" class="body">检查局部退化和评分冲突</text>
<rect id="accept" x="970" y="465" width="250" height="100" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="990" y="497" class="head">accept · 采用</text>
<text x="990" y="525" class="body">收益达标且各项检查通过</text>
<text x="990" y="550" class="body">登记产物版本与回滚点</text>
<rect id="reject" x="170" y="625" width="250" height="80" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="190" y="657" class="head">reject · 停止采用</text>
<text x="190" y="685" class="body">硬约束失败，拒绝或回滚</text>
<rect id="tune" x="970" y="625" width="250" height="80" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="990" y="657" class="head">tune · 调整后复测</text>
<text x="990" y="685" class="body">结论不足或存在可修复问题</text>
<path data-source="evidence" data-target="gate" d="M295 395V465" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="gate" data-target="review" d="M420 515H540" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<text x="466" y="500" class="label">通过</text>
<path data-source="gate" data-target="reject" d="M295 565V625" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure)"/>
<text x="310" y="601" class="label">失败</text>
<path data-source="review" data-target="accept" d="M790 515H970" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<text x="860" y="500" class="label">达标</text>
<path data-source="review" data-target="tune" d="M665 565V665H970" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<text x="720" y="650" class="label">需调整或补充评测</text>
</svg>
