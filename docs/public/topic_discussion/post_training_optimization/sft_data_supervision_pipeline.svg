<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">SFT 数据：从样本检查到有效监督</title>
<desc id="desc">先隔离训练与评测样本，再构造标签；只有保留有效回复位置的样本才能进入训练。</desc>
<defs>
<marker id="flow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="feedback" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0284C7"/></marker>
<marker id="constraint" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="failure" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
<marker id="gradient" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#9333EA"/></marker>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#334155}.title{font-size:27px;font-weight:700;fill:#172033}.sub{font-size:15px;fill:#475569}.head{font-size:17px;font-weight:700;fill:#172033}.body{font-size:15px}.label{font-size:14px;fill:#475569}</style>
</defs>
<rect width="1280" height="620" fill="#F8FAFC" data-layout-role="decoration"/>
<rect x="28" y="24" width="1224" height="572" rx="24" fill="white" stroke="#CBD5E1" data-layout-role="panel"/>
<text x="60" y="69" class="title">SFT 数据：从样本检查到有效监督</text>
<text x="60" y="101" class="sub">先隔离训练与评测样本，再构造标签；只有保留有效回复位置的样本才能进入训练。</text>
<rect id="source" x="60" y="150" width="240" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="80" y="182" class="head">数据来源</text>
<text x="80" y="210" class="body">人工、开源或合成</text>
<text x="80" y="235" class="body">记录来源与许可</text>
<rect id="quality" x="360" y="150" width="240" height="100" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
<text x="380" y="182" class="head">清洗与去重</text>
<text x="380" y="210" class="body">检查任务输入和完整样本</text>
<text x="380" y="235" class="body">固定筛选规则</text>
<rect id="split" x="660" y="150" width="240" height="100" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="680" y="182" class="head">切分与污染检查</text>
<text x="680" y="210" class="body">隔离训练、验证与评测集</text>
<text x="680" y="235" class="body">同源样本按组切分</text>
<rect id="format" x="960" y="150" width="260" height="100" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="980" y="182" class="head">对话模板与分词</text>
<text x="980" y="210" class="body">固定角色和特殊词元</text>
<text x="980" y="235" class="body">执行长度与截断规则</text>
<rect id="labels" x="960" y="360" width="260" height="110" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="980" y="392" class="head">标签与注意力范围</text>
<text x="980" y="420" class="body">回复位置参与监督</text>
<text x="980" y="445" class="body">提示和填充不计入损失</text>
<rect id="coverage" x="660" y="360" width="240" height="110" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
<text x="680" y="392" class="head">监督覆盖检查</text>
<text x="680" y="420" class="body">标签与预测位置对齐</text>
<text x="680" y="445" class="body">截断后仍有有效监督</text>
<rect id="admission" x="360" y="360" width="240" height="110" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="380" y="392" class="head">数据准入</text>
<text x="380" y="420" class="body">通过后进入训练</text>
<text x="380" y="445" class="body">失败样本修复或拒绝</text>
<rect id="record" x="60" y="360" width="240" height="110" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<text x="80" y="392" class="head">可追溯数据版本</text>
<text x="80" y="420" class="body">样本来源、指纹与切分</text>
<text x="80" y="445" class="body">保存规则和失败原因</text>
<path data-source="source" data-target="quality" d="M300 200H360" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="quality" data-target="split" d="M600 200H660" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="split" data-target="format" d="M900 200H960" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="format" data-target="labels" d="M1090 250V360" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="labels" data-target="coverage" d="M960 415H900" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="coverage" data-target="admission" d="M660 415H600" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
<path data-source="admission" data-target="record" d="M360 415H300" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)"/>
</svg>
