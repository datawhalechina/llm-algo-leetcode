<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">后训练优化路线图</title>
  <desc id="desc">路线从目标诊断进入监督基线；长样本在监督分支处理窗口、截断与 Packing，参数适配分支只选择更新范围。随后按离线偏好和在线奖励分流，所有候选最终由独立评测决定采用、调整或回滚。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:30px;font-weight:700;fill:#172033}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .phase{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:700;fill:#64748B;letter-spacing:1px}.nodeTitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}
      .copy{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="700" fill="#F8FAFC"/>
  <rect x="36" y="28" width="1208" height="644" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="76" class="title">后训练优化：阶段准入、反馈分流与采用决策</text>
  <text x="76" y="106" class="subtitle">先建立可比较的监督基线，再依据反馈来源和是否需要在线探索选择更新路径。</text>

  <text x="76" y="150" class="phase">共同基础</text>
  <rect x="76" y="170" width="244" height="106" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="98" y="204" class="nodeTitle">目标诊断与阶段准入</text><text x="98" y="234" class="copy">失败证据 → 最小干预阶段</text><text x="98" y="258" class="copy">数据、反馈与评测门槛</text>
  <rect x="380" y="170" width="244" height="106" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="402" y="204" class="nodeTitle">监督目标与 SFT 基线</text><text x="402" y="234" class="copy">数据契约、标签与监督词元</text><text x="402" y="258" class="copy">长样本再扩展窗口与 Packing</text>
  <rect x="684" y="170" width="244" height="106" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="706" y="204" class="nodeTitle">更新范围与参数适配</text><text x="706" y="234" class="copy">全参数 / LoRA / QLoRA</text><text x="706" y="258" class="copy">固定数据、步数与评测比较成本</text>
  <path d="M320 223H372" class="line"/><path d="M624 223H676" class="line"/>

  <text x="76" y="330" class="phase">反馈分支</text>
  <rect x="76" y="350" width="260" height="116" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="98" y="386" class="nodeTitle">偏好数据与离线 DPO</text><text x="98" y="416" class="copy">已有偏好对 + 固定参考策略</text><text x="98" y="442" class="copy">偏好边际 → 离线更新</text>
  <rect x="390" y="350" width="278" height="116" rx="16" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
  <text x="412" y="386" class="nodeTitle">奖励构造与在线策略候选</text><text x="412" y="416" class="copy">奖励模型 / 验证器 + 在线采样</text><text x="412" y="442" class="copy">优势 → PPO / GRPO 候选</text>
  <rect x="722" y="350" width="278" height="116" rx="16" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="744" y="386" class="nodeTitle">轨迹治理与在线训练交付</text><text x="744" y="416" class="copy">轨迹身份、策略版本与队列</text><text x="744" y="442" class="copy">权重同步、检查点与恢复</text>
  <path d="M744 276V310H206V342" class="line"/>
  <path d="M806 276V326H529V342" class="line"/>
  <path d="M668 408H714" class="line"/>

  <rect x="76" y="544" width="924" height="82" rx="18" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="100" y="578" class="nodeTitle">独立评测、能力回归与采用决策</text>
  <text x="100" y="607" class="copy">目标增益 · 能力保持 · 安全 · 鲁棒性 · 成本 · 失败切片 → 采用、调整或回滚</text>
  <path d="M206 466V544" class="line"/>
  <path d="M529 466V544" class="line"/>
  <path d="M861 466V544" class="line"/>
</svg>
