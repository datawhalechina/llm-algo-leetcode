<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">后训练优化路线图</title>
  <desc id="desc">目标诊断后，监督数据与参数方案经训练控制形成SFT基线，已有合适指令模型可先复测。基线可直接进入独立评测；需要继续更新时按反馈选择离线或在线分支。右侧独立学生扩展从冻结教师和共同学生起点比较蒸馏路线。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:30px;font-weight:700;fill:#172033}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .phase{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:700;fill:#64748B;letter-spacing:1px}.nodeTitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}
      .copy{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#F8FAFC"/>
  <rect x="36" y="28" width="1208" height="764" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="76" y="76" class="title">后训练优化：阶段准入、反馈分流与采用决策</text>
  <text x="76" y="106" class="subtitle">先复测已有模型或建立 SFT 基线；满足任务要求时直接评测，剩余失败再按反馈选择更新。</text>

  <text x="76" y="150" class="phase">共同基础</text>
  <rect id="diagnosis" x="76" y="170" width="244" height="106" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="98" y="204" class="nodeTitle">目标诊断与阶段准入</text><text x="98" y="234" class="copy">失败证据 → 最小干预阶段</text><text x="98" y="258" class="copy">数据、反馈与评测门槛</text>
  <rect id="supervision" x="380" y="170" width="244" height="106" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="402" y="204" class="nodeTitle">监督数据与目标</text><text x="402" y="234" class="copy">数据契约、标签与监督词元</text><text x="402" y="258" class="copy">长度、截断与样本拼接</text>
  <rect id="parameters" x="684" y="170" width="244" height="106" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="706" y="204" class="nodeTitle">更新范围与参数适配</text><text x="706" y="234" class="copy">全参数 / LoRA / QLoRA</text><text x="706" y="258" class="copy">固定数据、步数与评测比较成本</text>
  <path data-source="diagnosis" data-target="supervision" d="M320 223H380" class="line"/>
  <path data-source="diagnosis" data-target="parameters" d="M198 170V158H806V170" class="line"/>
  <rect id="baseline" x="380" y="300" width="548" height="80" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="402" y="332" class="nodeTitle">训练形成 SFT 基线 / 复测已有指令模型</text>
  <text x="402" y="358" class="copy">归约与有效更新 · 重载评测 · 检查点恢复</text>
  <path data-source="supervision" data-target="baseline" d="M502 276V300" class="line"/>
  <path data-source="parameters" data-target="baseline" d="M806 276V300" class="line"/>
  <path data-source="diagnosis" data-target="baseline" d="M198 276V340H380" class="line"/>
  <text x="210" y="320" class="copy">已有指令模型先复测</text>

  <text x="1030" y="150" class="phase">独立学生扩展</text>
  <rect id="student-start" x="1030" y="170" width="186" height="106" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="1046" y="204" class="nodeTitle">教师与学生起点</text><text x="1046" y="234" class="copy">冻结教师与初始学生</text><text x="1046" y="258" class="copy">固定任务和评测条件</text>

  <text x="76" y="416" class="phase">反馈分支</text>
  <rect id="offline" x="76" y="440" width="260" height="116" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="98" y="476" class="nodeTitle">离线 DPO / KTO</text><text x="98" y="506" class="copy">成对偏好或单条二元反馈</text><text x="98" y="532" class="copy">固定参考策略 → 离线更新</text>
  <rect id="online" x="390" y="440" width="278" height="116" rx="16" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
  <text x="412" y="476" class="nodeTitle">奖励构造与在线策略候选</text><text x="412" y="506" class="copy">奖励模型 / 验证器 + 在线采样</text><text x="412" y="532" class="copy">优势 → PPO / GRPO / RLOO</text>
  <rect id="system" x="722" y="440" width="278" height="116" rx="16" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="744" y="476" class="nodeTitle">轨迹管理与在线训练交付</text><text x="744" y="506" class="copy">轨迹身份、策略版本与队列</text><text x="744" y="532" class="copy">权重同步、检查点与恢复</text>
  <path data-source="baseline" data-target="offline" d="M420 380V396H206V440" class="line"/>
  <path data-source="baseline" data-target="online" d="M650 380V420H529V440" class="line"/>
  <path data-source="online" data-target="system" d="M668 498H722" class="line"/>

  <rect id="student-distillation" x="1030" y="440" width="186" height="116" rx="16" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="1046" y="476" class="nodeTitle">独立学生蒸馏</text><text x="1046" y="506" class="copy">固定或学生在策略轨迹</text><text x="1046" y="532" class="copy">DISTILL-OPD → 88</text>
  <path data-source="student-start" data-target="student-distillation" d="M1123 276V440" class="line"/>

  <rect id="evaluation" x="76" y="650" width="1140" height="82" rx="18" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="100" y="684" class="nodeTitle">独立评测、能力回归与采用决策</text>
  <text x="100" y="713" class="copy">目标增益或质量保持 · 安全 · 鲁棒性 · 成本 · 失败切片 → 采用、调整或回滚</text>
  <path data-source="baseline" data-target="evaluation" d="M928 340H1016V650" class="line"/>
  <text x="990" y="414" text-anchor="end" class="copy">基线可直接评测</text>
  <path data-source="offline" data-target="evaluation" d="M206 556V650" class="line"/>
  <path data-source="system" data-target="evaluation" d="M861 556V650" class="line"/>
  <path data-source="student-distillation" data-target="evaluation" d="M1123 556V650" class="line"/>
</svg>
