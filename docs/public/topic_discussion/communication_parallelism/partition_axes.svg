<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs><style>.title{font:700 30px sans-serif;fill:#172033}.sub{font:18px sans-serif;fill:#526071}.h{font:700 21px sans-serif;fill:#172033}.t{font:16px sans-serif;fill:#334155}.g{stroke-width:2}</style></defs><rect width="1400" height="700" fill="#fbfaf7"/>
  <text x="70" y="65" class="title">四种切分维度：层、张量、序列与请求</text><text x="70" y="98" class="sub">切分对象决定通信位置，也决定应该读取哪一组指标。</text>
  <rect x="65" y="155" width="300" height="380" rx="22" fill="#fff0c2" stroke="#d97706" class="g"/><text x="95" y="200" class="h">Pipeline Parallel</text><text x="95" y="232" class="t">切连续层 / stage</text>
  <g fill="#fff" stroke="#d97706"><rect x="100" y="280" width="50" height="70" rx="10"/><rect x="165" y="280" width="50" height="70" rx="10"/><rect x="230" y="280" width="50" height="70" rx="10"/><rect x="295" y="280" width="35" height="70" rx="10"/></g><text x="96" y="405" class="t">P2P activation / gradient</text><text x="96" y="445" class="t">代价：bubble、stage 不均</text>
  <rect x="390" y="155" width="300" height="380" rx="22" fill="#dbeafe" stroke="#2563eb" class="g"/><text x="420" y="200" class="h">Tensor Parallel</text><text x="420" y="232" class="t">切矩阵 / Head / 特征维</text>
  <g fill="#fff" stroke="#2563eb"><rect x="445" y="280" width="55" height="90" rx="10"/><rect x="500" y="280" width="70" height="90" rx="10"/><rect x="570" y="280" width="65" height="90" rx="10"/></g><text x="420" y="405" class="t">层内 Collective</text><text x="420" y="445" class="t">代价：高频同步</text>
  <rect x="715" y="155" width="300" height="380" rx="22" fill="#dcfce7" stroke="#16a34a" class="g"/><text x="745" y="200" class="h">Context Parallel</text><text x="745" y="232" class="t">切 sequence / context</text>
  <g fill="#fff" stroke="#16a34a"><rect x="765" y="295" width="65" height="55" rx="10"/><rect x="835" y="295" width="65" height="55" rx="10"/><rect x="905" y="295" width="65" height="55" rx="10"/></g><path d="M785 380H950" stroke="#16a34a" stroke-width="3"/><text x="745" y="405" class="t">环式 K/V 或状态交换</text><text x="745" y="445" class="t">代价：随上下文增长</text>
  <rect x="1040" y="155" width="295" height="380" rx="22" fill="#fce7f3" stroke="#db2777" class="g"/><text x="1070" y="200" class="h">Serving Replica</text><text x="1070" y="232" class="t">切请求，不切单个模型</text>
  <circle cx="1110" cy="320" r="35" fill="#fff" stroke="#db2777"/><circle cx="1190" cy="320" r="35" fill="#fff" stroke="#db2777"/><circle cx="1270" cy="320" r="35" fill="#fff" stroke="#db2777"/><text x="1070" y="405" class="t">路由、队列、Cache 局部性</text><text x="1070" y="445" class="t">代价：负载不均与长尾</text>
  <rect x="205" y="585" width="990" height="60" rx="15" fill="#f8fafc" stroke="#64748b"/><text x="310" y="623" class="h">组合前先写 Device Mesh：每个维度切什么、属于哪个通信组</text>
</svg>
