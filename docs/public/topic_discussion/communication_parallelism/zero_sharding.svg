<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#475569"/></marker><style>.title{font:700 30px sans-serif;fill:#172033}.sub{font:18px sans-serif;fill:#526071}.h{font:700 21px sans-serif;fill:#172033}.t{font:17px sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="700" fill="#fbfaf7"/><text x="70" y="65" class="title">训练状态：从完整复制到按 rank 分片</text><text x="70" y="98" class="sub">显存收益来自减少常驻副本，通信代价来自计算前后的状态恢复与归约。</text>
  <rect x="80" y="155" width="480" height="360" rx="22" fill="#fff0c2" stroke="#d97706" stroke-width="2"/><text x="115" y="202" class="h">DDP：每个 rank 保存完整状态</text>
  <rect x="135" y="245" width="160" height="75" rx="14" fill="#fff" stroke="#d97706"/><rect x="345" y="245" width="160" height="75" rx="14" fill="#fff" stroke="#d97706"/><rect x="240" y="365" width="160" height="75" rx="14" fill="#fff" stroke="#d97706"/>
  <text x="174" y="290" class="t">参数 P</text><text x="384" y="290" class="t">梯度 G</text><text x="267" y="410" class="t">优化器 O</text><text x="154" y="480" class="t">问题：状态副本随 rank 数重复</text>
  <path d="M560 335 H810" class="line"/><text x="625" y="315" class="t">分片常驻状态</text>
  <rect x="810" y="155" width="510" height="360" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="845" y="202" class="h">ZeRO-3 / FSDP：状态分片</text>
  <g fill="#fff" stroke="#2563eb"><rect x="865" y="250" width="95" height="70" rx="13"/><rect x="980" y="250" width="95" height="70" rx="13"/><rect x="1095" y="250" width="95" height="70" rx="13"/><rect x="1210" y="250" width="70" height="70" rx="13"/></g>
  <text x="890" y="293" class="t">P₀</text><text x="1005" y="293" class="t">G₁</text><text x="1120" y="293" class="t">O₂</text><text x="1228" y="293" class="t">…</text>
  <rect x="885" y="370" width="360" height="74" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="945" y="400" class="t">计算前：参数 All-Gather</text><text x="925" y="430" class="t">反向后：Reduce-Scatter / Reshard</text>
  <text x="275" y="610" class="h">判断峰值时还要加入 activation、通信 buffer 与 checkpoint 重组。</text>
