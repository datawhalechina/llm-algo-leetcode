<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">先比较词表分布，再按回答位置求平均</title>
  <desc id="desc">同一轨迹分别送入冻结教师与可训练学生形成词表分布；逐位置散度与完成区掩码共同进入有效均值。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="45" y="52" class="title">先比较词表分布，再按回答位置求平均</text>
  <rect x="45" y="210" width="230" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="244" text-anchor="middle" class="label">共同轨迹前缀</text>
  <text x="160" y="274" text-anchor="middle" class="body">固定或学生采样</text>
  <rect x="385" y="100" width="255" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="512.5" y="134" text-anchor="middle" class="label">冻结教师</text>
  <text x="512.5" y="164" text-anchor="middle" class="body">概率 pT，停止梯度</text>
  <rect x="385" y="325" width="255" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="512.5" y="359" text-anchor="middle" class="label">可训练学生</text>
  <text x="512.5" y="389" text-anchor="middle" class="body">概率 pS，参与求导</text>
  <rect x="745" y="210" width="205" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="847.5" y="244" text-anchor="middle" class="label">逐位置散度</text>
  <text x="847.5" y="274" text-anchor="middle" class="body">由 β 选择目标</text>
  <rect x="995" y="210" width="170" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1080" y="244" text-anchor="middle" class="label">有效均值</text>
  <text x="1080" y="274" text-anchor="middle" class="body">按 M 选择位置</text>
  <rect x="795" y="385" width="370" height="90" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="980" y="419" text-anchor="middle" class="label">回答掩码 M</text>
  <text x="980" y="449" text-anchor="middle" class="body">排除提示、填充和指定区域</text>
  <path d="M275 240 H320 V152 H385" class="edge"/>
  <path d="M275 290 H345 V377 H385" class="edge"/>
  <path d="M640 152 H690 V245 H745" class="edge"/>
  <path d="M640 377 H715 V285 H745" class="edge"/>
  <path d="M950 265 H995" class="edge"/>
  <path d="M1080 385 V320" class="edge"/>
  <text x="45" y="490" class="small">梯度通过所选位置的散度流向学生；教师保持冻结，采样出的离散词元作为固定输入。</text>
</svg>
