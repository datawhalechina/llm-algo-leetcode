<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">同类通信先聚合，再选择优先排查项</title><desc id="desc">CPU构造记录中两条AllReduce的暴露时间8与6毫秒先汇总为14，All-to-All为20，Broadcast为5。All-to-All是暴露时间最大项；再结合载荷64KiB、重叠比例0.60、已观测rank差异0.05检查路由流量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">通信热点：先合并同类事件，再判断优先检查什么</text>
<text x="55" y="80" class="sub" text-anchor="start">CPU构造例：按暴露时间总和选择排查对象，再结合载荷、重叠和rank差异解释原因。</text>
<text x="55" y="117" class="group" text-anchor="start">事件记录 · 暴露时间</text>
<text x="525" y="117" class="group" text-anchor="start">按collective汇总 · 同比例条形</text>
<g id="ar-event-1">
<rect x="55" y="135" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="170" y="164" class="head" text-anchor="middle">AllReduce · 记录1</text>
<text x="170" y="190" class="body" text-anchor="middle">暴露8ms</text>
</g>
<g id="ar-event-2">
<rect x="55" y="245" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="170" y="274" class="head" text-anchor="middle">AllReduce · 记录2</text>
<text x="170" y="300" class="body" text-anchor="middle">暴露6ms</text>
</g>
<g id="a2a-event">
<rect x="55" y="345" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="170" y="374" class="head" text-anchor="middle">All-to-All · 记录1</text>
<text x="170" y="400" class="body" text-anchor="middle">暴露20ms</text>
</g>
<g id="bc-event">
<rect x="55" y="455" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="170" y="484" class="head" text-anchor="middle">Broadcast · 记录1</text>
<text x="170" y="510" class="body" text-anchor="middle">暴露5ms</text>
</g>
<text x="525" y="180" class="head" text-anchor="start">AllReduce：8＋6＝14ms</text>
<g id="ar-total" data-layout-role="glyph-group">
<rect x="525" y="195" width="280" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" data-layout-role="glyph-group"/>
</g>
<text x="817" y="221" class="head" text-anchor="start">14</text>
<text x="525" y="350" class="head" text-anchor="start">All-to-All：20ms</text>
<g id="a2a-total" data-layout-role="glyph-group">
<rect x="525" y="365" width="400" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2" data-layout-role="glyph-group"/>
</g>
<text x="925" y="350" class="head" text-anchor="end">20</text>
<text x="525" y="460" class="head" text-anchor="start">Broadcast：5ms</text>
<g id="bc-total" data-layout-role="glyph-group">
<rect x="525" y="475" width="100" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" data-layout-role="glyph-group"/>
</g>
<text x="637" y="501" class="head" text-anchor="start">5</text>
<path id="ar1-to-total" d="M285 175H395V205H525" class="flow"/>
<path id="ar2-to-total" d="M285 285H415V225H525" class="flow"/>
<path id="a2a-to-total" d="M285 385H525" class="flow"/>
<path id="bc-to-total" d="M285 495H525" class="flow"/><line x1="525" y1="547" x2="925" y2="547" stroke="#94a3b8" stroke-width="1.5"/>
<text x="525" y="570" class="body" text-anchor="middle">0</text>
<text x="625" y="570" class="body" text-anchor="middle">5</text>
<text x="725" y="570" class="body" text-anchor="middle">10</text>
<text x="825" y="570" class="body" text-anchor="middle">15</text>
<text x="925" y="570" class="body" text-anchor="middle">20</text>
<text x="975" y="570" class="body" text-anchor="middle">ms</text>
<g id="priority">
<rect x="1115" y="345" width="290" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
<text x="1260" y="374" class="head" text-anchor="middle">优先排查All-to-All</text>
<text x="1260" y="400" class="body" text-anchor="middle">暴露时间总和最大：20ms</text>
</g>
<path id="largest-to-priority" d="M925 385H1115" class="flow"/>
<g id="pattern-evidence">
<rect x="1115" y="485" width="290" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="node"/>
<text x="1260" y="514" class="head" text-anchor="middle">进一步检查路由流量</text>
<text x="1260" y="540" class="body" text-anchor="middle">64KiB；重叠0.60；rank差异0.05</text>
</g>
<path id="priority-to-pattern" d="M1260 425V485" class="flow"/>
<text x="55" y="598" class="sub" text-anchor="start">示例rank差异已观测；缺少进程级时间时标为unknown，先补采，再判断是否失衡。</text></svg>
