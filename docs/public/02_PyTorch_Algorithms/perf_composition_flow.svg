<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">前置依赖、布局不兼容与资源竞争是不同关系</title><desc id="desc">左侧格式转换是新布局内核的前置，原布局配置与新布局内核明确互斥。右侧计算改写A和搬运改写B可能竞争共享带宽与临时空间，允许共存时通过测量判断净收益。可执行组合再与基线和各单项在同负载下比较。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.support{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.conflict{fill:none;stroke:#e11d48;stroke-width:2.5}</style></defs>
<rect width="1200" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="45" y="48" class="title" text-anchor="start">策略组合先分清：必须先做、不能共用，还是可能争资源？</text>
<text x="45" y="80" class="sub" text-anchor="start">关系示例：前置依赖决定顺序，明确不兼容排除组合，资源竞争留给同负载测量判断。</text>
<text x="45" y="118" class="group" text-anchor="start">布局依赖与互斥配置</text>
<text x="650" y="118" class="group" text-anchor="start">共享资源与潜在竞争</text>
<g id="format-conversion">
<rect x="45" y="150" width="220" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="155" y="179" class="head" text-anchor="middle">格式转换</text>
<text x="155" y="205" class="body" text-anchor="middle">产生下游需要的新布局</text>
</g>
<g id="new-layout-kernel">
<rect x="345" y="150" width="220" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="455" y="179" class="head" text-anchor="middle">新布局计算内核</text>
<text x="455" y="205" class="body" text-anchor="middle">消费转换后的布局</text>
</g>
<g id="original-layout-only">
<rect x="345" y="335" width="220" height="80" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2" class="node"/>
<text x="455" y="364" class="head" text-anchor="middle">仅支持原布局的配置</text>
<text x="455" y="390" class="body" text-anchor="middle">与上方配置明确互斥</text>
</g>
<path id="requires-format" d="M265 190H345" class="flow"/>
<text x="305" y="174" class="body" text-anchor="middle">前置</text>
<path id="incompatible-configurations" d="M455 230V335" class="conflict"/>
<path id="incompatibility-cross" d="M448 276L462 290M462 276L448 290" class="conflict"/>
<text x="475" y="288" class="body" text-anchor="start">互斥</text>
<g id="compute-change-a">
<rect x="650" y="150" width="220" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="760" y="179" class="head" text-anchor="middle">计算改写A</text>
<text x="760" y="205" class="body" text-anchor="middle">主要改变计算阶段</text>
</g>
<g id="transfer-change-b">
<rect x="930" y="150" width="220" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="1040" y="179" class="head" text-anchor="middle">搬运改写B</text>
<text x="1040" y="205" class="body" text-anchor="middle">主要改变数据搬运</text>
</g>
<g id="shared-resources">
<rect x="790" y="335" width="220" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="900" y="364" class="head" text-anchor="middle">可能共享带宽与临时区</text>
<text x="900" y="390" class="body" text-anchor="middle">并行时测争用与驻留峰值</text>
</g>
<path id="a-uses-resources" d="M760 230V270H840V335" class="support"/>
<path id="b-uses-resources" d="M1040 230V290H960V335" class="support"/>
<text x="45" y="480" class="group" text-anchor="start">可执行组合回到同负载对照</text>
<text x="45" y="512" class="body" text-anchor="start">先核对质量与资源，再比较基线、A、B和A＋B；回退只选合格且更快的单项。</text>
<text x="45" y="546" class="body" text-anchor="start">无合格单项时保留基线；组合新增收益使用对应参考的时间作分母。</text>
<text x="45" y="592" class="sub" text-anchor="start">实线箭头：前置依赖；红色交叉线：不兼容；虚线箭头：使用共享资源。</text></svg>
