<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">AdamW 执行路径基准</title>
  <desc id="desc">固定 AdamW 更新条件下比较单张量、foreach 和 fused 路径；先测两种张量布局的优化器耗时，再比较完整训练步、峰值显存和参数误差，最后决定是否采用。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#526579" />
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .title { font-size: 23px; font-weight: 700; }
      .head { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #425466; }
      .box { fill: #f4f7fb; stroke: #7890a8; stroke-width: 1.5; rx: 12; }
      .path { fill: #eef6ff; stroke: #527ba5; stroke-width: 1.5; rx: 12; }
      .evidence { fill: #f2f8f2; stroke: #5d8a67; stroke-width: 1.5; rx: 12; }
      .decision { fill: #fff5e8; stroke: #ba8744; stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #526579; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="500" fill="#ffffff" />
  <text x="560" y="42" text-anchor="middle" class="title">固定 AdamW 条件下，执行路径是否值得采用？</text>

  <rect x="38" y="178" width="220" height="126" class="box" />
  <text x="148" y="208" text-anchor="middle" class="head">固定训练合同</text>
  <text x="148" y="238" text-anchor="middle" class="body">AdamW · 学习率固定</text>
  <text x="148" y="263" text-anchor="middle" class="body">相同参数、梯度与随机种子</text>
  <text x="148" y="286" text-anchor="middle" class="small">不比较调度器或优化器算法</text>

  <path d="M258 240 H310 V112 H350" class="edge" />
  <path d="M310 240 V240 H350" class="edge" />
  <path d="M310 240 V368 H350" class="edge" />
  <rect x="350" y="76" width="220" height="72" class="path" />
  <text x="460" y="106" text-anchor="middle" class="head">单张量路径</text>
  <text x="460" y="130" text-anchor="middle" class="small">foreach=False · fused=False</text>
  <rect x="350" y="204" width="220" height="72" class="path" />
  <text x="460" y="234" text-anchor="middle" class="head">foreach 路径</text>
  <text x="460" y="258" text-anchor="middle" class="small">foreach=True · fused=False</text>
  <rect x="350" y="332" width="220" height="72" class="path" />
  <text x="460" y="362" text-anchor="middle" class="head">fused 路径</text>
  <text x="460" y="386" text-anchor="middle" class="small">foreach=None · fused=True</text>

  <path d="M570 112 H620 V180 H660" class="edge" />
  <path d="M570 240 H660" class="edge" />
  <path d="M570 368 H620 V300 H660" class="edge" />
  <rect x="660" y="132" width="210" height="216" class="evidence" />
  <text x="765" y="166" text-anchor="middle" class="head">两层测量</text>
  <text x="765" y="202" text-anchor="middle" class="body">优化器独立耗时</text>
  <text x="765" y="228" text-anchor="middle" class="small">256 小张量 / 4 大张量</text>
  <line x1="690" y1="248" x2="840" y2="248" stroke="#b3c7b6" />
  <text x="765" y="278" text-anchor="middle" class="body">完整训练步</text>
  <text x="765" y="304" text-anchor="middle" class="small">中位耗时 · 峰值显存</text>
  <text x="765" y="328" text-anchor="middle" class="small">参数最大误差</text>

  <path d="M870 240 H920" class="edge" />
  <rect x="920" y="148" width="170" height="184" class="decision" />
  <text x="1005" y="184" text-anchor="middle" class="head">采用判断</text>
  <text x="1005" y="218" text-anchor="middle" class="body">完整训练步提速 ≥ 5%</text>
  <text x="1005" y="246" text-anchor="middle" class="body">显存增量 ≤ 256 MiB</text>
  <text x="1005" y="274" text-anchor="middle" class="body">参数误差 ≤ 1e-4</text>
  <text x="1005" y="310" text-anchor="middle" class="small">满足全部门槛才 accept</text>
</svg>
