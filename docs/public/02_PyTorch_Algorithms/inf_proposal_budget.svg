<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581"/>
    </marker>
    <style>
      .title{font:700 25px sans-serif;fill:#102a43}.group{fill:#eef5fb;stroke:#9fb9cf;stroke-width:2}.node{fill:#fff;stroke:#477a9e;stroke-width:2}.grow{fill:#e9f6ee;stroke:#4e8a68;stroke-width:2}.hold{fill:#fff6e8;stroke:#c9852f;stroke-width:2}.shrink{fill:#fff0ea;stroke:#c56f43;stroke-width:2}.gate{fill:#f2edfb;stroke:#8066b3;stroke-width:2}.label{font:700 16px sans-serif;fill:#17324d}.small{font:14px sans-serif;fill:#365269}.edge{fill:none;stroke:#486581;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" class="title">候选预算不是越大越好：接受证据、系统压力与净收益共同决定调整方向</text>

  <rect x="38" y="68" width="300" height="180" rx="17" class="group"/>
  <text x="188" y="98" text-anchor="middle" class="label">近期接受证据</text>
  <rect x="68" y="120" width="240" height="50" rx="11" class="node"/>
  <text x="188" y="151" text-anchor="middle" class="small">接受率与连续接受长度</text>
  <rect x="68" y="182" width="240" height="50" rx="11" class="node"/>
  <text x="188" y="213" text-anchor="middle" class="small">草稿置信度与拒绝位置</text>

  <rect x="450" y="68" width="300" height="180" rx="17" class="group"/>
  <text x="600" y="98" text-anchor="middle" class="label">系统资源状态</text>
  <rect x="480" y="120" width="240" height="50" rx="11" class="node"/>
  <text x="600" y="151" text-anchor="middle" class="small">目标模型队列与验证余量</text>
  <rect x="480" y="182" width="240" height="50" rx="11" class="node"/>
  <text x="600" y="213" text-anchor="middle" class="small">显存压力与尾延迟</text>

  <rect x="862" y="68" width="300" height="180" rx="17" class="group"/>
  <text x="1012" y="98" text-anchor="middle" class="label">本轮成本账本</text>
  <rect x="892" y="120" width="240" height="50" rx="11" class="node"/>
  <text x="1012" y="151" text-anchor="middle" class="small">最终提交词元对应的基线时间</text>
  <rect x="892" y="182" width="240" height="50" rx="11" class="node"/>
  <text x="1012" y="206" text-anchor="middle" class="small">草稿 + 验证 + 修正成本</text>
  <text x="1012" y="224" text-anchor="middle" class="small">完整收益 = 基线时间 − 总成本</text>

  <rect x="430" y="286" width="340" height="72" rx="14" class="gate"/>
  <text x="600" y="315" text-anchor="middle" class="label">预算控制器</text>
  <text x="600" y="340" text-anchor="middle" class="small">先守住正确性与 k 的上下界，再比较收益和压力</text>

  <path d="M188 248 V270 Q188 286 204 286 H430" class="edge"/>
  <path d="M600 248 V286" class="edge"/>
  <path d="M1012 248 V270 Q1012 286 996 286 H770" class="edge"/>

  <rect x="74" y="400" width="286" height="84" rx="14" class="grow"/>
  <text x="217" y="430" text-anchor="middle" class="label">增大预算</text>
  <text x="217" y="455" text-anchor="middle" class="small">高接受 · 净收益为正 · 验证有余量</text>

  <rect x="457" y="400" width="286" height="84" rx="14" class="hold"/>
  <text x="600" y="430" text-anchor="middle" class="label">保持预算</text>
  <text x="600" y="455" text-anchor="middle" class="small">收益稳定 · 信号不足 · 已达边界</text>

  <rect x="840" y="400" width="286" height="84" rx="14" class="shrink"/>
  <text x="983" y="430" text-anchor="middle" class="label">减小预算</text>
  <text x="983" y="455" text-anchor="middle" class="small">频繁拒绝 · 净收益为负 · 压力升高</text>

  <path d="M520 358 V376 Q520 388 508 388 H217 V400" class="edge"/>
  <path d="M600 358 V400" class="edge"/>
  <path d="M680 358 V376 Q680 388 692 388 H983 V400" class="edge"/>
</svg>
