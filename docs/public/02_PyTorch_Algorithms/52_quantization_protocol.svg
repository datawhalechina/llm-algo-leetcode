<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
<title id="title">校准生成候选，验证比较后选择范围</title>
<desc id="desc">校准数据生成多个分位数范围及固定步长，验证数据以独立输入参与每个候选的量化恢复和指标统计。先限制舍入后需要裁剪的码比例，再选择验证MSE最低的候选。</desc>
<defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:400;fill:#17324d}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:15px;fill:#475569}.small{font-size:14px;fill:#475569}.flow{fill:none;stroke:#3978a8;stroke-width:2.5;marker-end:url(#arrow)}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L9 4.5 L0 9 Z" fill="#3978a8"/>
</marker>
</defs>
<rect width="1240" height="520" fill="#f8fbfd"/>
<text x="620" y="43" text-anchor="middle" class="title">候选参数来自校准，误差与约束在验证侧比较</text>
<text x="620" y="77" text-anchor="middle" class="small">固定对称 INT8 与逐张量粒度；验证数据参与选型，最终效果另测</text>
<rect x="40" y="120" width="240" height="100" rx="13" fill="#e8f3fb" stroke="#3978a8" stroke-width="2"/>
<text x="160" y="151" text-anchor="middle" class="h">校准数值</text>
<text x="160" y="178" text-anchor="middle" class="b">固定同一份数据</text>
<text x="160" y="201" text-anchor="middle" class="b">生成候选范围的来源</text>
<rect x="340" y="120" width="250" height="100" rx="13" fill="#f1eafa" stroke="#8b6bb1" stroke-width="2"/>
<text x="465" y="151" text-anchor="middle" class="h">多个范围候选</text>
<text x="465" y="178" text-anchor="middle" class="b">同一数据，不同绝对值分位数</text>
<text x="465" y="201" text-anchor="middle" class="b">范围 c，步长 s = c / 127</text>
<rect x="730" y="120" width="235" height="100" rx="13" fill="#e8f3fb" stroke="#3978a8" stroke-width="2"/>
<text x="847.5" y="151" text-anchor="middle" class="h">留出验证数值</text>
<text x="847.5" y="178" text-anchor="middle" class="b">与校准数值分开</text>
<text x="847.5" y="201" text-anchor="middle" class="b">参与候选评估与选择</text>
<rect x="730" y="290" width="235" height="100" rx="13" fill="#f1eafa" stroke="#8b6bb1" stroke-width="2"/>
<text x="847.5" y="321" text-anchor="middle" class="h">逐候选量化并恢复</text>
<text x="847.5" y="348" text-anchor="middle" class="b">每次使用固定的 c、s</text>
<text x="847.5" y="371" text-anchor="middle" class="b">各候选处理同一验证数值</text>
<rect x="1030" y="290" width="180" height="100" rx="13" fill="#fff1df" stroke="#c78335" stroke-width="2"/>
<text x="1120" y="321" text-anchor="middle" class="h">候选指标</text>
<text x="1120" y="348" text-anchor="middle" class="b">MSE、最大误差</text>
<text x="1120" y="371" text-anchor="middle" class="b">码裁剪比例</text>
<rect x="730" y="430" width="235" height="70" rx="13" fill="#eaf7ef" stroke="#4c9870" stroke-width="2"/>
<text x="847.5" y="457" text-anchor="middle" class="h">先约束，再比较 MSE</text>
<text x="847.5" y="482" text-anchor="middle" class="b">码裁剪比例 ≤ 上限</text>
<rect x="340" y="430" width="250" height="70" rx="13" fill="#eaf7ef" stroke="#4c9870" stroke-width="2"/>
<text x="465" y="457" text-anchor="middle" class="h">选中范围与步长</text>
<text x="465" y="482" text-anchor="middle" class="b">保留分位数和该候选的指标</text>
<path class="flow" d="M280 170 H340"/>
<path class="flow" d="M590 170 H650 V340 H730"/>
<path class="flow" d="M847 220 V290"/>
<path class="flow" d="M965 340 H1030"/>
<path class="flow" d="M1120 390 V465 H965"/>
<path class="flow" d="M730 465 H590"/>
<text x="668" y="262" text-anchor="start" class="small">参数</text>
<text x="870" y="262" text-anchor="start" class="small">数值</text>
</svg>
