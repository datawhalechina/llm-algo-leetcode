<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">监督微调从问题准入到训练交付的学习路径</title>
  <desc id="desc">主线依次经过微调就绪判断、数据准入、监督标签和训练闭环；参数高效适配、长上下文和低显存训练按约束进入。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:29px;font-weight:700;fill:#0F172A}.sub{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .step{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;font-weight:700;fill:#475569}.head{font-family:"Noto Sans CJK SC",sans-serif;font-size:20px;font-weight:700;fill:#172033}
      .body{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;fill:#334155}.small{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#475569}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.branch{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="600" fill="#F8FAFC"/>
  <rect x="28" y="24" width="1444" height="552" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="70" class="title">监督微调主线：先确认训练必要性，再建立可信监督</text>
  <text x="62" y="102" class="sub">每一节都产生下一节可检查的输入；适配方法和长上下文处理只在对应约束出现时进入。</text>

  <text x="66" y="157" class="step">问题证据</text>
  <rect x="60" y="174" width="292" height="174" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="84" y="210" class="head">33 · 后训练准入</text>
  <text x="84" y="244" class="body">稳定失败：步骤顺序仍不可靠</text>
  <text x="84" y="274" class="body">提示 / 检索 / 工具未解决</text>
  <rect x="84" y="296" width="244" height="34" rx="9" fill="#EFF6FF"/>
  <text x="98" y="319" class="small">输出：SFT 数据需求单</text>

  <text x="432" y="157" class="step">候选示范</text>
  <rect x="426" y="174" width="292" height="174" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="450" y="210" class="head">32 · 数据准入</text>
  <text x="450" y="244" class="body">合格示范 → 准入</text>
  <text x="450" y="274" class="body">重复 / 评测泄漏 → 拒绝</text>
  <rect x="450" y="296" width="244" height="34" rx="9" fill="#F5F3FF"/>
  <text x="464" y="319" class="small">输出：训练清单 + 拒绝原因</text>

  <text x="798" y="157" class="step">准入记录</text>
  <rect x="792" y="174" width="292" height="174" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="816" y="210" class="head">13 · 监督边界</text>
  <text x="816" y="244" class="body">Prompt Token → 忽略标签</text>
  <text x="816" y="274" class="body">Response Token → 有效监督</text>
  <rect x="816" y="296" width="244" height="34" rx="9" fill="#FFFBEB"/>
  <text x="830" y="319" class="small">输出：labels + 有效 Token 数</text>

  <text x="1164" y="157" class="step">监督批次</text>
  <rect x="1158" y="174" width="282" height="174" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="1182" y="210" class="head">15 · SFT 训练闭环</text>
  <text x="1182" y="244" class="body">前向、归约、反向与更新</text>
  <text x="1182" y="274" class="body">固定切片上的配对评估</text>
  <rect x="1182" y="296" width="234" height="34" rx="9" fill="#F0FDF4"/>
  <text x="1196" y="319" class="small">输出：更新与评测证据</text>

  <path d="M352 261H426" class="line"/><path d="M718 261H792" class="line"/><path d="M1084 261H1158" class="line"/>

  <text x="62" y="394" class="step">按约束进入的分支</text>
  <path d="M572 348V430" class="branch"/>
  <text x="586" y="404" class="small">长度或拼接约束</text>
  <path d="M938 348V430" class="branch"/>
  <text x="952" y="404" class="small">参数更新预算受限</text>
  <path d="M1299 348V430" class="branch"/>
  <text x="1313" y="404" class="small">进入项目实践</text>

  <rect x="426" y="430" width="292" height="124" rx="16" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
  <text x="450" y="466" class="head">30 · 长上下文处理</text>
  <text x="450" y="498" class="body">截断、监督保留与样本拼接</text>
  <text x="450" y="526" class="small">检查长度分布怎样改变监督预算</text>

  <rect x="792" y="430" width="292" height="124" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="816" y="466" class="head">14 → 31 · 参数高效适配</text>
  <text x="816" y="498" class="body">选择更新范围、秩与适配器变体</text>
  <text x="816" y="526" class="small">冻结基座后比较容量与交付代价</text>

  <rect x="1158" y="430" width="282" height="124" rx="16" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text x="1182" y="466" class="head">64 → 63 / 65 → 62</text>
  <text x="1182" y="498" class="body">数据准入、候选选型与训练交付</text>
  <text x="1182" y="526" class="small">固定模型、数据、预算和验收门槛</text>
</svg>
