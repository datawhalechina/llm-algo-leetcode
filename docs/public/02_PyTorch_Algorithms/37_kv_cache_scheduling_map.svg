<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">共享引用与物理占用：请求结束不一定立即释放块</title><desc id="desc">两条请求共享同一前缀，引用随请求结束减少；无活动引用的状态可以继续驻留，也可以安全回收。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#365269}.box{stroke-width:2;rx:15}.edge{fill:none;stroke:#52657a;stroke-width:2.4;marker-end:url(#arrow)}</style></defs><rect width="1200" height="570" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" class="title">共享引用与物理占用：请求结束不一定立即释放块</text>
<rect x="35" y="130" width="235" height="110" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="152.5" y="162" text-anchor="middle" class="label">请求 A 取得状态</text><text x="152.5" y="191" text-anchor="middle" class="small">引用 1；占用两块</text>
<rect x="335" y="130" width="235" height="110" class="box" fill="#f2edfb" stroke="#8066b3"/><text x="452.5" y="162" text-anchor="middle" class="label">请求 B 复用</text><text x="452.5" y="191" text-anchor="middle" class="small">引用 2；仍占两块</text>
<rect x="635" y="130" width="235" height="110" class="box" fill="#fff6e8" stroke="#c9852f"/><text x="752.5" y="162" text-anchor="middle" class="label">请求 A 结束</text><text x="752.5" y="191" text-anchor="middle" class="small">引用降至 1；不能回收</text>
<rect x="935" y="130" width="235" height="110" class="box" fill="#fff6e8" stroke="#c9852f"/><text x="1052.5" y="162" text-anchor="middle" class="label">请求 B 结束</text><text x="1052.5" y="191" text-anchor="middle" class="small">引用降至 0</text>
<rect x="35" y="365" width="280" height="115" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="175" y="397" text-anchor="middle" class="label">A 独占时可以追加</text><text x="175" y="426" text-anchor="middle" class="small">尾块内写入不新增块</text><text x="175" y="450" text-anchor="middle" class="small">跨边界才申请新块</text>
<rect x="470" y="365" width="300" height="115" class="box" fill="#f2edfb" stroke="#8066b3"/><text x="620" y="397" text-anchor="middle" class="label">保留为可复用缓存</text><text x="620" y="426" text-anchor="middle" class="small">仍占物理块；可作为驱逐候选</text>
<rect x="910" y="365" width="260" height="115" class="box" fill="#eaf7ef" stroke="#4e8a68"/><text x="1040" y="397" text-anchor="middle" class="label">安全回收后进入空闲池</text><text x="1040" y="426" text-anchor="middle" class="small">容量重新可分配</text>
<path d="M270 185H335" class="edge"/>
<path d="M570 185H635" class="edge"/>
<path d="M870 185H935" class="edge"/>
<path d="M150 240V365" class="edge"/>
<path d="M1052 240V300H620V365" class="edge"/>
<path d="M1052 300V365" class="edge"/>
<path d="M770 422H910" class="edge"/>
<text x="830" y="408" text-anchor="middle" class="small">安全驱逐</text><text x="600" y="535" text-anchor="middle" class="small">多人共享的前缀不能原地追加；真实回收还必须等待在途读写结束</text>
</svg>
