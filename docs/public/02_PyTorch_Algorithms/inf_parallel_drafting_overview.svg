<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">DFlash 并行草稿与 DSpark 的修正、置信度分支</title>
  <desc id="desc">上下文与锚点 Token 进入一次草稿前向，形成各位置基础词表分数。基础分数一条路径独立选取 DFlash 候选，另一条路径经低秩 Markov 修正形成 DSpark 候选。草稿前向另接置信度预测，输出与 DSpark 候选合并，供连续预算选择。分支各用独立连线，不共用线身。</desc>
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#315b7d"/>
    </marker>
    <marker id="arrow-correction" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#397650"/>
    </marker>
    <marker id="arrow-confidence" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a9602e"/>
    </marker>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17324d}
      .title{font-size:23px;font-weight:700}
      .subtitle{font-size:14px;fill:#365269}
      .label{font-size:16px;font-weight:600}
      .small{font-size:14px;fill:#365269}
      .node{stroke-width:2}
      .main{fill:#eef4f8;stroke:#477a9e}
      .correction{fill:#e8f4ec;stroke:#4e8a68}
      .confidence{fill:#fff3e8;stroke:#bf7447}
      .output{fill:#f2effa;stroke:#8472ad}
      .edge{fill:none;stroke-width:2.6;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1120" height="500" fill="#f7fafc" data-layout-role="decoration"/>
  <text x="560" y="36" text-anchor="middle" class="title">共享并行主干，分别形成候选与置信度</text>
  <text x="560" y="64" text-anchor="middle" class="subtitle">DFlash 直接选取候选；DSpark 增加局部顺序修正与位置置信度</text>

  <!-- Shared backbone and direct candidate output: left to right. -->
  <rect id="context" x="40" y="112" width="210" height="78" rx="12" class="node main"/>
  <text x="145" y="143" text-anchor="middle" class="label">上下文与锚点 Token</text>
  <text x="145" y="169" text-anchor="middle" class="small">提供共享条件</text>

  <rect id="draft" x="300" y="112" width="220" height="78" rx="12" class="node main"/>
  <text x="410" y="143" text-anchor="middle" class="label">一次草稿前向</text>
  <text x="410" y="169" text-anchor="middle" class="small">同时计算多个位置</text>

  <rect id="scores" x="580" y="112" width="220" height="78" rx="12" class="node main"/>
  <text x="690" y="143" text-anchor="middle" class="label">各位置基础词表分数</text>
  <text x="690" y="169" text-anchor="middle" class="small">位置间没有候选依赖</text>

  <rect id="dflash" x="860" y="112" width="220" height="78" rx="12" class="node main"/>
  <text x="970" y="143" text-anchor="middle" class="label">DFlash 候选块</text>
  <text x="970" y="169" text-anchor="middle" class="small">各位置独立选取</text>

  <!-- DSpark branches keep their source nodes and separate endpoints. -->
  <rect id="markov" x="580" y="280" width="220" height="78" rx="12" class="node correction"/>
  <text x="690" y="311" text-anchor="middle" class="label">低秩 Markov 修正</text>
  <text x="690" y="337" text-anchor="middle" class="small">恢复局部顺序依赖</text>

  <rect id="confidence" x="300" y="365" width="220" height="78" rx="12" class="node confidence"/>
  <text x="410" y="396" text-anchor="middle" class="label">置信度预测</text>
  <text x="410" y="422" text-anchor="middle" class="small">估计逐位置可信度</text>

  <rect id="dspark" x="860" y="280" width="220" height="78" rx="12" class="node output"/>
  <text x="970" y="311" text-anchor="middle" class="label">DSpark 候选与置信度</text>
  <text x="970" y="337" text-anchor="middle" class="small">供连续预算选择</text>

  <path data-source="context" data-target="draft" d="M250 151 H300" class="edge" stroke="#315b7d" marker-end="url(#arrow-main)"/>
  <path data-source="draft" data-target="scores" d="M520 151 H580" class="edge" stroke="#315b7d" marker-end="url(#arrow-main)"/>
  <path data-source="scores" data-target="dflash" d="M800 151 H860" class="edge" stroke="#315b7d" marker-end="url(#arrow-main)"/>
  <path data-source="scores" data-target="markov" d="M690 190 V280" class="edge" stroke="#397650" marker-end="url(#arrow-correction)"/>
  <path data-source="markov" data-target="dspark" d="M800 319 H860" class="edge" stroke="#397650" marker-end="url(#arrow-correction)"/>
  <path data-source="draft" data-target="confidence" d="M410 190 V365" class="edge" stroke="#a9602e" marker-end="url(#arrow-confidence)"/>
  <path data-source="confidence" data-target="dspark" d="M520 404 H970 V358" class="edge" stroke="#a9602e" marker-end="url(#arrow-confidence)"/>

  <text x="425" y="266" class="small">预测分支</text>
  <text x="705" y="239" class="small">修正分支</text>
  <text x="746" y="429" text-anchor="middle" class="small">位置置信度</text>
</svg>
