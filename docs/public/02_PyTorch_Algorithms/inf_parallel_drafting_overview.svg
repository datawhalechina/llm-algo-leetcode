<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">DFlash与DSpark并列草稿路径</title><desc id="desc">相同类型的上下文条件分别进入DFlash与DSpark的块并行主干。DFlash形成并行候选，DSpark增加低秩顺序修正和置信度预测，两种方法不是串行执行的两个阶段。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1120" height="500" fill="#f8fafc" data-layout-role="decoration"/>
<text x="35" y="38" class="title" text-anchor="start">DFlash与DSpark是两条草稿路径，而非先后执行的两步</text>
<text x="35" y="68" class="sub" text-anchor="start">两条路径各自运行草稿主干；上下文特征、锚点Token与块位置共同构成条件。</text>
<rect x="25" y="107" width="1070" height="120" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="25" y="270" width="1070" height="210" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="40" y="140" class="head" text-anchor="start">DFlash</text>
<text x="40" y="303" class="head" text-anchor="start">DSpark</text>
<rect x="300" y="134" width="220" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="410" y="162" class="head" text-anchor="middle">一次块并行前向</text>
<text x="410" y="186" class="body" text-anchor="middle">读取目标上下文特征</text>
<rect x="620" y="134" width="200" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="720" y="162" class="head" text-anchor="middle">并行选取候选</text>
<text x="720" y="186" class="body" text-anchor="middle">各位置基础分布</text>
<rect x="880" y="134" width="200" height="72" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="980" y="162" class="head" text-anchor="middle">候选块</text>
<text x="980" y="186" class="body" text-anchor="middle">交给目标模型验证</text>
<rect x="40" y="151" width="185" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="132.5" y="183" class="body" text-anchor="middle">锚点＋块位置</text>
<path id="dflash-context" d="M225 170H300" class="flow"/>
<path id="dflash-scores" d="M520 170H620" class="flow"/>
<path id="dflash-candidates" d="M820 170H880" class="flow"/>
<rect x="300" y="310" width="220" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="410" y="338" class="head" text-anchor="middle">一次块并行前向</text>
<text x="410" y="362" class="body" text-anchor="middle">基础分数＋隐藏状态</text>
<rect x="580" y="310" width="230" height="72" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="695" y="338" class="head" text-anchor="middle">低秩Markov顺序修正</text>
<text x="695" y="362" class="body" text-anchor="middle">前驱Token → 当前偏置</text>
<rect x="880" y="310" width="200" height="72" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="980" y="338" class="head" text-anchor="middle">候选块与置信度</text>
<text x="980" y="362" class="body" text-anchor="middle">供验证长度选择</text>
<rect x="40" y="327" width="185" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="132.5" y="359" class="body" text-anchor="middle">锚点＋块位置</text>
<path id="dspark-context" d="M225 346H300" class="flow"/>
<path id="dspark-base-logits" d="M520 346H580" class="flow"/>
<path id="dspark-corrected" d="M810 346H880" class="flow"/>
<rect x="580" y="420" width="230" height="54" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="695" y="448" class="head" text-anchor="middle">置信度头</text>
<text x="695" y="472" class="body" text-anchor="middle"></text>
<path id="hidden-to-confidence" d="M410 382V447H580" class="flow"/>
<path id="previous-embedding-to-confidence" d="M695 382V420" class="flow"/>
<text x="715" y="407" class="small" text-anchor="start">前驱嵌入</text>
<path id="confidence-to-output" d="M810 447H980V382" class="flow"/>
</svg>
