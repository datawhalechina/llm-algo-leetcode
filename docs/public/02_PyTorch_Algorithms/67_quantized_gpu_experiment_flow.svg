<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">量化部署实验的配对执行矩阵</title>
  <desc id="desc">统一环境和请求负载分别驱动浮点基线与量化候选，并核对量化候选的实际执行路径；结果按相同字段写入配对记录。</desc>
  <defs>
    <style>
      .title{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.h{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.blue{fill:#e8f3fb;stroke:#3978a8;stroke-width:2}.purple{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}.green{fill:#eaf7ef;stroke:#4c9870;stroke-width:2}.orange{fill:#fff1df;stroke:#c78335;stroke-width:2}.frame{fill:#fff;stroke:#c7d9e7;stroke-width:1.5}.flow{stroke:#3978a8;stroke-width:3;fill:none;marker-end:url(#arrow)}.optional{stroke:#8b6bb1;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#purpleArrow)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3978a8"/></marker>
    <marker id="purpleArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8b6bb1"/></marker>
  </defs>
  <rect width="1240" height="600" rx="24" fill="#f8fbfd"/>
  <text x="620" y="48" text-anchor="middle" class="title">真实量化部署：固定条件下的配对执行矩阵</text>
  <text x="620" y="76" text-anchor="middle" class="sub">G0 与 G1 共享模型版本、请求、硬件和测量方法，只改变权重产物与量化执行路径</text>

  <rect x="300" y="112" width="640" height="82" rx="18" class="blue"/>
  <text x="620" y="143" text-anchor="middle" class="h">统一环境与 workload</text>
  <text x="620" y="168" text-anchor="middle" class="t">模型与 tokenizer commit · 请求文件 · 并发 · 生成上限 · GPU · backend 版本</text>

  <rect x="65" y="270" width="300" height="106" rx="18" class="green"/>
  <text x="215" y="307" text-anchor="middle" class="h">G0 浮点基线</text>
  <text x="215" y="334" text-anchor="middle" class="t">原始模型 · 浮点加载路径</text>
  <text x="215" y="356" text-anchor="middle" class="t">作为延迟、吞吐和显存参照</text>
  <rect x="470" y="270" width="300" height="106" rx="18" class="orange"/>
  <text x="620" y="307" text-anchor="middle" class="h">G1 量化候选</text>
  <text x="620" y="334" text-anchor="middle" class="t">82 准入产物 · 目标量化路径</text>
  <text x="620" y="356" text-anchor="middle" class="t">核对真实执行与 fallback</text>
  <rect x="875" y="270" width="300" height="106" rx="18" class="blue"/>
  <text x="1025" y="307" text-anchor="middle" class="h">G1 执行路径核对</text>
  <text x="1025" y="334" text-anchor="middle" class="t">量化启动参数 · backend 日志</text>
  <text x="1025" y="356" text-anchor="middle" class="t">确认命中路径并记录 fallback</text>

  <path d="M540 194C470 224 300 232 215 270" class="flow"/>
  <path d="M620 194V270" class="flow"/>
  <path d="M700 194C770 224 940 232 1025 270" class="flow"/>

  <rect x="250" y="465" width="740" height="82" rx="18" class="frame"/>
  <text x="620" y="497" text-anchor="middle" class="h">同字段原始结果与执行证据</text>
  <text x="620" y="523" text-anchor="middle" class="t">TTFT · TPOT · 输出吞吐 · 峰值显存 · failure · backend 日志 · evidence level</text>
  <path d="M215 376C290 420 430 420 500 465" class="flow"/>
  <path d="M620 376V465" class="flow"/>
  <path d="M1025 376C950 420 810 420 740 465" class="flow"/>
</svg>
