<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc"><title id="title">Radix Tree 命中结果与执行计划</title><desc id="desc">命中长度把请求拆成可复用前缀与未命中后缀，分别进入缓存读取与 Prefill。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.sub{font-size:16px;fill:#475569}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#334155}.n{stroke-width:3;rx:18;ry:18}.f{stroke:#475569;stroke-width:3.5;fill:none;marker-end:url(#a)}.b{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1280" height="680" fill="url(#bg)"/><text x="54" y="58" class="title">命中结果如何进入执行计划</text><text x="54" y="88" class="sub">先得到 hit_len，再分别处理可复用前缀与未命中后缀。</text><rect x="460" y="130" width="360" height="102" class="n" fill="#ede9fe" stroke="#8b5cf6"/><text x="640" y="171" text-anchor="middle" class="label">命中长度 hit_len</text><text x="640" y="204" text-anchor="middle" class="small">prompt 开头连续命中的 token 数</text><rect x="460" y="290" width="360" height="90" class="n" fill="#f8fafc" stroke="#64748b"/><text x="640" y="326" text-anchor="middle" class="label">拆分请求范围</text><text x="640" y="354" text-anchor="middle" class="small">前缀走复用路径，后缀走计算路径</text><rect x="120" y="440" width="360" height="96" class="n" fill="#dcfce7" stroke="#16a34a"/><text x="300" y="480" text-anchor="middle" class="label">命中前缀</text><text x="300" y="512" text-anchor="middle" class="small">已登记的完整对象边界</text><rect x="120" y="580" width="360" height="72" class="n" fill="#eff6ff" stroke="#3b82f6"/><text x="300" y="612" text-anchor="middle" class="label">读取 KV Cache</text><text x="300" y="637" text-anchor="middle" class="small">确认状态驻留后复用</text><rect x="800" y="440" width="360" height="96" class="n" fill="#fef3c7" stroke="#d97706"/><text x="980" y="480" text-anchor="middle" class="label">未命中后缀</text><text x="980" y="512" text-anchor="middle" class="small">继续 Prefill</text><rect x="800" y="580" width="360" height="72" class="n" fill="#ecfeff" stroke="#0891b2"/><text x="980" y="612" text-anchor="middle" class="label">登记新路径</text><text x="980" y="637" text-anchor="middle" class="small">供后续请求复用</text><path d="M640 232V290" class="f"/><path d="M640 380V410H300V440" class="f"/><path d="M640 410H980V440" class="f"/><path d="M300 536V580" class="f"/><path d="M980 536V580" class="f"/></svg>
