<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">同一批测量在多个预算下筛选</title>
<desc id="desc">固定训练测量先检查运行与数值，再按显存上限、吞吐下限和损失要求筛选并排序。复用相同测量更改预算，分别记录选择一致、选择变化或某情景没有可行项。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="10" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="660" fill="#f8fafc"/>
<text x="600" y="42" text-anchor="middle" class="title">先按预算筛选，再看目标改变后是否仍选同一项</text>
<text x="600" y="75" text-anchor="middle" class="small">阈值情景复用同一批测量；选择一致不代表测量置信度已经确认</text>
<path d="M265 200H335" class="edge"/><path d="M555 200H625" class="edge"/><path d="M845 200H915" class="edge"/>
<path d="M1035 250V300H600V345" class="edge"/>
<path d="M480 435V480H200V520" class="edge"/><path d="M600 435V520" class="edge"/><path d="M720 435V480H1000V520" class="edge"/>
<g text-anchor="middle">
<rect x="45" y="150" width="220" height="100" class="node" fill="#e0f2fe" stroke="#0284c7"/>
<text x="155" y="180" class="head">同条件测量</text><text x="155" y="210" class="body">基线与各策略</text><text x="155" y="235" class="small">显存、速度、损失与状态</text>
<rect x="335" y="150" width="220" height="100" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="445" y="180" class="head">检查比较条件</text><text x="445" y="210" class="body">运行与数值结果</text><text x="445" y="235" class="small">确认预期路径实际执行</text>
<rect x="625" y="150" width="220" height="100" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="735" y="180" class="head">按预算保留可行项</text><text x="735" y="210" class="body">容量上限、速度下限</text><text x="735" y="235" class="small">同时满足损失要求</text>
<rect x="915" y="150" width="240" height="100" class="node" fill="#dcfce7" stroke="#16a34a"/>
<text x="1035" y="180" class="head">记录当前选择</text><text x="1035" y="210" class="body">先比显存，再比吞吐</text><text x="1035" y="235" class="small">无可行项时记录为空</text>
<rect x="380" y="345" width="440" height="90" class="node" fill="#eff6ff" stroke="#60a5fa"/>
<text x="600" y="380" class="head">复用测量，改变预算后重新筛选</text><text x="600" y="412" class="body">显存上限／吞吐下限／损失上限</text>
<rect x="55" y="520" width="290" height="90" class="node" fill="#dcfce7" stroke="#16a34a"/>
<text x="200" y="553" class="head">选择一致</text><text x="200" y="585" class="small">所列情景都选中同一候选</text>
<rect x="455" y="520" width="290" height="90" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="600" y="553" class="head">选择改变</text><text x="600" y="585" class="small">各情景可行，但所选候选改变</text>
<rect x="855" y="520" width="290" height="90" class="node" fill="#fff1f2" stroke="#e11d48"/>
<text x="1000" y="553" class="head">某情景没有可行项</text><text x="1000" y="585" class="small">调整目标或增加可比较候选</text>
</g></svg>
