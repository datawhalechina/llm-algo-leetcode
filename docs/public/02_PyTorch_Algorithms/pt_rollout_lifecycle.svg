<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">轨迹与策略版本生命周期</title>
  <desc id="desc">轨迹依次经过生成、奖励、新鲜度准入、独占预留与更新、策略发布，再由新策略开始下一轮生成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .node-title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .node-text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .caption { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 400; fill: #475569; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="470" rx="24" fill="#f8fafc"/>
  <text x="750" y="48" text-anchor="middle" class="title">轨迹、奖励与策略版本形成闭环</text>

  <rect x="35" y="125" width="250" height="150" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="160" y="178" text-anchor="middle" class="node-title">生成轨迹</text>
  <text x="160" y="211" text-anchor="middle" class="node-text">记录策略身份与生成条件</text>
  <text x="160" y="238" text-anchor="middle" class="node-text">保留有效动作与行为概率</text>

  <rect x="330" y="125" width="250" height="150" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="455" y="178" text-anchor="middle" class="node-title">完成奖励</text>
  <text x="455" y="211" text-anchor="middle" class="node-text">登记奖励来源与完成状态</text>
  <text x="455" y="238" text-anchor="middle" class="node-text">失败与未完成单独保留</text>

  <rect x="625" y="125" width="250" height="150" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="178" text-anchor="middle" class="node-title">新鲜度准入</text>
  <text x="750" y="211" text-anchor="middle" class="node-text">联合版本滞后与行为偏离</text>
  <text x="750" y="238" text-anchor="middle" class="node-text">拒绝未来、过期或漂移轨迹</text>

  <rect x="920" y="125" width="250" height="150" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1045" y="178" text-anchor="middle" class="node-title">独占预留与更新</text>
  <text x="1045" y="211" text-anchor="middle" class="node-text">一次轨迹只服务一次更新</text>
  <text x="1045" y="238" text-anchor="middle" class="node-text">提交成功后进入已消费状态</text>

  <rect x="1215" y="125" width="250" height="150" rx="18" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="1340" y="178" text-anchor="middle" class="node-title">发布新策略</text>
  <text x="1340" y="211" text-anchor="middle" class="node-text">提交不可变产物</text>
  <text x="1340" y="238" text-anchor="middle" class="node-text">完成必需工作进程确认</text>

  <path d="M285 200H330" class="flow"/>
  <path d="M580 200H625" class="flow"/>
  <path d="M875 200H920" class="flow"/>
  <path d="M1170 200H1215" class="flow"/>
  <path d="M1340 275V350H160V278" class="flow"/>
  <text x="750" y="397" text-anchor="middle" class="caption">活动策略切换完成后，下一轮轨迹才登记为新的策略身份</text>
</svg>
