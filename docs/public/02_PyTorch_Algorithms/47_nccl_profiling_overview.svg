<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">NCCL剖析如何从事件对齐走到通信排查</title><desc id="desc">固定负载分别提供计算事件和collective事件。按同rank、同时间单位对齐，合并计算覆盖后求通信交集和剩余时间，再按collective汇总。真实Trace补充rank、stream、同步依赖，用于解释等待。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.support{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">NCCL 通信剖析：事件怎样对齐，哪些等待需要继续排查？</text>
<text x="55" y="80" class="sub" text-anchor="start">CPU构造事件用于理解区间统计；真实设备Trace还需保留执行上下文与同步依赖。</text>
<g id="workload">
<rect x="55" y="240" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="170" y="267" class="head" text-anchor="middle">固定模型与负载</text>
<text x="170" y="293" class="body" text-anchor="middle">采集计算与通信事件</text>
</g>
<g id="compute-events">
<rect x="435" y="140" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="550" y="167" class="head" text-anchor="middle">计算事件</text>
<text x="550" y="193" class="body" text-anchor="middle">名称、起止时间</text>
</g>
<g id="communication-events">
<rect x="435" y="340" width="230" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="550" y="367" class="head" text-anchor="middle">通信事件</text>
<text x="550" y="393" class="body" text-anchor="middle">collective、bytes、起止时间</text>
</g>
<g id="alignment">
<rect x="805" y="240" width="230" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="920" y="267" class="head" text-anchor="middle">同rank、同单位对齐</text>
<text x="920" y="293" class="body" text-anchor="middle">计算区间先取并集</text>
</g>
<g id="interval-estimates">
<rect x="1205" y="240" width="230" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="node"/>
<text x="1320" y="267" class="head" text-anchor="middle">区间交集与剩余时间</text>
<text x="1320" y="293" class="body" text-anchor="middle">逐事件统计，保留归属</text>
</g>
<g id="execution-context">
<rect x="805" y="460" width="230" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="920" y="487" class="head" text-anchor="middle">真实Trace补充上下文</text>
<text x="920" y="513" class="body" text-anchor="middle">rank、stream与同步依赖</text>
</g>
<g id="collective-summary">
<rect x="1205" y="460" width="230" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
<text x="1320" y="487" class="head" text-anchor="middle">按collective汇总</text>
<text x="1320" y="513" class="body" text-anchor="middle">按总暴露时间确定排查顺序</text>
</g>
<path id="workload-to-compute" d="M285 265H355V180H435" class="flow"/>
<path id="workload-to-communication" d="M285 295H355V380H435" class="flow"/>
<path id="compute-to-alignment" d="M665 180H735V265H805" class="flow"/>
<path id="communication-to-alignment" d="M665 380H735V295H805" class="flow"/>
<path id="alignment-to-estimates" d="M1035 280H1205" class="flow"/>
<path id="context-to-alignment" d="M920 460V320" class="support"/>
<text x="934" y="399" class="body" text-anchor="start">解释依赖与等待</text>
<path id="estimates-to-summary" d="M1320 320V460" class="flow"/>
<text x="55" y="466" class="group" text-anchor="start">保留两层判断</text>
<text x="55" y="500" class="body" text-anchor="start">区间统计：先找到哪些通信值得排查</text>
<text x="55" y="530" class="body" text-anchor="start">依赖与完成时间：再判断它是否拖慢整轮执行</text>
<text x="55" y="590" class="sub" text-anchor="start">不同rank分别整理时间线；rank差异与同步等待根据实际采集信息解释，缺失项保留unknown。</text></svg>
