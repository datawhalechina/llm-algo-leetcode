<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 候选组与反馈链</title><desc id="desc">同一 prompt 生成多个候选，验证器逐候选评分，组内标准化形成相对优势，再与策略比率共同形成更新。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:24px;font-weight:700;fill:#0f172a}.s{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:500;fill:#475569}.l{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:16px;font-weight:700;fill:#111827}.b{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:12px;font-weight:500;fill:#334155}.box{stroke-width:2.5;rx:13}.f{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/><g transform="translate(78.5 0) scale(1.119047619)"><rect width="1200" height="420" fill="#f8fafc"/><text x="38" y="42" class="h">GRPO：同题候选如何形成相对更新信号</text><text x="38" y="67" class="s">评分先作用于候选，再在同一输入组内比较；不同任务的绝对奖励不直接混合。</text>
  <rect x="35" y="170" width="125" height="72" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="98" y="199" text-anchor="middle" class="l">输入提示</text><text x="98" y="223" text-anchor="middle" class="b">同一任务</text>
  <rect x="200" y="105" width="170" height="64" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="285" y="131" text-anchor="middle" class="l">候选 1 … k</text><text x="285" y="153" text-anchor="middle" class="b">回答 / 轨迹</text>
  <rect x="200" y="245" width="170" height="64" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="285" y="271" text-anchor="middle" class="l">采样对数概率</text><text x="285" y="293" text-anchor="middle" class="b">行为策略记录</text>
  <rect x="415" y="105" width="170" height="64" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="500" y="131" text-anchor="middle" class="l">逐候选评分</text><text x="500" y="153" text-anchor="middle" class="b">规则 · 模型 · 环境</text>
  <rect x="630" y="105" width="170" height="64" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="715" y="131" text-anchor="middle" class="l">组内优势</text><text x="715" y="153" text-anchor="middle" class="b">中心化与标准化</text>
  <rect x="630" y="245" width="170" height="64" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="715" y="271" text-anchor="middle" class="l">策略比率</text><text x="715" y="293" text-anchor="middle" class="b">当前 / 采样</text>
  <rect x="850" y="170" width="155" height="72" class="box" fill="#ede9fe" stroke="#6d28d9"/><text x="928" y="199" text-anchor="middle" class="l">保守目标</text><text x="928" y="223" text-anchor="middle" class="b">原始 / 裁剪后</text>
  <rect x="1045" y="170" width="125" height="72" class="box" fill="#ede9fe" stroke="#6d28d9"/><text x="1108" y="199" text-anchor="middle" class="l">更新</text><text x="1108" y="223" text-anchor="middle" class="b">掩码 · 均值</text>
  <path d="M160 194H180V137H200" class="f"/><path d="M160 218H180V277H200" class="f"/><path d="M370 137H415" class="f"/><path d="M585 137H630" class="f"/><path d="M370 277H630" class="f"/><path d="M800 137H825V194H850" class="f"/><path d="M800 277H825V218H850" class="f"/><path d="M1005 206H1045" class="f"/>
  </g>
</svg>
