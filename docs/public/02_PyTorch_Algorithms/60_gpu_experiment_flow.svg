<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">60 LoRA GPU 实验流程</title>
  <desc id="desc">Step 6 检查环境并运行 smoke test，Step 7 在相同条件下比较 baseline 和 LoRA，最后保存指标并生成决策。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #172b4d; }
      .label { font: 700 18px sans-serif; fill: #172b4d; }
      .body { font: 15px sans-serif; fill: #334e68; }
      .small { font: 14px sans-serif; fill: #486581; }
      .box { stroke-width: 2; rx: 14; }
      .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">60 LoRA 项目：从链路检查到对照决策</text>

  <rect x="55" y="95" width="230" height="145" class="box" fill="#e8f1fb" stroke="#4c86c6"/>
  <text x="170" y="130" text-anchor="middle" class="label">Step 6：先跑通链路</text>
  <text x="170" y="163" text-anchor="middle" class="body">dry_run</text>
  <text x="170" y="188" text-anchor="middle" class="body">→ real_gpu smoke</text>
  <text x="170" y="218" text-anchor="middle" class="small">检查 CUDA、模型、LoRA、产物</text>

  <path d="M285 168 H350" class="arrow"/>

  <rect x="350" y="95" width="230" height="145" class="box" fill="#fff4db" stroke="#d99a2b"/>
  <text x="465" y="130" text-anchor="middle" class="label">固定实验条件</text>
  <text x="465" y="163" text-anchor="middle" class="body">模型 · 数据 · 切分</text>
  <text x="465" y="188" text-anchor="middle" class="body">dtype · batch · steps</text>
  <text x="465" y="218" text-anchor="middle" class="small">SPLIT_SEED 固定</text>

  <path d="M580 168 H645" class="arrow"/>

  <rect x="645" y="75" width="230" height="185" class="box" fill="#e8f5ee" stroke="#4f9d69"/>
  <text x="760" y="112" text-anchor="middle" class="label">Step 7：匹配对照</text>
  <text x="760" y="150" text-anchor="middle" class="body">baseline</text>
  <text x="760" y="175" text-anchor="middle" class="small">更新底座模型权重</text>
  <text x="760" y="210" text-anchor="middle" class="body">LoRA</text>
  <text x="760" y="235" text-anchor="middle" class="small">冻结底座，只更新 adapter</text>

  <path d="M875 168 H940" class="arrow"/>

  <rect x="940" y="95" width="205" height="145" class="box" fill="#f0eafa" stroke="#8561a8"/>
  <text x="1042" y="130" text-anchor="middle" class="label">报告与决策</text>
  <text x="1042" y="163" text-anchor="middle" class="body">loss · 速度 · 显存</text>
  <text x="1042" y="188" text-anchor="middle" class="body">adapter · JSON</text>
  <text x="1042" y="218" text-anchor="middle" class="small">accept / tune / reject</text>

  <path d="M760 260 V320 H465 V350" class="arrow"/>
  <rect x="285" y="350" width="360" height="52" class="box" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="465" y="382" text-anchor="middle" class="body">改变 REAL_SEED 时，另存一份报告观察波动</text>
</svg>
