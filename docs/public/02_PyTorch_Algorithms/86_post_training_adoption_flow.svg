<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">并列后训练候选的生命周期交接流程</title><desc id="desc">DPO 与 GRPO/RLVR 的分支证据先转换成共同交接契约，再检查身份、产物、恢复和回滚条件，最终形成三态交接结果。</desc>
  <defs><marker id="orange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker><marker id="blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker><marker id="slate" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.orange,.blue,.teal,.slate{fill:none;stroke-width:3}.orange{stroke:#ea580c;marker-end:url(#orange)}.blue{stroke:#2563eb;marker-end:url(#blue)}.teal{stroke:#0f766e;marker-end:url(#teal)}.slate{stroke:#475569;marker-end:url(#slate)}</style></defs>
  <rect width="1200" height="600" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="title">并列候选先核对生命周期，再交给独立评测</text>
  <rect x="90" y="90" width="300" height="92" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="240" y="124" text-anchor="middle" class="head">DPO 交付清单</text><text x="240" y="151" text-anchor="middle" class="body">偏好隔离 · 独立边际 · 适配器</text>
  <rect x="810" y="90" width="300" height="92" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="960" y="124" text-anchor="middle" class="head">GRPO/RLVR 交付清单</text><text x="960" y="151" text-anchor="middle" class="body">轨迹契约 · 新轨迹质量 · 适配器</text>
  <rect x="430" y="235" width="340" height="96" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="600" y="269" text-anchor="middle" class="head">共同交付契约</text><text x="600" y="296" text-anchor="middle" class="body">源基线 · 候选身份 · 评测身份 · 产物哈希</text>
  <path class="orange" d="M240 182 V210 H520 V225"/><path class="orange" d="M960 182 V210 H680 V225"/>
  <rect x="100" y="405" width="230" height="88" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="215" y="438" text-anchor="middle" class="head">证据新鲜度</text><text x="215" y="465" text-anchor="middle" class="body">当前基线与分支证据有效</text>
  <rect x="385" y="405" width="230" height="88" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="500" y="438" text-anchor="middle" class="head">产物检查</text><text x="500" y="465" text-anchor="middle" class="body">候选哈希 · 回滚基线</text>
  <rect x="670" y="405" width="230" height="88" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="785" y="438" text-anchor="middle" class="head">恢复能力</text><text x="785" y="465" text-anchor="middle" class="body">最晚可信状态与回退动作</text>
  <rect x="955" y="405" width="170" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1040" y="438" text-anchor="middle" class="head">交接状态</text><text x="1040" y="465" text-anchor="middle" class="body">拒绝 / 调优 / 待评测</text>
  <path class="blue" d="M520 331 V370 H215 V395"/><path class="orange" d="M600 331 V395"/><path class="teal" d="M680 331 V370 H785 V395"/>
  <path class="slate" d="M330 449 H375"/><path class="slate" d="M615 449 H660"/><path class="slate" d="M900 449 H945"/>
</svg>
