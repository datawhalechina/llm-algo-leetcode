<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">先核对来源与目录，再保留待评测候选</title><desc id="desc">离线与在线分支各自保留原始评分，读取来源记录后核对本地目录和回退基线。恢复动作选择在另一张图中展开。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.label{font-size:14px;fill:#475569}</style></defs>
<rect width="1200" height="600" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="title">先核对来源与目录，再保留待评测候选</text>
<rect id="dpo" x="90" y="90" width="300" height="92" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="240" y="124" text-anchor="middle" class="head">离线候选清单</text><text x="240" y="151" text-anchor="middle" class="body">来源记录 · 离线评分 · 适配器</text>
<rect id="grpo" x="810" y="90" width="300" height="92" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="960" y="124" text-anchor="middle" class="head">在线候选清单</text><text x="960" y="151" text-anchor="middle" class="body">生成记录 · 规则得分 · 适配器</text>
<rect id="record" x="430" y="235" width="340" height="96" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="600" y="269" text-anchor="middle" class="head">候选来源与分支记录</text><text x="600" y="296" text-anchor="middle" class="body">源策略 · 评测标识 · 分支来源</text>
<rect id="source-check" x="100" y="405" width="230" height="88" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="215" y="439" text-anchor="middle" class="head">来源与窗口检查</text><text x="215" y="466" text-anchor="middle" class="body">来源匹配，分支字段满足</text>
<rect id="files" x="485" y="405" width="230" height="88" rx="14" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="600" y="439" text-anchor="middle" class="head">目录哈希核对</text><text x="600" y="466" text-anchor="middle" class="body">候选目录 · SFT 回退目录</text>
<rect id="result" x="900" y="405" width="230" height="88" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="1015" y="439" text-anchor="middle" class="head">候选状态</text><text x="1015" y="466" text-anchor="middle" class="body">拒绝 / 调整 / 待评测</text>
<path class="edge" d="M240 182 V210 H520 V235" data-source="dpo" data-target="record"/>
<path class="edge" d="M960 182 V210 H680 V235" data-source="grpo" data-target="record"/>
<path class="edge" d="M520 331 V370 H215 V405" data-source="record" data-target="source-check"/>
<path class="edge" d="M330 449 H485" data-source="source-check" data-target="files"/>
<path class="edge" d="M715 449 H900" data-source="files" data-target="result"/>
</svg>
