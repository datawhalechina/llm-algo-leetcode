<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">损失梯度经后续网络回到ReLU</title><desc id="desc">前向ReLU输出经后续网络形成logits并计算损失；反向经后续网络局部反向得到ReLU输出梯度，再用前向x形成的mask回传到输入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker><marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.read{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#blue)}.grad{stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}.control{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#purple)}</style></defs>
<rect width="1240" height="600" fill="#f8fafc" data-layout-role="decoration"/>
<text x="45" y="45" class="title" text-anchor="start">损失产生梯度，后续网络回传，ReLU再按前向状态门控</text>
<text x="45" y="78" class="sub" text-anchor="start">只把实际读取的mask连到ReLU反向；梯度沿各算子的局部依赖返回。</text>
<rect x="45" y="135" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="164" class="head" text-anchor="middle">激活输入 x</text>
<text x="140" y="191" class="body" text-anchor="middle">ReLU前的表示</text>
<path id="forward-0" d="M235 175H290" class="flow"/>
<rect x="290" y="135" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="385" y="164" class="head" text-anchor="middle">ReLU输出 y</text>
<text x="385" y="191" class="body" text-anchor="middle">y = max(0, x)</text>
<path id="forward-1" d="M480 175H535" class="flow"/>
<rect x="535" y="135" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="630" y="164" class="head" text-anchor="middle">后续网络</text>
<text x="630" y="191" class="body" text-anchor="middle">将y映射为logits</text>
<path id="forward-2" d="M725 175H780" class="flow"/>
<rect x="780" y="135" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="875" y="164" class="head" text-anchor="middle">logits z</text>
<text x="875" y="191" class="body" text-anchor="middle">模型输出分数</text>
<path id="forward-3" d="M970 175H1025" class="flow"/>
<rect x="1025" y="135" width="170" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1110" y="164" class="head" text-anchor="middle">损失 L</text>
<text x="1110" y="191" class="body" text-anchor="middle">与目标比较</text>
<rect x="290" y="300" width="190" height="80" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="385" y="329" class="head" text-anchor="middle">mask = (x &gt; 0)</text>
<text x="385" y="356" class="body" text-anchor="middle">由前向输入形成</text>
<path id="x-to-mask" d="M140 215V340H290" class="control"/>
<rect x="1025" y="285" width="170" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1110" y="314" class="head" text-anchor="middle">目标标签</text>
<text x="1110" y="341" class="body" text-anchor="middle">规定训练目标</text>
<path id="label-to-loss" d="M1110 285V215" class="control"/>
<rect x="1025" y="450" width="170" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="1110" y="479" class="head" text-anchor="middle">损失局部反向</text>
<text x="1110" y="506" class="body" text-anchor="middle">产生G_z</text>
<rect x="780" y="450" width="190" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="875" y="479" class="head" text-anchor="middle">后续网络局部反向</text>
<text x="875" y="506" class="body" text-anchor="middle">G_y = Jᵀ G_z</text>
<rect x="535" y="450" width="190" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="630" y="479" class="head" text-anchor="middle">上游梯度 G_y</text>
<text x="630" y="506" class="body" text-anchor="middle">返回ReLU输出</text>
<rect x="290" y="450" width="190" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="385" y="479" class="head" text-anchor="middle">ReLU局部反向</text>
<text x="385" y="506" class="body" text-anchor="middle">G_x = G_y ⊙ mask</text>
<rect x="45" y="450" width="190" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="140" y="479" class="head" text-anchor="middle">输入梯度 G_x</text>
<text x="140" y="506" class="body" text-anchor="middle">返回激活输入</text>
<path id="loss-backward-start" d="M1195 175H1215V490H1195" class="grad"/>
<path id="label-to-loss-backward" d="M1110 365V450" class="control"/>
<path id="loss-grad-to-network" d="M1025 490H970" class="grad"/>
<path id="network-grad-to-y" d="M780 490H725" class="grad"/>
<path id="y-grad-to-relu" d="M535 490H480" class="grad"/>
<path id="relu-grad-to-x" d="M290 490H235" class="grad"/>
<path id="mask-to-relu-backward" d="M385 380V450" class="control"/>
<text x="45" y="578" class="small" text-anchor="start">J表示后续网络对y的局部雅可比；紫色虚线标出目标输入或前向状态的读取。</text>
</svg>
