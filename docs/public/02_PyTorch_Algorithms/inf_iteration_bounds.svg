<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">服务批次的五类容量上界</title><desc id="desc">序列槽位、KV容量、本轮Token预算、服务目标和执行能力共同约束可执行批次，最小上界决定当前瓶颈。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#486581"/></marker><style>.t{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#203040}.h{font-size:22px;font-weight:700}.b{font-size:16px}.s{font-size:13px;fill:#526777}.l{fill:none;stroke:#486581;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" fill="#f7f9fc"/><text x="600" y="42" text-anchor="middle" class="t h">服务批次的五类容量上界</text>
  <g>
    <rect x="35" y="90" width="200" height="64" rx="13" fill="#e8f2ff" stroke="#5b8def" stroke-width="2"/><text x="135" y="116" text-anchor="middle" class="t b">序列槽位</text><text x="135" y="140" text-anchor="middle" class="t s">可同时驻留多少请求</text>
    <rect x="268" y="90" width="200" height="64" rx="13" fill="#e8f7ef" stroke="#48a879" stroke-width="2"/><text x="368" y="116" text-anchor="middle" class="t b">KV 容量</text><text x="368" y="140" text-anchor="middle" class="t s">历史状态占用多少字节</text>
    <rect x="501" y="90" width="200" height="64" rx="13" fill="#fff4db" stroke="#d99b2b" stroke-width="2"/><text x="601" y="116" text-anchor="middle" class="t b">本轮 Token 预算</text><text x="601" y="140" text-anchor="middle" class="t s">一轮允许处理多少工作</text>
    <rect x="734" y="90" width="200" height="64" rx="13" fill="#f1eaff" stroke="#8c6bc7" stroke-width="2"/><text x="834" y="116" text-anchor="middle" class="t b">服务目标</text><text x="834" y="140" text-anchor="middle" class="t s">由负载实测给出批次上限</text>
    <rect x="967" y="90" width="200" height="64" rx="13" fill="#ffecef" stroke="#cc6677" stroke-width="2"/><text x="1067" y="116" text-anchor="middle" class="t b">执行能力</text><text x="1067" y="140" text-anchor="middle" class="t s">内核与执行图是否支持</text>
  </g>
  <rect x="410" y="292" width="380" height="88" rx="15" fill="#fff" stroke="#405a73" stroke-width="2.5"/><text x="600" y="326" text-anchor="middle" class="t h">必要批次上界 = 五者最小值</text><text x="600" y="355" text-anchor="middle" class="t s">同时保留并列生效的约束</text>
  <path d="M135 154V224H450V292" class="l"/><path d="M368 154V246H520V292" class="l"/><path d="M601 154V292" class="l"/><path d="M834 154V246H680V292" class="l"/><path d="M1067 154V224H750V292" class="l"/>
  <rect x="220" y="442" width="310" height="72" rx="13" fill="#fff4db" stroke="#d99b2b" stroke-width="2"/><text x="375" y="472" text-anchor="middle" class="t b">扩大批次前先找生效上界</text><text x="375" y="496" text-anchor="middle" class="t s">避免收益饱和后继续增加延迟</text>
  <rect x="670" y="442" width="310" height="72" rx="13" fill="#e8f7ef" stroke="#48a879" stroke-width="2"/><text x="825" y="472" text-anchor="middle" class="t b">上下文增长会改变瓶颈</text><text x="825" y="496" text-anchor="middle" class="t s">KV 与注意力成本通常先收紧</text>
  <path d="M520 380V410H375V442" class="l"/><path d="M680 380V410H825V442" class="l"/>
</svg>
