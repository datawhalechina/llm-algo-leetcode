<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">两组报告共同回答：复用是否带来净收益</title><desc id="desc">相同请求分别关闭和开启前缀缓存，两组汇总后核对输出、命中计数与性能，另以压力负载评估容量。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.small{font-size:14px}.edge{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#7657a5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="title">两组报告共同回答：复用是否带来净收益</text>
<rect x="35" y="185" width="245" height="100" rx="14" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="157.5" y="220" text-anchor="middle" class="h">相同共享前缀请求</text><text x="157.5" y="250" text-anchor="middle">固定模型、顺序与生成规则</text>
<rect x="345" y="85" width="235" height="100" rx="14" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="462.5" y="120" text-anchor="middle" class="h">G0：关闭缓存</text><text x="462.5" y="150" text-anchor="middle">记录实际配置与请求</text>
<rect x="345" y="285" width="235" height="100" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="462.5" y="320" text-anchor="middle" class="h">G1：开启缓存</text><text x="462.5" y="350" text-anchor="middle">记录实际配置与请求</text>
<rect x="650" y="185" width="240" height="100" rx="14" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="770" y="220" text-anchor="middle" class="h">汇总两组原始记录</text><text x="770" y="250" text-anchor="middle">按请求编号配对</text>
<rect x="970" y="85" width="240" height="100" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="1090" y="120" text-anchor="middle" class="h">核对复用与输出</text><text x="1090" y="150" text-anchor="middle">命中单位、等价性与稳定性</text>
<rect x="970" y="285" width="240" height="100" rx="14" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1090" y="320" text-anchor="middle" class="h">比较延迟与吞吐</text><text x="1090" y="350" text-anchor="middle">同一客户端时间口径</text>
<rect x="1270" y="185" width="195" height="100" rx="14" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1367.5" y="220" text-anchor="middle" class="h">形成项目决策</text><text x="1367.5" y="250" text-anchor="middle">采用／补测／拒绝</text>
