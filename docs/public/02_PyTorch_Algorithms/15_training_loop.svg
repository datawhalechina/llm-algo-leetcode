<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">两微批次共享词元分母与一次有效更新</title><desc id="desc">两个微批次分别有4与10有效监督目标，两份损失总和均除以14后累积，之后一次optimizer更新并可选推进scheduler；满足首末或eval_every条件时评估记录。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="500" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="46" class="title" text-anchor="start">两个微批次共用14个有效目标的分母，再推进一次参数更新</text>
<text x="55" y="78" class="sub" text-anchor="start">S₁、S₂是各微批次有效监督位置的损失总和；参数在累计梯度期间保持同一版本。</text>
<rect x="55" y="150" width="180" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="145" y="178" class="head" text-anchor="middle">本轮开始</text>
<text x="145" y="203" class="body" text-anchor="middle">梯度归零；N=14</text>
<rect x="295" y="150" width="220" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="405" y="178" class="head" text-anchor="middle">微批次1：4个目标</text>
<text x="405" y="203" class="body" text-anchor="middle">反传S₁ / 14</text>
<rect x="575" y="150" width="220" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="685" y="178" class="head" text-anchor="middle">微批次2：10个目标</text>
<text x="685" y="203" class="body" text-anchor="middle">反传S₂ / 14</text>
<rect x="855" y="150" width="230" height="90" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="970" y="178" class="head" text-anchor="middle">有效更新边界</text>
<text x="970" y="203" class="body" text-anchor="middle">optimizer.step一次</text>
<rect x="1170" y="150" width="275" height="90" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1307.5" y="178" class="head" text-anchor="middle">训练时钟推进</text>
<text x="1307.5" y="203" class="body" text-anchor="middle">配置scheduler时推进一次</text>
<path id="begin-to-micro1" d="M235 195H295" class="flow"/>
<path id="micro1-to-micro2" d="M515 195H575" class="flow"/>
<path id="micro2-to-update" d="M795 195H855" class="flow"/>
<path id="update-to-clock" d="M1085 195H1170" class="flow"/>
<rect x="295" y="285" width="500" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" data-layout-role="panel"/><text x="545" y="313" class="head" text-anchor="middle">同一梯度缓冲区</text>
<text x="545" y="340" class="body" text-anchor="middle">g = ∇S₁ / 14 + ∇S₂ / 14</text>
<path id="micro1-to-gradient" d="M405 240V285" class="flow"/>
<path id="micro2-to-gradient" d="M685 240V285" class="flow"/>
<path id="gradient-to-update" d="M795 320H970V240" class="flow"/>
<rect x="1170" y="350" width="275" height="80" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1307.5" y="378" class="head" text-anchor="middle">按条件评估并记录</text>
<text x="1307.5" y="403" class="body" text-anchor="middle">首轮／末轮／eval_every</text>
<path id="clock-to-conditional-evaluation" d="M1307 240V350" class="flow"/>
<text x="55" y="460" class="sub" text-anchor="start">两份损失总和都除以14，使每个有效词元的权重一致；评估与history按记录条件执行。</text>
</svg>
