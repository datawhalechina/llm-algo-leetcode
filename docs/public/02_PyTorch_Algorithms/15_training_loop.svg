<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">端到端 SFT 的有效更新时间线</title>
  <desc id="desc">展示一次有效更新中梯度归零、多个微批次累积、参数写回、训练时钟推进以及隔离评估与记录的先后关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FDF2F8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#0891B2"/>
    </marker>
    <style>
      .title{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:30px;font-weight:700;fill:#0F172A}
      .sub{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:17px;font-weight:500;fill:#475569}
      .label{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:19px;font-weight:700;fill:#111827}
      .small{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:15px;font-weight:500;fill:#334155}
      .box{stroke-width:2.5}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#0891B2;stroke-width:2.5;fill:none;marker-end:url(#loopArrow)}
      .loopText{font-family:"Inter","Noto Sans CJK SC",sans-serif;font-size:15px;font-weight:600;fill:#0E7490}
    </style>
  </defs>
  <rect width="1500" height="470" rx="24" fill="url(#bg)"/>
  <text x="60" y="60" class="title">一次有效更新如何推进训练状态</text>
  <text x="60" y="92" class="sub">微批次只累积梯度；参数、学习率、评估结果和记录编号都在有效更新边界推进。</text>

  <rect x="45" y="180" width="210" height="120" rx="17" class="box" fill="#FFF7ED" stroke="#F59E0B"/>
  <text x="150" y="224" text-anchor="middle" class="label">更新起点</text>
  <text x="150" y="257" text-anchor="middle" class="small">梯度状态归零</text>
  <text x="150" y="283" text-anchor="middle" class="small">建立更新编号 u</text>

  <rect x="315" y="180" width="260" height="120" rx="17" class="box" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="445" y="224" text-anchor="middle" class="label">K 个微批次累积</text>
  <text x="445" y="257" text-anchor="middle" class="small">各自贡献缩放后的梯度</text>
  <text x="445" y="283" text-anchor="middle" class="small">参数保持不变</text>

  <rect x="635" y="180" width="240" height="120" rx="17" class="box" fill="#ECFDF5" stroke="#10B981"/>
  <text x="755" y="224" text-anchor="middle" class="label">有效更新边界</text>
  <text x="755" y="257" text-anchor="middle" class="small">累计梯度写回参数</text>
  <text x="755" y="283" text-anchor="middle" class="small">每个逻辑批次一次</text>

  <rect x="935" y="180" width="220" height="120" rx="17" class="box" fill="#F5F3FF" stroke="#8B5CF6"/>
  <text x="1045" y="224" text-anchor="middle" class="label">训练时钟推进</text>
  <text x="1045" y="257" text-anchor="middle" class="small">学习率状态前进一步</text>
  <text x="1045" y="283" text-anchor="middle" class="small">更新编号变为 u+1</text>

  <rect x="1215" y="180" width="240" height="120" rx="17" class="box" fill="#FDF2F8" stroke="#DB2777"/>
  <text x="1335" y="224" text-anchor="middle" class="label">隔离评估与记录</text>
  <text x="1335" y="257" text-anchor="middle" class="small">固定更新后的模型状态</text>
  <text x="1335" y="283" text-anchor="middle" class="small">写入同编号配对证据</text>

  <path d="M255 240H315" class="arrow"/>
  <path d="M575 240H635" class="arrow"/>
  <path d="M875 240H935" class="arrow"/>
  <path d="M1155 240H1215" class="arrow"/>

  <path d="M445 300V375H365V300" class="loop"/>
  <text x="510" y="405" text-anchor="middle" class="loopText">k &lt; K：继续读取下一个微批次</text>
</svg>
