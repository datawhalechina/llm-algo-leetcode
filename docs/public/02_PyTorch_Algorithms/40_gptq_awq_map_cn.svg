<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="title desc">
  <title id="title">GPTQ 与 AWQ 的校准策略差异</title>
  <desc id="desc">校准输入先形成共同的分组和 scale 基线，再分别进入 GPTQ 的层输出误差路径和 AWQ 的激活敏感通道路径，最终生成同类量化输出。</desc>
  <defs>
    <style>
      .title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.group{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.h{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.t{font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.purple{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}.green{fill:#eaf7ee;stroke:#4c9870;stroke-width:2}.orange{fill:#fff5df;stroke:#c78335;stroke-width:2}.pink{fill:#fce7f3;stroke:#db2777;stroke-width:2}.flow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.gptq{stroke:#8b6bb1;stroke-width:3;fill:none;marker-end:url(#purpleArrow)}.awq{stroke:#4c9870;stroke-width:3;fill:none;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker>
    <marker id="purpleArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8b6bb1"/></marker>
    <marker id="greenArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c9870"/></marker>
  </defs>
  <rect width="1240" height="540" rx="22" fill="#fffbeb"/>
  <text x="620" y="46" text-anchor="middle" class="title">GPTQ / AWQ：共享校准基础，选择不同的误差控制信号</text>
  <text x="620" y="74" text-anchor="middle" class="sub">左侧准备共同量化基线；中间两条并列路径决定各自的权重处理方式</text>

  <rect x="45" y="210" width="175" height="82" rx="15" class="blue"/>
  <text x="133" y="242" text-anchor="middle" class="h">校准输入</text><text x="133" y="266" text-anchor="middle" class="t">代表性样本与层输出</text>
  <rect x="275" y="210" width="175" height="82" rx="15" class="orange"/>
  <text x="363" y="242" text-anchor="middle" class="h">共同准备</text><text x="363" y="266" text-anchor="middle" class="t">分组、scale 与统计</text>
  <path d="M220 251H275" class="flow"/>

  <rect x="500" y="110" width="370" height="130" rx="18" class="frame"/>
  <text x="523" y="140" class="group">GPTQ：层输出误差路径</text>
  <rect x="523" y="165" width="140" height="48" rx="12" class="purple"/><text x="593" y="195" text-anchor="middle" class="h">比较恢复误差</text>
  <rect x="695" y="165" width="150" height="48" rx="12" class="purple"/><text x="770" y="195" text-anchor="middle" class="h">补偿并量化</text>
  <path d="M663 189H695" class="gptq"/>

  <rect x="500" y="300" width="370" height="130" rx="18" class="frame"/>
  <text x="523" y="330" class="group">AWQ：激活敏感通道路径</text>
  <rect x="523" y="355" width="140" height="48" rx="12" class="green"/><text x="593" y="385" text-anchor="middle" class="h">识别敏感通道</text>
  <rect x="695" y="355" width="150" height="48" rx="12" class="green"/><text x="770" y="385" text-anchor="middle" class="h">保护并重缩放</text>
  <path d="M663 379H695" class="awq"/>

  <rect x="955" y="210" width="235" height="92" rx="17" class="pink"/>
  <text x="1073" y="243" text-anchor="middle" class="h">共同量化输出</text><text x="1073" y="267" text-anchor="middle" class="t">低比特权重、scale 与 metadata</text>
  <rect x="955" y="335" width="235" height="58" rx="14" class="blue"/>
  <text x="1073" y="360" text-anchor="middle" class="h">artifact 与恢复误差</text><text x="1073" y="382" text-anchor="middle" class="t">交给 loader / backend 复核</text>

  <path d="M450 251H475V189H523" class="gptq"/>
  <path d="M450 251H475V379H523" class="awq"/>
  <path d="M845 189H910V245H955" class="gptq"/>
  <path d="M845 379H910V267H955" class="awq"/>
  <path d="M1073 302V335" class="flow"/>
</svg>
