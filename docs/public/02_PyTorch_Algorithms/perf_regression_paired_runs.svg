<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">同一轮配对：延迟比例、失败与缺失</title>
  <desc id="desc">构造四轮示例。第一轮基线10毫秒、候选9毫秒，比例0.90；第二轮先运行候选，候选10.5毫秒、基线10毫秒，比例1.05。第三轮候选失败，第四轮候选记录缺失；异常轮次单独保留，不生成比例。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}
      .sub{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}
      .body{font-family:"Noto Sans CJK SC",sans-serif;font-size:17px;fill:#334155}
      .edge{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">同一轮的两次运行怎样进入比较</text>
  <text x="600" y="80" text-anchor="middle" class="sub">构造示例，计划 4 轮；输入、权重、环境与计时范围相同，轮次之间交替执行顺序</text>
  <rect x="45" y="155" width="710" height="325" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" data-layout-role="panel"/>
  <path d="M45 215H755M45 280H755M45 345H755M45 410H755" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <g text-anchor="middle" class="head">
    <text x="95" y="192">轮次</text><text x="290" y="192">执行顺序</text>
    <text x="530" y="192">基线 / ms</text><text x="675" y="192">候选 / ms</text>
  </g>
  <g text-anchor="middle" class="body">
    <text x="95" y="254">1</text><text x="290" y="254">基线 → 候选</text><text x="530" y="254">10.0</text><text x="675" y="254">9.0</text>
    <text x="95" y="319">2</text><text x="290" y="319">候选 → 基线</text><text x="530" y="319">10.0</text><text x="675" y="319">10.5</text>
    <text x="95" y="384">3</text><text x="290" y="384">基线 → 候选</text><text x="530" y="384">10.0</text><text x="675" y="384" fill="#b91c1c">执行失败</text>
    <text x="95" y="449">4</text><text x="290" y="449">候选 → 基线</text><text x="530" y="449">10.0</text><text x="675" y="449" fill="#b45309">记录缺失</text>
  </g>
  <rect x="860" y="215" width="295" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1007" y="243" text-anchor="middle" class="head">2 个成功配对的比例</text>
  <text x="1007" y="277" text-anchor="middle" class="body">第 1 轮：9.0 / 10.0 = 0.90</text>
  <text x="1007" y="311" text-anchor="middle" class="body">第 2 轮：10.5 / 10.0 = 1.05</text>
  <path d="M755 248H810V265H860" class="edge"/>
  <path d="M755 313H810V305H860" class="edge"/>
  <rect x="860" y="365" width="295" height="115" rx="16" fill="#fff1f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1007" y="394" text-anchor="middle" class="head">分别保留异常轮次</text>
  <text x="1007" y="427" text-anchor="middle" class="body">第 3 轮：失败，记录发生阶段</text>
  <text x="1007" y="459" text-anchor="middle" class="body">第 4 轮：缺失，等待补齐</text>
  <path d="M755 378H810V420H860" class="edge"/>
  <path d="M755 443H810V450H860" class="edge"/>
</svg>
