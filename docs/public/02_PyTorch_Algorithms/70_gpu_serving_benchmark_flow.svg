<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs>
    <style>
      .title{font:700 28px sans-serif;fill:#17324d}.group{font:700 18px sans-serif;fill:#17324d}.h{font:700 16px sans-serif;fill:#17324d}.t{font:15px sans-serif;fill:#35526b}.s{font:14px sans-serif;fill:#526b7d}.flow{stroke:#3978a8;stroke-width:3;fill:none;marker-end:url(#arrow)}.merge{stroke:#8b6bb1;stroke-width:3;fill:none;marker-end:url(#purple)}.frame{fill:#fff;stroke:#c7d9e7;stroke-width:1.5}.blue{fill:#e8f3fb;stroke:#3978a8;stroke-width:2}.purple{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}.green{fill:#eaf7ef;stroke:#4c9870;stroke-width:2}.orange{fill:#fff1df;stroke:#c78335;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#3978a8"/></marker>
    <marker id="purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8b6bb1"/></marker>
  </defs>
  <rect width="1500" height="600" rx="24" fill="#f8fbfd"/>
  <text x="750" y="48" text-anchor="middle" class="title">GPU / backend Serving 基准：共同基线、两类对照与可追溯证据</text>

  <rect x="45" y="150" width="335" height="260" rx="18" class="frame"/>
  <text x="68" y="182" class="group">共同实验条件</text>
  <rect x="68" y="205" width="135" height="145" rx="14" class="blue"/>
  <text x="136" y="240" text-anchor="middle" class="h">环境</text><text x="136" y="266" text-anchor="middle" class="t">GPU / CUDA</text><text x="136" y="290" text-anchor="middle" class="t">backend / 模型</text><text x="136" y="314" text-anchor="middle" class="t">dtype</text>
  <rect x="222" y="205" width="135" height="145" rx="14" class="blue"/>
  <text x="290" y="240" text-anchor="middle" class="h">workload</text><text x="290" y="266" text-anchor="middle" class="t">请求流</text><text x="290" y="290" text-anchor="middle" class="t">并发 / 到达率</text><text x="290" y="314" text-anchor="middle" class="t">缓存策略</text>

  <rect x="455" y="220" width="220" height="120" rx="18" class="purple"/>
  <text x="565" y="258" text-anchor="middle" class="h">G0 共同基线</text><text x="565" y="285" text-anchor="middle" class="t">固定 backend 与默认策略</text><text x="565" y="310" text-anchor="middle" class="t">记录初始服务指标</text>

  <rect x="760" y="105" width="240" height="125" rx="18" class="green"/>
  <text x="880" y="142" text-anchor="middle" class="h">G1 负载敏感性</text><text x="880" y="170" text-anchor="middle" class="t">改变并发、到达率</text><text x="880" y="195" text-anchor="middle" class="t">观察排队与饱和点</text>
  <rect x="760" y="350" width="240" height="125" rx="18" class="orange"/>
  <text x="880" y="387" text-anchor="middle" class="h">G2 策略对照</text><text x="880" y="415" text-anchor="middle" class="t">固定 workload</text><text x="880" y="440" text-anchor="middle" class="t">只改变一项调度策略</text>

  <rect x="1085" y="220" width="205" height="120" rx="18" class="blue"/>
  <text x="1188" y="258" text-anchor="middle" class="h">JSON 证据</text><text x="1188" y="285" text-anchor="middle" class="t">指标、配置、失败状态</text><text x="1188" y="310" text-anchor="middle" class="t">baseline / candidate</text>
  <rect x="1335" y="235" width="120" height="90" rx="18" class="orange"/>
  <text x="1395" y="270" text-anchor="middle" class="h">决策</text><text x="1395" y="296" text-anchor="middle" class="t">accept</text><text x="1395" y="316" text-anchor="middle" class="t">tune / reject</text>

  <path d="M380 280H455" class="flow"/>
  <path d="M675 280H710V168H760" class="flow"/>
  <path d="M675 280H710V413H760" class="flow"/>
  <path d="M1000 168H1040V260H1085" class="merge"/>
  <path d="M1000 413H1040V300H1085" class="merge"/>
  <path d="M1290 280H1335" class="flow"/>
  <text x="720" y="92" text-anchor="middle" class="s">G1 与 G2 都以 G0 为共同基线：前者扫描负载，后者比较策略，二者不是串行阶段</text>
  <text x="750" y="545" text-anchor="middle" class="s">蓝：固定条件与可追溯记录　紫：共同参照　绿：负载扫描　橙：策略或结论</text>
</svg>
