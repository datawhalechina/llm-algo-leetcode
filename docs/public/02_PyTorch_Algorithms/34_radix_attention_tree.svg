<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" role="img" aria-labelledby="title desc">
  <title id="title">RadixAttention 的前缀复用</title>
  <desc id="desc">新请求沿 token 路径查询 Radix Tree，找到最长公共前缀后分为命中前缀和未命中后缀。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:700}.sub{font-size:16px;font-weight:500;fill:#475569}.label{font-size:18px;font-weight:700}.text{font-size:14px;font-weight:500;fill:#334155}.group-title{font-size:16px;font-weight:700;fill:#475569}
      .node{stroke-width:3;rx:17;ry:17}.group{stroke-width:2;rx:24;ry:24}.flow{stroke:#475569;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.branch{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1360" height="620" fill="url(#bg)"/>
  <text x="54" y="58" class="title">RadixAttention：沿 token 路径复用前缀</text>
  <text x="54" y="88" class="sub">共同词元路径与已保存对象的有效边界，一起确定可复用范围。</text>

  <rect x="54" y="210" width="190" height="110" class="node" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="149" y="252" text-anchor="middle" class="label">新请求</text><text x="149" y="284" text-anchor="middle" class="text">prompt token 路径</text>
  <rect x="300" y="130" width="400" height="330" class="group" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="326" y="168" class="group-title">Radix Tree：共享的 token 路径</text>
  <rect x="380" y="210" width="220" height="86" class="node" fill="#ecfccb" stroke="#65a30d"/>
  <text x="490" y="247" text-anchor="middle" class="label">共享前缀</text><text x="490" y="275" text-anchor="middle" class="text">同一段路径只登记一次</text>
  <rect x="350" y="360" width="140" height="70" class="node" fill="#ecfeff" stroke="#0891b2"/>
  <text x="420" y="391" text-anchor="middle" class="label">分支 A</text><text x="420" y="414" text-anchor="middle" class="text">后续 token</text>
  <rect x="530" y="360" width="140" height="70" class="node" fill="#ecfeff" stroke="#0891b2"/>
  <text x="600" y="391" text-anchor="middle" class="label">分支 B</text><text x="600" y="414" text-anchor="middle" class="text">后续 token</text>
  <rect x="800" y="210" width="240" height="110" class="node" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="920" y="252" text-anchor="middle" class="label">最长有效前缀</text><text x="920" y="284" text-anchor="middle" class="text">沿共享边逐段匹配</text>
  <rect x="1120" y="140" width="210" height="110" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1225" y="182" text-anchor="middle" class="label">命中前缀</text><text x="1225" y="214" text-anchor="middle" class="text">读取已有 KV Cache</text>
  <rect x="1120" y="360" width="210" height="110" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="1225" y="402" text-anchor="middle" class="label">未命中后缀</text><text x="1225" y="434" text-anchor="middle" class="text">继续 Prefill，形成新分支</text>

  <path d="M244 265H300" class="flow"/><path d="M490 296V330H420V360" class="branch"/><path d="M490 330H600V360" class="branch"/><path d="M700 265H800" class="flow"/><path d="M1040 265H1080V195H1120" class="branch"/><path d="M1080 265V415H1120" class="branch"/>
</svg>
