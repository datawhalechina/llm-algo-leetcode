<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">LoRA 与 QLoRA 的显存组成</title><desc id="desc">并列比较冻结权重、适配器训练状态与激活临时量。量化减少冻结权重，元数据和反量化还会占用空间；峰值取决于对象同时存在的时刻。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a;font-weight:400}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:15px;fill:#334155}.small{font-size:14px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="1080" height="520" fill="#f8fafc"/>
<text x="540" y="40" text-anchor="middle" class="title">低比特权重改变哪部分显存</text><text x="540" y="74" text-anchor="middle" class="small">按对象比较；框的大小用于分类，不代表实测字节数</text><rect x="40" y="105" width="450" height="95" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="265" y="135" text-anchor="middle" class="h">BF16 LoRA</text><text x="265" y="162" text-anchor="middle" class="b">冻结基础权重：BF16 存储</text><rect x="590" y="105" width="450" height="95" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="815" y="135" text-anchor="middle" class="h">NF4 QLoRA</text><text x="815" y="162" text-anchor="middle" class="b">冻结权重：NF4 编码 + 量化元数据</text><rect x="40" y="230" width="450" height="95" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="265" y="260" text-anchor="middle" class="h">适配器训练状态</text><text x="265" y="287" text-anchor="middle" class="b">可训练参数、梯度与优化器状态</text><rect x="590" y="230" width="450" height="95" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="815" y="260" text-anchor="middle" class="h">适配器训练状态</text><text x="815" y="287" text-anchor="middle" class="b">对应参数仍需梯度与优化器状态</text><rect x="40" y="355" width="450" height="110" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="265" y="385" text-anchor="middle" class="h">激活与临时量</text><text x="265" y="412" text-anchor="middle" class="b">由批次、长度及计算过程决定</text><text x="265" y="436" text-anchor="middle" class="b">峰值记录训练与验证中的同时驻留</text><rect x="590" y="355" width="450" height="110" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="815" y="385" text-anchor="middle" class="h">激活与临时量</text><text x="815" y="412" text-anchor="middle" class="b">还需观察反量化缓冲及精度处理</text><text x="815" y="436" text-anchor="middle" class="b">用实测峰值检查整体节省</text><text x="540" y="160" text-anchor="middle" class="small">权重表示</text><text x="540" y="286" text-anchor="middle" class="small">训练状态</text><text x="540" y="413" text-anchor="middle" class="small">实际峰值</text>
</svg>
