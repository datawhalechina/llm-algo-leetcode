<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 与 QLoRA 的训练状态账本</title>
  <desc id="desc">比较冻结基座、适配器、梯度优化器状态与激活，说明量化主要缩小冻结基座表示。</desc>
  <defs>
    <style>
      .title{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:25px;font-weight:700;fill:#172554}.group{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#1e3a8a}.label{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:17px;font-weight:600;fill:#0f172a}.small{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#334155}.line{stroke:#64748b;stroke-width:2.5;fill:none}.base{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.adapter{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.cost{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.quant{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
  <text x="540" y="38" text-anchor="middle" class="title">训练状态账本：LoRA 与 QLoRA 的差异</text>
  <text x="540" y="70" text-anchor="middle" class="small">量化主要改变冻结基座的表示，不会自动消除激活与适配器训练代价</text>
  <rect x="35" y="105" width="300" height="350" rx="16" class="base"/>
  <text x="185" y="140" text-anchor="middle" class="group">LoRA</text>
  <rect x="65" y="165" width="240" height="48" rx="10" class="base"/><text x="185" y="195" text-anchor="middle" class="label">冻结基座权重</text>
  <rect x="65" y="230" width="240" height="48" rx="10" class="adapter"/><text x="185" y="260" text-anchor="middle" class="label">可训练 Adapter</text>
  <rect x="65" y="295" width="240" height="48" rx="10" class="cost"/><text x="185" y="325" text-anchor="middle" class="label">梯度与优化器状态</text>
  <rect x="65" y="360" width="240" height="48" rx="10" class="cost"/><text x="185" y="390" text-anchor="middle" class="label">Activation</text>
  <rect x="390" y="105" width="300" height="350" rx="16" class="quant"/>
  <text x="540" y="140" text-anchor="middle" class="group">QLoRA</text>
  <rect x="420" y="165" width="240" height="48" rx="10" class="quant"/><text x="540" y="195" text-anchor="middle" class="label">NF4 / 低比特基座</text>
  <rect x="420" y="230" width="240" height="48" rx="10" class="adapter"/><text x="540" y="260" text-anchor="middle" class="label">可训练 Adapter</text>
  <rect x="420" y="295" width="240" height="48" rx="10" class="cost"/><text x="540" y="325" text-anchor="middle" class="label">梯度与优化器状态</text>
  <rect x="420" y="360" width="240" height="48" rx="10" class="cost"/><text x="540" y="390" text-anchor="middle" class="label">Activation</text>
  <line x1="335" y1="188" x2="390" y2="188" class="line" marker-end="url(#arrow)"/>
  <text x="362" y="178" text-anchor="middle" class="small">表示变化</text>
  <rect x="745" y="105" width="300" height="350" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="895" y="140" text-anchor="middle" class="group">共同需要核对</text>
  <text x="895" y="195" text-anchor="middle" class="label">显存上限</text>
  <text x="895" y="245" text-anchor="middle" class="label">吞吐下限</text>
  <text x="895" y="295" text-anchor="middle" class="label">验证质量</text>
  <text x="895" y="345" text-anchor="middle" class="label">证据来源</text>
  <text x="895" y="395" text-anchor="middle" class="small">estimated / measured</text>
  <line x1="690" y1="280" x2="745" y2="280" class="line" marker-end="url(#arrow)"/>
</svg>
