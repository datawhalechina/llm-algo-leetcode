<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">训练状态分片配对实验</title><desc id="desc">固定工作负载，比较DeepSpeed复制基线与ZeRO各阶段的耗时和显存。</desc><defs><marker markerUnits="userSpaceOnUse" id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><style>.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:24px;font-weight:500;fill:#0f172a}.s{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:500;fill:#334155}.n{stroke:#64748b;stroke-width:2;rx:14}.e{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1200" height="560" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" class="t">固定工作负载，只改变训练状态策略</text><g class="n"><rect x="70" y="110" width="230" height="110" fill="#dbeafe"/><rect x="365" y="80" width="220" height="85" fill="#dcfce7"/><rect x="365" y="190" width="220" height="85" fill="#dcfce7"/><rect x="365" y="300" width="220" height="85" fill="#dcfce7"/><rect x="650" y="135" width="220" height="150" fill="#fef3c7"/><rect x="935" y="135" width="195" height="150" fill="#f3e8ff"/></g><g text-anchor="middle"><text x="185" y="150" class="t">固定条件</text><text x="185" y="185" class="s">模型 · 批量 · 长度 · 精度</text><text x="475" y="115" class="t">复制基线</text><text x="475" y="225" class="t">ZeRO-1 / 2</text><text x="475" y="335" class="t">ZeRO-3</text><text x="760" y="175" class="t">原始测量</text><text x="760" y="210" class="s">每进程显存峰值</text><text x="760" y="242" class="s">最慢进程耗时</text><text x="1032" y="175" class="t">复测方向</text><text x="1032" y="212" class="s">容量与时间取舍</text></g><path class="e" d="M300 165H330V122H365"/><path class="e" d="M300 180H330V232H365"/><path class="e" d="M300 165H330V342H365"/><path class="e" d="M585 122H620V180H650"/><path class="e" d="M585 232H650"/><path class="e" d="M585 342H620V240H650"/><path class="e" d="M870 21