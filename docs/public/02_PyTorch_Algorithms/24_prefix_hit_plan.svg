<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">公共词元相同，不等于已有可复用的完整对象</title><desc id="desc">对照只登记长对象和另行登记短对象两种情况，同一请求的有效命中长度不同。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#365269}.box{stroke-width:2;rx:15}.edge{fill:none;stroke:#52657a;stroke-width:2.4;marker-end:url(#arrow)}</style></defs><rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" class="title">公共词元相同，不等于已有可复用的完整对象</text>
<rect x="40" y="130" width="320" height="115" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="200" y="162" text-anchor="middle" class="label">只登记 [1,2,3]</text><text x="200" y="191" text-anchor="middle" class="small">新请求 [1,2,9]</text>
<rect x="440" y="130" width="300" height="115" class="box" fill="#fff6e8" stroke="#c9852f"/><text x="590" y="162" text-anchor="middle" class="label">公共长度为 2</text><text x="590" y="191" text-anchor="middle" class="small">但没有完整的 [1,2] 对象</text>
<rect x="820" y="130" width="330" height="115" class="box" fill="#fff0ea" stroke="#c56f43"/><text x="985" y="162" text-anchor="middle" class="label">可复用长度为 0</text><text x="985" y="191" text-anchor="middle" class="small">仍需处理全部输入</text>
<rect x="40" y="320" width="320" height="115" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="200" y="352" text-anchor="middle" class="label">再登记 [1,2]</text><text x="200" y="381" text-anchor="middle" class="small">新请求仍是 [1,2,9]</text>
<rect x="440" y="320" width="300" height="115" class="box" fill="#eaf7ef" stroke="#4e8a68"/><text x="590" y="352" text-anchor="middle" class="label">完整对象匹配开头</text><text x="590" y="381" text-anchor="middle" class="small">复用前缀 [1,2]</text>
<rect x="820" y="320" width="330" height="115" class="box" fill="#eaf7ef" stroke="#4e8a68"/><text x="985" y="352" text-anchor="middle" class="label">命中长度为 2</text><text x="985" y="381" text-anchor="middle" class="small">未命中后缀 [9]</text>
<path d="M360 187H440" class="edge"/>
<path d="M740 187H820" class="edge"/>
<path d="M360 377H440" class="edge"/>
<path d="M740 377H820" class="edge"/>
<text x="600" y="490" text-anchor="middle" class="small">本页按完整对象登记；真实后端可按块或其他有效边界管理对象</text>
</svg>
