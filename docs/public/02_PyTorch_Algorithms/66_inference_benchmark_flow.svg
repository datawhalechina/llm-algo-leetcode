<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">单卡基线：固定输入，核对真实请求与逐轮统计</title><desc id="desc">模型与请求负载共同约束真实测量，身份、请求和统计完整时生成限定性引用；失败或缺失保留原始记录并修复或补采。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="failure" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:19px;fill:#475569}.node{rx:12;stroke:#94a3b8;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.failure{fill:none;stroke:#b45309;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#failure)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="40" y="50" class="title">单卡基线：固定输入，核对真实请求与逐轮统计</text>
<rect x="40" y="130" width="250" height="100" class="node" fill="#dbeafe"/><text x="165" y="169" text-anchor="middle" class="head">模型与测量身份</text><text x="165" y="202" text-anchor="middle" class="body">版本、精度与客户端口径</text>
<rect x="40" y="305" width="250" height="100" class="node" fill="#dbeafe"/><text x="165" y="344" text-anchor="middle" class="head">固定请求负载</text><text x="165" y="377" text-anchor="middle" class="body">顺序、长度与重复次数</text>
<rect x="410" y="225" width="260" height="100" class="node" fill="#dcfce7"/><text x="540" y="264" text-anchor="middle" class="head">真实服务逐轮采集</text><text x="540" y="297" text-anchor="middle" class="body">内容时间、停止与输出</text>
<rect x="770" y="225" width="260" height="100" class="node" fill="#fef3c7"/><text x="900" y="264" text-anchor="middle" class="head">核对完整性</text><text x="900" y="297" text-anchor="middle" class="body">身份、请求与统计</text>
<rect x="1160" y="130" width="290" height="100" class="node" fill="#ede9fe"/><text x="1305" y="169" text-anchor="middle" class="head">可引用基线</text><text x="1305" y="202" text-anchor="middle" class="body">仅限同身份、同协议</text>
<rect x="1160" y="315" width="290" height="100" class="node" fill="#ffedd5"/><text x="1305" y="354" text-anchor="middle" class="head">修复或补采</text><text x="1305" y="387" text-anchor="middle" class="body">保留失败与缺失记录</text>
<path d="M290 180H350V250H410" class="edge"/><path d="M290 355H330V300H410" class="edge"/><path d="M670 275H770" class="edge"/>
<path d="M1030 250H1090V180H1160" class="edge"/><text x="1045" y="228" class="note">完整</text>
<path d="M1030 300H1110V365H1160" class="failure"/><text x="1035" y="392" class="note">失败或缺失</text>
</svg>
