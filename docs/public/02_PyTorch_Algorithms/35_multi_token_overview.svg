<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">原生MTP的位置：候选来源、目标验证与下一轮推进</title>
<desc id="desc">上层并列比较独立草稿、原生MTP、EAGLE、DFlash、DSpark的候选来源，不表示执行顺序。下层展开原生MTP的上下文、内置预测模块、有序候选与目标计算；贪心验证和标准投机采样按各自规则形成接受前缀及修正或追加Token。提交后的输出更新下一轮上下文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="feedback-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:29px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#feedback-arrow)}</style></defs>
<rect width="1440" height="650" fill="#f8fafc" data-layout-role="decoration"/>
<text x="45" y="49" class="title" text-anchor="start">原生 MTP 在哪里：先看候选来源，再看验证与输出推进</text>
<text x="45" y="80" class="sub" text-anchor="start">不同方法改变候选的产生方式；提交哪些 Token，还取决于目标模型与解码规则。</text>
<text x="45" y="113" class="group" text-anchor="start">候选来源对照 · 并列方法</text>
<g id="independent-draft">
<rect x="45" y="130" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="160" y="156" class="head" text-anchor="middle">经典独立草稿模型</text>
<text x="160" y="180" class="body" text-anchor="middle">较小模型逐 Token 提议</text>
</g>
<g id="native-mtp-source">
<rect x="325" y="130" width="230" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="440" y="156" class="head" text-anchor="middle">原生 MTP · 本页重点</text>
<text x="440" y="180" class="body" text-anchor="middle">目标模型内置未来预测模块</text>
</g>
<g id="eagle-source">
<rect x="605" y="130" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="720" y="156" class="head" text-anchor="middle">EAGLE</text>
<text x="720" y="180" class="body" text-anchor="middle">利用目标特征产生候选</text>
</g>
<g id="dflash-source">
<rect x="885" y="130" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="1000" y="156" class="head" text-anchor="middle">DFlash</text>
<text x="1000" y="180" class="body" text-anchor="middle">块扩散草稿并行产生候选</text>
</g>
<g id="dspark-source">
<rect x="1165" y="130" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="1280" y="156" class="head" text-anchor="middle">DSpark</text>
<text x="1280" y="180" class="body" text-anchor="middle">半自回归生成＋置信度调度</text>
</g>
<text x="45" y="258" class="group" text-anchor="start">原生 MTP 的一轮推进 · 验证分支按解码规则二选一</text>
<g id="context">
<rect x="45" y="285" width="230" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="160" y="311" class="head" text-anchor="middle">当前已提交上下文</text>
<text x="160" y="335" class="body" text-anchor="middle">主模型状态与有效前缀</text>
</g>
<g id="mtp-modules">
<rect x="335" y="285" width="220" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="445" y="311" class="head" text-anchor="middle">内置 MTP 预测模块</text>
<text x="445" y="335" class="body" text-anchor="middle">复用状态，预测未来位置</text>
</g>
<g id="candidate-block">
<rect x="625" y="285" width="220" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="735" y="311" class="head" text-anchor="middle">有序候选块</text>
<text x="735" y="335" class="body" text-anchor="middle">按位置排列 c₁、…、cₖ</text>
<text x="735" y="356" class="body" text-anchor="middle">采样时保留草稿分布</text>
</g>
<g id="target-computation">
<rect x="915" y="285" width="220" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="1025" y="311" class="head" text-anchor="middle">目标模型计算</text>
<text x="1025" y="335" class="body" text-anchor="middle">按候选前缀求各位置分布</text>
</g>
<g id="greedy-rule">
<rect x="915" y="425" width="220" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="panel" data-layout-role="panel"/>
<text x="1025" y="451" class="head" text-anchor="middle">贪心验证</text>
<text x="1025" y="475" class="body" text-anchor="middle">逐位置比较目标首选 Token</text>
<text x="1025" y="496" class="body" text-anchor="middle">首次不同：用目标首选修正</text>
<text x="1025" y="517" class="body" text-anchor="middle">全部通过：追加目标 Token</text>
</g>
<g id="sampling-rule">
<rect x="625" y="425" width="220" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="panel" data-layout-role="panel"/>
<text x="735" y="451" class="head" text-anchor="middle">标准投机采样</text>
<text x="735" y="475" class="body" text-anchor="middle">按目标／草稿分布接受</text>
<text x="735" y="496" class="body" text-anchor="middle">拒绝时从修正分布采样</text>
<text x="735" y="517" class="body" text-anchor="middle">全部通过：追加目标采样</text>
</g>
<g id="commit-output">
<rect x="1195" y="440" width="210" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
<text x="1300" y="466" class="head" text-anchor="middle">提交本轮输出</text>
<text x="1300" y="490" class="body" text-anchor="middle">接受前缀＋修正或追加</text>
</g>
<path id="context-to-mtp" d="M275 325H335" class="flow"/>
<path id="mtp-to-candidates" d="M555 325H625" class="flow"/>
<path id="candidates-to-target" d="M845 325H915" class="flow"/>
<path id="target-to-greedy" d="M1025 365V425" class="flow"/>
<path id="target-to-sampling" d="M915 345H885V480H845" class="flow"/>
<path id="greedy-to-commit" d="M1135 480H1195" class="flow"/>
<path id="sampling-to-commit" d="M735 535V565H1300V520" class="flow"/>
<path id="commit-to-next-context" d="M1405 480H1420V615H15V325H45" class="feedback"/>
<text x="390" y="605" class="sub" text-anchor="start">已提交 Token 更新上下文；下一轮沿有效前缀继续生成</text></svg>
