<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">Attention反向的两条支路</title>
<desc id="desc">输出梯度dO分别参与dV与dP计算。dP穿过Softmax生成dS，再分成dQ与dK。各节点标注前向保存的操作数。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#475569}
.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}
.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1240" height="600" fill="#f8fafc" data-layout-role="decoration"/>
<text x="48" y="48" text-anchor="start" class="title">dO先分两支，再沿Softmax回到Q与K</text>
<text x="48" y="78" text-anchor="start" class="sub">单头等长示例 · 省略batch维 · Q、K、V、dO：N × d；P、dP、dS：N × N</text>
<rect x="48" y="260" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="143" y="289" text-anchor="middle" class="head">输出梯度 dO</text>
<text x="143" y="315" text-anchor="middle" class="body">来自上游损失</text>
<rect x="310" y="130" width="230" height="80" class="node" fill="#dcfce7" stroke="#16a34a"/>
<text x="425" y="159" text-anchor="middle" class="head">Value梯度 dV</text>
<text x="425" y="185" text-anchor="middle" class="body">dV = Pᵀ · dO</text>
<rect x="310" y="350" width="230" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="425" y="379" text-anchor="middle" class="head">概率梯度 dP</text>
<text x="425" y="405" text-anchor="middle" class="body">dP = dO · Vᵀ</text>
<rect x="620" y="350" width="250" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="745" y="379" text-anchor="middle" class="head">打分梯度 dS</text>
<text x="745" y="405" text-anchor="middle" class="body">dS = P ⊙ (dP − c)</text>
<rect x="952" y="240" width="240" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1072" y="269" text-anchor="middle" class="head">Query梯度 dQ</text>
<text x="1072" y="295" text-anchor="middle" class="body">dQ = dS · K · scale</text>
<rect x="952" y="440" width="240" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1072" y="469" text-anchor="middle" class="head">Key梯度 dK</text>
<text x="1072" y="495" text-anchor="middle" class="body">dK = dSᵀ · Q · scale</text>
<path id="dO-to-dV" d="M238 280H270V170H310" class="flow"/>
<path id="dO-to-dP" d="M238 320H270V390H310" class="flow"/>
<path id="dP-to-dS" d="M540 390H620" class="flow"/>
<path id="dS-to-dQ" d="M870 372H910V280H952" class="flow"/>
<path id="dS-to-dK" d="M870 408H910V480H952" class="flow"/>
<text x="425" y="111" text-anchor="middle" class="small">读取保存的 P</text>
<text x="425" y="458" text-anchor="middle" class="small">读取保存的 V</text>
<text x="745" y="458" text-anchor="middle" class="small">读取保存的 P</text>
<text x="1072" y="221" text-anchor="middle" class="small">读取 K 与 scale</text>
<text x="1072" y="548" text-anchor="middle" class="small">读取 Q 与 scale</text>
<text x="620" y="548" text-anchor="middle" class="body">cᵢ = Σⱼ Pᵢⱼ dPᵢⱼ；沿行广播</text>
<text x="620" y="575" text-anchor="middle" class="small">⊙：逐元素乘法；scale = 1 / √d</text>
</svg>
