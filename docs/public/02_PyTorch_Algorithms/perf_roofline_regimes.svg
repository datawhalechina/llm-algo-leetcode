<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">算术强度与 Roofline 资源区间</title>
  <desc id="desc">低算术强度候选受带宽上界约束，高算术强度候选受计算上界约束；落在屋顶线下方的候选还存在执行效率缺口。</desc>
  <defs>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .label{font-family:"Noto Sans CJK SC",sans-serif;font-size:17px;font-weight:700;fill:#172033}.text{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#475569}.small{font-family:"Noto Sans CJK SC",sans-serif;font-size:13px;fill:#334155}
      .axis{stroke:#475569;stroke-width:3}.roof{fill:none;stroke:#2563eb;stroke-width:6;stroke-linecap:round}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">算术强度决定理论资源区间</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">双对数示意，无数值刻度：横轴定位资源区间，纵向差距仍需结合执行过程分析</text>
  <path d="M155 500H1090" class="axis"/><path d="M155 500V118" class="axis"/>
  <text x="1090" y="550" text-anchor="end" class="label">算术强度（FLOPs / Byte，对数）</text>
  <text x="50" y="310" text-anchor="middle" class="label" transform="rotate(-90 50 310)">计算吞吐（FLOPs/s，对数）</text>

  <path d="M185 470L650 180H1040" class="roof"/>
  <line x1="650" y1="180" x2="650" y2="500" class="guide"/>
  <rect x="245" y="142" width="245" height="86" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="368" y="178" text-anchor="middle" class="label">带宽约束区间</text><text x="368" y="202" text-anchor="middle" class="small">减少搬运或提高数据复用</text>
  <rect x="780" y="96" width="245" height="72" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="903" y="132" text-anchor="middle" class="label">计算约束区间</text><text x="903" y="156" text-anchor="middle" class="small">减少运算或提高计算效率</text>
  <text x="665" y="524" class="small">机器平衡点</text>

  <circle cx="370" cy="375" r="11" fill="#dc2626"/><path d="M381 375L430 390" stroke="#dc2626" stroke-width="2"/>
  <rect x="430" y="363" width="205" height="86" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="533" y="400" text-anchor="middle" class="label">候选 A</text><text x="533" y="423" text-anchor="middle" class="small">低强度，接近带宽屋顶</text>

  <circle cx="830" cy="285" r="11" fill="#7c3aed"/><path d="M841 280L910 250" stroke="#7c3aed" stroke-width="2"/>
  <rect x="910" y="202" width="220" height="86" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="1020" y="239" text-anchor="middle" class="label">候选 B</text><text x="1020" y="262" text-anchor="middle" class="small">高强度，低于计算屋顶</text>
</svg>
