<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">梯度裁剪、优化器变换与参数相对位移</title><desc id="desc">无动量无权重衰减的SGD构造例：梯度3、4范数5，阈值1得到裁剪系数0.2和梯度0.6、0.8。学习率0.1得到参数位移负0.06、负0.08，范数0.1。更新前参数3、4范数5时相对位移约0.02。阈值、学习率与优化器状态分别作为变换条件，更新前参数用于归一化。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="500" fill="#f8fafc" data-layout-role="decoration"/>
<text x="45" y="48" class="title" text-anchor="start">从梯度到参数位移：裁剪、学习率和优化器各改变什么？</text>
<text x="45" y="80" class="sub" text-anchor="start">无动量、无权重衰减的SGD构造例；其他优化器需结合状态核对实际位移。</text>
<g id="clip-threshold">
<rect x="305" y="110" width="190" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="400" y="137" class="head" text-anchor="middle">裁剪阈值 m</text>
<text x="400" y="163" class="body" text-anchor="middle">本例m=1</text>
</g>
<g id="optimizer-conditions">
<rect x="555" y="110" width="210" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="660" y="137" class="head" text-anchor="middle">学习率／优化器状态</text>
<text x="660" y="163" class="body" text-anchor="middle">本例SGD：η=0.1</text>
</g>
<g id="reference-parameters">
<rect x="825" y="110" width="230" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="940" y="137" class="head" text-anchor="middle">更新前参数 θ</text>
<text x="940" y="163" class="body" text-anchor="middle">θ=(3,4)，‖θ‖=5</text>
</g>
<g id="raw-gradient">
<rect x="55" y="220" width="190" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="150" y="247" class="head" text-anchor="middle">原始梯度 g</text>
<text x="150" y="273" class="body" text-anchor="middle">g=(3,4)，‖g‖=5</text>
</g>
<g id="clipped-gradient">
<rect x="305" y="220" width="190" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="400" y="247" class="head" text-anchor="middle">全局范数裁剪</text>
<text x="400" y="273" class="body" text-anchor="middle">c=0.2</text>
<text x="400" y="298" class="body" text-anchor="middle">g̃=(0.6,0.8)</text>
</g>
<g id="optimizer-transform">
<rect x="555" y="220" width="210" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
<text x="660" y="247" class="head" text-anchor="middle">优化器形成更新</text>
<text x="660" y="273" class="body" text-anchor="middle">SGD：Δθ=−ηg̃</text>
</g>
<g id="parameter-delta">
<rect x="825" y="220" width="230" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="940" y="247" class="head" text-anchor="middle">实际参数位移 Δθ</text>
<text x="940" y="273" class="body" text-anchor="middle">Δθ=(−0.06,−0.08)</text>
<text x="940" y="298" class="body" text-anchor="middle">‖Δθ‖=0.1</text>
</g>
<g id="relative-motion">
<rect x="825" y="365" width="230" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="node"/>
<text x="940" y="392" class="head" text-anchor="middle">相对更新幅度 ρ</text>
<text x="940" y="418" class="body" text-anchor="middle">‖Δθ‖/(‖θ‖+ε)≈0.02</text>
</g>
<path id="gradient-to-clipping" d="M245 270H305" class="flow"/>
<path id="threshold-to-clipping" d="M400 180V220" class="flow"/>
<path id="clipping-to-optimizer" d="M495 270H555" class="flow"/>
<path id="conditions-to-optimizer" d="M660 180V220" class="flow"/>
<path id="optimizer-to-delta" d="M765 270H825" class="flow"/>
<path id="delta-to-relative-motion" d="M940 320V365" class="flow"/>
<path id="parameter-reference-to-relative-motion" d="M1055 145H1120V405H1055" class="flow"/>
<text x="55" y="385" class="body" text-anchor="start">联合记录有限值、梯度范数、裁剪系数与参数位移。</text>
<text x="55" y="420" class="body" text-anchor="start">这些量定位本次更新；任务质量交给独立评测判断。</text></svg>
