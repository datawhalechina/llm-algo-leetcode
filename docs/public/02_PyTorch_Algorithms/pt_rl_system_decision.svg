<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">先检查执行条件，再比较容量与传输预算</title><desc id="desc">候选角色映射分别形成显存、阶段容量和跨池传输账本；显存、版本和恢复决定拒绝条件，队列与暴露预算决定是否调整。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.label{font-size:14px;fill:#475569}</style></defs>
<rect width="1400" height="620" fill="#f8fafc"/><text x="700" y="42" text-anchor="middle" class="title">先检查执行条件，再比较容量与传输预算</text>
<rect id="deployment" x="45" y="245" width="220" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="155" y="279" text-anchor="middle" class="head">候选角色安排</text><text x="155" y="306" text-anchor="middle" class="body">共置 / 分离 / 混合</text><text x="155" y="330" text-anchor="middle" class="body">版本确认与恢复条件</text>
<rect id="memory" x="350" y="110" width="240" height="100" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="470" y="144" text-anchor="middle" class="head">资源池显存</text><text x="470" y="171" text-anchor="middle" class="body">实际峰值或给定预算</text>
<rect id="rate" x="350" y="270" width="240" height="100" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="470" y="304" text-anchor="middle" class="head">等价阶段容量</text><text x="470" y="331" text-anchor="middle" class="body">统一单位，再算队列余量</text>
<rect id="transfer" x="350" y="430" width="240" height="100" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="470" y="464" text-anchor="middle" class="head">跨池传输</text><text x="470" y="491" text-anchor="middle" class="body">共享域相加，独立域取最大</text>
<rect id="required" x="700" y="120" width="260" height="110" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="830" y="154" text-anchor="middle" class="head">执行先决条件</text><text x="830" y="181" text-anchor="middle" class="body">显存不超限 · 版本已确认</text><text x="830" y="205" text-anchor="middle" class="body">恢复路径可用</text>
<rect id="pressure" x="700" y="355" width="260" height="110" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="830" y="389" text-anchor="middle" class="head">容量与暴露预算</text><text x="830" y="416" text-anchor="middle" class="body">各阶段余量非负</text><text x="830" y="440" text-anchor="middle" class="body">传输暴露占用在预算内</text>
<rect id="reject" x="1050" y="110" width="290" height="90" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="1195" y="144" text-anchor="middle" class="head">拒绝 reject</text><text x="1195" y="171" text-anchor="middle" class="body">记录执行条件失败项</text>
<rect id="tune" x="1050" y="280" width="290" height="90" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="1195" y="314" text-anchor="middle" class="head">调整 tune</text><text x="1195" y="341" text-anchor="middle" class="body">调整积压阶段或关键链路</text>
<rect id="accept" x="1050" y="450" width="290" height="90" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="1195" y="484" text-anchor="middle" class="head">保留测量候选 accept</text><text x="1195" y="511" text-anchor="middle" class="body">按当前账本进入实际测量</text>
<path class="edge" d="M265 270 H300 V160 H350" data-source="deployment" data-target="memory"/>
<path class="edge" d="M265 305 H350" data-source="deployment" data-target="rate"/>
<path class="edge" d="M265 340 H300 V480 H350" data-source="deployment" data-target="transfer"/>
<path class="edge" d="M155 245 V80 H830 V120" data-source="deployment" data-target="required"/>
<text x="740" y="70" text-anchor="middle" class="label">版本与恢复</text>
<path class="edge" d="M590 160 H700" data-source="memory" data-target="required"/>
<path class="edge" d="M590 320 H650 V390 H700" data-source="rate" data-target="pressure"/>
<path class="edge" d="M590 480 H660 V440 H700" data-source="transfer" data-target="pressure"/>
<path class="edge" d="M830 230 V355" data-source="required" data-target="pressure"/>
<text x="848" y="300" class="label">通过</text>
<path class="edge" d="M960 165 H1050" data-source="required" data-target="reject"/>
<text x="985" y="151" class="label">失败</text>
<path class="edge" d="M960 385 H1000 V325 H1050" data-source="pressure" data-target="tune"/>
<text x="985" y="305" class="label">超限</text>
<path class="edge" d="M960 435 H1000 V495 H1050" data-source="pressure" data-target="accept"/>
<text x="978" y="525" class="label">预算内</text>
</svg>
