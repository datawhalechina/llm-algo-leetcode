<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">蒸馏学生交付项目的三组实验</title>
  <desc id="desc">冻结教师与同一学生起点形成学生基线、固定轨迹蒸馏和在线策略蒸馏三组实验，最后进入统一评测与交付判断。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #334155; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .guide { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="60" y="52" class="title">同一起点、三组实验、同一交付门槛</text>

  <rect x="60" y="92" width="230" height="112" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="175" y="126" text-anchor="middle" class="label">冻结教师</text>
  <text x="175" y="157" text-anchor="middle" class="body">提供 token 分布</text>
  <text x="175" y="181" text-anchor="middle" class="small">仅监督，不参与更新</text>

  <rect x="60" y="354" width="230" height="112" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="175" y="388" text-anchor="middle" class="label">学生共同起点</text>
  <text x="175" y="419" text-anchor="middle" class="body">同一 checkpoint</text>
  <text x="175" y="443" text-anchor="middle" class="small">同一数据与训练预算</text>

  <rect x="390" y="86" width="270" height="112" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="525" y="120" text-anchor="middle" class="label">G0 · 学生基线</text>
  <text x="525" y="151" text-anchor="middle" class="body">不使用教师分布</text>
  <text x="525" y="175" text-anchor="middle" class="small">得到质量与成本下界</text>

  <rect x="390" y="224" width="270" height="112" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="525" y="258" text-anchor="middle" class="label">G1 · 固定轨迹 KD</text>
  <text x="525" y="289" text-anchor="middle" class="body">固定数据上的教师反馈</text>
  <text x="525" y="313" text-anchor="middle" class="small">隔离反馈收益与采样变化</text>

  <rect x="390" y="362" width="270" height="112" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="396" text-anchor="middle" class="label">G2 · On-policy 蒸馏</text>
  <text x="525" y="427" text-anchor="middle" class="body">学生生成轨迹，教师评分</text>
  <text x="525" y="451" text-anchor="middle" class="small">检验分布匹配的增量收益</text>

  <rect x="770" y="177" width="190" height="206" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="865" y="215" text-anchor="middle" class="label">统一冻结评测</text>
  <text x="865" y="253" text-anchor="middle" class="body">质量</text>
  <text x="865" y="282" text-anchor="middle" class="body">模型大小</text>
  <text x="865" y="311" text-anchor="middle" class="body">延迟与吞吐</text>
  <text x="865" y="340" text-anchor="middle" class="body">产物可加载性</text>

  <rect x="1030" y="224" width="130" height="112" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1095" y="266" text-anchor="middle" class="label">交付判断</text>
  <text x="1095" y="298" text-anchor="middle" class="body">选择学生候选</text>

  <path d="M290 410 H350 V142 H390" class="edge"/>
  <path d="M350 280 H390" class="edge"/>
  <path d="M350 418 H390" class="edge"/>
  <path d="M290 148 H330 V280 H390" class="guide"/>
  <path d="M330 148 V418 H390" class="guide"/>
  <path d="M660 142 H715 V230 H770" class="edge"/>
  <path d="M660 280 H770" class="edge"/>
  <path d="M660 418 H715 V330 H770" class="edge"/>
  <path d="M960 280 H1030" class="edge"/>
</svg>
