<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">从同一学生起点比较固定轨迹与在线蒸馏</title>
  <desc id="desc">学生共同起点分别进入训练前、固定轨迹、在线轨迹三组；同题比较质量、文件大小和延迟，教师分数作为参照。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="45" y="52" class="title">从同一学生起点比较固定轨迹与在线蒸馏</text>
  <rect x="55" y="230" width="220" height="110" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="165" y="264" text-anchor="middle" class="label">共同学生起点</text>
  <text x="165" y="294" text-anchor="middle" class="body">相同初始模型版本</text>
  <text x="165" y="320" text-anchor="middle" class="body">固定训练与评测数据</text>
  <rect x="410" y="105" width="290" height="100" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="555" y="139" text-anchor="middle" class="label">G0：训练前学生</text>
  <text x="555" y="169" text-anchor="middle" class="body">保留质量与成本基线</text>
  <rect x="410" y="245" width="290" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="555" y="279" text-anchor="middle" class="label">G1：固定轨迹</text>
  <text x="555" y="309" text-anchor="middle" class="body">参考答案前缀＋教师分布</text>
  <rect x="410" y="385" width="290" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="419" text-anchor="middle" class="label">G2：在线轨迹</text>
  <text x="555" y="449" text-anchor="middle" class="body">学生采样前缀＋教师分布</text>
  <rect x="840" y="200" width="300" height="210" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="990" y="234" text-anchor="middle" class="label">同题、同协议比较</text>
  <text x="990" y="264" text-anchor="middle" class="body">候选相对 G0 的质量变化</text>
  <text x="990" y="290" text-anchor="middle" class="body">候选相对教师的质量保持</text>
  <text x="990" y="316" text-anchor="middle" class="body">模型文件大小与重复延迟</text>
  <text x="990" y="342" text-anchor="middle" class="body">文件校验与重新加载</text>
  <path d="M275 250 H330 V155 H410" class="edge"/>
  <path d="M275 285 H410" class="edge"/>
  <path d="M275 320 H355 V435 H410" class="edge"/>
  <path d="M700 155 H765 V240 H840" class="edge"/>
  <path d="M700 295 H840" class="edge"/>
  <path d="M700 435 H785 V370 H840" class="edge"/>
  <text x="55" y="530" class="small">混合路线另行保存固定轨迹阶段的模型，再从该模型继续在线训练；教师得分是当前题集参照。</text>
</svg>
