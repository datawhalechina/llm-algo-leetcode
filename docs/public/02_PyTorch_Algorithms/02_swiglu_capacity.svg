<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">标准FFN与SwiGLU的等参数容量</title><desc id="desc">取D384，标准FFN中间维1536有两块589824参数，SwiGLU中间维1024有三块393216参数，总量都为1179648。条宽与参数量成比例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">同一参数预算：两块较宽的投影，换成三块较窄的投影</text>
<text x="55" y="80" class="sub" text-anchor="start">取D=384，忽略bias；下方条宽与参数量成比例，表示容量而非执行耗时。</text>
<text x="55" y="210" class="head" text-anchor="start">标准FFN</text>
<text x="55" y="238" class="body" text-anchor="start">H=4D=1536</text>
<g data-layout-role="glyph-group"><rect data-count="589824" x="390" y="185" width="360" height="65" fill="#dbeafe" stroke="#2563eb"/><text x="570" y="170" class="body" text-anchor="middle">up：384→1536</text>
<text x="570" y="225" class="head" text-anchor="middle">589,824</text>
</g>
<g data-layout-role="glyph-group"><rect data-count="589824" x="750" y="185" width="360" height="65" fill="#ede9fe" stroke="#7c3aed"/><text x="930" y="170" class="body" text-anchor="middle">down：1536→384</text>
<text x="930" y="225" class="head" text-anchor="middle">589,824</text>
</g>
<rect x="1160" y="185" width="280" height="65" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="1300" y="212" class="small" text-anchor="middle">参数总量</text>
<text x="1300" y="237" class="head" text-anchor="middle">1,179,648</text>
<text x="55" y="350" class="head" text-anchor="start">SwiGLU</text>
<text x="55" y="378" class="body" text-anchor="start">H=8D/3=1024</text>
<g data-layout-role="glyph-group"><rect data-count="393216" x="390" y="325" width="240" height="65" fill="#dbeafe" stroke="#2563eb"/><text x="510" y="310" class="body" text-anchor="middle">gate：384→1024</text>
<text x="510" y="365" class="head" text-anchor="middle">393,216</text>
</g>
<g data-layout-role="glyph-group"><rect data-count="393216" x="630" y="325" width="240" height="65" fill="#ede9fe" stroke="#7c3aed"/><text x="750" y="310" class="body" text-anchor="middle">up：384→1024</text>
<text x="750" y="365" class="head" text-anchor="middle">393,216</text>
</g>
<g data-layout-role="glyph-group"><rect data-count="393216" x="870" y="325" width="240" height="65" fill="#dcfce7" stroke="#15803d"/><text x="990" y="310" class="body" text-anchor="middle">down：1024→384</text>
<text x="990" y="365" class="head" text-anchor="middle">393,216</text>
</g>
<rect x="1160" y="325" width="280" height="65" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="1300" y="352" class="small" text-anchor="middle">参数总量</text>
<text x="1300" y="377" class="head" text-anchor="middle">1,179,648</text>
<text x="55" y="442" class="sub" text-anchor="start">本例1024恰为256的倍数；一般实现还会将理论中间维向上对齐到指定倍数。</text>
</svg>
