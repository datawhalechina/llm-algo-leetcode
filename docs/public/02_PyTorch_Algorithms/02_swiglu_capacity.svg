<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">标准 FFN 与 SwiGLU 的容量对齐</title><desc id="desc">展示标准 FFN 两个投影与 SwiGLU 三个投影的参数账本，并解释为何需要缩小 SwiGLU 的中间维。</desc>
  <defs><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 18px sans-serif;fill:#0f172a}.b{font:500 15px sans-serif;fill:#334155}.box{stroke-width:2.5;rx:18}.a{stroke:#64748b;stroke-width:3.5;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="560" fill="#f8fafc"/><text x="55" y="58" class="t">门控增加一条投影：中间维需要重新分配</text><text x="55" y="88" class="s">对比的目标是相近参数预算，而不是把 SwiGLU 的中间维机械设为标准 FFN 的 4D。</text>
  <rect x="80" y="150" width="500" height="310" class="box" fill="#eff6ff" stroke="#2563eb"/><text x="110" y="192" class="h">标准 FFN</text><text x="110" y="224" class="b">up: D → 4D</text><text x="110" y="252" class="b">activation: 4D → 4D</text><text x="110" y="280" class="b">down: 4D → D</text><rect x="110" y="330" width="360" height="74" class="box" fill="#dbeafe" stroke="#60a5fa"/><text x="135" y="362" class="h">约 2 × D × 4D = 8D² 参数</text><text x="135" y="388" class="b">两次矩阵投影构成容量基线</text>
  <rect x="820" y="150" width="500" height="310" class="box" fill="#f5f3ff" stroke="#7c3aed"/><text x="850" y="192" class="h">SwiGLU</text><text x="850" y="224" class="b">gate: D → H；up: D → H</text><text x="850" y="252" class="b">SiLU(gate) × up: H</text><text x="850" y="280" class="b">down: H → D</text><rect x="850" y="330" width="360" height="74" class="box" fill="#ede9fe" stroke="#a78bfa"/><text x="875" y="362" class="h">约 3 × D × H ≈ 8D²</text><text x="875" y="388" class="b">因此 H ≈ 8D / 3，再按倍数对齐</text>
  <path d="M580 305H820" class="a"/><text x="630" y="280" class="b">保持相近参数预算</text>
  <text x="90" y="515" class="s">`multiple_of` 只是在理论 H 的基础上调整形状；它不会改变“门控新增分支，所以容量需要重分配”的原因。</text>
</svg>
