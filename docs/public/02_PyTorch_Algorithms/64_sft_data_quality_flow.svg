<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SFT 数据从来源到训练快照的准入链路</title>
  <desc id="desc">数据固定来源与序列协议，收集监督事实，再清洗切分并检查重复和任务重合，形成准入结果。</desc>
  <defs>
    <marker id="neutral" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="green" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker>
    <marker id="red" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <marker id="amber" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:20px;font-weight:700}.body{font-size:16px;fill:#334155}.neutral,.green,.red,.amber{fill:none;stroke-width:3}.neutral{stroke:#475569;marker-end:url(#neutral)}.green{stroke:#16a34a;marker-end:url(#green)}.red{stroke:#dc2626;marker-end:url(#red)}.amber{stroke:#d97706;marker-end:url(#amber)}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" class="title">从原始数据到可训练快照</text>
  <text x="600" y="73" text-anchor="middle" class="sub">样本身份与序列协议共同限定准入结果的适用范围</text>

  <rect x="55" y="130" width="235" height="125" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="172" y="169" text-anchor="middle" class="head">身份登记</text>
  <text x="172" y="203" text-anchor="middle" class="body">来源版本 · 样本身份</text>
  <text x="172" y="230" text-anchor="middle" class="body">审计规则版本</text>

  <rect x="330" y="130" width="235" height="125" rx="16" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text x="447" y="169" text-anchor="middle" class="head">序列与监督审计</text>
  <text x="447" y="203" text-anchor="middle" class="body">固定模板与分词器</text>
  <text x="447" y="230" text-anchor="middle" class="body">监督词元 · 截断</text>

  <rect x="605" y="130" width="235" height="125" rx="16" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="722" y="169" text-anchor="middle" class="head">清洗与切分</text>
  <text x="722" y="203" text-anchor="middle" class="body">清洗后固定随机切分</text>
  <text x="722" y="230" text-anchor="middle" class="body">检查重复与跨集重合</text>

  <rect x="880" y="130" width="265" height="125" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1012" y="169" text-anchor="middle" class="head">准入交付</text>
  <text x="1012" y="203" text-anchor="middle" class="body">失败项与修复动作</text>
  <text x="1012" y="230" text-anchor="middle" class="body">数据快照与准入清单</text>

  <path class="neutral" d="M290 192 H320"/><path class="neutral" d="M565 192 H595"/><path class="neutral" d="M840 192 H870"/>

  <rect x="250" y="340" width="210" height="90" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="355" y="375" text-anchor="middle" class="head">reject｜阻断项</text><text x="355" y="405" text-anchor="middle" class="body">修复后重新审计</text>
  <rect x="495" y="340" width="210" height="90" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="375" text-anchor="middle" class="head">tune｜可修复项</text><text x="600" y="405" text-anchor="middle" class="body">清洗或调整长度</text>
  <rect x="740" y="340" width="210" height="90" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="845" y="375" text-anchor="middle" class="head">accept｜全部通过</text><text x="845" y="405" text-anchor="middle" class="body">冻结训练快照</text>
  <path class="red" d="M950 255 V285 H355 V330"/><path class="amber" d="M1012 255 V300 H600 V330"/><path class="green" d="M1075 255 V315 H845 V330"/>
</svg>
