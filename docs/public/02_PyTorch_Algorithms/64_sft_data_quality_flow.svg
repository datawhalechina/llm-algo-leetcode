<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">SFT 数据检查、清洗与重新切分</title><desc id="desc">记录来源后分别保存原始检查、清洗切分和最终检查。最终决定分成拒绝、待修复和接受，接受后固定成员清单。</desc><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:400;fill:#0f172a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#334155}.small{font-size:15px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="43" text-anchor="middle" class="title">先检查原始数据，清洗与切分后再检查</text><text x="600" y="76" text-anchor="middle" class="small">同一分词和长度规则用于两次检查；原始与最终结果分别保存</text><rect x="40" y="125" width="240" height="130" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="160" y="158" text-anchor="middle" class="h">记录来源</text><text x="160" y="188" text-anchor="middle" class="b">数据提交与原始行号</text><text x="160" y="213" text-anchor="middle" class="b">分词器、模板与长度</text><rect x="330" y="125" width="240" height="130" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="450" y="158" text-anchor="middle" class="h">保存原始检查</text><text x="450" y="188" text-anchor="middle" class="b">空内容、重复与截断</text><text x="450" y="213" text-anchor="middle" class="b">回答和结束标记监督数</text><rect x="620" y="125" width="240" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="740" y="158" text-anchor="middle" class="h">清洗与切分</text><text x="740" y="188" text-anchor="middle" class="b">去掉空内容与完整重复</text><text x="740" y="213" text-anchor="middle" class="b">保留样本打乱后切分</text><rect x="910" y="125" width="250" height="130" rx="14" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/><text x="1035" y="158" text-anchor="middle" class="h">重新检查</text><text x="1035" y="188" text-anchor="middle" class="b">监督、重复与两侧任务</text><text x="1035" y="213" text-anchor="middle" class="b">汇总全部未通过项</text><path class="flow" d="M280 190 H330"/><path class="flow" d="M570 190 H620"/><path class="flow" d="M860 190 H910"/><rect x="100" y="365" width="260" height="110" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="230" y="398" text-anchor="middle" class="h">拒绝：先修内容或切分</text><text x="230" y="428" text-anchor="middle" class="b">空内容、零监督、任务重合</text><text x="230" y="453" text-anchor="middle" class="b">或验证数量不足</text><rect x="470" y="365" width="260" height="110" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="600" y="398" text-anchor="middle" class="h">待修复：重复或截断超限</text><text x="600" y="428" text-anchor="middle" class="b">其他检查通过</text><text x="600" y="453" text-anchor="middle" class="b">去重或调整长度再检查</text><rect x="840" y="365" width="260" height="110" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="970" y="398" text-anchor="middle" class="h">接受：保存数据清单</text><text x="970" y="428" text-anchor="middle" class="b">全部门槛通过</text><text x="970" y="453" text-anchor="middle" class="b">固定训练与验证成员</text><path class="flow" d="M985 255 V295 H230 V365"/><path class="flow" d="M1040 255 V315 H600 V365"/><path class="flow" d="M1100 255 V335 H970 V365"/>
</svg>
