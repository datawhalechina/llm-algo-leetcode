<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">Attention 前向状态与反向梯度总览</title>
  <desc id="desc">上方展示查询、键和值形成 Attention 输出与损失的前向路径，中间列出反向所需的保存状态，下方展示输出梯度依次形成值、概率、打分以及查询和键梯度的反向路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="blueArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563eb"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#dc2626"/>
    </marker>
    <style>
      .title{font:700 27px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}
      .group{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}
      .label{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}
      .small{font:500 13px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}
      .hint{font:600 12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .box{stroke-width:2.5}
      .forward{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#blueArrow)}
      .backward{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#redArrow)}
      .state-link{stroke:#65a30d;stroke-width:2.5;stroke-dasharray:7 5;fill:none}
    </style>
  </defs>

  <rect width="1240" height="600" fill="url(#bg)"/>
  <text x="48" y="48" class="title">Attention backward：保存什么，梯度就从哪里取数</text>
  <text x="48" y="76" class="sub">蓝色为前向数值流，绿色为保存状态，红色为反向梯度流</text>

  <text x="48" y="116" class="group">前向：得到输出并保留反向所需状态</text>
  <rect x="48" y="136" width="164" height="68" rx="14" fill="#fff7ed" stroke="#f59e0b" class="box"/>
  <text x="130" y="164" text-anchor="middle" class="label">Query / Key</text>
  <text x="130" y="187" text-anchor="middle" class="small">Q、K</text>

  <rect x="260" y="136" width="164" height="68" rx="14" fill="#eff6ff" stroke="#3b82f6" class="box"/>
  <text x="342" y="164" text-anchor="middle" class="label">缩放打分</text>
  <text x="342" y="187" text-anchor="middle" class="small">S = QKᵀ / √d</text>

  <rect x="472" y="136" width="164" height="68" rx="14" fill="#f5f3ff" stroke="#8b5cf6" class="box"/>
  <text x="554" y="164" text-anchor="middle" class="label">概率矩阵</text>
  <text x="554" y="187" text-anchor="middle" class="small">P = Softmax(S)</text>

  <rect x="472" y="224" width="164" height="60" rx="14" fill="#fff7ed" stroke="#f59e0b" class="box"/>
  <text x="554" y="250" text-anchor="middle" class="label">Value</text>
  <text x="554" y="271" text-anchor="middle" class="small">V</text>

  <rect x="700" y="136" width="164" height="68" rx="14" fill="#ecfccb" stroke="#65a30d" class="box"/>
  <text x="782" y="164" text-anchor="middle" class="label">Attention 输出</text>
  <text x="782" y="187" text-anchor="middle" class="small">O = PV</text>

  <rect x="912" y="136" width="164" height="68" rx="14" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="994" y="164" text-anchor="middle" class="label">下游损失</text>
  <text x="994" y="187" text-anchor="middle" class="small">产生 dO</text>

  <path d="M212 170H260" class="forward"/>
  <path d="M424 170H472" class="forward"/>
  <path d="M636 170H700" class="forward"/>
  <path d="M864 170H912" class="forward"/>
  <path d="M636 254H666Q682 254 682 238V186Q682 170 700 170" class="forward"/>

  <rect x="260" y="242" width="164" height="54" rx="12" fill="#f7fee7" stroke="#65a30d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="342" y="264" text-anchor="middle" class="label">保存状态</text>
  <text x="342" y="284" text-anchor="middle" class="small">Q、K、V、P、scale</text>
  <path d="M342 204V242" class="state-link"/>

  <text x="48" y="352" class="group">反向：dO 分成两支，再沿 Softmax 与打分链返回输入</text>
  <rect x="48" y="410" width="134" height="68" rx="14" fill="#fff1f2" stroke="#e11d48" class="box"/>
  <text x="115" y="438" text-anchor="middle" class="label">输出梯度</text>
  <text x="115" y="461" text-anchor="middle" class="small">dO</text>

  <rect x="242" y="366" width="146" height="68" rx="14" fill="#eff6ff" stroke="#3b82f6" class="box"/>
  <text x="315" y="394" text-anchor="middle" class="label">Value 梯度</text>
  <text x="315" y="417" text-anchor="middle" class="small">dV = PᵀdO</text>

  <rect x="242" y="470" width="146" height="68" rx="14" fill="#eff6ff" stroke="#3b82f6" class="box"/>
  <text x="315" y="498" text-anchor="middle" class="label">概率梯度</text>
  <text x="315" y="521" text-anchor="middle" class="small">dP = dOVᵀ</text>

  <rect x="484" y="470" width="146" height="68" rx="14" fill="#f5f3ff" stroke="#8b5cf6" class="box"/>
  <text x="557" y="498" text-anchor="middle" class="label">打分梯度</text>
  <text x="557" y="521" text-anchor="middle" class="small">dS</text>

  <rect x="726" y="470" width="174" height="68" rx="14" fill="#ecfccb" stroke="#65a30d" class="box"/>
  <text x="813" y="498" text-anchor="middle" class="label">Query / Key 梯度</text>
  <text x="813" y="521" text-anchor="middle" class="small">dQ、dK</text>

  <path d="M182 431Q204 400 242 400" class="backward"/>
  <path d="M182 457Q204 504 242 504" class="backward"/>
  <path d="M388 504H484" class="backward"/>
  <path d="M630 504H726" class="backward"/>

  <text x="205" y="383" class="hint">读取 P</text>
  <text x="205" y="496" class="hint">读取 V</text>
  <text x="414" y="492" class="hint">读取 P</text>
  <text x="652" y="492" class="hint">读取 Q、K、scale</text>

  <rect x="950" y="390" width="238" height="112" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1069" y="420" text-anchor="middle" class="label">反向读取关系</text>
  <text x="972" y="448" class="small">dV 读取 P</text>
  <text x="972" y="473" class="small">dP 读取 V，dS 读取 P</text>
  <text x="972" y="498" class="small">dQ / dK 读取 Q、K 与 scale</text>
</svg>
