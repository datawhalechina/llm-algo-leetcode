<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">Attention前向保存与反向读取</title><desc id="desc">前向保留Q、K、V和P的引用以及缩放系数；各反向分支读取对应操作数。实线为计算，虚线为保存或读取。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.save{stroke:#15803d;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1240" height="600" fill="#f8fafc" data-layout-role="decoration"/>
<text x="48" y="46" class="title" text-anchor="start">前向留下哪些状态，反向分别从哪里取数</text>
<text x="48" y="77" class="sub" text-anchor="start">实线：前向计算；虚线：保留与读取。下方列出消费者，梯度分支与公式在第二图展开。</text>
<rect x="48" y="120" width="238" height="74" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="167" y="149" class="head" text-anchor="middle">输入 Q、K</text>
<text x="167" y="175" class="body" text-anchor="middle">输入张量引用</text>
<rect x="350" y="120" width="238" height="74" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="469" y="149" class="head" text-anchor="middle">缩放打分 S</text>
<text x="469" y="175" class="body" text-anchor="middle">S = QKᵀ × scale</text>
<rect x="652" y="120" width="238" height="74" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="771" y="149" class="head" text-anchor="middle">概率矩阵 P</text>
<text x="771" y="175" class="body" text-anchor="middle">P = Softmax(S)</text>
<rect x="954" y="120" width="238" height="74" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1073" y="149" class="head" text-anchor="middle">输出 O</text>
<text x="1073" y="175" class="body" text-anchor="middle">O = P V</text>
<path id="qk-to-score" d="M286 157H350" class="flow"/>
<path id="score-to-probability" d="M588 157H652" class="flow"/>
<path id="probability-to-output" d="M890 157H954" class="flow"/>
<rect x="954" y="230" width="238" height="74" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1073" y="259" class="head" text-anchor="middle">输入 V</text>
<text x="1073" y="285" class="body" text-anchor="middle">输入张量引用</text>
<path id="value-to-output" d="M1073 230V194" class="flow"/>
<text x="48" y="320" class="small" text-anchor="start">保留状态</text>
<rect x="48" y="340" width="238" height="74" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="167" y="369" class="head" text-anchor="middle">Q、K</text>
<text x="167" y="395" class="body" text-anchor="middle">保留输入引用</text>
<path id="save-48" d="M167 194V340" class="save"/>
<path id="read-48" d="M167 414V484" class="save"/>
<rect x="350" y="340" width="238" height="74" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="469" y="369" class="head" text-anchor="middle">scale</text>
<text x="469" y="395" class="body" text-anchor="middle">保存标量 1 / √d</text>
<path id="save-350" d="M469 194V340" class="save"/>
<path id="read-350" d="M469 414V484" class="save"/>
<rect x="652" y="340" width="238" height="74" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="771" y="369" class="head" text-anchor="middle">P</text>
<text x="771" y="395" class="body" text-anchor="middle">保存归一化结果</text>
<path id="save-652" d="M771 194V340" class="save"/>
<path id="read-652" d="M771 414V484" class="save"/>
<rect x="954" y="340" width="238" height="74" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1073" y="369" class="head" text-anchor="middle">V</text>
<text x="1073" y="395" class="body" text-anchor="middle">保留输入引用</text>
<path id="save-954" d="M1073 304V340" class="save"/>
<path id="read-954" d="M1073 414V484" class="save"/>
<text x="48" y="462" class="small" text-anchor="start">反向读取</text>
<rect x="48" y="484" width="238" height="74" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="167" y="513" class="head" text-anchor="middle">回传 Q／K</text>
<text x="167" y="539" class="body" text-anchor="middle">dQ 读取 K；dK 读取 Q</text>
<rect x="350" y="484" width="238" height="74" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="469" y="513" class="head" text-anchor="middle">缩放两支梯度</text>
<text x="469" y="539" class="body" text-anchor="middle">dQ 与 dK 使用同一 scale</text>
<rect x="652" y="484" width="238" height="74" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="771" y="513" class="head" text-anchor="middle">回传 V 与打分</text>
<text x="771" y="539" class="body" text-anchor="middle">dV 与 dS 均读取 P</text>
<rect x="954" y="484" width="238" height="74" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1073" y="513" class="head" text-anchor="middle">回传概率</text>
<text x="1073" y="539" class="body" text-anchor="middle">dP 读取 V</text>
</svg>
