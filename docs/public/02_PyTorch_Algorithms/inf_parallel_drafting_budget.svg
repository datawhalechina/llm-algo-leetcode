<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">教学置信度预算与实际验证</title><desc id="desc">教学例置信度0.9、0.8、0.3、0.95在阈值0.5时选择连续前缀2，不越过第三位置去选第四位置。目标验证示例实际接受1个，提交接受Token与修正Token。零预算转普通Decode。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1120" height="500" fill="#f8fafc" data-layout-role="decoration"/>
<text x="35" y="38" class="title" text-anchor="start">预算k是计划验证长度，接受长度a由目标模型决定</text>
<text x="35" y="68" class="sub" text-anchor="start">固定阈值教学例：置信度 [0.90, 0.80, 0.30, 0.95]，阈值0.50，上限K=4。</text>
<rect x="35" y="125" width="215" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="142.5" y="153" class="head" text-anchor="middle">候选块＋置信度</text>
<text x="142.5" y="177" class="body" text-anchor="middle">候选 t₁、t₂、t₃、t₄</text>
<rect x="310" y="125" width="215" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="417.5" y="153" class="head" text-anchor="middle">选择连续预算 k</text>
<text x="417.5" y="177" class="body" text-anchor="middle">本例k=2，第3位置停止</text>
<rect x="590" y="125" width="215" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="697.5" y="153" class="head" text-anchor="middle">目标模型验证</text>
<text x="697.5" y="177" class="body" text-anchor="middle">示例：实际接受 a = 1</text>
<rect x="865" y="125" width="215" height="72" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="972.5" y="153" class="head" text-anchor="middle">提交本轮结果</text>
<text x="972.5" y="177" class="body" text-anchor="middle">t₁ ＋ 首拒修正词元</text>
<path id="block-to-budget" d="M250 161H310" class="flow"/>
<path id="budget-to-verify" d="M525 161H590" class="flow"/>
<path id="verify-to-commit" d="M805 161H865" class="flow"/>
<text x="558" y="110" class="small" text-anchor="middle">k &gt; 0</text>
<text x="698" y="233" class="small" text-anchor="middle">t₁通过，t₂拒绝</text>
<rect x="590" y="310" width="215" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="697.5" y="338" class="head" text-anchor="middle">零预算普通Decode</text>
<text x="697.5" y="362" class="body" text-anchor="middle">首位置低于阈值时</text>
<rect x="865" y="310" width="215" height="72" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="972.5" y="338" class="head" text-anchor="middle">下一轮状态</text>
<text x="972.5" y="362" class="body" text-anchor="middle">更新已提交序列与KV</text>
<path id="zero-budget-fallback" d="M417 197V346H590" class="flow"/>
<path id="fallback-to-next" d="M805 346H865" class="flow"/>
<path id="commit-to-next" d="M972 197V310" class="flow"/>
<text x="449" y="285" class="small" text-anchor="middle">k = 0</text>
<text x="35" y="414" class="body" text-anchor="start">后部高置信位置不跨过低置信位置单独送验。</text>
<text x="35" y="447" class="body" text-anchor="start">若a=k，提交全部候选；额外Token按验证协议处理。</text>
<text x="35" y="480" class="small" text-anchor="start">DSpark完整调度还结合校准后的前缀存活概率、负载与吞吐曲线。</text>
</svg>
