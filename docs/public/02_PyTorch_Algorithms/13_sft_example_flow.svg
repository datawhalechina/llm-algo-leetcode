<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">SFT 样本到训练字段的转换</title>
  <desc id="desc">原始对话先经过模型对应的聊天模板与分词器，再形成输入、有效位置和监督标签；提示区域标签为负一百，回答与结束标记提供监督。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .title{font-size:30px;font-weight:700;fill:#0F172A}
      .subtitle{font-size:17px;fill:#475569}
      .heading{font-size:21px;font-weight:700}
      .body{font-size:16px;fill:#334155}
      .small{font-size:14px;fill:#475569}
      .card{stroke-width:2}
    </style>
  </defs>

  <rect width="1440" height="600" rx="24" fill="#F8FAFC"/>
  <text x="56" y="58" class="title">一条 SFT 样本如何变成训练字段</text>
  <text x="56" y="91" class="subtitle">模板、分词和监督边界必须来自同一模型契约；训练字段不是直接由字符串拼接得到。</text>

  <rect x="56" y="132" width="300" height="402" rx="20" fill="#FFF7ED" stroke="#F59E0B" class="card"/>
  <text x="82" y="171" class="heading" fill="#92400E">原始对话样本</text>
  <rect x="82" y="202" width="248" height="64" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.8"/>
  <text x="100" y="228" class="small">system</text>
  <text x="100" y="252" class="body">你是数学助手</text>
  <rect x="82" y="282" width="248" height="76" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.8"/>
  <text x="100" y="308" class="small">user / prompt</text>
  <text x="100" y="336" class="body">请计算 2 + 2</text>
  <rect x="82" y="374" width="248" height="76" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.8"/>
  <text x="100" y="400" class="small">assistant / response</text>
  <text x="100" y="428" class="body">答案是 4</text>
  <text x="82" y="493" class="small">样本身份与切分已通过数据准入</text>

  <path d="M356 333H406" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="381" y="311" text-anchor="middle" class="small">模板化</text>

  <rect x="420" y="132" width="386" height="402" rx="20" fill="#EFF6FF" stroke="#2563EB" class="card"/>
  <text x="446" y="171" class="heading" fill="#1E3A8A">聊天模板与分词</text>
  <text x="446" y="204" class="body">模型专属控制 Token 确定角色边界</text>
  <rect x="446" y="230" width="334" height="172" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8"/>
  <rect x="466" y="254" width="98" height="48" rx="10" fill="#E2E8F0"/>
  <text x="515" y="284" text-anchor="middle" class="small">system</text>
  <rect x="574" y="254" width="88" height="48" rx="10" fill="#FFEDD5"/>
  <text x="618" y="284" text-anchor="middle" class="small">user</text>
  <rect x="672" y="254" width="88" height="48" rx="10" fill="#DCFCE7"/>
  <text x="716" y="284" text-anchor="middle" class="small">assistant</text>
  <text x="466" y="340" class="body">[控制符, 提示 Token, 助手起点,</text>
  <text x="466" y="370" class="body">回答 Token, EOS]</text>
  <text x="446" y="438" class="small">训练序列包含回答；推理输入停在助手起点</text>
  <text x="446" y="472" class="small">分词器同时给出 Token 边界和填充方式</text>

  <path d="M806 333H870" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="838" y="311" text-anchor="middle" class="small">构造字段</text>

  <rect x="884" y="132" width="500" height="402" rx="20" fill="#F5F3FF" stroke="#7C3AED" class="card"/>
  <text x="910" y="171" class="heading" fill="#5B21B6">训练输入与监督边界</text>
  <text x="910" y="204" class="body">三个字段长度一致，但职责不同</text>

  <text x="910" y="251" class="body" font-weight="700">input_ids</text>
  <rect x="1028" y="226" width="208" height="40" rx="9" fill="#FFEDD5" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1132" y="251" text-anchor="middle" class="small">提示与控制 Token</text>
  <rect x="1244" y="226" width="112" height="40" rx="9" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1300" y="251" text-anchor="middle" class="small">回答 + EOS</text>

  <text x="910" y="320" class="body" font-weight="700">attention_mask</text>
  <rect x="1058" y="295" width="298" height="40" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1207" y="320" text-anchor="middle" class="small">真实序列为 1；右侧 padding 为 0</text>

  <text x="910" y="389" class="body" font-weight="700">labels</text>
  <rect x="1028" y="364" width="208" height="40" rx="9" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="1132" y="389" text-anchor="middle" class="small">提示位置：-100</text>
  <rect x="1244" y="364" width="112" height="40" rx="9" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1300" y="389" text-anchor="middle" class="small">回答 ID</text>

  <rect x="1028" y="438" width="328" height="42" rx="10" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="1192" y="464" text-anchor="middle" class="small">只有回答与 EOS 进入监督损失</text>
</svg>
