<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">LoRA训练旁路与评估模式下的权重合并</title><desc id="desc">训练时输入分为冻结W0主路与仅作用于旁路的Dropout、A、B、缩放路径，两路相加。评估关闭Dropout后，W0与sBA分别进入权重加法，合并权重执行单路线性变换。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="560" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="46" class="title" text-anchor="start">训练保留低秩旁路；评估时可把增量合并到基座权重</text>
<text x="55" y="77" class="sub" text-anchor="start">W₀冻结，A/B可训练；Dropout只作用于旁路输入。合并等价性在评估模式下核对。</text>
<rect x="55" y="160" width="160" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="135" y="188" class="head" text-anchor="middle">输入 x</text>
<text x="135" y="213" class="body" text-anchor="middle">维度 dᵢₙ</text>
<rect x="355" y="120" width="220" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="465" y="148" class="head" text-anchor="middle">冻结主分支 W₀</text>
<text x="465" y="173" class="body" text-anchor="middle">W₀ x</text>
<rect x="300" y="270" width="180" height="70" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="390" y="298" class="head" text-anchor="middle">旁路Dropout</text>
<text x="390" y="323" class="body" text-anchor="middle">仅训练时随机</text>
<rect x="540" y="270" width="160" height="70" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="620" y="298" class="head" text-anchor="middle">可训练 A</text>
<text x="620" y="323" class="body" text-anchor="middle">dᵢₙ → r</text>
<rect x="760" y="270" width="160" height="70" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="840" y="298" class="head" text-anchor="middle">可训练 B</text>
<text x="840" y="323" class="body" text-anchor="middle">r → dₒᵤₜ</text>
<rect x="980" y="270" width="160" height="70" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1060" y="298" class="head" text-anchor="middle">缩放 s</text>
<text x="1060" y="323" class="body" text-anchor="middle">s = α / r</text>
<rect x="1190" y="160" width="160" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="1270" y="188" class="head" text-anchor="middle">输出相加</text>
<text x="1270" y="213" class="body" text-anchor="middle">W₀x + Δh</text>
<rect x="1410" y="160" width="140" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1480" y="188" class="head" text-anchor="middle">输出 h</text>
<text x="1480" y="213" class="body" text-anchor="middle">维度 dₒᵤₜ</text>
<path id="input-to-base" d="M215 180H260V160H355" class="flow"/>
<path id="input-to-adapter" d="M215 220H260V305H300" class="flow"/>
<path id="dropout-to-A" d="M480 305H540" class="flow"/>
<path id="A-to-B" d="M700 305H760" class="flow"/>
<path id="B-to-scale" d="M920 305H980" class="flow"/>
<path id="base-to-sum" d="M575 160H1160V185H1190" class="flow"/>
<path id="adapter-to-sum" d="M1140 305H1270V240" class="flow"/>
<path id="sum-to-output" d="M1350 200H1410" class="flow"/>
<text x="55" y="434" class="head" text-anchor="start">评估时合并</text>
<text x="55" y="466" class="small" text-anchor="start">旁路Dropout关闭</text>
<rect x="355" y="370" width="220" height="65" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="465" y="398" class="head" text-anchor="middle">基础权重 W₀</text>
<text x="465" y="423" class="body" text-anchor="middle">dₒᵤₜ × dᵢₙ</text>
<rect x="355" y="475" width="220" height="65" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="465" y="503" class="head" text-anchor="middle">低秩增量 ΔW</text>
<text x="465" y="528" class="body" text-anchor="middle">ΔW = sBA</text>
<rect x="780" y="420" width="300" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="930" y="448" class="head" text-anchor="middle">权重相加</text>
<text x="930" y="473" class="body" text-anchor="middle">W_m = W₀ + ΔW</text>
<rect x="1200" y="420" width="350" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1375" y="448" class="head" text-anchor="middle">合并后单路径输出</text>
<text x="1375" y="473" class="body" text-anchor="middle">h = W_m x</text>
<path id="base-weight-to-merge" d="M575 402H680V440H780" class="flow"/>
<path id="delta-weight-to-merge" d="M575 507H680V480H780" class="flow"/>
<path id="merged-weight-to-inference" d="M1080 460H1200" class="flow"/>
</svg>
