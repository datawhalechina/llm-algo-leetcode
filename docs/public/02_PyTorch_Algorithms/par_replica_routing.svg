<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">缓存命中与等待门槛的具体比较</title><desc id="desc">请求10ms到达，A可用12ms、B14ms、C11ms，只有B命中前缀。最早开始为C的11ms，允许额外等待3ms时B可选，容忍2ms时回退C。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="650" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">先比较预计开始时间，再决定是否为缓存命中等待</text>
<text x="55" y="80" class="sub" text-anchor="start">无既有会话的示例；请求a=10 ms到达。开始时间=max(a, available_at)，等待=开始−到达。</text>
<rect x="55" y="160" width="340" height="240" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="225" y="194" class="head" text-anchor="middle">同一请求看到的副本状态</text>
<text x="225" y="240" class="body" text-anchor="middle">A：12 ms可用，等待2 ms</text>
<text x="225" y="295" class="body" text-anchor="middle">B：14 ms可用，等待4 ms，命中</text>
<text x="225" y="350" class="body" text-anchor="middle">C：11 ms可用，等待1 ms</text>
<rect x="480" y="260" width="250" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="605" y="288" class="head" text-anchor="middle">最早开始基线：C</text>
<text x="605" y="312" class="body" text-anchor="middle">开始11 ms，等待1 ms</text>
<path id="state-to-baseline" d="M395 300H480" class="flow"/>
<path id="baseline-to-condition" d="M730 300H780" class="flow"/>
<polygon points="900,200 1020,300 900,400 780,300" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" data-layout-role="glyph-group"/><text x="900" y="279" class="head" text-anchor="middle">B命中前缀，且</text>
<text x="900" y="308" class="body" text-anchor="middle">额外等待3 ms ≤ δ？</text>
<rect x="1135" y="170" width="300" height="80" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1285" y="198" class="head" text-anchor="middle">选择B复用前缀</text>
<text x="1285" y="222" class="body" text-anchor="middle">δ=3 ms时满足门槛</text>
<rect x="1135" y="445" width="300" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="1285" y="473" class="head" text-anchor="middle">回退到C</text>
<text x="1285" y="497" class="body" text-anchor="middle">δ=2 ms时超出门槛</text>
<path id="within-slack" d="M1020 300H1070V210H1135" class="flow"/>
<text x="1070" y="155" class="head" text-anchor="middle">是</text>
<path id="exceeds-slack" d="M900 400V485H1135" class="flow"/>
<text x="1000" y="468" class="head" text-anchor="middle">否</text>
<text x="55" y="567" class="sub" text-anchor="start">δ是允许缓存命中副本比最早可用副本多等的时间；本例额外等待=14−11=3 ms。</text>
<text x="55" y="605" class="sub" text-anchor="start">已有会话时先检查会话所属副本的等待条件，再检查前缀命中副本。</text>
</svg>
