<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">请求选择与轮次执行分别决定谁等待、谁推进</title><desc id="desc">服务端请求到达后等待选择，选中的批次执行一轮；未完成成员保留状态，完成成员退出。CPU整批窗口模型与此通用循环分开解释。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.small{font-size:14px}.edge{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#7657a5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="title">请求选择与轮次执行分别决定谁等待、谁推进</text>
<rect x="35" y="115" width="210" height="100" rx="14" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="140" y="150" text-anchor="middle" class="h">请求到达</text><text x="140" y="180" text-anchor="middle">记录时间与业务优先级</text>
<rect x="285" y="115" width="210" height="100" rx="14" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="390" y="150" text-anchor="middle" class="h">等待集合</text><text x="390" y="180" text-anchor="middle">已到达、尚未获选</text>
<rect x="535" y="115" width="210" height="100" rx="14" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="640" y="150" text-anchor="middle" class="h">请求选择</text><text x="640" y="180" text-anchor="middle">先到先服务／优先级</text>
<rect x="785" y="115" width="210" height="100" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="890" y="150" text-anchor="middle" class="h">组成执行批次</text><text x="890" y="180" text-anchor="middle">受槽位、KV 与词元限制</text>
<rect x="1035" y="115" width="210" height="100" rx="14" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1140" y="150" text-anchor="middle" class="h">执行一轮</text><text x="1140" y="180" text-anchor="middle">预填充或解码</text>
<rect x="1290" y="115" width="170" height="100" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="1375" y="150" text-anchor="middle" class="h">完成退出</text><text x="1375" y="180" text-anchor="middle">保存结束时刻</text>
<path d="M245 165H285" class="edge"/>
<path d="M495 165H535" class="edge"/>
<path d="M745 165H785" class="edge"/>
<path d="M995 165H1035" class="edge"/>
<path d="M1245 165H1290" class="edge"/>
<rect x="1035" y="310" width="210" height="90" rx="14" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1140" y="345" text-anchor="middle" class="h">未完成成员</text><text x="1140" y="375" text-anchor="middle">携带更新后的 KV</text>
<path d="M1140 215V310" class="edge"/>
<path d="M1035 355H890V215" class="feedback"/>
<text x="600" y="335" text-anchor="middle" class="small">服务端轮次循环：未完成成员保留，空位可接纳新成员</text>
<text x="600" y="375" text-anchor="middle" class="small">CPU 模型：整批结束后释放；客户端首内容时刻：用于观察响应顺序</text>
</svg>
