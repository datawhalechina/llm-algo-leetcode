<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">三种历史保存方式，都要检查答案、耗时与显存</title><desc id="desc">显式KV、递推与混合架构保存不同对象；记录模型版本与比较条件后，每种方案都完成相同的任务检查和测量。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18324a}.title{font-size:25px;font-weight:700}.h{font-size:17px;font-weight:700;text-anchor:middle}.b{font-size:14px;text-anchor:middle}.small{font-size:14px;fill:#486275}.node{stroke-width:1.8;rx:12}.line{fill:none;stroke:#496580;stroke-width:2.5;marker-end:url(#arrow)}</style>
<marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496580"/></marker></defs>
<rect width="1120" height="620" fill="#f7fafc"/>
<text x="40" y="46" class="title">三种历史保存方式，都要检查答案、耗时与显存</text>
<text x="40" y="77" class="small">先记录每个模型的版本，再检查训练、任务与运行条件哪些相同、哪些不同。</text>
<path d="M450 190V217H190V245" class="line"/>
<path d="M560 190V245" class="line"/>
<path d="M670 190V217H930V245" class="line"/>
<path d="M190 380V410H450V440" class="line"/>
<path d="M560 380V440" class="line"/>
<path d="M930 380V410H670V440" class="line"/>
<g><rect x="395" y="100" width="330" height="90" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="560" y="128" class="h">记录版本，核对比较条件</text><text x="560" y="152" class="b">固定任务、长度与运行设置</text><text x="560" y="173" class="b">训练或分词器不同则分别报告</text></g>
<g><rect x="40" y="245" width="300" height="135" class="node" fill="#fff" stroke="#2563EB" data-layout-role="panel"/><text x="190" y="273" class="h">逐词保存KV</text></g>
<rect x="65" y="293" width="32" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="81" y="314" class="b">KV</text>
<rect x="107" y="293" width="32" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="123" y="314" class="b">KV</text>
<rect x="149" y="293" width="32" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="165" y="314" class="b">KV</text>
<rect x="191" y="293" width="32" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="207" y="314" class="b">KV</text>
<rect x="233" y="293" width="32" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="249" y="314" class="b">KV</text>
<rect x="275" y="293" width="32" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="291" y="314" class="b">KV</text>
<text x="190" y="357" class="b">历史越长，保存的词元状态越多</text>
<g><rect x="410" y="245" width="300" height="135" class="node" fill="#fff" stroke="#16A34A" data-layout-role="panel"/><text x="560" y="273" class="h">递推状态</text></g>
<rect x="430" y="293" width="80" height="32" rx="4" fill="#DCFCE7" stroke="#16A34A" data-layout-role="decoration"/><text x="470" y="314" class="b">上一状态</text>
<rect x="610" y="293" width="80" height="32" rx="4" fill="#DCFCE7" stroke="#16A34A" data-layout-role="decoration"/><text x="650" y="314" class="b">当前状态</text>
<text x="560" y="295" class="b">读入新词元</text>
<path d="M510 310H610" class="line"/>
<text x="560" y="357" class="b">持续更新，状态形状保持不变</text>
<g><rect x="780" y="245" width="300" height="135" class="node" fill="#fff" stroke="#D97706" data-layout-role="panel"/><text x="930" y="273" class="h">混合层</text></g>
<rect x="800" y="293" width="55" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="827.5" y="314" class="b">KV</text>
<rect x="865" y="293" width="55" height="32" rx="4" fill="#DCFCE7" stroke="#16A34A" data-layout-role="decoration"/><text x="892.5" y="314" class="b">递推</text>
<rect x="930" y="293" width="55" height="32" rx="4" fill="#DBEAFE" stroke="#2563EB" data-layout-role="decoration"/><text x="957.5" y="314" class="b">KV</text>
<rect x="995" y="293" width="55" height="32" rx="4" fill="#DCFCE7" stroke="#16A34A" data-layout-role="decoration"/><text x="1022.5" y="314" class="b">递推</text>
<text x="930" y="357" class="b">按层排列，同时使用两种保存方式</text>
<g><rect x="395" y="440" width="330" height="90" class="node" fill="#E0F2FE" stroke="#0284C7"/><text x="560" y="468" class="h">每种方案都完成同一组测试</text><text x="560" y="492" class="b">检查答案；测预填充与单步解码</text><text x="560" y="513" class="b">记录最大显存占用及增量</text></g>
<text x="40" y="580" class="small">状态形状用于估算存储大小；是否答对、是否更快，分别用任务输出和实际测量判断。</text>
</svg>
