<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">相同工作量下，I/O重叠怎样改变完成时间</title>
  <desc id="desc">构造示例，I/O8毫秒、独立计算5毫秒、后继计算5毫秒。串行18毫秒；并行后暴露尾部3毫秒，整体13毫秒。两种路径使用同一时间比例。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}
      .subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}
      .text{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}
      .axis{stroke:#64748b;stroke-width:2}
      .io{fill:#fde68a;stroke:#d97706;stroke-width:2}
      .independent{fill:#bbf7d0;stroke:#16a34a;stroke-width:2}
      .successor{fill:#ddd6fe;stroke:#7c3aed;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">总服务时间不等于暴露尾部或整段完成时间</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">构造示例：I/O 8 ms、独立计算 5 ms、后继计算 5 ms；上下共用同一时间比例</text>
  <text x="45" y="163" class="head">串行：18 ms</text>
  <g text-anchor="middle">
    <rect x="240" y="125" width="320" height="70" class="io"/><text x="400" y="166" class="text">I/O：8 ms 全部暴露</text>
    <rect x="560" y="125" width="200" height="70" class="independent"/><text x="660" y="166" class="text">独立计算 5 ms</text>
    <rect x="760" y="125" width="200" height="70" class="successor"/><text x="860" y="166" class="text">后继计算 5 ms</text>
  </g>
  <text x="45" y="282" class="head">重叠：13 ms</text>
  <text x="70" y="362" class="head">I/O</text>
  <text x="70" y="472" class="head">计算</text>
  <g text-anchor="middle">
    <rect x="240" y="320" width="320" height="70" class="io"/><text x="400" y="362" class="text">I/O 服务量仍为 8 ms</text>
    <rect x="240" y="430" width="200" height="70" class="independent"/><text x="340" y="472" class="text">独立计算 5 ms</text>
    <rect x="440" y="430" width="120" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="500" y="472" class="text">暴露 3 ms</text>
    <rect x="560" y="430" width="200" height="70" class="successor"/><text x="660" y="472" class="text">后继计算 5 ms</text>
  </g>
  <path d="M560 355V430" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="240" y1="550" x2="1040" y2="550" class="axis"/>
  <g class="text" text-anchor="middle">
    <text x="240" y="575">0</text><text x="440" y="575">5</text><text x="560" y="575">8</text><text x="760" y="575">13</text><text x="960" y="575">18</text>
  </g>
  <text x="1040" y="605" text-anchor="end" class="text">时间（ms）→</text>
</svg>
