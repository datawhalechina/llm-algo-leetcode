<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">EAGLE-3从目标表示到下一轮状态</title><desc id="desc">已提交上下文经目标模型取得多层表示，拼接投影后与当前Token嵌入送入自回归草稿器；候选经同一目标模型验证，提交连续前缀并更新下一轮状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="520" fill="#f8fafc" data-layout-role="decoration"/>
<text x="40" y="40" class="title" text-anchor="start">EAGLE-3：目标表示提供条件，草稿依次扩展，目标模型验证</text>
<text x="40" y="70" class="sub" text-anchor="start">真实草稿器采用特征拼接与学习投影；本页CPU的加权和用于练习特征维度与贡献。</text>
<rect x="40" y="115" width="210" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="145" y="143" class="head" text-anchor="middle">已提交上下文</text>
<text x="145" y="167" class="body" text-anchor="middle">包含当前Token</text>
<rect x="300" y="115" width="240" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="420" y="143" class="head" text-anchor="middle">目标模型前向</text>
<text x="420" y="167" class="body" text-anchor="middle">Prefill或上一轮验证</text>
<rect x="600" y="115" width="230" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="715" y="143" class="head" text-anchor="middle">多层特征拼接／投影</text>
<text x="715" y="167" class="body" text-anchor="middle">浅、中、深层 → 草稿条件</text>
<rect x="900" y="115" width="250" height="72" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1025" y="143" class="head" text-anchor="middle">草稿器自回归扩展</text>
<text x="1025" y="167" class="body" text-anchor="middle">当前Token嵌入＋特征</text>
<path id="context-to-target" d="M250 151H300" class="flow"/>
<path id="target-to-features" d="M540 151H600" class="flow"/>
<path id="features-to-drafter" d="M830 151H900" class="flow"/>
<path id="token-to-drafter" d="M145 187V250H950V187" class="flow"/>
<text x="530" y="238" class="small" text-anchor="middle">当前Token嵌入</text>
<rect x="900" y="330" width="250" height="72" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1025" y="358" class="head" text-anchor="middle">候选树</text>
<text x="1025" y="382" class="body" text-anchor="middle">父子关系保留草稿历史</text>
<rect x="600" y="330" width="230" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="715" y="358" class="head" text-anchor="middle">同一目标模型验证</text>
<text x="715" y="382" class="body" text-anchor="middle">按树路径组织注意力</text>
<rect x="300" y="330" width="240" height="72" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="420" y="358" class="head" text-anchor="middle">提交连续接受前缀</text>
<text x="420" y="382" class="body" text-anchor="middle">首拒按验证协议修正</text>
<rect x="40" y="330" width="210" height="72" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="145" y="358" class="head" text-anchor="middle">下一轮状态</text>
<text x="145" y="382" class="body" text-anchor="middle">提交序列、KV与目标特征</text>
<path id="drafter-to-tree" d="M1025 187V330" class="flow"/>
<path id="tree-to-verifier" d="M900 366H830" class="flow"/>
<path id="verifier-to-commit" d="M600 366H540" class="flow"/>
<path id="commit-to-next" d="M300 366H250" class="flow"/>
<text x="1045" y="295" class="small" text-anchor="start">同一路径逐步扩展</text>
<text x="40" y="474" class="sub" text-anchor="start">每轮以新的已提交状态开始；草稿中的未接受分支在提交时丢弃。</text>
</svg>
