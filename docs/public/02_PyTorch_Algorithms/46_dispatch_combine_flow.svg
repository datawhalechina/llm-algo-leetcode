<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">两个Token如何经本地和远端专家恢复原序输出</title><desc id="desc">来源rank0的t0路由到E0和E2，t1路由到E1和E3。rank0拥有E0和E1，rank1拥有E2和E3。远端结果回到来源rank后按Token索引和权重combine，得到t0输出0.5、3及t1输出2、1。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">两条本地路由、两条跨rank路由，怎样合回两个Token？</text>
<text x="55" y="80" class="sub" text-anchor="start">构造例：Top-2、4个专家，每专家接收1条路由；容量为1时全部进入计算，索引与权重保留在来源rank。</text>
<g id="source">
<rect x="55" y="260" width="300" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="205" y="287" class="head" text-anchor="middle">来源rank0：t0、t1</text>
<text x="205" y="313" class="body" text-anchor="middle">t0权重(E0,E2)＝(0.25,0.75)</text>
<text x="205" y="336" class="body" text-anchor="middle">t1权重(E1,E3)＝(0.5,0.5)</text>
</g>
<g id="rank0-experts">
<rect x="535" y="140" width="280" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="675" y="167" class="head" text-anchor="middle">rank0拥有E0、E1</text>
<text x="675" y="193" class="body" text-anchor="middle">本地路由：t0→E0；t1→E1</text>
<text x="675" y="216" class="body" text-anchor="middle">各接收1条Token表示</text>
</g>
<g id="rank1-experts">
<rect x="535" y="360" width="280" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="675" y="387" class="head" text-anchor="middle">rank1拥有E2、E3</text>
<text x="675" y="413" class="body" text-anchor="middle">跨rank路由：t0→E2；t1→E3</text>
<text x="675" y="436" class="body" text-anchor="middle">各接收1条Token表示</text>
</g>
<g id="local-results">
<rect x="925" y="140" width="230" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="1040" y="167" class="head" text-anchor="middle">本地专家结果</text>
<text x="1040" y="193" class="body" text-anchor="middle">E0(t0)＝[2,0]</text>
<text x="1040" y="216" class="body" text-anchor="middle">E1(t1)＝[1,1]</text>
</g>
<g id="remote-results">
<rect x="925" y="360" width="230" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="1040" y="387" class="head" text-anchor="middle">远端结果回到rank0</text>
<text x="1040" y="413" class="body" text-anchor="middle">E2(t0)＝[0,4]</text>
<text x="1040" y="436" class="body" text-anchor="middle">E3(t1)＝[3,1]</text>
</g>
<g id="combined-result">
<rect x="1225" y="260" width="220" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
<text x="1335" y="287" class="head" text-anchor="middle">按原Token加权合并</text>
<text x="1335" y="313" class="body" text-anchor="middle">t0＝[0.5,3]</text>
<text x="1335" y="336" class="body" text-anchor="middle">t1＝[2,1]</text>
</g>
<path id="local-dispatch" d="M355 285H435V190H535" class="flow"/>
<text x="480" y="174" class="body" text-anchor="middle">本地</text>
<path id="remote-dispatch" d="M355 335H435V410H535" class="flow"/>
<text x="480" y="394" class="body" text-anchor="middle">分发</text>
<path id="local-result" d="M815 190H925" class="flow"/>
<path id="remote-return" d="M815 410H925" class="flow"/>
<text x="870" y="394" class="body" text-anchor="middle">回程</text>
<path id="local-to-output" d="M1155 190H1190V285H1225" class="flow"/>
<path id="remote-to-output" d="M1155 410H1190V335H1225" class="flow"/>
<text x="55" y="515" class="group" text-anchor="start">按索引恢复顺序，再用来源rank保留的权重累加</text>
<text x="55" y="546" class="body" text-anchor="start">t0：0.25×[2,0]＋0.75×[0,4]＝[0.5,3]；t1：0.5×[1,1]＋0.5×[3,1]＝[2,1]</text>
<text x="55" y="587" class="sub" text-anchor="start">载荷示例：D=2、FP32，每路由8B；跨rank去程16B、回程16B（仅表示载荷，不含元数据与协议）。</text></svg>
