<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">Part 02 大模型算法实战知识地图</title>
  <desc id="desc">从 PyTorch 与硬件基础出发，分别进入模型架构、训练与后训练、推理与服务三条主线；每条主线形成独立证据，最终进入项目采用判断。精度、显存、通信与性能证据横向约束三条主线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:30px;font-weight:700;fill:#0f172a}.sub{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:16px;fill:#475569}.head{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#172033}.copy{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#334155}.group{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:700;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.6;marker-end:url(#arrow)}.guide{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1500" height="700" fill="#f8fafc"/>
  <rect x="28" y="24" width="1444" height="652" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="70" class="title">Part 02：从算法表达走向可采用的工程证据</text>
  <text x="62" y="102" class="sub">架构、训练与推理是三条并行主线；精度、显存、通信和性能分析横向约束每一条主线。</text>

  <rect x="58" y="248" width="210" height="126" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="82" y="284" class="head">前置能力</text>
  <text x="82" y="314" class="copy">张量 · 自动微分 · 模块状态</text>
  <text x="82" y="340" class="copy">硬件、数值与系统基础</text>

  <rect x="350" y="136" width="230" height="112" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="374" y="172" class="head">模型架构</text><text x="374" y="202" class="copy">组件、残差流与注意力</text><text x="374" y="226" class="copy">MoE、稀疏与记忆结构</text>
  <rect x="350" y="262" width="230" height="112" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="374" y="298" class="head">训练与后训练</text><text x="374" y="328" class="copy">监督目标与参数更新</text><text x="374" y="352" class="copy">偏好、奖励与在线生命周期</text>
  <rect x="350" y="388" width="230" height="112" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="374" y="424" class="head">推理与服务</text><text x="374" y="454" class="copy">请求执行、解码与缓存</text><text x="374" y="478" class="copy">调度、低精度与部署</text>

  <rect x="660" y="136" width="250" height="112" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="684" y="172" class="head">结构候选与资源影响</text><text x="684" y="202" class="copy">访问范围 · 状态表示</text><text x="684" y="226" class="copy">容量、质量与计算代价</text>
  <rect x="660" y="262" width="250" height="112" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="684" y="298" class="head">训练候选与交付状态</text><text x="684" y="328" class="copy">数据准入 · 更新范围</text><text x="684" y="352" class="copy">检查点、评测与回滚</text>
  <rect x="660" y="388" width="250" height="112" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="684" y="424" class="head">服务策略与运行状态</text><text x="684" y="454" class="copy">延迟 · 吞吐 · 显存</text><text x="684" y="478" class="copy">队列、失败与服务目标</text>

  <rect x="990" y="136" width="220" height="112" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="1014" y="172" class="head">架构证据</text><text x="1014" y="202" class="copy">固定输入比较候选</text><text x="1014" y="226" class="copy">检查访问、容量与质量</text>
  <rect x="990" y="262" width="220" height="112" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1014" y="298" class="head">训练证据</text><text x="1014" y="328" class="copy">固定数据比较候选</text><text x="1014" y="352" class="copy">检查质量、状态与恢复</text>
  <rect x="990" y="388" width="220" height="112" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1014" y="424" class="head">服务证据</text><text x="1014" y="454" class="copy">固定工作负载比较候选</text><text x="1014" y="478" class="copy">检查性能、容量与可靠性</text>

  <rect x="1280" y="202" width="170" height="236" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="1304" y="242" class="head">项目采用判断</text>
  <text x="1304" y="282" class="copy">固定基线与候选</text><text x="1304" y="312" class="copy">质量与资源门槛</text><text x="1304" y="342" class="copy">失败与恢复证据</text><text x="1304" y="382" class="group">采用 / 调优 / 拒绝</text>

