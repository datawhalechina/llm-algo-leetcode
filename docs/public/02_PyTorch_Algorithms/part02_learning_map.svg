  <text x="58" y="568" class="group">横切约束</text>
  <rect x="180" y="540" width="260" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="310" y="575" text-anchor="middle" class="copy">数据类型、量化与数值稳定性</text>
  <rect x="470" y="540" width="220" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="580" y="575" text-anchor="middle" class="copy">显存、状态与 I/O</text>
  <rect x="720" y="540" width="250" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="845" y="575" text-anchor="middle" class="copy">通信、并行与资源拓扑</text>
  <rect x="1000" y="540" width="250" height="58" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1125" y="575" text-anchor="middle" class="copy">测量、归因与性能回归</text>
  <path d="M310 532V516H1125V532" class="guide"/>
