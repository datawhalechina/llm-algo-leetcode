<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">工作量与设备能力怎样共同形成 Roofline 判断</title>
  <desc id="desc">运算量与搬运模型共同得出算术强度；独立测量的设备计算与带宽参考、算术强度共同输入Roofline模型，再与实测吞吐及关键路径比较。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}.body{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#475569}.formula{font-family:monospace;font-size:14px;fill:#334155}
      .edge{fill:none;stroke:#334155;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">工作量与设备能力共同形成 Roofline 判断</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">工作量决定强度，设备能力提供资源参考，两路输入共同决定模型曲线</text>
  <g text-anchor="middle">
    <rect x="60" y="130" width="290" height="88" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="205" y="158" class="head">计算工作量 F</text><text x="205" y="186" class="body">矩阵形状与运算计数</text><text x="205" y="208" class="body">约 2mnk FLOPs</text>
    <rect x="60" y="330" width="290" height="88" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="205" y="358" class="head">搬运模型 Q</text><text x="205" y="386" class="body">输入、输出与复用假设</text><text x="205" y="408" class="body">明确存储层和元素字节数</text>
    <rect x="455" y="230" width="290" height="88" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/>
    <text x="600" y="258" class="head">算术强度 I</text><text x="600" y="286" class="formula">I = F / Q</text><text x="600" y="308" class="body">单位：FLOPs / Byte</text>
    <rect x="455" y="430" width="290" height="88" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="600" y="458" class="head">设备能力 P、B</text><text x="600" y="486" class="body">计算吞吐与同层带宽</text><text x="600" y="508" class="body">实测得到参考，不是严格上界</text>
    <rect x="850" y="230" width="290" height="88" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="995" y="258" class="head">Roofline 模型</text><text x="995" y="286" class="formula">R = min(P, I × B)</text><text x="995" y="308" class="body">比较斜线与平台的限制</text>
    <rect x="850" y="430" width="290" height="88" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/>
    <text x="995" y="458" class="head">实测与关键路径复核</text><text x="995" y="486" class="body">比较吞吐，再检查等待与执行</text><text x="995" y="508" class="body">局部差距不等于端到端瓶颈</text>
  </g>
  <path d="M350 174H400V254H455" class="edge" marker-end="url(#arrow)"/>
  <path d="M350 374H400V294H455" class="edge" marker-end="url(#arrow)"/>
  <path d="M745 254H850" class="edge" marker-end="url(#arrow)"/>
  <path d="M745 474H800V294H850" class="edge" marker-end="url(#arrow)"/>
  <path d="M995 318V430" class="edge" marker-end="url(#arrow)"/>
</svg>
