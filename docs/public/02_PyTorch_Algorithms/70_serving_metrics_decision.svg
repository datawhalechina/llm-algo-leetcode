<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">排序收益、整组性能与低优先级等待一起判断</title><desc id="desc">先核对配置与请求完整性，再依次比较首内容顺序分数、整体吞吐和TTFT、低优先级E2E尾延迟。完整性失败拒绝，任一收益条件未满足则调整。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.small{font-size:14px}.edge{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#7657a5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="42" text-anchor="middle" class="title">排序收益、整组性能与低优先级等待一起判断</text>
<rect x="35" y="100" width="240" height="100" rx="14" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="155" y="135" text-anchor="middle" class="h">配置与请求核对</text><text x="155" y="165" text-anchor="middle">开关生效、请求完整</text>
<rect x="330" y="100" width="240" height="100" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="450" y="135" text-anchor="middle" class="h">首内容顺序分数</text><text x="450" y="165" text-anchor="middle">跨优先级请求对的符合率</text>
<rect x="625" y="100" width="240" height="100" rx="14" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="745" y="135" text-anchor="middle" class="h">整组性能</text><text x="745" y="165" text-anchor="middle">吞吐与 TTFT P95</text>
<rect x="920" y="100" width="240" height="100" rx="14" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1040" y="135" text-anchor="middle" class="h">低优先级等待</text><text x="1040" y="165" text-anchor="middle">各轮 E2E P95 的均值</text>
<rect x="1215" y="100" width="240" height="100" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="1335" y="135" text-anchor="middle" class="h">局部采用</text><text x="1335" y="165" text-anchor="middle">当前固定请求流达标</text>
<path d="M275 150H330" class="edge"/>
<path d="M570 150H625" class="edge"/>
<path d="M865 150H920" class="edge"/>
<path d="M1160 150H1215" class="edge"/>
<text x="302" y="130" text-anchor="middle" class="small">通过</text>
<text x="597" y="130" text-anchor="middle" class="small">达标</text>
<text x="892" y="130" text-anchor="middle" class="small">达标</text>
<text x="1187" y="130" text-anchor="middle" class="small">达标</text>
<rect x="35" y="320" width="240" height="90" rx="14" fill="#fbeceb" stroke="#b85c57" stroke-width="2"/><text x="155" y="355" text-anchor="middle" class="h">拒绝候选</text><text x="155" y="385" text-anchor="middle">运行失败或请求不完整</text>
<rect x="330" y="320" width="830" height="90" rx="14" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="745" y="355" text-anchor="middle" class="h">调整后重新比较</text><text x="745" y="385" text-anchor="middle">顺序收益不足、吞吐／TTFT 越界或低优先级等待过长</text>
<path d="M155 200V320" class="edge"/>
<text x="205" y="270" text-anchor="middle" class="small">未通过</text>
<path d="M450 200V320" class="edge"/>
<path d="M745 200V320" class="edge"/>
<path d="M1040 200V320" class="edge"/>
<text x="450" y="270" text-anchor="middle" class="small">未达标</text>
<text x="745" y="270" text-anchor="middle" class="small">未达标</text>
<text x="1040" y="270" text-anchor="middle" class="small">未达标</text>
<text x="750" y="452" text-anchor="middle" class="small">首内容顺序来自客户端观测；持续到达负载中的长期等待，另用跨轮请求轨迹检查</text>
</svg>
