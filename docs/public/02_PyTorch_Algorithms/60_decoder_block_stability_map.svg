<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Decoder Block 候选的项目比较路径</title>
  <desc id="desc">从匹配模型快照开始，核对唯一结构差分，执行配对质量和成本复测，经过证据门禁后形成采用记录。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#52657a"/></marker>
    <style>.t{font:700 24px sans-serif;fill:#17324d}.h{font:600 18px sans-serif;fill:#17324d}.s{font:15px sans-serif;fill:#40566d}.i{fill:#e8f3ff;stroke:#4d86b8;stroke-width:2}.p{fill:#eef8ef;stroke:#57945d;stroke-width:2}.e{fill:#fff4df;stroke:#b98332;stroke-width:2}.d{fill:#f2ecff;stroke:#7c62ad;stroke-width:2}.l{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="t">Decoder Block：从匹配候选到采用记录</text>
  <rect x="60" y="120" width="220" height="94" rx="14" class="i"/><text x="170" y="157" text-anchor="middle" class="h">匹配模型快照</text><text x="170" y="186" text-anchor="middle" class="s">版本 · 数据 · 训练预算</text>
  <rect x="350" y="120" width="220" height="94" rx="14" class="p"/><text x="460" y="157" text-anchor="middle" class="h">唯一结构差分</text><text x="460" y="186" text-anchor="middle" class="s">Norm 位置 / 类型 / FFN 激活</text>
  <rect x="640" y="120" width="220" height="94" rx="14" class="e"/><text x="750" y="157" text-anchor="middle" class="h">配对质量评测</text><text x="750" y="186" text-anchor="middle" class="s">固定验证集 · 失败样例</text>
  <rect x="640" y="335" width="220" height="94" rx="14" class="e"/><text x="750" y="372" text-anchor="middle" class="h">配对成本复测</text><text x="750" y="401" text-anchor="middle" class="s">梯度 · 时间 · 峰值显存</text>
  <rect x="930" y="225" width="210" height="94" rx="14" class="d"/><text x="1035" y="262" text-anchor="middle" class="h">证据门禁</text><text x="1035" y="291" text-anchor="middle" class="s">失败 · 缺失 · 阈值</text>
  <rect x="930" y="405" width="210" height="94" rx="14" class="d"/><text x="1035" y="442" text-anchor="middle" class="h">Block 采用记录</text><text x="1035" y="471" text-anchor="middle" class="s">身份 · 指标 · 状态 · 动作</text>
  <path d="M280 167 H350" class="l"/><path d="M570 167 H640" class="l"/><path d="M570 167 H600 V382 H640" class="l"/>
  <path d="M860 167 H895 V253 H930" class="l"/><path d="M860 382 H895 V291 H930" class="l"/><path d="M1035 319 V405" class="l"/>
</svg>
