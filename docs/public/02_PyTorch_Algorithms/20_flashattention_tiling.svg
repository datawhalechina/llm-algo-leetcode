<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention 核心机制与演进关系</title>
  <desc id="desc">左侧展示完整 Attention 的中间工作集问题，中央展示 FlashAttention 的分块与在线 Softmax 核心机制，右侧展示 FlashAttention 2、3、4 的执行方式演进。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 32px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 500 17px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .group { font: 700 19px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .label { font: 700 21px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 500 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tiny { font: 500 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box { stroke-width: 3; rx: 16; ry: 16; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .blue-arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#blueArrow); }
      .dashed { stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="780" fill="url(#bg)"/>
  <text x="70" y="62" class="title">FlashAttention：从核心数据流到执行方式演进</text>
  <text x="70" y="94" class="sub">左侧是问题背景，中央是共同核心机制，右侧是围绕这一机制展开的版本演进。</text>

  <rect x="60" y="150" width="330" height="560" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="95" y="195" class="group">问题与硬件前置</text>
  <rect x="95" y="225" width="260" height="78" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="225" y="258" text-anchor="middle" class="label">Q / K / V → 完整 QKᵀ / √D</text>
  <text x="225" y="284" text-anchor="middle" class="small">分数矩阵约为 N × N</text>
  <path d="M 225 303 L 225 335" class="arrow"/>
  <rect x="95" y="335" width="260" height="82" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="225" y="369" text-anchor="middle" class="label">GPU 显存层级</text>
  <text x="225" y="396" text-anchor="middle" class="small">HBM ↔ SRAM</text>
  <path d="M 225 417 L 225 449" class="arrow"/>
  <rect x="95" y="449" width="260" height="82" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="225" y="483" text-anchor="middle" class="label">数据搬运成本</text>
  <text x="225" y="510" text-anchor="middle" class="small">读写与数据搬运</text>
  <path d="M 225 531 L 225 563" class="arrow"/>
  <rect x="95" y="563" width="260" height="92" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="225" y="601" text-anchor="middle" class="label">局部工作集</text>
  <text x="225" y="629" text-anchor="middle" class="small">分块适合片上存储</text>
  <text x="225" y="681" text-anchor="middle" class="tiny">需要改变的是数据流</text>

  <rect x="515" y="125" width="570" height="630" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/>
  <text x="800" y="180" text-anchor="middle" class="group">FlashAttention 核心机制</text>
  <text x="800" y="213" text-anchor="middle" class="small">改变中间结果的保存与更新方式</text>

  <rect x="625" y="265" width="350" height="92" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="800" y="303" text-anchor="middle" class="label">Q / K / V 分块</text>
  <text x="800" y="331" text-anchor="middle" class="small">一次处理一个局部分块</text>
  <path d="M 800 357 L 800 405" class="arrow"/>
  <rect x="625" y="405" width="350" height="92" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="800" y="443" text-anchor="middle" class="label">局部分数 Sᵢⱼ = QᵢKⱼᵀ / √D</text>
  <text x="800" y="471" text-anchor="middle" class="small">不保存完整分数矩阵</text>
  <path d="M 800 497 L 800 545" class="arrow"/>
  <rect x="625" y="545" width="350" height="130" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="800" y="583" text-anchor="middle" class="label">Online Softmax</text>
  <text x="800" y="612" text-anchor="middle" class="small">逐行更新 mᵢ / lᵢ / Oᵢ</text>
  <text x="800" y="640" text-anchor="middle" class="small">保持精确 Attention 输出</text>
  <path d="M 975 610 C 1045 610 1045 450 975 450" class="dashed"/>
  <text x="1050" y="535" class="tiny">下一个 K/V 分块</text>

  <rect x="1180" y="150" width="355" height="560" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1215" y="195" class="group">围绕核心机制的演进</text>
  <rect x="1215" y="220" width="285" height="105" class="box" fill="#ffffff" stroke="#3b82f6"/>
  <text x="1357" y="260" text-anchor="middle" class="label">FlashAttention-2</text>
  <text x="1357" y="289" text-anchor="middle" class="small">并行划分</text>
  <text x="1357" y="313" text-anchor="middle" class="small">工作分配</text>
  <rect x="1215" y="385" width="285" height="105" class="box" fill="#ffffff" stroke="#3b82f6"/>
  <text x="1357" y="425" text-anchor="middle" class="label">FlashAttention-3</text>
  <text x="1357" y="454" text-anchor="middle" class="small">异步流水线</text>
  <text x="1357" y="478" text-anchor="middle" class="small">低精度与 Hopper 协同</text>
  <rect x="1215" y="550" width="285" height="105" class="box" fill="#ffffff" stroke="#3b82f6"/>
  <text x="1357" y="590" text-anchor="middle" class="label">FlashAttention-4</text>
  <text x="1357" y="619" text-anchor="middle" class="small">CuTeDSL</text>
  <text x="1357" y="643" text-anchor="middle" class="small">Hopper / Blackwell 计算内核</text>
  <path d="M 1357 325 L 1357 385" class="blue-arrow"/>
  <path d="M 1357 490 L 1357 550" class="blue-arrow"/>

  <path d="M 390 609 C 480 609 505 310 625 310" class="blue-arrow"/>
  <path d="M 1085 430 C 1125 430 1145 430 1180 430" class="blue-arrow"/>

</svg>
