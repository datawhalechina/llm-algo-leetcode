<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">DP张量流水线组合的八rank排布与验收</title><desc id="desc">构造示意DP等于2、TP等于2、PP等于2、CP和EP均为1，共八个rank。两行DP副本各含两个PP阶段，每阶段两个TP rank。进程数匹配之后仍需检查结构和进程组、拓扑容量与同步，再在同模型负载精度下复测。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect x="0" y="0" width="1500" height="620" rx="12" fill="#f8fafc" stroke="#f8fafc" stroke-width="2" class="decoration" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">8个rank排得下组合，还要检查结构、资源与实际执行</text>
<text x="55" y="80" class="sub" text-anchor="start">构造例：DP=2、TP=2、PP=2，CP=EP=1；每行DP副本处理不同样本，stage内部使用TP。</text>
<text x="55" y="132" class="group" text-anchor="start">DP×TP×PP＝2×2×2＝8 · 排布示意</text>
<g id="eight-rank-layout">
<rect x="55" y="155" width="760" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" class="panel" data-layout-role="panel"/>
<rect x="130" y="175" width="280" height="255" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" class="panel" data-layout-role="panel"/>
<rect x="515" y="175" width="280" height="255" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2" class="panel" data-layout-role="panel"/>
<text x="270" y="207" class="head" text-anchor="middle">PP stage0</text>
<text x="655" y="207" class="head" text-anchor="middle">PP stage1</text>
<text x="90" y="272" class="head" text-anchor="middle">DP0</text>
<g id="rank-0" data-dp="0" data-pp="0" data-tp="0" data-layout-role="glyph-group">
<rect x="150" y="225" width="100" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="200" y="254" class="head" text-anchor="middle">rank0</text>
<text x="200" y="280" class="body" text-anchor="middle">TP0</text>
</g>
<g id="rank-1" data-dp="0" data-pp="0" data-tp="1" data-layout-role="glyph-group">
<rect x="295" y="225" width="100" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="345" y="254" class="head" text-anchor="middle">rank1</text>
<text x="345" y="280" class="body" text-anchor="middle">TP1</text>
</g>
<g id="rank-2" data-dp="0" data-pp="1" data-tp="0" data-layout-role="glyph-group">
<rect x="535" y="225" width="100" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="585" y="254" class="head" text-anchor="middle">rank2</text>
<text x="585" y="280" class="body" text-anchor="middle">TP0</text>
</g>
<g id="rank-3" data-dp="0" data-pp="1" data-tp="1" data-layout-role="glyph-group">
<rect x="680" y="225" width="100" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="730" y="254" class="head" text-anchor="middle">rank3</text>
<text x="730" y="280" class="body" text-anchor="middle">TP1</text>
</g>
<text x="90" y="392" class="head" text-anchor="middle">DP1</text>
<g id="rank-4" data-dp="1" data-pp="0" data-tp="0" data-layout-role="glyph-group">
<rect x="150" y="345" width="100" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="200" y="374" class="head" text-anchor="middle">rank4</text>
<text x="200" y="400" class="body" text-anchor="middle">TP0</text>
</g>
<g id="rank-5" data-dp="1" data-pp="0" data-tp="1" data-layout-role="glyph-group">
<rect x="295" y="345" width="100" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="345" y="374" class="head" text-anchor="middle">rank5</text>
<text x="345" y="400" class="body" text-anchor="middle">TP1</text>
</g>
<g id="rank-6" data-dp="1" data-pp="1" data-tp="0" data-layout-role="glyph-group">
<rect x="535" y="345" width="100" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="585" y="374" class="head" text-anchor="middle">rank6</text>
<text x="585" y="400" class="body" text-anchor="middle">TP0</text>
</g>
<g id="rank-7" data-dp="1" data-pp="1" data-tp="1" data-layout-role="glyph-group">
<rect x="680" y="345" width="100" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" class="glyph-group" data-layout-role="glyph-group"/>
<text x="730" y="374" class="head" text-anchor="middle">rank7</text>
<text x="730" y="400" class="body" text-anchor="middle">TP1</text>
</g>
</g>
<g id="group-and-shape-constraints">
<rect x="955" y="135" width="440" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="1175" y="164" class="head" text-anchor="middle">进程数匹配后，检查结构与分组</text>
<text x="1175" y="190" class="body" text-anchor="middle">层／Head划分、进程组、模型和后端支持</text>
</g>
<g id="runtime-constraints">
<rect x="955" y="300" width="440" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="1175" y="329" class="head" text-anchor="middle">检查拓扑、容量与同步</text>
<text x="1175" y="355" class="body" text-anchor="middle">互联、峰值显存、流水线stage与通信开销</text>
</g>
<g id="matched-workload-retest">
<rect x="955" y="465" width="440" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="node"/>
<text x="1175" y="494" class="head" text-anchor="middle">同模型、同负载、同精度复测</text>
<text x="1175" y="520" class="body" text-anchor="middle">先核对正确性／容量，再比较完成时间与扩展效率</text>
</g>
<path id="layout-to-constraints" d="M815 285H885V175H955" class="flow"/>
<path id="structure-to-runtime" d="M1175 215V300" class="flow"/>
<path id="runtime-to-retest" d="M1175 380V465" class="flow"/>
<text x="55" y="485" class="body" text-anchor="start">排布图表示进程角色，不表示通信的执行顺序。</text>
<text x="55" y="520" class="body" text-anchor="start">CP／EP按序列与MoE条件加入，重新核对具体后端的进程组。</text>
<text x="55" y="555" class="body" text-anchor="start">Serving副本在请求层分流，实例内部仍可使用模型并行。</text>
<text x="55" y="599" class="sub" text-anchor="start">候选兼容清单用于提出计划；实际组合能否运行、是否更快，需要对应后端与同负载结果支持。</text></svg>
