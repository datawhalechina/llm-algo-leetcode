<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">FP8 与 KV Cache 量化的对象和收益不同</title>
  <desc id="desc">FP8 面向前向计算中的激活或权重表示，KV Cache 量化面向已生成 token 的状态存储。两条路径分别检查计算路径和上下文容量，不能混为同一项证据。</desc>
  <defs>
    <style>
      .title{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.group{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#35526b}.h{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.frame{fill:#fff;stroke:#c7d9e7;stroke-width:1.5}.blue{fill:#e8f3fb;stroke:#3978a8;stroke-width:2}.green{fill:#eaf7ef;stroke:#4c9870;stroke-width:2}.orange{fill:#fff1df;stroke:#c78335;stroke-width:2}.purple{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}.flow{stroke:#3978a8;stroke-width:3;fill:none;marker-end:url(#arrow)}.fp8{stroke:#4c9870;stroke-width:3;fill:none;marker-end:url(#greenArrow)}.kv{stroke:#8b6bb1;stroke-width:3;fill:none;marker-end:url(#purpleArrow)}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#3978a8"/></marker>
    <marker id="greenArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#4c9870"/></marker>
    <marker id="purpleArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8b6bb1"/></marker>
  </defs>
  <rect width="1240" height="600" rx="24" fill="#f8fbfd"/>
  <text x="620" y="48" text-anchor="middle" class="title">FP8 / KV Cache：运行时量化面对的对象与收益不同</text>
  <text x="620" y="76" text-anchor="middle" class="sub">先区分量化发生在计算路径还是状态存储路径，再选择对应的误差与性能证据</text>

  <rect x="50" y="135" width="535" height="310" rx="18" class="frame"/>
  <text x="75" y="166" class="group">FP8 计算路径</text>
  <rect x="75" y="205" width="205" height="80" rx="15" class="blue"/>
  <text x="178" y="237" text-anchor="middle" class="h">激活 / 权重表示</text><text x="178" y="262" text-anchor="middle" class="t">前向计算中的张量</text>
  <rect x="350" y="205" width="205" height="80" rx="15" class="green"/>
  <text x="453" y="237" text-anchor="middle" class="h">FP8 scale 与计算</text><text x="453" y="262" text-anchor="middle" class="t">动态范围与 kernel 路径</text>
  <path d="M280 245H350" class="fp8"/>
  <rect x="160" y="335" width="315" height="62" rx="14" class="green"/>
  <text x="318" y="362" text-anchor="middle" class="h">观察计算与带宽路径</text><text x="318" y="384" text-anchor="middle" class="t">误差、吞吐与硬件支持</text>
  <path d="M453 285V315H318V335" class="fp8"/>

  <rect x="655" y="135" width="535" height="310" rx="18" class="frame"/>
  <text x="680" y="166" class="group">KV Cache 状态路径</text>
  <rect x="680" y="205" width="205" height="80" rx="15" class="blue"/>
  <text x="783" y="237" text-anchor="middle" class="h">已生成 K / V</text><text x="783" y="262" text-anchor="middle" class="t">随上下文持续驻留</text>
  <rect x="955" y="205" width="205" height="80" rx="15" class="purple"/>
  <text x="1058" y="237" text-anchor="middle" class="h">分组量化与读取</text><text x="1058" y="262" text-anchor="middle" class="t">量化值必须匹配 scale</text>
  <path d="M885 245H955" class="kv"/>
  <rect x="765" y="335" width="315" height="62" rx="14" class="purple"/>
  <text x="923" y="362" text-anchor="middle" class="h">观察容量与上下文质量</text><text x="923" y="384" text-anchor="middle" class="t">bytes、恢复误差与并发</text>
  <path d="M1058 285V315H923V335" class="kv"/>

  <rect x="350" y="500" width="540" height="48" rx="15" class="orange"/>
  <text x="620" y="530" text-anchor="middle" class="h">各自形成 baseline / candidate；不要用一种路径的证据替代另一种</text>
  <path d="M318 397V470H520V500" class="flow"/>
  <path d="M923 397V470H720V500" class="flow"/>
</svg>
