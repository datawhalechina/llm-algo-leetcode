<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">LoRA零初始化的梯度公式与首次更新例</title><desc id="desc">关闭Dropout时令u=Ax、g=dL/dh，G_B=s g u转置，G_A=s B转置g x转置。B为零使G_A为零，G_B是否非零由输入与上游信号决定；固定无衰减无动量SGD例展示之后的梯度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="560" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="46" class="title" text-anchor="start">B=0使A的首轮梯度为0；B的梯度还取决于输入与上游信号</text>
<text x="55" y="77" class="sub" text-anchor="start">单样本、旁路Dropout关闭；定义u=Ax，g=∂L/∂h，缩放s=α/r。</text>
<rect x="55" y="115" width="700" height="150" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="830" y="115" width="715" height="150" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="80" y="149" class="head" text-anchor="start">先看两条局部梯度</text>
<text x="80" y="193" class="body" text-anchor="start">G_B = s · g uᵀ</text>
<text x="80" y="235" class="body" text-anchor="start">G_A = s · Bᵀ g xᵀ</text>
<text x="855" y="149" class="head" text-anchor="start">代入B=0</text>
<text x="855" y="193" class="body" text-anchor="start">G_A = 0</text>
<text x="855" y="235" class="body" text-anchor="start">G_B由g和Ax决定；固定例中的信号可以使它非零。</text>
<text x="55" y="303" class="sub" text-anchor="start">构造例：首次SGD，学习率0.1，无动量、无权重衰减；x与上游g在两轮保持相同。</text>
<rect x="55" y="330" width="390" height="155" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="80" y="360" class="head" text-anchor="start">输入与初始化</text>
<text x="80" y="393" class="body" text-anchor="start">x=[1,2]ᵀ；A=[1,0]</text>
<text x="80" y="425" class="body" text-anchor="start">B=[0,0]ᵀ；s=1</text>
<text x="80" y="457" class="body" text-anchor="start">g=[1,−1]ᵀ；u=1</text>
<rect x="520" y="330" width="450" height="155" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="545" y="360" class="head" text-anchor="start">首轮反向</text>
<text x="545" y="393" class="body" text-anchor="start">G_B=[1,−1]ᵀ</text>
<text x="545" y="425" class="body" text-anchor="start">G_A=[0,0]</text>
<text x="545" y="457" class="body" text-anchor="start">冻结W₀不接收参数梯度</text>
<rect x="1040" y="330" width="505" height="155" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="1065" y="360" class="head" text-anchor="start">首次更新与下一轮</text>
<text x="1065" y="393" class="body" text-anchor="start">SGD后B=[−0.1,0.1]ᵀ</text>
<text x="1065" y="425" class="body" text-anchor="start">A仍为[1,0]</text>
<text x="1065" y="457" class="body" text-anchor="start">下轮G_A=[−0.2,−0.4]</text>
<path id="init-to-gradients" d="M445 407H520" class="flow"/>
<path id="gradient-to-update" d="M970 407H1040" class="flow"/>
<text x="55" y="532" class="sub" text-anchor="start">梯度公式说明信号能否到达；参数是否变化，还要结合优化器状态与权重衰减判断。</text>
</svg>
