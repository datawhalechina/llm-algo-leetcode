<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">相同阶段耗时下，串行与流水路径怎样完成两个批次</title>
  <desc id="desc">构造模型，准备4毫秒、复制2毫秒、计算10毫秒。串行两个批次32毫秒；理想流水26毫秒，首批等待6毫秒，第二批计算紧接前批。两种路径共用每毫秒25像素的时间轴。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}
      .subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .label{font-family:"Noto Sans CJK SC",sans-serif;font-size:17px;font-weight:700;fill:#172033}
      .text{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}
      .prepare{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .copy{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .compute{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
      .edge{fill:none;stroke:#334155;stroke-width:2.5}
      .axis{stroke:#64748b;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">预取与搬运重叠怎样减少两批的完成时间</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">CPU 构造模型：每批准备 4 ms、复制 2 ms、计算 10 ms；上下共用相同时间比例</text>
  <text x="40" y="154" class="label">串行：32 ms</text>
  <g text-anchor="middle">
    <rect x="220" y="120" width="100" height="64" class="prepare"/><text x="270" y="158" class="text">准备 1</text>
    <rect x="320" y="120" width="50" height="64" class="copy"/><text x="345" y="158" class="text">传 1</text>
    <rect x="370" y="120" width="250" height="64" class="compute"/><text x="495" y="158" class="text">计算 1</text>
    <rect x="620" y="120" width="100" height="64" class="prepare"/><text x="670" y="158" class="text">准备 2</text>
    <rect x="720" y="120" width="50" height="64" class="copy"/><text x="745" y="158" class="text">传 2</text>
    <rect x="770" y="120" width="250" height="64" class="compute"/><text x="895" y="158" class="text">计算 2</text>
  </g>
  <text x="40" y="268" class="label">流水：26 ms</text>
  <text x="60" y="332" class="label">CPU 准备</text>
  <text x="60" y="412" class="label">设备复制</text>
  <text x="60" y="492" class="label">设备计算</text>
  <g text-anchor="middle">
    <rect x="220" y="300" width="100" height="50" class="prepare"/><text x="270" y="330" class="text">准备 1</text>
    <rect x="320" y="300" width="100" height="50" class="prepare"/><text x="370" y="330" class="text">准备 2</text>
    <rect x="320" y="380" width="50" height="50" class="copy"/><text x="345" y="410" class="text">传 1</text>
    <rect x="420" y="380" width="50" height="50" class="copy"/><text x="445" y="410" class="text">传 2</text>
    <rect x="220" y="460" width="150" height="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="295" y="490" class="text">首批等待 6 ms</text>
    <rect x="370" y="460" width="250" height="50" class="compute"/><text x="495" y="490" class="text">计算 1：6–16 ms</text>
    <rect x="620" y="460" width="250" height="50" class="compute"/><text x="745" y="490" class="text">计算 2：16–26 ms</text>
  </g>
  <path d="M320 325V380" class="edge" marker-end="url(#arrow)"/>
  <path d="M420 325V380" class="edge" marker-end="url(#arrow)"/>
  <path d="M370 405V460" class="edge" marker-end="url(#arrow)"/>
  <path d="M470 405H620V460" class="edge" marker-end="url(#arrow)"/>
  <line x1="220" y1="550" x2="1100" y2="550" class="axis"/>
  <g class="text" text-anchor="middle">
    <text x="220" y="576">0</text><text x="370" y="576">6</text><text x="620" y="576">16</text><text x="870" y="576">26</text><text x="1020" y="576">32</text>
  </g>
  <text x="1100" y="605" text-anchor="end" class="text">时间（ms）→</text>
</svg>
