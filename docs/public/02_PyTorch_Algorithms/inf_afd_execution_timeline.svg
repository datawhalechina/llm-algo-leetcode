<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">每个微批次保持依赖，不同微批次寻找重叠</title><desc id="desc">同步与微批次流水均保持Attention到发送到FFN到返回的依赖；微批次1的Attention可与微批次0的FFN同时执行。</desc><defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:26px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.edge{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.opt{fill:none;stroke:#7657a5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs><rect width="1500" height="650" fill="#f8fafc"/><text x="750" y="43" text-anchor="middle" class="title">每个微批次保持依赖，不同微批次寻找重叠</text>
<text x="120" y="167" text-anchor="middle" class="h">单个微批次</text>
<rect x="230" y="120" width="200" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="330" y="153" text-anchor="middle" class="h">Attention 0</text><text x="330" y="181" text-anchor="middle">得到隐藏表示</text>
<rect x="475" y="120" width="200" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="575" y="153" text-anchor="middle" class="h">发送 0</text><text x="575" y="181" text-anchor="middle">隐藏表示与路由信息</text>
<rect x="720" y="120" width="200" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="820" y="153" text-anchor="middle" class="h">FFN 0</text><text x="820" y="181" text-anchor="middle">专家计算与合并</text>
<rect x="965" y="120" width="200" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1065" y="153" text-anchor="middle" class="h">返回 0</text><text x="1065" y="181" text-anchor="middle">结果送回继续原层</text>
<path d="M430 165H475" class="edge"/>
<path d="M675 165H720" class="edge"/>
<path d="M920 165H965" class="edge"/>
<text x="120" y="363" text-anchor="middle" class="h">微批次 0</text>
<rect x="230" y="320" width="160" height="80" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="310" y="366" text-anchor="middle" class="h">Attention 0</text>
<rect x="435" y="320" width="130" height="80" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="500" y="366" text-anchor="middle" class="h">发送 0</text>
<rect x="610" y="320" width="180" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="700" y="366" text-anchor="middle" class="h">FFN 0</text>
<rect x="835" y="320" width="130" height="80" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="900" y="366" text-anchor="middle" class="h">返回 0</text>
<path d="M390 360H435" class="edge"/>
<path d="M565 360H610" class="edge"/>
<path d="M790 360H835" class="edge"/>
<text x="120" y="483" text-anchor="middle" class="h">微批次 1</text>
<rect x="610" y="440" width="180" height="80" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="700" y="486" text-anchor="middle" class="h">Attention 1</text>
<rect x="835" y="440" width="130" height="80" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="900" y="486" text-anchor="middle" class="h">发送 1</text>
<rect x="1010" y="440" width="180" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1100" y="486" text-anchor="middle" class="h">FFN 1</text>
<rect x="1235" y="440" width="140" height="80" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1305" y="486" text-anchor="middle" class="h">返回 1</text>
<path d="M790 480H835" class="edge"/>
<path d="M965 480H1010" class="edge"/>
<path d="M1190 480H1235" class="edge"/>
<text x="700" y="425" text-anchor="middle" class="s">两类角色可并行</text>
<path d="M230 570H1390" class="edge"/><text x="1390" y="598" text-anchor="middle" class="s">时间 →</text>
<text x="750" y="620" text-anchor="middle" class="s">依赖与同时机会示意，非实测比例；收益还取决于缓冲区、链路争用、角色数量与实际排队</text>
</svg>
