<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">同一毫秒刻度下的完成链与等待间隔</title>
  <desc id="desc">示意数据与 CPU 练习一致，每毫秒 70 像素，窗口起点为 0。读取 0 至 2、准备 2.5 至 4、复制 4 至 6、计算 7 至 12 毫秒；日志为 4.2 至 5 毫秒。红色区间为就绪后间隔，不自动归因为同步；箭头表示依赖，不表示传输时长。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#334155"/></marker>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;fill:#475569}
      .lane{font-family:"Noto Sans CJK SC",sans-serif;font-size:17px;font-weight:700;fill:#172033}.label{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;font-weight:700;fill:#172033}.small{font-family:"Noto Sans CJK SC",sans-serif;font-size:13px;fill:#475569}
      .dep{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.tick{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="45" text-anchor="middle" class="title">完成链包含执行时间与尚待解释的间隔</text>
  <text x="600" y="74" text-anchor="middle" class="subtitle">示意数据；各通道共享毫秒刻度，箭头表示依赖，条块宽度表示持续时间</text>
  <rect x="180" y="95" width="970" height="140" rx="14" fill="#eff6ff"/>
  <rect x="180" y="255" width="970" height="110" rx="14" fill="#fffbeb"/>
  <rect x="180" y="385" width="970" height="110" rx="14" fill="#f0fdf4"/>
  <text x="35" y="185" class="lane">CPU 线程</text>
  <text x="35" y="315" class="lane">复制通道</text>
  <text x="35" y="445" class="lane">CUDA 流</text>
  <g class="tick">
    <line x1="240" y1="95" x2="240" y2="520"/><line x1="380" y1="95" x2="380" y2="520"/>
    <line x1="415" y1="95" x2="415" y2="520"/><line x1="520" y1="95" x2="520" y2="520"/>
    <line x1="660" y1="95" x2="660" y2="520"/><line x1="730" y1="95" x2="730" y2="520"/>
    <line x1="1080" y1="95" x2="1080" y2="520"/>
  </g>
  <rect id="load" x="240" y="145" width="140" height="70" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="310" y="174" text-anchor="middle" class="label">读取</text><text x="310" y="199" text-anchor="middle" class="small">0–2 ms</text>
  <rect x="380" y="145" width="35" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="397" y="231" text-anchor="middle" class="small">间隔 0.5 ms</text>
  <rect id="prepare" x="415" y="145" width="105" height="70" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="467" y="174" text-anchor="middle" class="label">准备</text><text x="467" y="199" text-anchor="middle" class="small">2.5–4 ms</text>
  <rect id="log" x="534" y="145" width="56" height="70" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="562" y="174" text-anchor="middle" class="small">日志</text><text x="562" y="198" text-anchor="middle" class="small">4.2–5</text>
  <rect id="copy" x="520" y="275" width="140" height="70" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
  <text x="590" y="304" text-anchor="middle" class="label">H2D</text><text x="590" y="329" text-anchor="middle" class="small">4–6 ms</text>
  <rect x="660" y="405" width="70" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="695" y="435" text-anchor="middle" class="small">待启动</text><text x="695" y="459" text-anchor="middle" class="small">6–7 ms</text>
  <rect id="compute" x="730" y="405" width="350" height="70" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/>
  <text x="905" y="434" text-anchor="middle" class="label">计算 · 5 ms</text><text x="905" y="459" text-anchor="middle" class="small">7–12 ms，完成链终点</text>
  <path d="M310 145V115H467V145" class="dep" data-source="load" data-target="prepare" marker-end="url(#arrow)"/>
  <path d="M520 180H534" class="dep" data-source="prepare" data-target="log" marker-end="url(#arrow)"/>
  <path d="M467 215V245H590V275" class="dep" data-source="prepare" data-target="copy" marker-end="url(#arrow)"/>
  <path d="M660 310H750V405" class="dep" data-source="copy" data-target="compute" marker-end="url(#arrow)"/>
  <line x1="240" y1="520" x2="1120" y2="520" stroke="#94a3b8" stroke-width="2"/>
  <g text-anchor="middle" class="small">
    <text x="240" y="545">0</text><text x="380" y="545">2</text><text x="415" y="545">2.5</text><text x="520" y="545">4</text>
    <text x="660" y="545">6</text><text x="730" y="545">7</text><text x="1080" y="545">12</text>
  </g>
  <text x="1120" y="575" text-anchor="end" class="small">时间 / ms →</text>
</svg>
