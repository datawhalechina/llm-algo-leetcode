<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">候选树评分与连续提交</title><desc id="desc">教学候选树10到11到13的路径累计分数为负0.35，高于10到12的负1.10；示例目标验证接受10和11、拒绝13，因此提交10、11及修正词元。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="520" fill="#f8fafc" data-layout-role="decoration"/>
<text x="40" y="40" class="title" text-anchor="start">候选分数用于排序，目标验证决定哪一段真正提交</text>
<text x="40" y="70" class="sub" text-anchor="start">沿用本页CPU树例：节点分数 = 父路径累计分数 + 当前边log-score；验证结果为说明性示例。</text>
<rect x="40" y="200" width="140" height="68" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="110" y="228" class="head" text-anchor="middle">上下文根</text>
<text x="110" y="252" class="body" text-anchor="middle">累计 0</text>
<rect x="225" y="200" width="150" height="68" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="300" y="228" class="head" text-anchor="middle">Token 10</text>
<text x="300" y="252" class="body" text-anchor="middle">−0.10</text>
<rect x="420" y="125" width="150" height="68" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="495" y="153" class="head" text-anchor="middle">Token 11</text>
<text x="495" y="177" class="body" text-anchor="middle">−0.30</text>
<rect x="420" y="295" width="150" height="68" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="495" y="323" class="head" text-anchor="middle">Token 12</text>
<text x="495" y="347" class="body" text-anchor="middle">−1.10</text>
<rect x="615" y="125" width="150" height="68" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="690" y="153" class="head" text-anchor="middle">Token 13</text>
<text x="690" y="177" class="body" text-anchor="middle">−0.35</text>
<path id="root-to-10" d="M180 234H225" class="flow"/>
<path id="10-to-11" d="M375 220H395V159H420" class="flow"/>
<path id="10-to-12" d="M375 250H395V329H420" class="flow"/>
<path id="11-to-13" d="M570 159H615" class="flow"/>
<text x="400" y="108" class="small" text-anchor="middle">边 −0.20</text>
<text x="400" y="286" class="small" text-anchor="middle">边 −1.00</text>
<text x="669" y="108" class="small" text-anchor="middle">边 −0.05</text>
<rect x="850" y="125" width="300" height="72" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1000" y="153" class="head" text-anchor="middle">组织目标模型验证</text>
<text x="1000" y="177" class="body" text-anchor="middle">示例路径 [10, 11, 13]</text>
<path id="ranked-path-to-verify" d="M765 159H850" class="flow"/>
<rect x="850" y="270" width="300" height="72" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="1000" y="298" class="head" text-anchor="middle">连续接受：10、11</text>
<text x="1000" y="322" class="body" text-anchor="middle">13为首个拒绝位置</text>
<path id="verify-to-result" d="M1000 197V270" class="flow"/>
<rect x="850" y="400" width="300" height="72" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1000" y="428" class="head" text-anchor="middle">提交并进入下一轮</text>
<text x="1000" y="452" class="body" text-anchor="middle">10、11 ＋ 修正词元</text>
<path id="result-to-commit" d="M1000 342V400" class="flow"/>
<text x="40" y="444" class="body" text-anchor="start">叶路径10→11→13：−0.35；叶路径10→12：−1.10</text>
<text x="40" y="479" class="small" text-anchor="start">树边表示父子依赖；验证和提交使用右侧流程。</text>
</svg>
