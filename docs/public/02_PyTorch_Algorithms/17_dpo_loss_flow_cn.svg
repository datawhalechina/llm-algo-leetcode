<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">DPO 从 token 到回答级损失</title><desc id="desc">四组 token log probability 使用相同 response mask 聚合，冻结参考分支，再形成逐样本 DPO 损失和 batch 均值。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.h{font:700 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 16px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:2.5;rx:13}.f{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1500" height="470" fill="#f8fafc"/><g transform="translate(78.5 0) scale(1.119047619)"><rect width="1200" height="420" fill="#f8fafc"/><text x="38" y="42" class="h">DPO：从 Token 分数到成对偏好目标</text><text x="38" y="67" class="s">输入提示与填充位置先被排除；求和或均值口径必须在四条评分路径中保持一致。</text>
  <rect x="35" y="120" width="175" height="64" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="122" y="146" text-anchor="middle" class="l">当前策略 Token 分数</text><text x="122" y="168" text-anchor="middle" class="b">优选 / 非优选</text>
  <rect x="35" y="240" width="175" height="64" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="122" y="266" text-anchor="middle" class="l">参考模型 Token 分数</text><text x="122" y="288" text-anchor="middle" class="b">优选 / 非优选</text>
  <rect x="260" y="170" width="155" height="72" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="338" y="199" text-anchor="middle" class="l">有效回答范围</text><text x="338" y="223" text-anchor="middle" class="b">求和或均值</text>
  <rect x="465" y="120" width="175" height="64" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="552" y="146" text-anchor="middle" class="l">当前策略回答分数</text><text x="552" y="168" text-anchor="middle" class="b">优选 / 非优选</text>
  <rect x="465" y="240" width="175" height="64" class="box" fill="#eef2ff" stroke="#6366f1"/><text x="552" y="266" text-anchor="middle" class="l">参考模型回答分数</text><text x="552" y="288" text-anchor="middle" class="b">优选 / 非优选 · 冻结</text>
  <rect x="700" y="170" width="170" height="72" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="785" y="199" text-anchor="middle" class="l">两条相对偏移</text><text x="785" y="223" text-anchor="middle" class="b">Δ优选 · Δ非优选</text>
  <rect x="930" y="170" width="190" height="72" class="box" fill="#ede9fe" stroke="#6d28d9"/><text x="1025" y="199" text-anchor="middle" class="l">逐样本损失 → 均值</text><text x="1025" y="223" text-anchor="middle" class="b">softplus(−z) → batch mean</text>
  <path d="M210 152H235V190H260" class="f"/><path d="M210 272H235V222H260" class="f"/><path d="M415 190H440V152H465" class="f"/><path d="M415 222H440V272H465" class="f"/><path d="M640 152H665V194H700" class="f"/><path d="M640 272H665V218H700" class="f"/><path d="M870 206H930" class="f"/>
  </g>
</svg>
