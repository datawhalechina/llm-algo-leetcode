<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">服务采集与失败清理：初始化、正式请求、原始记录分开</title><desc id="desc">解析模型并准备服务后测量固定请求，正常路径保存原始记录并清理进程；解析、启动或请求失败时保存失败记录，同样进入进程清理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="failure" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px}.note{font-size:19px;fill:#475569}.node{rx:12;stroke:#94a3b8;stroke-width:2}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.failure{fill:none;stroke:#b45309;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#failure)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="40" y="50" class="title">服务采集与失败清理：初始化、正式请求、原始记录分开</text>
<rect x="40" y="130" width="240" height="100" class="node" fill="#dbeafe"/><text x="160" y="169" text-anchor="middle" class="head">解析模型快照</text><text x="160" y="202" text-anchor="middle" class="body">记录不可变版本</text>
<rect x="350" y="130" width="240" height="100" class="node" fill="#dcfce7"/><text x="470" y="169" text-anchor="middle" class="head">服务启动与就绪</text><text x="470" y="202" text-anchor="middle" class="body">初始化不计请求时间</text>
<rect x="660" y="130" width="240" height="100" class="node" fill="#dcfce7"/><text x="780" y="169" text-anchor="middle" class="head">预热与正式测量</text><text x="780" y="202" text-anchor="middle" class="body">保留每轮请求记录</text>
<rect x="970" y="130" width="240" height="100" class="node" fill="#ede9fe"/><text x="1090" y="169" text-anchor="middle" class="head">保存原始记录</text><text x="1090" y="202" text-anchor="middle" class="body">日志、样本与资源</text>
<rect x="1240" y="130" width="220" height="100" class="node" fill="#dbeafe"/><text x="1350" y="169" text-anchor="middle" class="head">清理服务进程</text><text x="1350" y="202" text-anchor="middle" class="body">回收本次执行资源</text>
<rect x="660" y="330" width="240" height="100" class="node" fill="#ffedd5"/><text x="780" y="369" text-anchor="middle" class="head">保存失败记录</text><text x="780" y="402" text-anchor="middle" class="body">错误阶段与修复线索</text>
<path d="M280 180H350" class="edge"/><path d="M590 180H660" class="edge"/><path d="M900 180H970" class="edge"/><path d="M1210 180H1240" class="edge"/>
<path d="M160 230V290H700V330" class="failure"/><path d="M470 230V270H740V330" class="failure"/><path d="M780 230V330" class="failure"/>
<path d="M900 380H1350V230" class="failure"/>
</svg>
