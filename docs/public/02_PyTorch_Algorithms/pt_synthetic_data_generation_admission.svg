<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">合成候选从任务蓝图进入验证准入</title>
  <desc id="desc">任务蓝图确定生成范围，生成身份绑定来源，候选经过相似度与污染检查、验证器检查后分为接纳、复核和拒绝。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 16px; fill: #334155; }
      .flow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">合成数据不是一次生成，而是一条证据链</text>

  <rect x="55" y="115" width="210" height="155" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="158" text-anchor="middle" class="label">任务蓝图</text>
  <text x="160" y="193" text-anchor="middle" class="body">能力缺口 · 输入边界</text>
  <text x="160" y="220" text-anchor="middle" class="body">难度 · 成功条件</text>

  <rect x="330" y="115" width="210" height="155" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="435" y="158" text-anchor="middle" class="label">生成身份</text>
  <text x="435" y="193" text-anchor="middle" class="body">生成器 · 模板</text>
  <text x="435" y="220" text-anchor="middle" class="body">批次 · 候选标识</text>

  <rect x="605" y="115" width="230" height="155" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="720" y="158" text-anchor="middle" class="label">数据筛查</text>
  <text x="720" y="193" text-anchor="middle" class="body">训练参考相似度</text>
  <text x="720" y="220" text-anchor="middle" class="body">冻结评测污染</text>

  <rect x="900" y="115" width="245" height="155" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1022" y="158" text-anchor="middle" class="label">验证器证据</text>
  <text x="1022" y="193" text-anchor="middle" class="body">规则 · 执行 · 质量</text>
  <text x="1022" y="220" text-anchor="middle" class="body">结果、版本与失败原因</text>

  <path d="M265 192 H330" class="flow"/>
  <path d="M540 192 H605" class="flow"/>
  <path d="M835 192 H900" class="flow"/>

  <path d="M1022 270 V318" class="flow"/>
  <path d="M1022 318 H332 V363" class="flow"/>
  <path d="M1022 318 H600 V363" class="flow"/>
  <path d="M1022 318 H868 V363" class="flow"/>

  <rect x="220" y="365" width="225" height="95" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="332" y="404" text-anchor="middle" class="label">接纳</text>
  <text x="332" y="434" text-anchor="middle" class="body">进入最终数据审计</text>

  <rect x="488" y="365" width="225" height="95" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="404" text-anchor="middle" class="label">复核</text>
  <text x="600" y="434" text-anchor="middle" class="body">检查近重复与质量</text>

  <rect x="756" y="365" width="225" height="95" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="868" y="404" text-anchor="middle" class="label">拒绝</text>
  <text x="868" y="434" text-anchor="middle" class="body">携带原因返回生成环节</text>
</svg>
