<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">合成候选来源、筛查与去向</title><desc id="desc">来源、训练及同批相似度、评测任务重合和已有验证结果共同进入候选判断。汇总全部原因后分别接纳、复核或拒绝；接纳继续进入数据字段与切分检查。</desc><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:400;fill:#0f172a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#334155}.small{font-size:15px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="43" text-anchor="middle" class="title">保存来源、检查候选，再决定怎样使用</text><text x="600" y="76" text-anchor="middle" class="small">任务要求、候选内容与每项检查结果对应到同一个样本</text><rect x="40" y="125" width="240" height="130" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="160" y="158" text-anchor="middle" class="h">任务蓝图</text><text x="160" y="188" text-anchor="middle" class="b">要补足的任务与输入范围</text><text x="160" y="213" text-anchor="middle" class="b">成功条件与版本</text><rect x="330" y="125" width="240" height="130" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="450" y="158" text-anchor="middle" class="h">候选与生成来源</text><text x="450" y="188" text-anchor="middle" class="b">指令、回答与样本标识</text><text x="450" y="213" text-anchor="middle" class="b">生成模型及模板版本</text><rect x="620" y="125" width="240" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="740" y="158" text-anchor="middle" class="h">指令比较</text><text x="740" y="188" text-anchor="middle" class="b">训练与同批其他候选</text><text x="740" y="213" text-anchor="middle" class="b">固定评测任务重合</text><rect x="910" y="125" width="250" height="130" rx="14" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/><text x="1035" y="158" text-anchor="middle" class="h">汇总验证结果与原因</text><text x="1035" y="188" text-anchor="middle" class="b">必需检查、质量分数</text><text x="1035" y="213" text-anchor="middle" class="b">保留全部未通过原因</text><path class="flow" d="M280 190 H330"/><path class="flow" d="M570 190 H620"/><path class="flow" d="M860 190 H910"/><rect x="100" y="365" width="260" height="110" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="230" y="398" text-anchor="middle" class="h">接纳</text><text x="230" y="428" text-anchor="middle" class="b">全部检查通过</text><text x="230" y="453" text-anchor="middle" class="b">继续字段、重复与切分审计</text><rect x="470" y="365" width="260" height="110" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="600" y="398" text-anchor="middle" class="h">复核</text><text x="600" y="428" text-anchor="middle" class="b">近重复或中间质量分数</text><text x="600" y="453" text-anchor="middle" class="b">检查任务价值与回答</text><rect x="840" y="365" width="260" height="110" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="970" y="398" text-anchor="middle" class="h">拒绝</text><text x="970" y="428" text-anchor="middle" class="b">空内容、评测重合等</text><text x="970" y="453" text-anchor="middle" class="b">按原因修改或移除</text><path class="flow" d="M985 255 V295 H230 V365"/><path class="flow" d="M1040 255 V315 H600 V365"/><path class="flow" d="M1100 255 V335 H970 V365"/>
</svg>
