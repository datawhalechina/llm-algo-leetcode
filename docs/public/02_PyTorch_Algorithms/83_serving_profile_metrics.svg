<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Serving profile metrics and constraints</title><desc id="desc">Latency, balanced and throughput profiles each use a different primary metric while sharing resource and failure guardrails.</desc>
  <style>text{font-family:"Noto Sans","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#536174}.label{font-size:16px;font-weight:700}.body{font-size:13px;fill:#45556d}.tiny{font-size:12px;fill:#536174}.box{stroke:#9ba9bc;stroke-width:1.5;rx:13}.line{fill:none;stroke:#62728a;stroke-width:2}</style>
  <rect width="1120" height="470" fill="#fff"/><text x="48" y="48" class="title">Primary metric changes with the request objective</text><text x="48" y="73" class="sub">The same guardrails prevent a gain in one metric from hiding an unacceptable service cost.</text>
  <rect x="72" y="132" width="260" height="152" class="box" fill="#eaf8f1"/><text x="202" y="164" class="label" text-anchor="middle">Latency profile</text><text x="202" y="191" class="body" text-anchor="middle">Primary: TTFT P50 / P95</text><text x="202" y="214" class="body" text-anchor="middle">Guard: TPOT · failures</text><text x="202" y="239" class="tiny" text-anchor="middle">concurrency 1, short request</text>
  <rect x="430" y="132" width="260" height="152" class="box" fill="#fff3d9"/><text x="560" y="164" class="label" text-anchor="middle">Balanced profile</text><text x="560" y="191" class="body" text-anchor="middle">Primary: TTFT + TPOT</text><text x="560" y="214" class="body" text-anchor="middle">Guard: P95 · memory · queue</text><text x="560" y="239" class="tiny" text-anchor="middle">moderate concurrency, mixed request</text>
  <rect x="788" y="132" width="260" height="152" class="box" fill="#f3ebff"/><text x="918" y="164" class="label" text-anchor="middle">Throughput profile</text><text x="918" y="191" class="body" text-anchor="middle">Primary: output tokens / second</text><text x="918" y="214" class="body" text-anchor="middle">Guard: P95 · queue · OOM</text><text x="918" y="239" class="tiny" text-anchor="middle">high concurrency or long generation</text>
  <path d="M202 284 V340 H462" class="line"/><path d="M452 335 L462 340 L452 345 Z" fill="#62728a"/><path d="M560 284 V332" class="line"/><path d="M555 332 L560 342 L565 332 Z" fill="#62728a"/><path d="M918 284 V340 H658" class="line"/><path d="M658 335 L648 340 L658 345 Z" fill="#62728a"/>
  <rect x="430" y="342" width="260" height="72" class="box" fill="#e8f0ff"/><text x="560" y="371" class="label" text-anchor="middle">Shared evidence fields</text><text x="560" y="395" class="body" text-anchor="middle">artifact lineage · backend · peak memory · queue · failure</text>
</svg>
