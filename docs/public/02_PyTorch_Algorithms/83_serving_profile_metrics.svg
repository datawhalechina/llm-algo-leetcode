<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">同一场景内先筛选，再比较主指标</title><desc id="desc">候选记录先固定产物和场景，筛除未达所有服务目标的记录，再按主指标方向排序；持平时比较归一化余量。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1240" height="600" fill="#f8fafc"/><text x="620" y="43" text-anchor="middle" class="title">同一场景内先筛选，再比较主指标</text>
<rect x="65" y="125" width="270" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="200" y="157" text-anchor="middle" class="h">同场景候选</text><text x="200" y="184" text-anchor="middle">相同产物与请求压力</text>
<rect x="485" y="125" width="270" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="620" y="157" text-anchor="middle" class="h">核对全部服务目标</text><text x="620" y="184" text-anchor="middle">上限不超，下限达标</text>
<rect x="905" y="125" width="270" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1040" y="157" text-anchor="middle" class="h">比较主指标</text><text x="1040" y="184" text-anchor="middle">延迟取小，吞吐取大</text>
<path d="M335 170H485" class="e"/>
<path d="M755 170H905" class="e"/>
<rect x="65" y="365" width="270" height="90" rx="13" fill="#fbeceb" stroke="#b85c57" stroke-width="2"/><text x="200" y="397" text-anchor="middle" class="h">保留排除原因</text><text x="200" y="424" text-anchor="middle">失败、错配或指标未达标</text>
<rect x="485" y="365" width="270" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="620" y="397" text-anchor="middle" class="h">选中记录</text><text x="620" y="424" text-anchor="middle">保存指标和适用场景</text>
<rect x="905" y="365" width="270" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1040" y="397" text-anchor="middle" class="h">主指标持平</text><text x="1040" y="424" text-anchor="middle">比较各项归一化余量之和</text>
<path d="M620 215V280H200V365" class="e"/>
<path d="M1040 215V365" class="e"/>
<path d="M905 410H755" class="e"/>
<path d="M905 195H850V325H620V365" class="e"/>
<text x="1065" y="285" text-anchor="middle" class="s">持平</text>
<text x="800" y="310" text-anchor="middle" class="s">直接选出更优者</text>
<text x="620" y="520" text-anchor="middle" class="s">余量：上限 − 实测值，或实测值 − 下限，再按门槛尺度归一化</text>
<text x="620" y="554" text-anchor="middle" class="s">本图为 CPU 多候选选择规则；真实压测先为每类固定场景取得完整记录</text>
</svg>
