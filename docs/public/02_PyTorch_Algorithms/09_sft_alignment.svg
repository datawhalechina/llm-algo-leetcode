<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">SFT 数据与损失对齐</title>
  <desc id="desc">展示 prompt、response、EOS、padding、attention mask、labels 以及 next-token shift 在监督微调中的对齐关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 30px "Inter", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .sub { font: 500 16px "Inter", "Noto Sans SC", sans-serif; fill: #475569; }
      .label { font: 700 18px "Inter", "Noto Sans SC", sans-serif; fill: #111827; }
      .small { font: 500 14px "Inter", "Noto Sans SC", sans-serif; fill: #334155; }
      .axis { stroke: #64748b; stroke-width: 3; }
      .box { stroke-width: 2.5; rx: 14; ry: 14; }
      .chip { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 12; ry: 12; }
    </style>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <text x="64" y="66" class="title">SFT 数据对齐：input_ids、attention_mask、labels</text>
  <text x="64" y="96" class="sub">Prompt 提供上下文，response 提供监督；padding 被忽略，logits 与 labels 错开一位计算 next-token loss。</text>

  <text x="70" y="160" class="label">Token 位置</text>
  <line x1="220" y1="154" x2="1460" y2="154" class="axis"/>
  <g>
    <rect x="220" y="120" width="150" height="70" class="box" fill="#fff7ed" stroke="#f59e0b"/>
    <rect x="380" y="120" width="150" height="70" class="box" fill="#fff7ed" stroke="#f59e0b"/>
    <rect x="540" y="120" width="150" height="70" class="box" fill="#fff7ed" stroke="#f59e0b"/>
    <rect x="700" y="120" width="150" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/>
    <rect x="860" y="120" width="150" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/>
    <rect x="1020" y="120" width="150" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/>
    <rect x="1180" y="120" width="150" height="70" class="box" fill="#ecfccb" stroke="#65a30d"/>
    <rect x="1340" y="120" width="120" height="70" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
    <rect x="1460" y="120" width="70" height="70" class="box" fill="#e2e8f0" stroke="#94a3b8"/>

    <text x="295" y="150" text-anchor="middle" class="label">prompt</text>
    <text x="455" y="150" text-anchor="middle" class="label">prompt</text>
    <text x="615" y="150" text-anchor="middle" class="label">prompt</text>
    <text x="775" y="150" text-anchor="middle" class="label">response</text>
    <text x="935" y="150" text-anchor="middle" class="label">response</text>
    <text x="1095" y="150" text-anchor="middle" class="label">response</text>
    <text x="1255" y="150" text-anchor="middle" class="label">response</text>
    <text x="1400" y="150" text-anchor="middle" class="label">EOS</text>
    <text x="1495" y="150" text-anchor="middle" class="label">pad</text>
  </g>

  <rect x="70" y="230" width="1460" height="90" class="chip"/>
  <text x="96" y="262" class="label">input_ids</text>
  <text x="310" y="262" class="small">prompt token ids + response token ids + EOS + padding</text>
  <text x="96" y="292" class="label">attention_mask</text>
  <text x="310" y="292" class="small">真实 token 为 1，padding 为 0</text>

  <rect x="70" y="360" width="1460" height="100" class="chip"/>
  <text x="96" y="392" class="label">labels</text>
  <text x="220" y="392" class="small">prompt 和 padding 位置 → -100</text>
  <text x="220" y="422" class="small">response / EOS 保留原 token id</text>
  <text x="96" y="450" class="label">loss 目标</text>
  <text x="220" y="450" class="small">错位一位后：logits[t] → labels[t+1]</text>

  <rect x="70" y="500" width="1460" height="120" class="chip"/>
  <text x="96" y="536" class="label">说明</text>
  <text x="120" y="574" class="small">Prompt 提供上下文，response / EOS 提供监督；padding 在当前 mask 配置下不参与 attention 和 loss。</text>
  <text x="120" y="604" class="small">截断后仍需保留有效监督 token。</text>
</svg>
