<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Quantized serving profile evidence flow</title><desc id="desc">A gated artifact and same workload deployment evidence feed three serving profiles, which create profile specific recommendations.</desc>
  <style>text{font-family:"Noto Sans","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#536174}.label{font-size:16px;font-weight:700}.body{font-size:13px;fill:#45556d}.tiny{font-size:12px;fill:#536174}.box{stroke:#9ba9bc;stroke-width:1.5;rx:13}.group{fill:#f7f9fc;stroke:#d6deea;stroke-width:1.5;rx:16}.line{fill:none;stroke:#62728a;stroke-width:2}</style>
  <rect width="1120" height="520" fill="#fff"/><text x="48" y="48" class="title">One artifact, three serving objectives</text><text x="48" y="73" class="sub">Keep lineage fixed; vary workload and serving configuration only within each profile.</text>
  <rect x="54" y="165" width="170" height="92" class="box" fill="#e8f0ff"/><text x="139" y="196" class="label" text-anchor="middle">82 gate</text><text x="139" y="220" class="body" text-anchor="middle">artifact + quality</text><text x="139" y="240" class="body" text-anchor="middle">loader evidence</text>
  <path d="M224 211 H300" class="line"/><path d="M290 206 L300 211 L290 216 Z" fill="#62728a"/>
  <rect x="302" y="165" width="190" height="92" class="box" fill="#eef4fa"/><text x="397" y="196" class="label" text-anchor="middle">66 → 67</text><text x="397" y="220" class="body" text-anchor="middle">float baseline +</text><text x="397" y="240" class="body" text-anchor="middle">same-workload deploy</text>
  <path d="M492 211 H570" class="line"/><path d="M560 206 L570 211 L560 216 Z" fill="#62728a"/>
  <rect x="572" y="112" width="496" height="220" class="group"/><text x="598" y="144" class="label">83 · quantized Serving profiles</text>
  <rect x="600" y="174" width="132" height="94" class="box" fill="#eaf8f1"/><text x="666" y="204" class="label" text-anchor="middle">Latency</text><text x="666" y="228" class="body" text-anchor="middle">TTFT / P95</text><text x="666" y="248" class="tiny" text-anchor="middle">short, interactive</text>
  <rect x="754" y="174" width="132" height="94" class="box" fill="#fff3d9"/><text x="820" y="204" class="label" text-anchor="middle">Balanced</text><text x="820" y="228" class="body" text-anchor="middle">TTFT / TPOT</text><text x="820" y="248" class="tiny" text-anchor="middle">mixed workload</text>
  <rect x="908" y="174" width="132" height="94" class="box" fill="#f3ebff"/><text x="974" y="204" class="label" text-anchor="middle">Throughput</text><text x="974" y="228" class="body" text-anchor="middle">tokens / second</text><text x="974" y="248" class="tiny" text-anchor="middle">batch-oriented</text>
  <path d="M666 268 V372 H790" class="line"/><path d="M780 367 L790 372 L780 377 Z" fill="#62728a"/><path d="M820 268 V364" class="line"/><path d="M815 364 L820 374 L825 364 Z" fill="#62728a"/><path d="M974 268 V372 H850" class="line"/><path d="M850 367 L840 372 L850 377 Z" fill="#62728a"/>
  <rect x="710" y="374" width="220" height="72" class="box" fill="#e8f0ff"/><text x="820" y="404" class="label" text-anchor="middle">Profile-specific choice</text><text x="820" y="428" class="body" text-anchor="middle">SLO → accept / tune / reject</text>
  <text x="48" y="485" class="tiny">Profiles are not a universal ranking: a throughput configuration may be unsuitable for interactive latency SLOs.</text>
</svg>
