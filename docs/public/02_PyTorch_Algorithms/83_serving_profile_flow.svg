<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">固定量化部署，分别测量三类请求压力</title><desc id="desc">同一部署输入分别进入延迟、均衡和吞吐场景，三类测量齐全后按各自服务目标登记达标范围。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1240" height="600" fill="#f8fafc"/><text x="620" y="43" text-anchor="middle" class="title">固定量化部署，分别测量三类请求压力</text>
<rect x="380" y="100" width="480" height="85" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="620" y="132" text-anchor="middle" class="h">已接受的量化部署</text><text x="620" y="159" text-anchor="middle">模型、产物、后端与设备身份</text>
<rect x="60" y="270" width="280" height="100" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="200" y="302" text-anchor="middle" class="h">延迟优先</text><text x="200" y="329" text-anchor="middle">低并发、短输出；首响应</text>
<rect x="480" y="270" width="280" height="100" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="620" y="302" text-anchor="middle" class="h">均衡场景</text><text x="620" y="329" text-anchor="middle">中并发；输出间隔与吞吐</text>
<rect x="900" y="270" width="280" height="100" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1040" y="302" text-anchor="middle" class="h">吞吐优先</text><text x="1040" y="329" text-anchor="middle">高并发、较长输出</text>
<path d="M440 185V220H200V270" class="e"/>
<path d="M620 185V270" class="e"/>
<path d="M800 185V220H1040V270" class="e"/>
<rect x="270" y="460" width="700" height="95" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="620" y="492" text-anchor="middle" class="h">核对测量完整性，分别判断服务目标</text><text x="620" y="519" text-anchor="middle">三类测齐后汇总接受，仅列出实际达标场景</text>
<path d="M200 370V410H420V460" class="e"/>
<path d="M620 370V460" class="e"/>
<path d="M1040 370V410H820V460" class="e"/>
<text x="620" y="585" text-anchor="middle" class="s">当前真实矩阵每类一份固定配置并重复测量；跨场景不作统一排名</text>
</svg>
