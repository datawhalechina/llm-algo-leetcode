<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">前缀复用：先确认状态相容，再查找已保存的对象</title><desc id="desc">匹配从请求开头进行，只有已登记且可读取的前缀状态可以复用，剩余后缀继续计算。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#365269}.box{stroke-width:2;rx:15}.edge{fill:none;stroke:#52657a;stroke-width:2.4;marker-end:url(#arrow)}</style></defs><rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" class="title">前缀复用：先确认状态相容，再查找已保存的对象</text>
<rect x="40" y="130" width="230" height="110" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="155" y="162" text-anchor="middle" class="label">新请求</text><text x="155" y="191" text-anchor="middle" class="small">提示词元与计算条件</text>
<rect x="325" y="130" width="240" height="110" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="445" y="162" text-anchor="middle" class="label">缓存身份相同</text><text x="445" y="191" text-anchor="middle" class="small">权重、位置、精度与权限</text>
<rect x="620" y="130" width="250" height="110" class="box" fill="#f2edfb" stroke="#8066b3"/><text x="745" y="162" text-anchor="middle" class="label">查找可用的最长对象</text><text x="745" y="191" text-anchor="middle" class="small">从请求开头连续匹配</text>
<rect x="930" y="90" width="230" height="110" class="box" fill="#eaf7ef" stroke="#4e8a68"/><text x="1045" y="122" text-anchor="middle" class="label">命中前缀</text><text x="1045" y="151" text-anchor="middle" class="small">确认 K/V 驻留与引用</text>
<rect x="930" y="280" width="230" height="110" class="box" fill="#fff6e8" stroke="#c9852f"/><text x="1045" y="312" text-anchor="middle" class="label">未命中后缀</text><text x="1045" y="341" text-anchor="middle" class="small">继续预填充并产生新状态</text>
<path d="M270 185H325" class="edge"/>
<path d="M565 185H620" class="edge"/>
<path d="M870 170H900V145H930" class="edge"/>
<path d="M870 205H900V335H930" class="edge"/>
<text x="600" y="465" text-anchor="middle" class="small">匹配范围、实际跳过的计算量和物理占用分别记录；文本相同不是全部复用条件</text>
</svg>
