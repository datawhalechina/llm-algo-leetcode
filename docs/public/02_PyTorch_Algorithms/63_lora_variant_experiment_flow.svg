<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 候选从定义到交付的实验链</title><desc id="desc">候选经过同条件筛选、配对复测、质量等价判断和低代价选择。</desc>
  <defs><marker id="neutral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px;fill:#334155}.neutral,.green,.red,.amber{fill:none;stroke-width:3}.neutral{stroke:#475569;marker-end:url(#neutral)}.green{stroke:#16a34a;marker-end:url(#green)}.red{stroke:#dc2626;marker-end:url(#red)}.amber{stroke:#d97706;marker-end:url(#amber)}</style></defs>
  <rect width="1200" height="520" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">LoRA 配置不能只看一次损失排名</text>
  <rect x="45" y="120" width="185" height="125" rx="15" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="137" y="158" text-anchor="middle" class="h">秩候选矩阵</text><text x="137" y="190" text-anchor="middle" class="b">秩 4 / 8 / 16</text><text x="137" y="217" text-anchor="middle" class="b">固定α，系数随秩变</text>
  <rect x="275" y="120" width="185" height="125" rx="15" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="367" y="158" text-anchor="middle" class="h">同条件筛选</text><text x="367" y="190" text-anchor="middle" class="b">固定模型、数据</text><text x="367" y="217" text-anchor="middle" class="b">训练预算与评测集</text>
  <rect x="505" y="120" width="185" height="125" rx="15" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/><text x="597" y="158" text-anchor="middle" class="h">配对复测</text><text x="597" y="190" text-anchor="middle" class="b">相同随机种子集合</text><text x="597" y="217" text-anchor="middle" class="b">记录失败与波动</text>
  <rect x="735" y="120" width="185" height="125" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="827" y="158" text-anchor="middle" class="h">质量等价区间</text><text x="827" y="190" text-anchor="middle" class="b">共享种子配对差</text><text x="827" y="217" text-anchor="middle" class="b">是否落入预设区间</text>
  <rect x="965" y="120" width="190" height="125" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="1060" y="158" text-anchor="middle" class="h">方案交付</text><text x="1060" y="190" text-anchor="middle" class="b">质量近似时</text><text x="1060" y="217" text-anchor="middle" class="b">选择更低代价</text>
  <path class="neutral" d="M230 182 H265"/><path class="neutral" d="M460 182 H495"/><path class="neutral" d="M690 182 H725"/><path class="neutral" d="M920 182 H955"/>
  <rect x="262" y="335" width="210" height="95" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="367" y="372" text-anchor="middle" class="h">无合格候选</text><text x="367" y="402" text-anchor="middle" class="b">拒绝本轮选型</text>
  <rect x="492" y="335" width="210" height="95" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="597" y="372" text-anchor="middle" class="h">复测不足或不稳定</text><text x="597" y="402" text-anchor="middle" class="b">补充实验</text>
  <rect x="955" y="335" width="210" height="95" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="1060" y="372" text-anchor="middle" class="h">证据完整</text><text x="1060" y="402" text-anchor="middle" class="b">输出选型清单</text>
  <path class="red" d="M367 245 V325"/><path class="amber" d="M597 245 V325"/><path class="green" d="M1060 245 V325"/>
</svg>
