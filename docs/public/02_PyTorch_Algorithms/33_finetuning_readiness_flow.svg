<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc">
  <title id="title">从稳定失败到最小充分干预的分支决策</title>
  <desc id="desc">先确认失败证据，再判断不修改模型参数的方案能否解决；不能解决时区分表示、行为和反馈缺口，检查各分支前置条件后回到固定失败切片复测。</desc>
  <defs>
    <style>
      .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0F172A}.sub{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
      .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700}.body{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;fill:#334155}
      .label{font-family:"Noto Sans CJK SC",sans-serif;font-size:14px;font-weight:700;fill:#475569}.edge{fill:none;stroke:#475569;stroke-width:2.4}
    </style>
  </defs>
  <rect width="1500" height="580" fill="#F8FAFC"/>
  <rect x="28" y="24" width="1444" height="532" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="68" class="title">后训练准入：失败根因决定最小充分干预</text>
  <text x="62" y="98" class="sub">提示、检索和工具先作为对照；只有稳定残留的参数内缺口才进入训练分支。</text>

  <rect x="60" y="235" width="210" height="112" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="165" y="270" text-anchor="middle" class="head" fill="#1E3A8A">稳定失败证据</text>
  <text x="165" y="301" text-anchor="middle" class="body">固定目标、工作负载</text>
  <text x="165" y="325" text-anchor="middle" class="body">失败切片与独立评测</text>

  <polygon points="420,211 540,291 420,371 300,291" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="280" text-anchor="middle" class="head" fill="#5B21B6">不修改模型参数</text>
  <text x="420" y="306" text-anchor="middle" class="head" fill="#5B21B6">能解决吗？</text>

  <rect x="570" y="112" width="530" height="122" rx="18" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="2"/>
  <text x="594" y="137" class="label">按失败根因选择一种无需训练的方案</text>
  <rect x="590" y="150" width="150" height="66" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="665" y="177" text-anchor="middle" class="head" fill="#075985">提示模板</text>
  <text x="665" y="201" text-anchor="middle" class="body">表达与格式</text>
  <rect x="760" y="150" width="150" height="66" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="835" y="177" text-anchor="middle" class="head" fill="#075985">检索增强</text>
  <text x="835" y="201" text-anchor="middle" class="body">外部与时效知识</text>
  <rect x="930" y="150" width="150" height="66" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="1005" y="177" text-anchor="middle" class="head" fill="#075985">外部工具</text>
  <text x="1005" y="201" text-anchor="middle" class="body">查询、计算与动作</text>

  <polygon points="650,376 745,439 650,502 555,439" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="650" y="429" text-anchor="middle" class="head" fill="#92400E">参数内缺口</text>
  <text x="650" y="455" text-anchor="middle" class="head" fill="#92400E">属于哪一类？</text>

  <rect x="775" y="377" width="535" height="132" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="799" y="402" class="label">按缺口与反馈条件选择一种训练分支</text>
  <rect x="795" y="416" width="148" height="74" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="869" y="445" text-anchor="middle" class="head" fill="#9A3412">表示缺口</text>
  <text x="869" y="471" text-anchor="middle" class="body">持续预训练</text>
  <rect x="963" y="416" width="148" height="74" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="1037" y="443" text-anchor="middle" class="head" fill="#9A3412">行为缺口</text>
  <text x="1037" y="467" text-anchor="middle" class="body">SFT 数据需求单</text>
  <text x="1037" y="487" text-anchor="middle" class="body">进入数据准入审计</text>
  <rect x="1131" y="409" width="159" height="88" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="1210" y="437" text-anchor="middle" class="head" fill="#9A3412">反馈缺口</text>
  <text x="1210" y="462" text-anchor="middle" class="body">离线偏好优化</text>
  <text x="1210" y="484" text-anchor="middle" class="body">在线 RL / RLVR</text>

  <rect x="1140" y="232" width="174" height="118" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="1227" y="266" text-anchor="middle" class="head" fill="#991B1B">分支前置条件</text>
  <text x="1227" y="296" text-anchor="middle" class="body">数据 / 反馈 / 评测</text>
  <text x="1227" y="321" text-anchor="middle" class="body">资源 / 恢复 / 回滚</text>

  <polygon points="1390,232 1450,291 1390,350 1330,291" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="1390" y="283" text-anchor="middle" class="head" fill="#166534">固定切片</text>
  <text x="1390" y="309" text-anchor="middle" class="head" fill="#166534">复测达标？</text>
  <text x="1382" y="205" class="label">达标：停止</text>

  <path d="M270 291H300" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="300,291 291,286 291,296" fill="#475569"/>
  <path d="M420 211V173H570" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="570,173 561,168 561,178" fill="#475569"/>
  <text x="515" y="220" class="label">能</text>
  <path d="M1100 173H1120V266H1140" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="1140,266 1131,261 1131,271" fill="#475569"/>
  <path d="M420 371V439H555" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="555,439 546,434 546,444" fill="#475569"/>
  <text x="515" y="391" class="label">不能</text>
  <path d="M745 439H775" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="775,439 766,434 766,444" fill="#475569"/>
  <path d="M1227 377V350" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="1227,350 1222,359 1232,359" fill="#475569"/>
  <path d="M1314 291H1330" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="1330,291 1321,286 1321,296" fill="#475569"/>
  <path d="M1390 232V214" fill="none" stroke="#475569" stroke-width="2.4"/>
  <polygon points="1390,214 1385,223 1395,223" fill="#475569"/>

  <path d="M1390 350V530H165V347" fill="none" stroke="#7C3AED" stroke-width="2.3" stroke-dasharray="8 6"/>
  <polygon points="165,347 160,356 170,356" fill="#7C3AED"/>
  <text x="650" y="550" fill="#6D28D9" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700">未达标：带着新的失败证据重新诊断，不按固定算法顺序升级</text>
</svg>
