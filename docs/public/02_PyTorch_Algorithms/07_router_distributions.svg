<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">概率偏好与离散派发的差别</title><desc id="desc">四Token每行概率为0.26、0.25、0.25、0.24，Top1均选专家0。分配为4、0、0、0。构造容量2时专家0超额2次。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker><marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.read{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#blue)}.grad{stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}.control{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#purple)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">平均概率接近均匀，Top-1派发仍可能集中到同一专家</text>
<text x="55" y="80" class="sub" text-anchor="start">构造例：4个Token、4个专家；每个Token的概率均为[0.26, 0.25, 0.25, 0.24]。</text>
<rect x="55" y="120" width="420" height="285" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="545" y="120" width="420" height="285" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="1035" y="120" width="410" height="285" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="265" y="151" class="head" text-anchor="middle">平均概率 Pᵢ</text>
<text x="755" y="151" class="head" text-anchor="middle">实际Top-1派发计数</text>
<line x1="100" y1="340" x2="445" y2="340" stroke="#e2e8f0" data-layout-role="decoration"/><text x="84" y="345" class="small" text-anchor="middle">0.0</text>
<line x1="100" y1="280" x2="445" y2="280" stroke="#e2e8f0" data-layout-role="decoration"/><text x="84" y="285" class="small" text-anchor="middle">0.1</text>
<line x1="100" y1="220" x2="445" y2="220" stroke="#e2e8f0" data-layout-role="decoration"/><text x="84" y="225" class="small" text-anchor="middle">0.2</text>
<line x1="100" y1="160" x2="445" y2="160" stroke="#e2e8f0" data-layout-role="decoration"/><text x="84" y="165" class="small" text-anchor="middle">0.3</text>
<g data-layout-role="glyph-group"><rect data-expert="0" data-prob="0.26" x="120" y="184" width="50" height="156" fill="#dbeafe" stroke="#2563eb"/><text x="145" y="174" class="small" text-anchor="middle">0.26</text>
<text x="145" y="369" class="body" text-anchor="middle">E0</text>
</g>
<g data-layout-role="glyph-group"><rect data-count="4" x="610" y="160" width="50" height="180" fill="#dbeafe" stroke="#2563eb"/><rect x="610" y="160" width="50" height="90" fill="#fee2e2" stroke="#e11d48"/></g>
<text x="635" y="365" class="head" text-anchor="middle">4</text>
<text x="635" y="390" class="body" text-anchor="middle">E0</text>
<g data-layout-role="glyph-group"><rect data-expert="1" data-prob="0.25" x="205" y="190" width="50" height="150" fill="#dbeafe" stroke="#2563eb"/><text x="230" y="180" class="small" text-anchor="middle">0.25</text>
<text x="230" y="369" class="body" text-anchor="middle">E1</text>
</g>
<line x1="695" y1="340" x2="745" y2="340" stroke="#2563eb" stroke-width="2" data-layout-role="decoration"/><text x="720" y="365" class="head" text-anchor="middle">0</text>
<text x="720" y="390" class="body" text-anchor="middle">E1</text>
<g data-layout-role="glyph-group"><rect data-expert="2" data-prob="0.25" x="290" y="190" width="50" height="150" fill="#dbeafe" stroke="#2563eb"/><text x="315" y="180" class="small" text-anchor="middle">0.25</text>
<text x="315" y="369" class="body" text-anchor="middle">E2</text>
</g>
<line x1="780" y1="340" x2="830" y2="340" stroke="#2563eb" stroke-width="2" data-layout-role="decoration"/><text x="805" y="365" class="head" text-anchor="middle">0</text>
<text x="805" y="390" class="body" text-anchor="middle">E2</text>
<g data-layout-role="glyph-group"><rect data-expert="3" data-prob="0.24" x="375" y="196" width="50" height="144" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="186" class="small" text-anchor="middle">0.24</text>
<text x="400" y="369" class="body" text-anchor="middle">E3</text>
</g>
<line x1="865" y1="340" x2="915" y2="340" stroke="#2563eb" stroke-width="2" data-layout-role="decoration"/><text x="890" y="365" class="head" text-anchor="middle">0</text>
<text x="890" y="390" class="body" text-anchor="middle">E3</text>
<line x1="595" y1="250" x2="945" y2="250" stroke="#e11d48" stroke-dasharray="7 5" stroke-width="2" data-layout-role="decoration"/><text x="800" y="239" class="small" text-anchor="middle">构造容量线：每专家2次分配</text>
<text x="1060" y="156" class="head" text-anchor="start">同一批次的三种读法</text>
<text x="1060" y="202" class="body" text-anchor="start">P = [0.26, 0.25, 0.25, 0.24]</text>
<text x="1060" y="247" class="body" text-anchor="start">分配计数 = [4, 0, 0, 0]</text>
<text x="1060" y="292" class="body" text-anchor="start">f = [1, 0, 0, 0]</text>
<text x="1060" y="337" class="body" text-anchor="start">容量设为2 → E₀超额2次</text>
<text x="1060" y="379" class="small" text-anchor="start">红色部分表示构造例的超额分配</text>
<text x="55" y="442" class="sub" text-anchor="start">Pᵢ描述概率偏好；fᵢ描述离散选择；容量线说明这些选择是否能被当前专家槽位接纳。</text>
</svg>
