<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">MoE 负载均衡训练机制</title>
  <desc id="desc">路由分布经过统计形成负载均衡损失，反向传播后约束路由器避免专家塌缩。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#ecfdf5"/></linearGradient>
    <style>
      .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .label { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
      .box { stroke-width: 3; rx: 18; ry: 18; }
      .flow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <text x="60" y="60" class="title">MoE 负载均衡：将专家拥塞转成训练信号</text>
  <text x="60" y="90" class="sub">统计“路由器想选谁”和“实际分给谁”，把专家拥塞转成可优化的训练信号</text>

  <rect x="70" y="250" width="220" height="100" class="box" fill="#fff7ed" stroke="#f59e0b"/><text x="180" y="290" text-anchor="middle" class="label">路由输出</text><text x="180" y="318" text-anchor="middle" class="small">概率 P 与 Top-K 分配</text>
  <rect x="360" y="180" width="240" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="480" y="220" text-anchor="middle" class="label">概率分布 P</text><text x="480" y="248" text-anchor="middle" class="small">路由器的偏好</text>
  <rect x="360" y="390" width="240" height="100" class="box" fill="#eff6ff" stroke="#3b82f6"/><text x="480" y="430" text-anchor="middle" class="label">分配比例 f</text><text x="480" y="458" text-anchor="middle" class="small">实际专家负载</text>
  <rect x="700" y="250" width="250" height="100" class="box" fill="#f5f3ff" stroke="#8b5cf6"/><text x="825" y="290" text-anchor="middle" class="label">辅助损失</text><text x="825" y="318" text-anchor="middle" class="small">比较 P 与 f 的偏斜</text>
  <rect x="1050" y="250" width="220" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/><text x="1160" y="290" text-anchor="middle" class="label">总损失</text><text x="1160" y="318" text-anchor="middle" class="small">任务损失 + 辅助项</text>
  <rect x="1360" y="250" width="170" height="100" class="box" fill="#fff1f2" stroke="#e11d48"/><text x="1445" y="290" text-anchor="middle" class="label">更新路由器</text><text x="1445" y="318" text-anchor="middle" class="small">反向传播</text>

  <path d="M290 300 C325 300 325 230 360 230" class="flow"/><path d="M290 300 C325 300 325 440 360 440" class="flow"/><path d="M600 230 C650 230 660 300 700 300" class="flow"/><path d="M600 440 C650 440 660 300 700 300" class="flow"/><path d="M950 300 L1050 300" class="flow"/><path d="M1270 300 L1360 300" class="flow"/>
</svg>
