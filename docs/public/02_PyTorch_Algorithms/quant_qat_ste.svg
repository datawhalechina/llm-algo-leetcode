<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">前向保留离散值，反向使用近似梯度</title><desc id="desc">前向从浮点输入经裁剪、舍入和恢复到后续计算；反向从损失回到输入，绕过舍入导数，但保留裁剪的饱和梯度。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1080" height="460" fill="#f8fafc"/><text x="540" y="43" text-anchor="middle" class="title">前向保留离散值，反向使用近似梯度</text>
<rect x="35" y="95" width="150" height="80" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="110" y="141" text-anchor="middle" class="h">浮点输入</text>
<rect x="250" y="95" width="150" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="325" y="141" text-anchor="middle" class="h">裁剪到范围</text>
<rect x="465" y="95" width="150" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="540" y="141" text-anchor="middle" class="h">缩放与舍入</text>
<rect x="680" y="95" width="150" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="755" y="141" text-anchor="middle" class="h">恢复浮点近似</text>
<rect x="895" y="95" width="150" height="80" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="970" y="141" text-anchor="middle" class="h">后续计算</text>
<path d="M185 135H250" class="e"/>
<path d="M400 135H465" class="e"/>
<path d="M615 135H680" class="e"/>
<path d="M830 135H895" class="e"/>
<rect x="35" y="310" width="230" height="85" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="150" y="342" text-anchor="middle" class="h">传回输入的梯度</text><text x="150" y="369" text-anchor="middle">区间内直通，饱和区为 0</text>
<rect x="425" y="310" width="230" height="85" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="540" y="342" text-anchor="middle" class="h">保留裁剪梯度</text><text x="540" y="369" text-anchor="middle">绕过离散舍入的导数</text>
<rect x="815" y="310" width="230" height="85" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="930" y="342" text-anchor="middle" class="h">反向上游梯度</text><text x="930" y="369" text-anchor="middle">从后续损失传来</text>
<path d="M970 175V310" class="d"/>
<path d="M815 352H655" class="d"/>
<path d="M425 352H265" class="d"/>
<text x="540" y="438" text-anchor="middle" class="s">例：范围 −1 到 1，输入 0.5 继续传梯度，输入 2 在裁剪处截断</text>
</svg>
