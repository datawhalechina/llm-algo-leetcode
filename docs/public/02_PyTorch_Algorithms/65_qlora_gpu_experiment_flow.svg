<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
<title id="title">QLoRA 固定批次比较与容量阶梯</title><desc id="desc">共享模型数据和适配器配置。固定批次三种子交替配对比较质量、速度和显存；容量阶梯单独增加微批次并记录成功或显存不足，形成不同用途的决定。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a;font-weight:400}.title{font-size:25px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:15px;fill:#334155}.small{font-size:14px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="1080" height="520" fill="#f8fafc"/>
<text x="540" y="38" text-anchor="middle" class="title">同一训练任务，两种测量问题</text><rect x="300" y="70" width="480" height="88" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="540" y="100" text-anchor="middle" class="h">共同条件</text><text x="540" y="127" text-anchor="middle" class="b">模型提交、数据切分、适配器配置与序列长度</text><rect x="40" y="220" width="450" height="100" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="265" y="250" text-anchor="middle" class="h">固定批次：比较质量与速度</text><text x="265" y="277" text-anchor="middle" class="b">固定有效批次、步数和共享种子</text><text x="265" y="301" text-anchor="middle" class="b">每个种子配对，先后顺序交替</text><rect x="590" y="220" width="450" height="100" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="815" y="250" text-anchor="middle" class="h">容量阶梯：寻找可行批次</text><text x="815" y="277" text-anchor="middle" class="b">微批次 1 → 2 → 4 → 8，累积次数固定</text><text x="815" y="301" text-anchor="middle" class="b">逐档短训，记录成功或显存不足</text><path class="flow" d="M420 158 V190 H265 V220"/><path class="flow" d="M660 158 V190 H815 V220"/><rect x="40" y="385" width="450" height="100" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="265" y="415" text-anchor="middle" class="h">质量达标后，检查步时回退</text><text x="265" y="442" text-anchor="middle" class="b">分别报告训练时间、吞吐与峰值显存</text><text x="265" y="466" text-anchor="middle" class="b">按速度门槛决定是否采用</text><rect x="590" y="385" width="450" height="100" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="815" y="415" text-anchor="middle" class="h">检查显存下降与最大可行档位</text><text x="815" y="442" text-anchor="middle" class="b">容量用途允许速度与显存之间的交换</text><text x="815" y="466" text-anchor="middle" class="b">有效批次变化，质量仍看左侧固定比较</text><path class="flow" d="M265 320 V385"/><path class="flow" d="M815 320 V385"/>
</svg>
