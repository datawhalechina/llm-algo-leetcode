<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">QLoRA GPU 配对复测</title>
  <desc id="desc">固定模型、数据与训练步数，分别运行 LoRA 和 QLoRA，统一记录显存、步时、质量与 adapter 产物后形成选型决策。</desc>
  <defs>
    <style>.title{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:25px;font-weight:700;fill:#172554}.sub{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;fill:#475569}.h{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#172554}.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:14px;fill:#475569}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.purple{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.flow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1080" height="520" rx="22" fill="#fafcff"/>
  <text x="540" y="44" text-anchor="middle" class="title">QLoRA：固定口径下的真实训练复测</text>
  <text x="540" y="72" text-anchor="middle" class="sub">两条训练路径共享 workload，只改变底座精度与量化配置</text>
  <rect x="55" y="178" width="210" height="108" rx="16" class="blue"/>
  <text x="160" y="216" text-anchor="middle" class="h">统一训练口径</text>
  <text x="160" y="244" text-anchor="middle" class="t">模型 · 数据 · seed</text>
  <text x="160" y="266" text-anchor="middle" class="t">batch · seq_len · steps</text>
  <rect x="325" y="108" width="210" height="108" rx="16" class="green"/>
  <text x="430" y="146" text-anchor="middle" class="h">LoRA baseline</text>
  <text x="430" y="174" text-anchor="middle" class="t">浮点底座 · adapter</text>
  <text x="430" y="196" text-anchor="middle" class="t">显存 · 步时 · loss</text>
  <rect x="325" y="278" width="210" height="108" rx="16" class="purple"/>
  <text x="430" y="316" text-anchor="middle" class="h">QLoRA candidate</text>
  <text x="430" y="344" text-anchor="middle" class="t">NF4 · double quant</text>
  <text x="430" y="366" text-anchor="middle" class="t">显存 · 步时 · loss</text>
  <rect x="595" y="178" width="210" height="108" rx="16" class="orange"/>
  <text x="700" y="216" text-anchor="middle" class="h">结果与产物</text>
  <text x="700" y="244" text-anchor="middle" class="t">配对 JSON · failure</text>
  <text x="700" y="266" text-anchor="middle" class="t">adapter manifest</text>
  <rect x="865" y="178" width="160" height="108" rx="16" class="blue"/>
  <text x="945" y="216" text-anchor="middle" class="h">训练决策</text>
  <text x="945" y="244" text-anchor="middle" class="t">accept · tune</text>
  <text x="945" y="266" text-anchor="middle" class="t">reject · 复测</text>
  <path d="M265 220C290 200 300 162 325 162" class="flow"/>
  <path d="M265 244C290 270 300 332 325 332" class="flow"/>
  <path d="M535 162C565 172 570 210 595 218" class="flow"/>
  <path d="M535 332C565 322 570 254 595 246" class="flow"/>
  <path d="M805 232H865" class="flow"/>
</svg>
