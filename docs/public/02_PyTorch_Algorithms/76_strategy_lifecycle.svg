<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">四种激活保存与恢复方式</title>
<desc id="desc">同一训练任务下，完整保存保留GPU激活，重算保留边界输入，卸载把保存张量放在主机，混合组合两种方法；箭头表示反向需要时的恢复动作，时间与容量需分别测量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="10" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}.title{font-size:26px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="660" fill="#f8fafc"/>
<text x="600" y="42" text-anchor="middle" class="title">前向结束后保存什么，反向需要时怎样恢复？</text>
<text x="600" y="72" text-anchor="middle" class="small">固定模型、输入与优化器；四行是不同策略，不是依次执行的步骤</text>
<text x="140" y="110" text-anchor="middle" class="head">策略</text>
<text x="470" y="110" text-anchor="middle" class="head">保存期间的状态</text>
<text x="995" y="110" text-anchor="middle" class="head">反向使用时的动作与代价</text>
<path d="M640 180H830" class="edge"/><path d="M640 300H830" class="edge"/><path d="M640 420H830" class="edge"/><path d="M640 540H830" class="edge"/>
<g text-anchor="middle">
<rect x="40" y="130" width="200" height="100" class="node" fill="#e0f2fe" stroke="#0284c7"/>
<text x="140" y="170" class="head">完整保存</text><text x="140" y="202" class="small">baseline</text>
<rect x="300" y="130" width="340" height="100" class="node" fill="#eff6ff" stroke="#60a5fa"/>
<text x="470" y="170" class="head">激活继续保存在GPU</text><text x="470" y="202" class="body">保持到反向读取</text>
<rect x="830" y="130" width="330" height="100" class="node" fill="#eff6ff" stroke="#60a5fa"/>
<text x="995" y="170" class="head">直接使用保存张量</text><text x="995" y="202" class="body">以持续占用换取直接读取</text>
<rect x="40" y="250" width="200" height="100" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="140" y="290" class="head">激活重算</text><text x="140" y="322" class="small">checkpoint</text>
<rect x="300" y="250" width="340" height="100" class="node" fill="#fffbeb" stroke="#f59e0b"/>
<text x="470" y="290" class="head">保留边界输入或部分激活</text><text x="470" y="322" class="body">中间结果按需重新生成</text>
<rect x="830" y="250" width="330" height="100" class="node" fill="#fffbeb" stroke="#f59e0b"/>
<text x="995" y="290" class="head">重新执行选定前向区域</text><text x="995" y="322" class="body">增加恢复中间结果的计算</text>
<rect x="40" y="370" width="200" height="100" class="node" fill="#dcfce7" stroke="#16a34a"/>
<text x="140" y="410" class="head">主机卸载</text><text x="140" y="442" class="small">offload</text>
<rect x="300" y="370" width="340" height="100" class="node" fill="#f0fdf4" stroke="#4ade80"/>
<text x="470" y="410" class="head">所需张量暂放主机内存</text><text x="470" y="442" class="body">GPU保存期间的占用可减少</text>
<rect x="830" y="370" width="330" height="100" class="node" fill="#f0fdf4" stroke="#4ade80"/>
<text x="995" y="410" class="head">搬回GPU后使用</text><text x="995" y="442" class="body">增加传输与可能的等待</text>
<rect x="40" y="490" width="200" height="100" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="140" y="530" class="head">混合策略</text><text x="140" y="562" class="small">hybrid</text>
<rect x="300" y="490" width="340" height="100" class="node" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="470" y="530" class="head">部分保留，部分卸载</text><text x="470" y="562" class="body">实际保存范围由实现决定</text>
<rect x="830" y="490" width="330" height="100" class="node" fill="#f5f3ff" stroke="#a78bfa"/>
<text x="995" y="530" class="head">按需重算与搬回</text><text x="995" y="562" class="body">重新比较计算、搬运与峰值</text>
<text x="600" y="632" class="small">保存方式改变的是状态与恢复代价；是否降低整步峰值、是否值得采用，仍看完整更新测量</text>
</g></svg>
