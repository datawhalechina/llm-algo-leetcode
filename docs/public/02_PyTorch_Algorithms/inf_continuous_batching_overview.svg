<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
<title id="title">服务端连续批处理：每轮重新组织成员</title><desc id="desc">移除终止请求，按槽位、KV与词元预算准入新请求，再执行和更新；未完成状态传入下一轮。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.small{font-size:14px}.edge{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#7657a5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="410" fill="#f8fafc"/><text x="560" y="42" text-anchor="middle" class="title">服务端连续批处理：每轮重新组织成员</text>
<rect x="40" y="115" width="220" height="90" rx="14" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="150" y="150" text-anchor="middle" class="h">释放终止成员</text><text x="150" y="180" text-anchor="middle">归还槽位与可回收 KV</text>
<rect x="315" y="115" width="220" height="90" rx="14" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="425" y="150" text-anchor="middle" class="h">选择等待请求</text><text x="425" y="180" text-anchor="middle">槽位＋KV＋词元预算</text>
<rect x="590" y="115" width="220" height="90" rx="14" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="700" y="150" text-anchor="middle" class="h">执行本轮批次</text><text x="700" y="180" text-anchor="middle">输入分块／解码一步</text>
<rect x="865" y="115" width="220" height="90" rx="14" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="975" y="150" text-anchor="middle" class="h">更新请求状态</text><text x="975" y="180" text-anchor="middle">追加 KV、标记终止</text>
<path d="M260 160H315" class="edge"/>
<path d="M535 160H590" class="edge"/>
<path d="M810 160H865" class="edge"/>
<path d="M975 205V285H150V205" class="feedback"/>
<text x="560" y="277" text-anchor="middle" class="small">下一轮携带未完成成员和更新后的资源状态</text>
<text x="560" y="358" text-anchor="middle" class="small">本页真实后端实验改变客户端提交方式；服务端仍使用同一套调度器</text>
</svg>
