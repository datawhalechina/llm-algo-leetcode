<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">训练更新与更新后损失评估</title><desc id="desc">更新前参数theta_u计算训练梯度，写回得到theta_u加1。在选定记录时点，用同一版更新后参数分别无梯度评估训练与验证批次，记录更新编号和两份loss。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="500" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="46" class="title" text-anchor="start">训练用更新前参数产生梯度，记录读取同一版更新后模型</text>
<text x="55" y="78" class="sub" text-anchor="start">选定一次记录时点：训练与评估复用监督位置和归约定义，评估分别读取训练批次与验证批次。</text>
<rect x="55" y="135" width="180" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="145" y="163" class="head" text-anchor="middle">更新前 θ_u</text>
<text x="145" y="188" class="body" text-anchor="middle">训练模式＋计算图</text>
<rect x="295" y="135" width="220" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="405" y="163" class="head" text-anchor="middle">训练批次→累计梯度</text>
<text x="405" y="188" class="body" text-anchor="middle">在θ_u上计算损失</text>
<rect x="575" y="135" width="220" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="685" y="163" class="head" text-anchor="middle">参数写回一次</text>
<text x="685" y="188" class="body" text-anchor="middle">得到θ_{u+1}</text>
<rect x="900" y="110" width="250" height="80" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1025" y="138" class="head" text-anchor="middle">重新评估训练批次</text>
<text x="1025" y="163" class="body" text-anchor="middle">L_train(B_train; θ_{u+1})</text>
<rect x="900" y="270" width="250" height="80" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="1025" y="298" class="head" text-anchor="middle">评估验证批次（若提供）</text>
<text x="1025" y="323" class="body" text-anchor="middle">L_val(B_val; θ_{u+1})</text>
<rect x="1225" y="190" width="220" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1335" y="218" class="head" text-anchor="middle">按更新编号记录</text>
<text x="1335" y="243" class="body" text-anchor="middle">train_loss／val_loss</text>
<path id="old-to-training" d="M235 175H295" class="flow"/>
<path id="training-to-update" d="M515 175H575" class="flow"/>
<path id="updated-to-train-eval" d="M795 155H850V150H900" class="flow"/>
<path id="updated-to-val-eval" d="M795 195H850V310H900" class="flow"/>
<path id="train-eval-to-record" d="M1150 150H1180V210H1225" class="flow"/>
<path id="val-eval-to-record" d="M1150 310H1180V250H1225" class="flow"/>
<text x="55" y="405" class="sub" text-anchor="start">两次评估均使用eval与no_grad，完成后恢复调用前模式；已有梯度和优化器状态保持不变。</text>
<text x="55" y="460" class="sub" text-anchor="start">记录中的train_loss由更新后的模型重新评估得到，验证损失读取同一版参数。</text>
</svg>
