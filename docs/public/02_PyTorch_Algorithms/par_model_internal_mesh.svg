<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc"><title id="title">三种切分与进程组映射</title><desc id="desc">模型内部并行从层、特征和序列三个正交维度切分，并映射到 Device Mesh。</desc><defs><style>.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:29px;font-weight:700;fill:#0f172a}.s{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16px;font-weight:500;fill:#475569}.h{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#111827;text-anchor:middle}.b{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:500;fill:#334155;text-anchor:middle}.x{stroke-width:2.5;rx:16}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker markerUnits="userSpaceOnUse" id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="1500" height="620" fill="#f8fafc"/><text x="55" y="58" class="t">模型内部并行：三个切分维度映射到同一个 Device Mesh</text><text x="55" y="88" class="s">PP、TP、CP 分别切层、层内特征和序列状态；mesh 乘积必须等于 world size。</text><rect x="55" y="235" width="220" height="100" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="165" y="273" class="h">全局模型与输入</text><text x="165" y="300" class="b">层数 · 头数 · 序列长度</text><rect x="375" y="115" width="230" height="100" class="x" fill="#fff7ed" stroke="#d97706"/><text x="490" y="153" class="h">PP：不同层与阶段</text><text x="490" y="180" class="b">阶段传输与流水空转</text><rect x="375" y="255" width="230" height="100" class="x" fill="#ecfeff" stroke="#0891b2"/><text x="490" y="293" class="h">TP：层内矩阵与头</text><text x="490" y="320" class="b">层内归约与收集</text><rect x="375" y="395" width="230" height="100" class="x" fill="#f5f3ff" stroke="#7c3aed"/><text x="490" y="433" class="h">CP：序列位置</text><text x="490" y="460" class="b">K/V 与状态交换</text><rect x="750" y="215" width="285" height="140" class="x" fill="#ffffff" stroke="#64748b"/><text x="892" y="255" class="h">Device Mesh</text><text x="892" y="286" class="b">shape = (pp, tp, cp)</text><text x="892" y="315" class="b">pp × tp × cp = world size</text><rect x="1160" y="215" width="285" height="140" class="x" fill="#ecfccb" stroke="#65a30d"/><text x="1302" y="255" class="h">每进程的局部数量</text><text x="1302" y="286" class="b">局部层 · 头 · 序列位置</text><text x="1302" y="315" class="b">状态字节与运行时间另测</text><path d="M275 265H330V165H375" class="a"/><path d="M275 285H330V305H375" class="a"/><path d="M275 305H330V445H375" class="a"/><path d="M605 165H680V250H750" class="a"/><path d="M605 305H750" class="a"/><path d="M605 445H680V320H750" class="a"/><path d="M1035 285H1160" class="a"/></svg>
