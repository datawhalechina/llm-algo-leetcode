<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">MHA、GQA、MQA 的 QKV 张量分支</title>
<desc id="desc">输入产生 Q 与 K/V 两条不同 head 数的张量分支。它们共同参与 Attention，K/V 同时进入 KV Cache。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  <style>
    .title { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 29px; font-weight: 700; fill: #0f172a; }
    .sub { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
    .head { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
    .body { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 500; fill: #334155; }
    .shape { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .small { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
    .box { stroke-width: 2.5; rx: 16; }
    .panel { stroke-width: 2; rx: 20; }
    .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .state { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="1500" height="560" fill="#f8fafc"/>
<text x="70" y="58" class="title">MHA、GQA、MQA：Q 与 K/V 的张量分支</text>
<text x="70" y="91" class="sub">B 是 batch，S 是序列长度，H 是 Query head 数，Hₖᵥ 是 KV head 数，D 是每个 head 的特征宽度。</text>

<rect x="45" y="215" width="185" height="110" fill="#dbeafe" class="box" stroke="#3b82f6"/>
<text x="137" y="252" text-anchor="middle" class="head">输入表示</text>
<text x="137" y="280" text-anchor="middle" class="shape">[B, S, D_model]</text>

<rect x="300" y="195" width="225" height="150" fill="#e0f2fe" class="box" stroke="#0284c7"/>
<text x="412" y="234" text-anchor="middle" class="head">Q / K / V 投影</text>
<text x="412" y="282" text-anchor="middle" class="body">生成 Query 与 K/V 状态</text>
<path d="M230 270 H285" class="line"/>

<rect x="590" y="120" width="230" height="138" fill="#ede9fe" class="box" stroke="#7c3aed"/>
<text x="705" y="157" text-anchor="middle" class="head">K/V：KV head</text>
<text x="705" y="188" text-anchor="middle" class="shape">[B, Hₖᵥ, S, D]</text>
<text x="705" y="216" text-anchor="middle" class="small">MHA：Hₖᵥ=H；GQA：Hₖᵥ&lt;H；MQA：Hₖᵥ=1</text>

<rect x="590" y="345" width="230" height="128" fill="#dcfce7" class="box" stroke="#16a34a"/>
<text x="705" y="382" text-anchor="middle" class="head">Q：Query head</text>
<text x="705" y="413" text-anchor="middle" class="shape">[B, H, S, D]</text>
<text x="705" y="441" text-anchor="middle" class="small">当前位置发起查询</text>
<path d="M525 245 H555 V184 H590" class="state"/>
<path d="M525 295 H555 V409 H590" class="line"/>

<rect x="905" y="120" width="220" height="128" fill="#fef3c7" class="box" stroke="#d97706"/>
<text x="1015" y="157" text-anchor="middle" class="head">Q × Kᵀ 与权重</text>
<text x="1015" y="188" text-anchor="middle" class="body">相关性计算后归一化</text>
<text x="1015" y="216" text-anchor="middle" class="shape">[B, H, S, S]</text>
<path d="M820 184 H905" class="state"/>
<path d="M820 409 H860 V248 H1015" class="line"/>

<rect x="1190" y="120" width="255" height="128" fill="#fce7f3" class="box" stroke="#db2777"/>
<text x="1317" y="157" text-anchor="middle" class="head">权重 × V 与多头输出</text>
<text x="1317" y="188" text-anchor="middle" class="body">权重聚合 V，形成上下文表示</text>
<text x="1317" y="216" text-anchor="middle" class="shape">[B, S, H×D]</text>
<path d="M1125 184 H1190" class="line"/>

<rect x="930" y="345" width="330" height="138" fill="#fff4e6" class="box" stroke="#d97706"/>
<text x="1095" y="382" text-anchor="middle" class="head">KV Cache</text>
<text x="1095" y="413" text-anchor="middle" class="body">仅保存历史 K/V，沿 S 维增长</text>
<text x="1095" y="441" text-anchor="middle" class="shape">[B, Hₖᵥ, S_cache, D]</text>
<path d="M705 258 V300 H1095 V345" class="state"/>
</svg>
