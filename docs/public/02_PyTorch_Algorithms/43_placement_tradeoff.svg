<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">同一组状态怎样形成三个阶段的GPU容量</title>
<desc id="desc">复用本页CPU账本示例，三个阶段GPU驻留容量分别为1900、2200和1800 MB。CPU驻留的250 MB激活单独记账。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#475569}
.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}
.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1200" height="560" fill="#f8fafc" data-layout-role="decoration"/>
<text x="50" y="46" text-anchor="start" class="title">同一组状态，怎样形成三个阶段的GPU容量</text>
<text x="50" y="77" text-anchor="start" class="sub">理论账本示例（CPU计算） · 单位：MB · 优化器状态已创建后的稳态阶段</text>
<g data-layout-role="glyph-group"><rect x="50" y="102" width="18" height="18" fill="#dbeafe" stroke="#2563eb"/><text x="77" y="117" text-anchor="start" class="small">参数</text>
</g>
<g data-layout-role="glyph-group"><rect x="230" y="102" width="18" height="18" fill="#ede9fe" stroke="#7c3aed"/><text x="257" y="117" text-anchor="start" class="small">优化器状态</text>
</g>
<g data-layout-role="glyph-group"><rect x="410" y="102" width="18" height="18" fill="#fef3c7" stroke="#d97706"/><text x="437" y="117" text-anchor="start" class="small">保存的激活</text>
</g>
<g data-layout-role="glyph-group"><rect x="590" y="102" width="18" height="18" fill="#fee2e2" stroke="#ef4444"/><text x="617" y="117" text-anchor="start" class="small">梯度</text>
</g>
<g data-layout-role="glyph-group"><rect x="770" y="102" width="18" height="18" fill="#e0f2fe" stroke="#0284c7"/><text x="797" y="117" text-anchor="start" class="small">前向工作区</text>
</g>
<g data-layout-role="glyph-group"><rect x="950" y="102" width="18" height="18" fill="#ccfbf1" stroke="#0f766e"/><text x="977" y="117" text-anchor="start" class="small">通信缓冲</text>
</g>
<text x="50" y="145" text-anchor="start" class="small">阶段</text>
<text x="1090" y="145" text-anchor="middle" class="small">GPU总量</text>
<line x1="200" y1="154" x2="200" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="200" y="456" text-anchor="middle" class="small">0</text>
<line x1="340" y1="154" x2="340" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="340" y="456" text-anchor="middle" class="small">400</text>
<line x1="480" y1="154" x2="480" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="480" y="456" text-anchor="middle" class="small">800</text>
<line x1="620" y1="154" x2="620" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="620" y="456" text-anchor="middle" class="small">1200</text>
<line x1="760" y1="154" x2="760" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="760" y="456" text-anchor="middle" class="small">1600</text>
<line x1="900" y1="154" x2="900" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="900" y="456" text-anchor="middle" class="small">2000</text>
<line x1="1040" y1="154" x2="1040" y2="428" stroke="#cbd5e1" stroke-dasharray="4 5" data-layout-role="decoration"/><text x="1040" y="456" text-anchor="middle" class="small">2400</text>
<text x="50" y="191" text-anchor="start" class="head">前向</text>
<text x="50" y="215" text-anchor="start" class="small">forward</text>
<g data-phase="forward" data-total-mb="1900" data-layout-role="glyph-group">
<rect data-state="parameters" data-size-mb="800" x="200" y="168" width="280" height="56" fill="#dbeafe" stroke="#2563eb"/><text x="340" y="203" text-anchor="middle" class="head">800</text>
<rect data-state="optimizer_state" data-size-mb="600" x="480" y="168" width="210" height="56" fill="#ede9fe" stroke="#7c3aed"/><text x="585" y="203" text-anchor="middle" class="head">600</text>
<rect data-state="activations" data-size-mb="300" x="690" y="168" width="105" height="56" fill="#fef3c7" stroke="#d97706"/><text x="742.5" y="203" text-anchor="middle" class="head">300</text>
<rect data-state="forward_workspace" data-size-mb="200" x="795" y="168" width="70" height="56" fill="#e0f2fe" stroke="#0284c7"/><text x="830" y="203" text-anchor="middle" class="head">200</text>
</g>
<text x="1090" y="198" text-anchor="middle" class="head">1900</text>
<text x="50" y="287" text-anchor="start" class="head">反向</text>
<text x="50" y="311" text-anchor="start" class="small">backward</text>
<rect x="196" y="260" width="778" height="64" rx="4" fill="none" stroke="#7c3aed" stroke-width="2.5" data-layout-role="decoration"/><g data-phase="backward" data-total-mb="2200" data-layout-role="glyph-group">
<rect data-state="parameters" data-size-mb="800" x="200" y="264" width="280" height="56" fill="#dbeafe" stroke="#2563eb"/><text x="340" y="299" text-anchor="middle" class="head">800</text>
<rect data-state="optimizer_state" data-size-mb="600" x="480" y="264" width="210" height="56" fill="#ede9fe" stroke="#7c3aed"/><text x="585" y="299" text-anchor="middle" class="head">600</text>
<rect data-state="activations" data-size-mb="300" x="690" y="264" width="105" height="56" fill="#fef3c7" stroke="#d97706"/><text x="742.5" y="299" text-anchor="middle" class="head">300</text>
<rect data-state="gradients" data-size-mb="400" x="795" y="264" width="140" height="56" fill="#fee2e2" stroke="#ef4444"/><text x="865" y="299" text-anchor="middle" class="head">400</text>
<rect data-state="collective_buffer" data-size-mb="100" x="935" y="264" width="35" height="56" fill="#ccfbf1" stroke="#0f766e"/><text x="952.5" y="299" text-anchor="middle" class="small">100</text>
</g>
<text x="1090" y="294" text-anchor="middle" class="head">2200</text>
<text x="1090" y="317" text-anchor="middle" class="small">示例峰值</text>
<text x="50" y="383" text-anchor="start" class="head">更新</text>
<text x="50" y="407" text-anchor="start" class="small">update</text>
<g data-phase="update" data-total-mb="1800" data-layout-role="glyph-group">
<rect data-state="parameters" data-size-mb="800" x="200" y="360" width="280" height="56" fill="#dbeafe" stroke="#2563eb"/><text x="340" y="395" text-anchor="middle" class="head">800</text>
<rect data-state="optimizer_state" data-size-mb="600" x="480" y="360" width="210" height="56" fill="#ede9fe" stroke="#7c3aed"/><text x="585" y="395" text-anchor="middle" class="head">600</text>
<rect data-state="gradients" data-size-mb="400" x="690" y="360" width="140" height="56" fill="#fee2e2" stroke="#ef4444"/><text x="760" y="395" text-anchor="middle" class="head">400</text>
</g>
<text x="1090" y="390" text-anchor="middle" class="head">1800</text>
<text x="620" y="486" text-anchor="middle" class="small">GPU驻留容量（MB）</text>
<rect x="50" y="512" width="18" height="18" fill="#e2e8f0" stroke="#64748b" data-layout-role="decoration"/><text x="80" y="527" text-anchor="start" class="sub">CPU驻留激活：250 MB，单独记账；上方仅汇总GPU驻留对象。</text>
</svg>
