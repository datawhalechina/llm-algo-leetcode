<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">部署判断从固定模型与请求开始</title><desc id="desc">浮点服务可独立评估，按需加入实际启用策略的结果；可复用测量或重新执行，联合质量和资源条件后交接。</desc><defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:26px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.edge{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#arrow)}.opt{fill:none;stroke:#7657a5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs><rect width="1500" height="470" fill="#f8fafc"/><text x="750" y="43" text-anchor="middle" class="title">部署判断从固定模型与请求开始</text>
<rect x="35" y="105" width="240" height="100" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="155" y="138" text-anchor="middle" class="h">固定输入</text><text x="155" y="166" text-anchor="middle">模型版本、模板与请求集</text>
<rect x="330" y="105" width="240" height="100" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="450" y="138" text-anchor="middle" class="h">检查单卡容量</text><text x="450" y="166" text-anchor="middle">权重、KV、工作区与余量</text>
<rect x="625" y="105" width="240" height="100" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="745" y="138" text-anchor="middle" class="h">取得服务记录</text><text x="745" y="166" text-anchor="middle">复用原测量或重新执行</text>
<rect x="920" y="105" width="240" height="100" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1040" y="138" text-anchor="middle" class="h">联合评估</text><text x="1040" y="166" text-anchor="middle">任务质量、服务与资源</text>
<rect x="1215" y="105" width="240" height="100" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="1335" y="138" text-anchor="middle" class="h">采用后交接</text><text x="1335" y="166" text-anchor="middle">配置、结果与回滚基线</text>
<path d="M275 155H330" class="edge"/>
<path d="M570 155H625" class="edge"/>
<path d="M865 155H920" class="edge"/>
<path d="M1160 155H1215" class="edge"/>
<rect x="330" y="320" width="240" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="450" y="353" text-anchor="middle" class="h">容量不够</text><text x="450" y="381" text-anchor="middle">减少长度／并发后重测</text>
<rect x="625" y="320" width="240" height="90" rx="13" fill="#fbeceb" stroke="#b85c57" stroke-width="2"/><text x="745" y="353" text-anchor="middle" class="h">启动或请求失败</text><text x="745" y="381" text-anchor="middle">保存失败原因并修复</text>
<rect x="920" y="320" width="240" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1040" y="353" text-anchor="middle" class="h">按启用加入专项结果</text><text x="1040" y="381" text-anchor="middle">量化、投机、缓存或调度</text>
<path d="M450 205V320" class="edge"/>
<path d="M745 205V320" class="edge"/>
<path d="M1040 320V205" class="opt"/>
<text x="750" y="450" text-anchor="middle" class="s">默认浮点路径：模型与共享基线；专项策略作为条件分支，实际开启后再比较组合结果</text>
</svg>
