<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">投机解码的一轮机制</title>
  <desc id="desc">一轮投机解码从候选提议开始，经目标模型验证，最后根据验证结果更新生成状态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.group{font-size:18px;font-weight:700;fill:#334155}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#475569}.panel{stroke-width:2;rx:20;ry:20}.node{stroke-width:2;rx:14;ry:14}.flow{stroke:#475569;stroke-width:3;stroke-linecap:round;fill:none;marker-end:url(#arrow)}.branch{stroke:#94a3b8;stroke-width:3;stroke-linecap:round;fill:none}</style>
  </defs>
  <rect width="1440" height="650" fill="#f8fafc"/>
  <text x="58" y="55" class="title">投机解码：一轮如何推进</text>
  <text x="58" y="86" class="sub">草稿模型提出候选，目标模型集中验证，验证结果决定本轮保留哪些 token。</text>

  <rect x="525" y="115" width="390" height="88" class="node" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="720" y="153" text-anchor="middle" class="label">一轮投机解码</text>
  <text x="720" y="181" text-anchor="middle" class="small">当前上下文 → 候选 → 验证 → 状态更新</text>

  <rect x="45" y="270" width="410" height="290" class="panel" fill="#fff7ed" stroke="#fdba74"/>
  <text x="75" y="307" text-anchor="start" class="group">候选提议</text>
  <rect x="95" y="350" width="310" height="78" class="node" fill="#ffffff" stroke="#f59e0b"/>
  <text x="250" y="382" text-anchor="middle" class="label">草稿模型</text>
  <text x="250" y="407" text-anchor="middle" class="small">提出连续 token 与草稿概率</text>
  <rect x="95" y="455" width="310" height="70" class="node" fill="#ffffff" stroke="#f59e0b"/>
  <text x="250" y="484" text-anchor="middle" class="label">候选序列</text>
  <text x="250" y="507" text-anchor="middle" class="small">长度 K，按位置排列</text>
  <path d="M250 428V455" class="flow"/>

  <rect x="515" y="270" width="410" height="290" class="panel" fill="#eef2ff" stroke="#818cf8"/>
  <text x="545" y="307" text-anchor="start" class="group">目标验证</text>
  <rect x="565" y="350" width="310" height="78" class="node" fill="#ffffff" stroke="#6366f1"/>
  <text x="720" y="382" text-anchor="middle" class="label">目标模型</text>
  <text x="720" y="407" text-anchor="middle" class="small">一次计算多个位置的概率</text>
  <rect x="565" y="455" width="310" height="70" class="node" fill="#ffffff" stroke="#6366f1"/>
  <text x="720" y="484" text-anchor="middle" class="label">按位置对齐</text>
  <text x="720" y="507" text-anchor="middle" class="small">比较目标概率与草稿概率</text>
  <path d="M720 428V455" class="flow"/>

  <rect x="985" y="270" width="410" height="290" class="panel" fill="#ecfdf5" stroke="#86efac"/>
  <text x="1015" y="307" text-anchor="start" class="group">状态更新</text>
  <rect x="1090" y="350" width="200" height="54" class="node" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1190" y="384" text-anchor="middle" class="label">验证结果</text>
  <rect x="1005" y="450" width="110" height="92" class="node" fill="#ffffff" stroke="#4ade80"/>
  <text x="1060" y="480" text-anchor="middle" class="label">接受前缀</text>
  <text x="1060" y="507" text-anchor="middle" class="small">仍有位置</text>
  <text x="1060" y="528" text-anchor="middle" class="small">继续扫描</text>
  <rect x="1135" y="450" width="110" height="92" class="node" fill="#ffffff" stroke="#fb7185"/>
  <text x="1190" y="480" text-anchor="middle" class="label">首次拒绝</text>
  <text x="1190" y="507" text-anchor="middle" class="small">拒绝修正</text>
  <text x="1190" y="528" text-anchor="middle" class="small">修正 token</text>
  <rect x="1265" y="450" width="110" height="92" class="node" fill="#ffffff" stroke="#22d3ee"/>
  <text x="1320" y="480" text-anchor="middle" class="label">全部接受</text>
  <text x="1320" y="507" text-anchor="middle" class="small">目标追加</text>
  <text x="1320" y="528" text-anchor="middle" class="small">token</text>
  <path d="M1190 404V425M1060 425H1320" class="branch"/>
  <path d="M1060 425V450" class="flow"/>
  <path d="M1190 425V450" class="flow"/>
  <path d="M1320 425V450" class="flow"/>

  <path d="M720 203V235M250 235H1190" class="branch"/>
  <path d="M250 235V350" class="flow"/>
  <path d="M720 235V350" class="flow"/>
  <path d="M1190 235V350" class="flow"/>
</svg>
