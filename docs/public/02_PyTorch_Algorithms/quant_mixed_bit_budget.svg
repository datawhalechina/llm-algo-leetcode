<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">质量门槛与容量预算共同筛选候选</title><desc id="desc">纵轴质量损失向上增加，横轴容量向右增加；同时位于质量阈值下方和容量预算左方的候选才合格。点位为示意而非实测。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="title">质量门槛与容量预算共同筛选候选</text>
<rect x="130" y="315" width="670" height="190" fill="#e8f6f1" data-layout-role="panel"/>
<path d="M130 505V115" class="e"/><path d="M130 505H1090" class="e"/>
<path d="M130 315H1090" fill="none" stroke="#3f8b72" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M800 115V505" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="7 6"/>
<text x="45" y="330" transform="rotate(-90 45 330)" class="h" text-anchor="middle">质量损失（向上增加）</text>
<text x="610" y="558" class="h" text-anchor="middle">容量字节（向右增加）</text>
<circle cx="230" cy="185" r="13" fill="#b85c57"/><circle cx="440" cy="275" r="13" fill="#b7791f"/>
<circle cx="610" cy="365" r="13" fill="#3f8b72"/><circle cx="740" cy="420" r="13" fill="#3f78a8"/>
<circle cx="985" cy="455" r="13" fill="#7657a5"/>
<text x="245" y="155" text-anchor="middle" class="s">统一低位宽：损失较高</text>
<text x="440" y="245" text-anchor="middle" class="s">少量保护，仍未达标</text>
<text x="600" y="345" text-anchor="middle" class="s">最小容量合格候选</text>
<text x="735" y="455" text-anchor="middle" class="s">更多保护</text>
<text x="985" y="420" text-anchor="middle" class="s">超过容量预算</text>
<text x="900" y="300" text-anchor="middle" class="s">质量门槛</text>
<text x="815" y="100" text-anchor="middle" class="s">容量预算</text>
<text x="330" y="465" text-anchor="middle" class="s">同时满足两项条件的区域</text>
<text x="600" y="600" text-anchor="middle" class="s">机制示意，非实测曲线；真实候选逐个测量，组合误差可能非单调</text>
</svg>
