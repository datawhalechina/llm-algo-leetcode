<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">分别检查偏好概率与策略候选质量</title>
<desc id="desc">上行以校准记录选择正温度并计算Brier误差，调整偏好概率而非原始奖励。下行将候选的代理奖励与另外计算的任务质量送入三项检查，分别决定继续复测或定位问题。</desc>
<defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:400;fill:#172033}.title{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#334155}.small{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
</marker>
</defs>
<rect width="1440" height="620" fill="#F8FAFC"/>
<rect x="28" y="24" width="1384" height="572" rx="26" fill="#FFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="720" y="68" text-anchor="middle" class="title">温度校准概率，任务质量另作检查</text>
<text x="720" y="101" text-anchor="middle" class="small">两个不同问题：成对概率是否合适，以及追逐奖励后任务表现是否退化</text>
<rect x="60" y="155" width="250" height="105" rx="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="185" y="187" text-anchor="middle" class="h">留出校准记录</text>
<text x="185" y="216" text-anchor="middle" class="b">回答 A／B 的分数差</text>
<text x="185" y="239" text-anchor="middle" class="b">偏好标签 0／1</text>
<rect x="390" y="155" width="250" height="105" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="515" y="187" text-anchor="middle" class="h">正温度候选</text>
<text x="515" y="216" text-anchor="middle" class="b">调整分数差到概率的尺度</text>
<text x="515" y="239" text-anchor="middle" class="b">保持差值符号与排序</text>
<rect x="720" y="155" width="250" height="105" rx="15" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="845" y="187" text-anchor="middle" class="h">计算 Brier 误差</text>
<text x="845" y="216" text-anchor="middle" class="b">概率与标签的均方差</text>
<text x="845" y="239" text-anchor="middle" class="b">每个温度分别记录</text>
<rect x="1050" y="155" width="310" height="105" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="1205" y="187" text-anchor="middle" class="h">选定温度与误差</text>
<text x="1205" y="216" text-anchor="middle" class="b">校准记录参与温度选择</text>
<text x="1205" y="239" text-anchor="middle" class="b">最终概率效果可另留样本检查</text>
<path class="flow" d="M310 207 H390"/>
<path class="flow" d="M640 207 H720"/>
<path class="flow" d="M970 207 H1050"/>
<rect x="60" y="400" width="240" height="100" rx="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="180" y="432" text-anchor="middle" class="h">策略候选</text>
<text x="180" y="461" text-anchor="middle" class="b">同一组任务与规则</text>
<text x="180" y="484" text-anchor="middle" class="b">记录候选及基线身份</text>
<rect x="380" y="350" width="260" height="90" rx="15" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
<text x="510" y="382" text-anchor="middle" class="h">代理奖励</text>
<text x="510" y="411" text-anchor="middle" class="b">各候选的奖励及排序</text>
<rect x="380" y="480" width="260" height="90" rx="15" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
<text x="510" y="512" text-anchor="middle" class="h">另作任务评测</text>
<text x="510" y="541" text-anchor="middle" class="b">质量分数与基线变化</text>
<rect x="720" y="405" width="260" height="110" rx="15" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
<text x="850" y="437" text-anchor="middle" class="h">分别检查三项</text>
<text x="850" y="466" text-anchor="middle" class="b">质量下限、相对下降量</text>
<text x="850" y="489" text-anchor="middle" class="b">无并列候选的两两排序背离</text>
<rect x="1080" y="350" width="280" height="90" rx="15" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
<text x="1220" y="382" text-anchor="middle" class="h">保留候选继续复测</text>
<text x="1220" y="411" text-anchor="middle" class="b">在新任务与更新后再检查</text>
<rect x="1080" y="480" width="280" height="90" rx="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
<text x="1220" y="512" text-anchor="middle" class="h">定位问题并调整</text>
<text x="1220" y="541" text-anchor="middle" class="b">检查奖励漏洞或数据覆盖</text>
<path class="flow" d="M300 425 H340 V395 H380"/>
<path class="flow" d="M300 475 H330 V525 H380"/>
<path class="flow" d="M640 395 H680 V435 H720"/>
<path class="flow" d="M640 525 H680 V485 H720"/>
<path class="flow" d="M980 435 H1030 V395 H1080"/>
<path class="flow" d="M980 485 H1015 V525 H1080"/>
<text x="1050" y="382" text-anchor="middle" class="b">通过</text>
<text x="1047" y="513" text-anchor="middle" class="b">未通过</text>
</svg>
