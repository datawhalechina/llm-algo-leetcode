<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">从误差候选到预算内的位宽策略</title><desc id="desc">统一协议得到逐层误差与候选字节，保护规则限定最低位宽，再用剩余预算升级，转换后测组合质量与实际存储。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="title">从误差候选到预算内的位宽策略</text>
<rect x="45" y="125" width="250" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="170" y="157" text-anchor="middle" class="h">统一条件测误差</text><text x="170" y="184" text-anchor="middle">模型、样本与其余层固定</text>
<rect x="455" y="125" width="290" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="600" y="157" text-anchor="middle" class="h">构造候选集合</text><text x="600" y="184" text-anchor="middle">位宽、误差与统计字节</text>
<rect x="905" y="125" width="250" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="1030" y="157" text-anchor="middle" class="h">最低精度规则</text><text x="1030" y="184" text-anchor="middle">指定必须保护的对象</text>
<path d="M295 170H455" class="e"/>
<rect x="455" y="310" width="290" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="600" y="342" text-anchor="middle" class="h">初始分配与逐次升级</text><text x="600" y="369" text-anchor="middle">按误差收益／额外字节选择</text>
<path d="M600 215V310" class="e"/>
<path d="M1030 215V355H745" class="e"/>
<rect x="45" y="310" width="250" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="170" y="342" text-anchor="middle" class="h">总字节预算</text><text x="170" y="369" text-anchor="middle">先保证初始分配能放下</text>
<path d="M295 355H455" class="e"/>
<rect x="455" y="490" width="290" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="600" y="522" text-anchor="middle" class="h">逐层位宽策略</text><text x="600" y="549" text-anchor="middle">记录每次升级及剩余预算</text>
<rect x="905" y="490" width="250" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="1030" y="522" text-anchor="middle" class="h">转换后组合复验</text><text x="1030" y="549" text-anchor="middle">模型 NLL 与实际状态字节</text>
<path d="M600 400V490" class="e"/>
<path d="M745 535H905" class="e"/>
<text x="600" y="608" text-anchor="middle" class="s">CPU 使用理想权重字节；转换后另计缩放参数、填充和保留状态</text>
</svg>
