<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">混合位宽分配流程</title><desc id="desc">固定评测协议测量逐层敏感度，在容量预算与保护规则下分配位宽，再生成可审计策略。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker><style>.b{fill:#fff;stroke:#64748b;stroke-width:2;rx:14}.m{fill:#eff6ff;stroke:#2563eb}.p{fill:#fff7ed;stroke:#ea580c}.o{fill:#ecfdf5;stroke:#059669}.t{font:600 19px sans-serif;fill:#0f172a;text-anchor:middle}.s{font:14px sans-serif;fill:#334155;text-anchor:middle}.l{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}.g{font:600 16px sans-serif;fill:#475569}</style></defs>
  <rect width="1080" height="430" fill="#f8fafc"/>
  <text x="35" y="42" class="g">测量</text>
  <rect x="60" y="70" width="230" height="88" class="b m"/><text x="175" y="107" class="t">逐层候选</text><text x="175" y="135" class="s">4 / 8 / 16 bit</text>
  <rect x="425" y="70" width="230" height="88" class="b m"/><text x="540" y="107" class="t">敏感度记录</text><text x="540" y="135" class="s">误差 · 质量 · 层角色</text>
  <rect x="790" y="70" width="230" height="88" class="b p"/><text x="905" y="107" class="t">约束集合</text><text x="905" y="135" class="s">预算 · 保护层 · backend</text>
  <path d="M290 114 H425" class="l"/><path d="M655 114 H790" class="l"/>
  <text x="35" y="240" class="g">分配与验证</text>
  <rect x="175" y="245" width="260" height="92" class="b p"/><text x="305" y="283" class="t">预算内位宽分配</text><text x="305" y="311" class="s">收益 / 额外字节</text>
  <rect x="645" y="245" width="260" height="92" class="b o"/><text x="775" y="283" class="t">策略与 fallback</text><text x="775" y="311" class="s">layer → bits → reason</text>
  <path d="M905 158 V205 H305 V245" class="l"/><path d="M435 291 H645" class="l"/>
  <rect x="410" y="370" width="260" height="48" class="b o"/><text x="540" y="400" class="t">独立质量与部署复验</text>
  <path d="M775 337 V354 H540 V370" class="l"/>
</svg>
