<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">相似度、评测污染与验证器共同决定候选去向</title>
  <desc id="desc">拒绝条件优先处理评测污染和必需验证失败，通过后再依据训练相似度与质量证据决定接纳或复核。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; fill: #334155; }
      .edge { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .yes { font-size: 15px; font-weight: 700; fill: #b91c1c; }
      .no { font-size: 15px; font-weight: 700; fill: #166534; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="title">先阻断无效证据，再判断是否值得接纳</text>

  <rect x="55" y="190" width="190" height="105" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="232" text-anchor="middle" class="label">候选记录</text>
  <text x="150" y="262" text-anchor="middle" class="body">身份 · 文本 · 验证结果</text>

  <rect x="310" y="165" width="220" height="155" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="210" text-anchor="middle" class="label">拒绝条件？</text>
  <text x="420" y="244" text-anchor="middle" class="body">身份缺失 / 评测污染</text>
  <text x="420" y="271" text-anchor="middle" class="body">必需验证失败 / 质量过低</text>

  <rect x="610" y="165" width="220" height="155" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="720" y="210" text-anchor="middle" class="label">复核条件？</text>
  <text x="720" y="244" text-anchor="middle" class="body">训练相似度过高</text>
  <text x="720" y="271" text-anchor="middle" class="body">质量位于复核区间</text>

  <rect x="930" y="82" width="210" height="90" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1035" y="122" text-anchor="middle" class="label">拒绝</text>
  <text x="1035" y="150" text-anchor="middle" class="body">保留全部失败原因</text>

  <rect x="930" y="215" width="210" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1035" y="255" text-anchor="middle" class="label">复核</text>
  <text x="1035" y="283" text-anchor="middle" class="body">检查任务价值与回答</text>

  <rect x="930" y="348" width="210" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1035" y="388" text-anchor="middle" class="label">接纳</text>
  <text x="1035" y="416" text-anchor="middle" class="body">进入最终数据审计</text>

  <path d="M245 242 H310" class="edge"/>
  <path d="M530 242 H610" class="edge"/>
  <path d="M420 165 V127 H930" class="edge"/>
  <path d="M830 242 H930" class="edge"/>
  <path d="M720 320 V393 H930" class="edge"/>

  <text x="660" y="112" class="yes">是</text>
  <text x="560" y="229" class="no">否</text>
  <text x="865" y="229" class="yes">是</text>
  <text x="741" y="365" class="no">否</text>
</svg>
