<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">交叉熵的概率目标有效位置与归约</title><desc id="desc">前向logits经稳定归一化得到概率，与目标比较并聚合有效位置。局部反向中p和y分别进入目标差，有效集合控制mask与mean分母，归约后返回logits梯度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker><marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.read{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#blue)}.grad{stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}.control{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#purple)}</style></defs>
<rect width="1240" height="600" fill="#f8fafc" data-layout-role="decoration"/>
<text x="45" y="45" class="title" text-anchor="start">目标差需要p与y，有效集合同时控制梯度位置和平均分母</text>
<text x="45" y="78" class="sub" text-anchor="start">前向得到loss；下方展开交叉熵局部梯度。紫色虚线表示操作数或归约配置。</text>
<rect x="45" y="120" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="140" y="149" class="head" text-anchor="middle">输出分数</text>
<text x="140" y="176" class="body" text-anchor="middle">logits z</text>
<path id="forward-0" d="M235 160H285" class="flow"/>
<rect x="285" y="120" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="380" y="149" class="head" text-anchor="middle">稳定归一化</text>
<text x="380" y="176" class="body" text-anchor="middle">概率p与log p</text>
<path id="forward-1" d="M475 160H525" class="flow"/>
<rect x="525" y="120" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="620" y="149" class="head" text-anchor="middle">目标比较</text>
<text x="620" y="176" class="body" text-anchor="middle">逐位置分类误差</text>
<path id="forward-2" d="M715 160H765" class="flow"/>
<rect x="765" y="120" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="860" y="149" class="head" text-anchor="middle">有效位置聚合</text>
<text x="860" y="176" class="body" text-anchor="middle">只统计集合V</text>
<path id="forward-3" d="M955 160H1005" class="flow"/>
<rect x="1005" y="120" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1100" y="149" class="head" text-anchor="middle">标量损失</text>
<text x="1100" y="176" class="body" text-anchor="middle">sum或mean</text>
<rect x="285" y="270" width="190" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="380" y="299" class="head" text-anchor="middle">概率 p</text>
<text x="380" y="326" class="body" text-anchor="middle">来自归一化结果</text>
<rect x="525" y="270" width="190" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="620" y="299" class="head" text-anchor="middle">目标分布 y</text>
<text x="620" y="326" class="body" text-anchor="middle">由类别标签确定</text>
<rect x="765" y="270" width="190" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="860" y="299" class="head" text-anchor="middle">有效集合 V</text>
<text x="860" y="326" class="body" text-anchor="middle">位置及数量 |V|</text>
<rect x="1005" y="270" width="190" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1100" y="299" class="head" text-anchor="middle">归约选择</text>
<text x="1100" y="326" class="body" text-anchor="middle">sum / mean</text>
<path id="probability-to-saved-value" d="M380 200V270" class="flow"/>
<path id="target-to-comparison" d="M620 270V200" class="control"/>
<path id="valid-to-forward-aggregate" d="M860 270V200" class="control"/>
<path id="reduction-to-loss" d="M1100 270V200" class="control"/>
<text x="45" y="427" class="head" text-anchor="start">局部反向</text>
<rect x="285" y="460" width="240" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="405" y="489" class="head" text-anchor="middle">目标差 p − y</text>
<text x="405" y="516" class="body" text-anchor="middle">由两份操作数共同形成</text>
<rect x="615" y="460" width="240" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="735" y="489" class="head" text-anchor="middle">有效位置门控</text>
<text x="735" y="516" class="body" text-anchor="middle">(p − y) × mask</text>
<rect x="945" y="460" width="250" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1070" y="489" class="head" text-anchor="middle">归约并返回G_z</text>
<text x="1070" y="516" class="body" text-anchor="middle">sum: 1；mean: 1 / |V|</text>
<path id="p-to-difference" d="M380 350V460" class="control"/>
<path id="y-to-difference" d="M620 350V420H465V460" class="control"/>
<path id="difference-to-mask" d="M525 500H615" class="grad"/>
<path id="mask-to-reduction" d="M855 500H945" class="grad"/>
<path id="valid-to-backward-mask" d="M860 350V400H735V460" class="control"/>
<path id="valid-count-to-denominator" d="M900 350V430H1010V460" class="control"/>
<path id="reduction-mode-to-gradient" d="M1100 350V460" class="control"/>
<text x="45" y="581" class="small" text-anchor="start">集合外位置的梯度为0；mean使用有效位置数作分母。G_z返回模型的logits端。</text>
</svg>
