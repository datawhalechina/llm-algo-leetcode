<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">回答来源决定训练会访问哪些前缀</title>
  <desc id="desc">固定回答和学生采样按来源比例组成批次，再比较同一前缀的两个模型分布，以回答位置更新学生。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="45" y="52" class="title">回答来源决定训练会访问哪些前缀</text>
  <rect x="45" y="105" width="260" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="139" text-anchor="middle" class="label">固定轨迹</text>
  <text x="175" y="169" text-anchor="middle" class="body">数据集／预先生成的回答</text>
  <text x="175" y="195" text-anchor="middle" class="body">来源比例 1 − λ</text>
  <rect x="45" y="305" width="260" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="175" y="339" text-anchor="middle" class="label">在策略轨迹</text>
  <text x="175" y="369" text-anchor="middle" class="body">当前学生生成的回答</text>
  <text x="175" y="395" text-anchor="middle" class="body">来源比例 λ</text>
  <rect x="430" y="205" width="240" height="130" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="239" text-anchor="middle" class="label">组成轨迹批次</text>
  <text x="550" y="269" text-anchor="middle" class="body">保留来源与模型版本</text>
  <text x="550" y="295" text-anchor="middle" class="body">逐位置取相同前缀</text>
  <rect x="800" y="120" width="345" height="130" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="972.5" y="154" text-anchor="middle" class="label">教师与学生分别预测</text>
  <text x="972.5" y="184" text-anchor="middle" class="body">同一词元映射、同一目标位置</text>
  <text x="972.5" y="210" text-anchor="middle" class="body">比较两个词表概率分布</text>
  <rect x="800" y="330" width="345" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="972.5" y="364" text-anchor="middle" class="label">按回答位置更新学生</text>
  <text x="972.5" y="394" text-anchor="middle" class="body">教师分布停止梯度</text>
  <path d="M305 165 H365 V245 H430" class="edge"/>
  <path d="M305 365 H390 V295 H430" class="edge"/>
  <path d="M670 270 H735 V185 H800" class="edge"/>
  <path d="M972 250 V330" class="edge"/>
  <text x="45" y="480" class="small">λ 选择回答来源；β 选择两个模型分布的比较方式。小批次的来源数量需要明确取整规则。</text>
</svg>
