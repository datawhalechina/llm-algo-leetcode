<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">回答、结束标记与有效监督数量</title><desc id="desc">三种序列对照：正常回答保留回答和EOS，空回答仍可能只有EOS监督，提示占满窗口则没有监督。提示和PAD均忽略，截去的词元不进入训练。</desc><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:400;fill:#0f172a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#334155}.small{font-size:15px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748b"/></marker></defs><rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="43" text-anchor="middle" class="title">回答为空与监督数为零，是两种不同问题</text><text x="600" y="76" text-anchor="middle" class="small">绿色为保留的回答及 EOS；灰色为提示与 PAD；虚线右侧被截去</text><text x="40" y="152" text-anchor="start" class="h">正常回答</text><rect x="275" y="120" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="309" y="152" text-anchor="middle" class="h">p₁</text><rect x="353" y="120" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="387" y="152" text-anchor="middle" class="h">p₂</text><rect x="431" y="120" width="68" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/><text x="465" y="152" text-anchor="middle" class="h">a₁</text><rect x="509" y="120" width="68" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/><text x="543" y="152" text-anchor="middle" class="h">a₂</text><rect x="587" y="120" width="68" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/><text x="621" y="152" text-anchor="middle" class="h">EOS</text><rect x="665" y="120" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="699" y="152" text-anchor="middle" class="h">PAD</text><text x="1010" y="150" text-anchor="middle" class="h">监督数 = 3</text><text x="650" y="202" text-anchor="middle" class="b">回答词元与 EOS 参与损失，提示和填充位置忽略</text><text x="40" y="282" text-anchor="start" class="h">空回答</text><rect x="275" y="250" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="309" y="282" text-anchor="middle" class="h">p₁</text><rect x="353" y="250" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="387" y="282" text-anchor="middle" class="h">p₂</text><rect x="431" y="250" width="68" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/><text x="465" y="282" text-anchor="middle" class="h">EOS</text><rect x="509" y="250" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="543" y="282" text-anchor="middle" class="h">PAD</text><rect x="587" y="250" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="621" y="282" text-anchor="middle" class="h">PAD</text><rect x="665" y="250" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="699" y="282" text-anchor="middle" class="h">PAD</text><text x="1010" y="280" text-anchor="middle" class="h">监督数 = 1</text><text x="650" y="332" text-anchor="middle" class="b">仍有 EOS 标签，但示范回答缺失，内容检查拒绝</text><text x="40" y="412" text-anchor="start" class="h">提示占满窗口</text><rect x="275" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="309" y="412" text-anchor="middle" class="h">p₁</text><rect x="353" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="387" y="412" text-anchor="middle" class="h">p₂</text><rect x="431" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="465" y="412" text-anchor="middle" class="h">p₃</text><rect x="509" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="543" y="412" text-anchor="middle" class="h">p₄</text><rect x="587" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" opacity="0.45"/><text x="621" y="412" text-anchor="middle" class="h">a₁</text><rect x="665" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" opacity="0.45"/><text x="699" y="412" text-anchor="middle" class="h">a₂</text><rect x="743" y="380" width="68" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" opacity="0.45"/><text x="777" y="412" text-anchor="middle" class="h">EOS</text><path d="M578 367 V438" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="1040" y="410" text-anchor="middle" class="h">监督数 = 0</text><text x="650" y="466" text-anchor="middle" class="b">长度上限落在提示末尾：回答与 EOS 都被截去</text>
</svg>
