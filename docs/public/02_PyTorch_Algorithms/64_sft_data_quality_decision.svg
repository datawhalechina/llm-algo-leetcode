<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SFT 数据准入与版本晋级判断</title>
  <desc id="desc">先依据阻断项和可修复项确定拒绝、调优或接受，再判断清洗后的同源数据版本能否晋级。</desc>
  <defs>
    <marker id="neutral" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
    <marker id="red" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker>
    <marker id="amber" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
    <marker id="green" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:700}.b{font-size:15px;fill:#334155}.neutral,.red,.amber,.green{fill:none;stroke-width:3}.neutral{stroke:#475569;marker-end:url(#neutral)}.red{stroke:#dc2626;marker-end:url(#red)}.amber{stroke:#d97706;marker-end:url(#amber)}.green{stroke:#16a34a;marker-end:url(#green)}</style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="t">准入状态与清洗版本如何晋级</text>

  <rect x="40" y="100" width="210" height="90" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="145" y="136" text-anchor="middle" class="h">审计事实</text>
  <text x="145" y="165" text-anchor="middle" class="b">失败项与固定阈值</text>
  <path class="neutral" d="M250 145 H270"/>

  <polygon points="400,90 520,145 400,200 280,145" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="400" y="139" text-anchor="middle" class="h">存在阻断项？</text>
  <text x="400" y="164" text-anchor="middle" class="b">空监督 / 泄漏 / 评测缺失</text>

  <rect x="280" y="250" width="240" height="90" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" class="h">reject｜拒绝</text>
  <text x="400" y="314" text-anchor="middle" class="b">修复阻断项并重新审计</text>
  <path class="red" d="M400 200 V240"/>
  <text x="416" y="225" class="b">是</text>

  <polygon points="700,90 820,145 700,200 580,145" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="700" y="139" text-anchor="middle" class="h">可修复项超限？</text>
  <text x="700" y="164" text-anchor="middle" class="b">重复率 / 截断率超限</text>
  <path class="neutral" d="M520 145 H570"/>
  <text x="545" y="132" text-anchor="middle" class="b">否</text>

  <rect x="580" y="235" width="240" height="80" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="700" y="267" text-anchor="middle" class="h">tune｜调优</text>
  <text x="700" y="294" text-anchor="middle" class="b">清洗或调整长度后重新审计</text>
  <path class="amber" d="M700 200 V225"/>
  <text x="716" y="219" class="b">是</text>

  <rect x="860" y="100" width="250" height="90" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="985" y="136" text-anchor="middle" class="h">accept｜接受</text>
  <text x="985" y="165" text-anchor="middle" class="b">冻结训练快照</text>
  <path class="green" d="M820 145 H850"/>
  <text x="835" y="132" text-anchor="middle" class="b">否</text>

  <polygon points="700,330 835,400 700,470 565,400" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="700" y="383" text-anchor="middle" class="h">清洗版本可晋级？</text>
  <text x="700" y="408" text-anchor="middle" class="b">同源 · 同序列协议 · 评测量不降</text>
  <text x="700" y="430" text-anchor="middle" class="b">保留率与风险检查通过</text>
  <path class="neutral" d="M700 315 V320"/>
  <path class="neutral" d="M520 295 H545 V350 H660"/>
  <text x="550" y="337" class="b">修复后</text>

  <rect x="270" y="355" width="250" height="90" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="395" y="390" text-anchor="middle" class="h">暂不替换旧快照</text>
  <text x="395" y="419" text-anchor="middle" class="b">继续修复并重新审计</text>
  <path class="amber" d="M565 400 H530"/>
  <text x="547" y="386" text-anchor="middle" class="b">否</text>

  <rect x="880" y="355" width="260" height="90" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1010" y="390" text-anchor="middle" class="h">新版本晋级</text>
  <text x="1010" y="419" text-anchor="middle" class="b">替换旧快照并交接训练</text>
  <path class="green" d="M835 400 H870"/>
  <text x="852" y="386" text-anchor="middle" class="b">是</text>
</svg>
