<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">Ring Attention 的分片轮转与在线归一化</title><desc id="desc">每个设备保留本地 Q，K/V 分片在 p 个设备间轮转 p 轮，并逐轮累计未归一化统计，最终输出o=u/l。</desc>
<defs><style>.t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:29px;font-weight:700;fill:#0f172a}.s{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:16px;font-weight:500;fill:#475569}.h{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#111827;text-anchor:middle}.b{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:500;fill:#334155;text-anchor:middle}.x{stroke-width:2.5;rx:15}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#m)}.r{stroke:#7c3aed;stroke-width:2.5;fill:none;marker-end:url(#p)}</style><marker markerUnits="userSpaceOnUse" id="m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker markerUnits="userSpaceOnUse" id="p" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>
<rect width="1500" height="620" fill="#f8fafc"/><text x="55" y="58" class="t">K/V 分片轮转：每一轮都更新在线 Softmax 状态</text><text x="55" y="88" class="s">设备保留本地 Q；收到一块 K/V 就计算局部分数，并更新最大值m、指数和l与未归一化加权和u。</text>
<rect x="55" y="210" width="190" height="100" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="150" y="247" class="h">设备 i</text><text x="150" y="275" class="b">固定本地 Qᵢ</text>
<rect x="315" y="145" width="190" height="90" class="x" fill="#ede9fe" stroke="#8b5cf6"/><text x="410" y="180" class="h">第0轮</text><text x="410" y="207" class="b">本地 K/V 分片</text>
<rect x="565" y="145" width="190" height="90" class="x" fill="#ede9fe" stroke="#8b5cf6"/><text x="660" y="180" class="h">第1轮</text><text x="660" y="207" class="b">邻居 K/V 分片</text>
<rect x="815" y="145" width="190" height="90" class="x" fill="#ede9fe" stroke="#8b5cf6"/><text x="910" y="180" class="h">…</text><text x="910" y="207" class="b">继续轮转</text>
<rect x="1065" y="145" width="190" height="90" class="x" fill="#ede9fe" stroke="#8b5cf6"/><text x="1160" y="180" class="h">第p−1轮</text><text x="1160" y="207" class="b">最后一块 K/V</text>
<path d="M245 245H280V190H315" class="r"/><path d="M505 190H565" class="r"/><path d="M755 190H815" class="r"/><path d="M1005 190H1065" class="r"/>
<rect x="315" y="330" width="190" height="100" class="x" fill="#fff7ed" stroke="#d97706"/><text x="410" y="365" class="h">局部分数</text><text x="410" y="392" class="b">QᵢKⱼᵀ 与 Vⱼ</text>
<rect x="565" y="330" width="210" height="100" class="x" fill="#fff1f2" stroke="#e11d48"/><text x="670" y="365" class="h">更新 m</text><text x="670" y="392" class="b">累计最大分数</text>
<rect x="835" y="330" width="210" height="100" class="x" fill="#ecfeff" stroke="#0891b2"/><text x="940" y="365" class="h">更新 l</text><text x="940" y="392" class="b">累计指数和</text>
<rect x="1105" y="330" width="210" height="100" class="x" fill="#ecfccb" stroke="#65a30d"/><text x="1210" y="365" class="h">更新 u</text><text x="1210" y="392" class="b">累计未归一化加权和</text>
<path d="M410 235V330" class="a"/><path d="M505 380H565" class="a"/><path d="M775 380H835" class="a"/><path d="M1045 380H1105" class="a"/><path d="M1210 330V285H410V330" class="r"/>
<text x="810" y="276" class="b">下一分片到达后，继续累计</text>
<rect x="400" y="505" width="700" height="64" class="x" fill="#ffffff" stroke="#94a3b8"/><text x="750" y="544" class="h">处理p块K/V后，输出o=u/l；因果注意力还需施加相同位置掩码</text>
</svg>
