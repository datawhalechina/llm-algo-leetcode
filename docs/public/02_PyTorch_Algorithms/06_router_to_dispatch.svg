<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 470" role="img" aria-labelledby="title desc"><title id="title">MoE Router 从偏好到专家路径</title><desc id="desc">展示完整概率、Top-K 选择、重归一化、dispatch 和 combine 的顺序。</desc><defs><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 18px sans-serif;fill:#0f172a}.b{font:500 15px sans-serif;fill:#334155}.x{stroke-width:2.5;rx:18}.a{stroke:#64748b;stroke-width:3.5;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1420" height="470" fill="#f8fafc"/><text x="55" y="58" class="t">Router 的两类输出：训练偏好与执行路径</text><text x="55" y="88" class="s">完整概率用于统计全局偏好；Top-K 结果才决定 token 去向与专家输出如何组合。</text><rect x="60" y="180" width="180" height="100" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="90" y="220" class="h">router logits</text><text x="90" y="248" class="b">每 token × E experts</text><rect x="330" y="180" width="190" height="100" class="x" fill="#ecfeff" stroke="#0891b2"/><text x="360" y="220" class="h">full softmax p</text><text x="360" y="248" class="b">供 07 统计偏好</text><rect x="610" y="180" width="190" height="100" class="x" fill="#f5f3ff" stroke="#7c3aed"/><text x="640" y="220" class="h">Top-K ids / weights</text><text x="640" y="248" class="b">保留候选专家</text><rect x="890" y="180" width="190" height="100" class="x" fill="#fff7ed" stroke="#d97706"/><text x="920" y="220" class="h">normalize weights</text><text x="920" y="248" class="b">每 token 权重和为 1</text><rect x="1170" y="110" width="190" height="100" class="x" fill="#fff1f2" stroke="#e11d48"/><text x="1200" y="150" class="h">dispatch</text><text x="1200" y="178" class="b">按 expert 分发 token</text><rect x="1170" y="300" width="190" height="100" class="x" fill="#f0fdf4" stroke="#16a34a"/><text x="1200" y="340" class="h">combine</text><text x="1200" y="368" class="b">按权重回收输出</text><path d="M240 230H330" class="a"/><path d="M520 230H610" class="a"/><path d="M800 230H890" class="a"/><path d="M1080 230H1120V160H1170" class="a"/><path d="M1265 210V300" class="a"/></svg>
