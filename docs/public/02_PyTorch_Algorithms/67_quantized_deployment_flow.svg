<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
<title id="title">固定请求比较同源浮点与量化部署</title><desc id="desc">同一模型与请求分别在浮点和量化路径运行，合并请求结果、实际路径与上游质量记录，再按给定条件形成部署判断。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1240" height="600" fill="#f8fafc"/><text x="620" y="43" text-anchor="middle" class="title">固定请求比较同源浮点与量化部署</text>
<rect x="370" y="100" width="500" height="85" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="620" y="132" text-anchor="middle" class="h">同一模型与请求条件</text><text x="620" y="159" text-anchor="middle">版本、分词、并发、生成规则、后端与硬件</text>
<rect x="80" y="275" width="270" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="215" y="307" text-anchor="middle" class="h">浮点基线</text><text x="215" y="334" text-anchor="middle">每轮保存请求与运行记录</text>
<rect x="485" y="275" width="270" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="620" y="307" text-anchor="middle" class="h">量化候选</text><text x="620" y="334" text-anchor="middle">同源产物，相同请求</text>
<rect x="890" y="275" width="270" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="1025" y="307" text-anchor="middle" class="h">实际执行核对</text><text x="1025" y="334" text-anchor="middle">量化路径与回退情况</text>
<path d="M450 185V225H215V275" class="e"/>
<path d="M620 185V275" class="e"/>
<path d="M755 320H890" class="e"/>
<rect x="80" y="465" width="270" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="215" y="497" text-anchor="middle" class="h">来源质量记录</text><text x="215" y="524" text-anchor="middle">已有候选选择评测</text>
<rect x="485" y="465" width="675" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="822.5" y="497" text-anchor="middle" class="h">配对指标与部署判断</text><text x="822.5" y="524" text-anchor="middle">先核对来源、执行与质量，再检查资源容许条件</text>
<path d="M215 365V420H550V465" class="e"/>
<path d="M620 365V465" class="e"/>
<path d="M1025 365V465" class="e"/>
<path d="M350 510H485" class="e"/>
<text x="620" y="587" text-anchor="middle" class="s">运行先后多轮交换；是否加速由相对基线的实际变化判断</text>
</svg>
