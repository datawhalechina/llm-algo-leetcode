<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">量化推理部署的统一对照与决策</title>
  <desc id="desc">先固定模型、workload 和运行环境，在 CPU 账本确认量化表示与质量门槛，再比较浮点 baseline、量化 candidate 和可选 backend，最后依据性能、质量和证据形成部署判断。</desc>
  <defs>
    <style>
      .title{font:700 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.group{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#35526b}.h{font:700 17px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#526b7d}.frame{fill:#fff;stroke:#c7d9e7;stroke-width:1.5}.blue{fill:#e8f3fb;stroke:#3978a8;stroke-width:2}.purple{fill:#f1eafa;stroke:#8b6bb1;stroke-width:2}.green{fill:#eaf7ef;stroke:#4c9870;stroke-width:2}.orange{fill:#fff1df;stroke:#c78335;stroke-width:2}.flow{stroke:#3978a8;stroke-width:3;fill:none;marker-end:url(#arrow)}.optional{stroke:#8b6bb1;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#purpleArrow)}
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#3978a8"/></marker>
    <marker id="purpleArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8b6bb1"/></marker>
  </defs>
  <rect width="1240" height="600" rx="24" fill="#f8fbfd"/>
  <text x="620" y="48" text-anchor="middle" class="title">量化部署：从统一对照到可复核的部署判断</text>
  <text x="620" y="76" text-anchor="middle" class="sub">比较对象必须共享模型、workload 与运行环境，才能解释性能与质量的变化</text>

  <rect x="370" y="110" width="500" height="68" rx="18" class="blue"/>
  <text x="620" y="139" text-anchor="middle" class="h">统一比较条件</text>
  <text x="620" y="162" text-anchor="middle" class="t">模型 · workload · backend · dtype · 生成长度</text>

  <rect x="45" y="245" width="250" height="128" rx="18" class="frame"/>
  <text x="68" y="276" class="group">CPU 机制账本</text>
  <rect x="68" y="300" width="204" height="48" rx="12" class="blue"/>
  <text x="170" y="331" text-anchor="middle" class="h">量化表示与误差门槛</text>

  <rect x="345" y="245" width="250" height="128" rx="18" class="frame"/>
  <text x="368" y="276" class="group">浮点 baseline</text>
  <rect x="368" y="300" width="204" height="48" rx="12" class="green"/>
  <text x="470" y="331" text-anchor="middle" class="h">延迟、吞吐、显存与质量</text>

  <rect x="645" y="245" width="250" height="128" rx="18" class="frame"/>
  <text x="668" y="276" class="group">量化 candidate</text>
  <rect x="668" y="300" width="204" height="48" rx="12" class="orange"/>
  <text x="770" y="331" text-anchor="middle" class="h">同一 workload 下的对照</text>

  <rect x="945" y="245" width="250" height="128" rx="18" class="frame"/>
  <text x="968" y="276" class="group">可选 backend 扩展</text>
  <rect x="968" y="300" width="204" height="48" rx="12" class="purple"/>
  <text x="1070" y="331" text-anchor="middle" class="h">artifact、格式与执行证据</text>

  <path d="M620 178V205H170V245" class="flow"/>
  <path d="M620 178V205H470V245" class="flow"/>
  <path d="M620 178V205H770V245" class="flow"/>
  <path d="M620 178V205H1070V245" class="optional"/>

  <rect x="260" y="455" width="720" height="86" rx="18" class="green"/>
  <text x="620" y="487" text-anchor="middle" class="h">统一结果表与部署判断</text>
  <text x="620" y="513" text-anchor="middle" class="t">性能与显存 · 任务质量与兼容性 · artifact 与 evidence level</text>
  <text x="620" y="533" text-anchor="middle" class="t">accept · tune · reject</text>
  <path d="M170 373V415H440V455" class="flow"/>
  <path d="M470 373V455" class="flow"/>
  <path d="M770 373V455" class="flow"/>
  <path d="M1070 373V415H800V455" class="optional"/>
</svg>
