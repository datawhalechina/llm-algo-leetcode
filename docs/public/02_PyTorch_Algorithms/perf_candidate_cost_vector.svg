<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">权重减少并不保证整体峰值下降</title>
  <desc id="desc">构造容量对照，各自峰值时刻按同一比例绘图：基线权重64MiB和其他驻留32MiB，共96MiB；候选权重32MiB、其他驻留32MiB和新增临时区40MiB，共104MiB。</desc>
  <defs><style>
    .title{font-family:"Noto Sans CJK SC",sans-serif;font-size:28px;font-weight:700;fill:#0f172a}
    .subtitle{font-family:"Noto Sans CJK SC",sans-serif;font-size:16px;fill:#475569}
    .head{font-family:"Noto Sans CJK SC",sans-serif;font-size:18px;font-weight:700;fill:#172033}
    .body{font-family:"Noto Sans CJK SC",sans-serif;font-size:15px;fill:#334155}
    .axis{stroke:#64748b;stroke-width:2}
  </style></defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">权重更小，新增临时区仍可能抬高整体峰值</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">构造示例，非 BF16 实测：分别取两方案各自峰值时刻，所有块使用同一容量比例</text>
  <text x="55" y="215" class="head">基线峰值</text>
  <g text-anchor="middle">
    <rect x="240" y="160" width="384" height="96" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="432" y="215" class="body">权重 64 MiB</text>
    <rect x="624" y="160" width="192" height="96" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="720" y="215" class="body">其他驻留 32 MiB</text>
  </g>
  <text x="1030" y="215" text-anchor="middle" class="head">合计 96 MiB</text>
  <text x="55" y="385" class="head">候选峰值</text>
  <g text-anchor="middle">
    <rect x="240" y="330" width="192" height="96" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="336" y="385" class="body">权重 32 MiB</text>
    <rect x="432" y="330" width="192" height="96" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="528" y="385" class="body">其他驻留 32 MiB</text>
    <rect x="624" y="330" width="240" height="96" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="744" y="385" class="body">新增临时区 40 MiB</text>
  </g>
  <text x="1030" y="385" text-anchor="middle" class="head">合计 104 MiB</text>
  <line x1="240" y1="490" x2="912" y2="490" class="axis"/>
  <g class="body" text-anchor="middle">
    <text x="240" y="520">0</text><text x="432" y="520">32</text>
    <text x="624" y="520">64</text><text x="816" y="520">96</text><text x="912" y="520">112</text>
  </g>
  <text x="1080" y="560" text-anchor="end" class="body">容量（MiB）→</text>
</svg>
