<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">按失败原因决定拒绝、调参、补测或接受</title>
  <desc id="desc">先合同和产物，后质量、重复计时和资源条件。失败出口依次为reject、tune、measure、tune，全部通过为accept。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/>
  <text x="45" y="52" class="title">按失败原因决定拒绝、调参、补测或接受</text>
  <rect x="45" y="150" width="240" height="140" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="165" y="184" text-anchor="middle" class="label">记录与产物</text>
  <text x="165" y="214" text-anchor="middle" class="body">共同起点、数据记录</text>
  <text x="165" y="240" text-anchor="middle" class="body">文件校验与加载</text>
  <rect x="330" y="150" width="240" height="140" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="184" text-anchor="middle" class="label">质量增益与保持</text>
  <text x="450" y="214" text-anchor="middle" class="body">候选相对 G0 的增益</text>
  <text x="450" y="240" text-anchor="middle" class="body">候选与教师的分数比</text>
  <rect x="615" y="150" width="240" height="140" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="735" y="184" text-anchor="middle" class="label">重复计时</text>
  <text x="735" y="214" text-anchor="middle" class="body">重复次数与样本数</text>
  <text x="735" y="240" text-anchor="middle" class="body">读取候选计时摘要</text>
  <rect x="900" y="150" width="240" height="140" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="184" text-anchor="middle" class="label">资源与类别</text>
  <text x="1020" y="214" text-anchor="middle" class="body">大小、延迟比值</text>
  <text x="1020" y="240" text-anchor="middle" class="body">各类别分数变化</text>
  <path d="M285 220 H330" class="edge"/>
  <path d="M570 220 H615" class="edge"/>
  <path d="M855 220 H900" class="edge"/>
  <text x="295" y="198" class="small">过</text><text x="580" y="198" class="small">过</text><text x="865" y="198" class="small">过</text>
  <rect x="45" y="380" width="240" height="90" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="414" text-anchor="middle" class="label">reject</text>
  <text x="165" y="444" text-anchor="middle" class="body">修复记录或产物</text>
  <rect x="330" y="380" width="240" height="90" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="414" text-anchor="middle" class="label">tune</text>
  <text x="450" y="444" text-anchor="middle" class="body">调整训练后复测</text>
  <rect x="615" y="380" width="240" height="90" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="735" y="414" text-anchor="middle" class="label">measure</text>
  <text x="735" y="444" text-anchor="middle" class="body">补充重复推理计时</text>
  <rect x="900" y="350" width="240" height="90" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1020" y="384" text-anchor="middle" class="label">tune</text>
  <text x="1020" y="414" text-anchor="middle" class="body">调整资源或质量条件</text>
  <rect x="900" y="460" width="240" height="65" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="494" text-anchor="middle" class="label">accept</text>

  <path d="M165 290 V380" class="edge"/>
  <path d="M450 290 V380" class="edge"/>
  <path d="M735 290 V380" class="edge"/>
  <path d="M1020 290 V350" class="edge"/>
  <path d="M1140 220 H1170 V492 H1140" class="edge"/>
  <text x="175" y="332" class="small">失败</text><text x="460" y="332" class="small">不足</text><text x="745" y="332" class="small">不足</text><text x="1030" y="328" class="small">超限</text><text x="1160" y="315" text-anchor="end" class="small">全部通过</text>
  <text x="45" y="535" class="small">accept 对应输入记录所列门槛；最终留出评测与实际文件检查按各自记录核对。</text>
</svg>
