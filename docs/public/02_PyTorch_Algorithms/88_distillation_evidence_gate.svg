<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">蒸馏学生交付的证据门</title>
  <desc id="desc">项目依次检查实验合同、质量提升、产物完整性和部署收益，再形成拒绝、调优、继续测量或接受结论。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #334155; }
      .decision { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="54" class="title">质量更高还不够：学生必须同时通过四道证据门</text>

  <rect x="60" y="120" width="220" height="132" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="170" y="158" text-anchor="middle" class="label">1 · 实验合同</text>
  <text x="170" y="190" text-anchor="middle" class="body">共同学生起点与预算</text>
  <text x="170" y="216" text-anchor="middle" class="body">训练 / 评测切分隔离</text>

  <rect x="340" y="120" width="220" height="132" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="158" text-anchor="middle" class="label">2 · 质量证据</text>
  <text x="450" y="190" text-anchor="middle" class="body">优于 G0 学生基线</text>
  <text x="450" y="216" text-anchor="middle" class="body">达到教师保留率门槛</text>

  <rect x="620" y="120" width="220" height="132" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="730" y="158" text-anchor="middle" class="label">3 · 产物证据</text>
  <text x="730" y="190" text-anchor="middle" class="body">权重、配置和哈希齐全</text>
  <text x="730" y="216" text-anchor="middle" class="body">目标 loader 可重新加载</text>

  <rect x="900" y="120" width="220" height="132" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1010" y="158" text-anchor="middle" class="label">4 · 部署证据</text>
  <text x="1010" y="190" text-anchor="middle" class="body">大小或显存比例达标</text>
  <text x="1010" y="216" text-anchor="middle" class="body">延迟 / 吞吐满足目标</text>

  <path d="M280 186 H340" class="edge"/>
  <path d="M560 186 H620" class="edge"/>
  <path d="M840 186 H900" class="edge"/>

  <path d="M170 252 V342" class="edge"/>
  <path d="M450 252 V342" class="edge"/>
  <path d="M730 252 V342" class="edge"/>
  <path d="M1010 252 V342" class="edge"/>

  <rect x="72" y="342" width="196" height="86" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="378" text-anchor="middle" class="decision" fill="#991b1b">reject</text>
  <text x="170" y="405" text-anchor="middle" class="body">合同不可比较</text>

  <rect x="352" y="342" width="196" height="86" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="378" text-anchor="middle" class="decision" fill="#9a3412">tune</text>
  <text x="450" y="405" text-anchor="middle" class="body">质量尚未达标</text>

  <rect x="632" y="342" width="196" height="86" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="730" y="378" text-anchor="middle" class="decision" fill="#854d0e">measure</text>
  <text x="730" y="405" text-anchor="middle" class="body">补产物或运行证据</text>

  <rect x="912" y="342" width="196" height="86" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1010" y="378" text-anchor="middle" class="decision" fill="#166534">accept</text>
  <text x="1010" y="405" text-anchor="middle" class="body">学生可进入交付</text>
</svg>
