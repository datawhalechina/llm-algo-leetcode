<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">Serving副本的数据流与状态输入</title><desc id="desc">请求经路由器选择三个独立模型副本之一，输出经返回通道送回。可用时间、缓存与会话归属作为路由器的独立状态输入，不将响应结果直接当作缓存或队列状态。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1500" height="650" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">请求选一个副本执行，运行状态另行送入路由器</text>
<text x="55" y="80" class="sub" text-anchor="start">每个副本保存完整模型与本地KV状态；实线为请求／响应，虚线为副本上报的路由状态。</text>
<rect x="55" y="285" width="210" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="160" y="313" class="head" text-anchor="middle">请求入口</text>
<text x="160" y="337" class="body" text-anchor="middle">到达时间、前缀、会话</text>
<rect x="355" y="260" width="250" height="140" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="480" y="288" class="head" text-anchor="middle">副本路由器</text>
<text x="480" y="312" class="body" text-anchor="middle">轮询／队列／局部性</text>
<rect x="780" y="135" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="900" y="163" class="head" text-anchor="middle">副本 A</text>
<text x="900" y="187" class="body" text-anchor="middle">完整模型＋本地KV</text>
<rect x="780" y="290" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="900" y="318" class="head" text-anchor="middle">副本 B</text>
<text x="900" y="342" class="body" text-anchor="middle">完整模型＋本地KV</text>
<rect x="780" y="445" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="900" y="473" class="head" text-anchor="middle">副本 C</text>
<text x="900" y="497" class="body" text-anchor="middle">完整模型＋本地KV</text>
<rect x="1185" y="290" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1315" y="318" class="head" text-anchor="middle">返回请求结果</text>
<text x="1315" y="342" class="body" text-anchor="middle">词元／耗时／失败</text>
<path id="request-to-router" d="M265 330H355" class="flow"/>
<path id="route-A" d="M605 280H690V175H780" class="flow"/>
<path id="route-B" d="M605 330H780" class="flow"/>
<path id="route-C" d="M605 380H690V485H780" class="flow"/>
<path id="return-A" d="M1020 175H1110V310H1185" class="flow"/>
<path id="return-B" d="M1020 330H1185" class="flow"/>
<path id="return-C" d="M1020 485H1110V350H1185" class="flow"/>
<rect x="355" y="535" width="250" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="480" y="563" class="head" text-anchor="middle">副本上报状态</text>
<text x="480" y="587" class="body" text-anchor="middle">可用时间、缓存、会话归属</text>
<path id="status-to-router" d="M480 535V400" class="feedback"/>
<text x="55" y="640" class="sub" text-anchor="start">队列感知比较预计开始时间；局部性感知额外读取缓存与会话信息。</text>
</svg>
