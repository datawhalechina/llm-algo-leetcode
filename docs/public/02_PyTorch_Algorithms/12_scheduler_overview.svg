<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="title desc">
  <title id="title">参数更新与学习率调度时钟</title>
  <desc id="desc">梯度形成后先检查有效性，成功写回参数才推进调度时钟，跳过更新则保持当前步。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:14px;fill:#334155}.label{font-size:13px;font-weight:700}.node{stroke-width:2;rx:14}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1240" height="600" fill="#f8fafc"/>
  <text x="620" y="44" text-anchor="middle" class="title">学习率调度跟随成功的参数更新</text>
  <text x="620" y="73" text-anchor="middle" class="sub">前向、反向和累积次数不是调度时钟；参数是否真正变化才是</text>

  <rect x="55" y="228" width="220" height="104" fill="#eff6ff" stroke="#60a5fa" class="node"/>
  <text x="165" y="269" text-anchor="middle" class="head">形成候选梯度</text><text x="165" y="298" text-anchor="middle" class="body">一次或多次微批次累积</text>
  <path d="M275 280H360" class="flow"/>
  <rect x="360" y="228" width="220" height="104" fill="#fff7ed" stroke="#fb923c" class="node"/>
  <text x="470" y="269" text-anchor="middle" class="head">检查更新有效性</text><text x="470" y="298" text-anchor="middle" class="body">有限值、边界与更新条件</text>

  <path d="M580 280H620V212H665" class="flow"/>
  <rect x="586" y="178" width="68" height="27" rx="7" fill="#f8fafc"/>
  <text x="620" y="197" text-anchor="middle" class="label" fill="#047857">通过</text>
  <rect x="665" y="160" width="220" height="104" fill="#ecfdf5" stroke="#34d399" class="node"/>
  <text x="775" y="201" text-anchor="middle" class="head">写回参数</text><text x="775" y="230" text-anchor="middle" class="body">发生一次有效参数变化</text>
  <path d="M885 212H970" class="flow"/>
  <rect x="970" y="160" width="220" height="104" fill="#f5f3ff" stroke="#a78bfa" class="node"/>
  <text x="1080" y="201" text-anchor="middle" class="head">推进调度时钟</text><text x="1080" y="230" text-anchor="middle" class="body">为下一次更新准备学习率</text>

  <path d="M580 280H620V402H665" class="flow"/>
  <rect x="568" y="369" width="104" height="27" rx="7" fill="#f8fafc"/>
  <text x="620" y="388" text-anchor="middle" class="label" fill="#b91c1c">失败或跳步</text>
  <rect x="665" y="350" width="220" height="104" fill="#fef2f2" stroke="#f87171" class="node"/>
  <text x="775" y="391" text-anchor="middle" class="head">保持参数不变</text><text x="775" y="420" text-anchor="middle" class="body">本轮不构成有效更新</text>
  <path d="M885 402H970" class="flow"/>
  <rect x="970" y="350" width="220" height="104" fill="#f1f5f9" stroke="#94a3b8" class="node"/>
  <text x="1080" y="391" text-anchor="middle" class="head">保持当前调度步</text><text x="1080" y="420" text-anchor="middle" class="body">不提前消耗学习率进度</text>
</svg>
