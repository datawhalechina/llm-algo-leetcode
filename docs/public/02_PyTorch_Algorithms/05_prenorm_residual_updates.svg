<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 560" role="img" aria-labelledby="title desc"><title id="title">Decoder Block 的两次 Pre-Norm 残差更新</title><desc id="desc">展示 Attention 更新和 MLP 更新如何依次写回同一条 hidden state 主路径。</desc><defs><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 18px sans-serif;fill:#0f172a}.b{font:500 15px sans-serif;fill:#334155}.x{stroke-width:2.5;rx:18}.a{stroke:#64748b;stroke-width:3.5;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1420" height="560" fill="#f8fafc"/><text x="55" y="58" class="t">两次 Pre-Norm 更新：同一条主状态依次吸收上下文与通道变化</text><text x="55" y="88" class="s">Attention 改变 token 间信息流；MLP 改变单 token 的通道表示；两次输出都回到 [B, S, D]。</text><rect x="70" y="215" width="180" height="100" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="100" y="254" class="h">x</text><text x="100" y="282" class="b">hidden state</text><rect x="360" y="135" width="220" height="100" class="x" fill="#ecfeff" stroke="#0891b2"/><text x="390" y="174" class="h">RMSNorm → Attention</text><text x="390" y="202" class="b">RoPE / GQA 在内部生效</text><rect x="680" y="215" width="190" height="100" class="x" fill="#f5f3ff" stroke="#7c3aed"/><text x="710" y="254" class="h">h = x + update</text><text x="710" y="282" class="b">上下文更新后的主状态</text><rect x="970" y="135" width="220" height="100" class="x" fill="#fff7ed" stroke="#d97706"/><text x="1000" y="174" class="h">RMSNorm → SwiGLU</text><text x="1000" y="202" class="b">逐 token 通道变换</text><rect x="1260" y="215" width="120" height="100" class="x" fill="#f0fdf4" stroke="#16a34a"/><text x="1290" y="254" class="h">out</text><text x="1290" y="282" class="b">[B,S,D]</text><path d="M250 265H300V185H360" class="a"/><path d="M250 265H680" class="a"/><path d="M580 185H630V265H680" class="a"/><path d="M870 265H920V185H970" class="a"/><path d="M870 265H1260" class="a"/><path d="M1190 185H1230V265H1260" class="a"/><text x="82" y="500" class="s">结构替换可以发生在 Attention 或 FFN 内部，但每个子层都必须回到与残差相容的 [B, S, D] 接口。</text></svg>
