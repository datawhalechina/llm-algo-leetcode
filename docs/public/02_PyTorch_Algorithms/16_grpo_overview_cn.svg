<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 训练总览</title>
  <desc id="desc">同一个 prompt 生成多个候选，经验证器或奖励模型评分后进行组内比较，再更新策略。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>.h{font:700 26px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:500 15px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#475569}.l{font:700 18px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.b{font:500 14px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#334155}.box{stroke-width:3;rx:16}.f{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="500" fill="#f8fafc"/>
  <text x="50" y="55" class="h">GRPO：同一问题上的候选比较</text>
  <text x="50" y="83" class="s">GRPO 用组内相对奖励形成更新信号，再用策略裁剪控制更新幅度。</text>
  <rect x="55" y="190" width="210" height="110" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="160" y="232" text-anchor="middle" class="l">Prompt</text><text x="160" y="263" text-anchor="middle" class="b">同一个问题</text>
  <rect x="335" y="125" width="235" height="100" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="452" y="165" text-anchor="middle" class="l">候选组</text><text x="452" y="195" text-anchor="middle" class="b">response 1 / 2 / … / k</text>
  <rect x="335" y="275" width="235" height="100" class="box" fill="#ecfccb" stroke="#65a30d"/>
  <text x="452" y="315" text-anchor="middle" class="l">验证器 / 奖励</text><text x="452" y="345" text-anchor="middle" class="b">规则、模型或人工信号</text>
  <rect x="640" y="190" width="220" height="110" class="box" fill="#fff1f2" stroke="#e11d48"/>
  <text x="750" y="232" text-anchor="middle" class="l">组内相对优势</text><text x="750" y="263" text-anchor="middle" class="b">center + normalize</text>
  <rect x="930" y="190" width="210" height="110" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1035" y="232" text-anchor="middle" class="l">策略更新</text><text x="1035" y="263" text-anchor="middle" class="b">ratio + clipping</text>
  <path d="M265 245L335 175M265 255L335 325M570 175L640 225M570 325L640 275M860 245H930" class="f"/>
</svg>
