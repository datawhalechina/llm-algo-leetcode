<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">SFT 下一 Token 对齐与有效监督归约</title>
  <desc id="desc">当前位置的预测与后一位置标签对齐，负一百标签和填充位置不产生损失；不同微批次先累计损失和与有效监督 Token 数，再统一相除。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569"/>
    </marker>
    <marker id="validArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#16A34A"/>
    </marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .title{font-size:30px;font-weight:700;fill:#0F172A}
      .subtitle{font-size:17px;fill:#475569}
      .heading{font-size:20px;font-weight:700;fill:#0F172A}
      .body{font-size:16px;fill:#334155}
      .small{font-size:14px;fill:#475569}
      .cell{stroke-width:1.7}
    </style>
  </defs>

  <rect width="1440" height="600" rx="24" fill="#F8FAFC"/>
  <text x="56" y="58" class="title">下一 Token 对齐与有效监督 Token 归约</text>
  <text x="56" y="91" class="subtitle">先右移预测与目标，再按有效监督位置聚合；不能按样本数或微批次数简单平均。</text>

  <rect x="56" y="128" width="1328" height="254" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="82" y="166" class="heading">位置级对齐</text>
  <text x="82" y="213" class="body" font-weight="700">预测位置</text>
  <text x="82" y="278" class="body" font-weight="700">后一位置标签</text>
  <text x="82" y="343" class="body" font-weight="700">计入损失</text>

  <g>
    <rect x="236" y="184" width="118" height="46" rx="9" fill="#FFEDD5" stroke="#F59E0B" class="cell"/><text x="295" y="213" text-anchor="middle" class="small">prompt₀</text>
    <rect x="364" y="184" width="118" height="46" rx="9" fill="#FFEDD5" stroke="#F59E0B" class="cell"/><text x="423" y="213" text-anchor="middle" class="small">prompt₁</text>
    <rect x="492" y="184" width="118" height="46" rx="9" fill="#FFEDD5" stroke="#F59E0B" class="cell"/><text x="551" y="213" text-anchor="middle" class="small">prompt₂</text>
    <rect x="620" y="184" width="118" height="46" rx="9" fill="#DCFCE7" stroke="#16A34A" class="cell"/><text x="679" y="213" text-anchor="middle" class="small">response₀</text>
    <rect x="748" y="184" width="118" height="46" rx="9" fill="#DCFCE7" stroke="#16A34A" class="cell"/><text x="807" y="213" text-anchor="middle" class="small">response₁</text>
    <rect x="876" y="184" width="118" height="46" rx="9" fill="#DCFCE7" stroke="#16A34A" class="cell"/><text x="935" y="213" text-anchor="middle" class="small">response₂</text>
    <rect x="1004" y="184" width="118" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED" class="cell"/><text x="1063" y="213" text-anchor="middle" class="small">EOS</text>
    <rect x="1132" y="184" width="118" height="46" rx="9" fill="#E2E8F0" stroke="#64748B" class="cell"/><text x="1191" y="213" text-anchor="middle" class="small">padding</text>

    <rect x="236" y="249" width="118" height="46" rx="9" fill="#E2E8F0" stroke="#64748B" class="cell"/><text x="295" y="278" text-anchor="middle" class="small">-100</text>
    <rect x="364" y="249" width="118" height="46" rx="9" fill="#E2E8F0" stroke="#64748B" class="cell"/><text x="423" y="278" text-anchor="middle" class="small">-100</text>
    <rect x="492" y="249" width="118" height="46" rx="9" fill="#DCFCE7" stroke="#16A34A" class="cell"/><text x="551" y="278" text-anchor="middle" class="small">response₀</text>
    <rect x="620" y="249" width="118" height="46" rx="9" fill="#DCFCE7" stroke="#16A34A" class="cell"/><text x="679" y="278" text-anchor="middle" class="small">response₁</text>
    <rect x="748" y="249" width="118" height="46" rx="9" fill="#DCFCE7" stroke="#16A34A" class="cell"/><text x="807" y="278" text-anchor="middle" class="small">response₂</text>
    <rect x="876" y="249" width="118" height="46" rx="9" fill="#EDE9FE" stroke="#7C3AED" class="cell"/><text x="935" y="278" text-anchor="middle" class="small">EOS</text>
    <rect x="1004" y="249" width="118" height="46" rx="9" fill="#E2E8F0" stroke="#64748B" class="cell"/><text x="1063" y="278" text-anchor="middle" class="small">-100</text>
    <rect x="1132" y="249" width="118" height="46" rx="9" fill="#E2E8F0" stroke="#64748B" class="cell"/><text x="1191" y="278" text-anchor="middle" class="small">无下一目标</text>

    <text x="295" y="343" text-anchor="middle" class="body">否</text>
    <text x="423" y="343" text-anchor="middle" class="body">否</text>
    <text x="551" y="343" text-anchor="middle" class="body" fill="#166534">是</text>
    <text x="679" y="343" text-anchor="middle" class="body" fill="#166534">是</text>
    <text x="807" y="343" text-anchor="middle" class="body" fill="#166534">是</text>
    <text x="935" y="343" text-anchor="middle" class="body" fill="#166534">是</text>
    <text x="1063" y="343" text-anchor="middle" class="body">否</text>
    <text x="1191" y="343" text-anchor="middle" class="body">否</text>
  </g>

  <path d="M684 382V398H316V414" fill="none" stroke="#16A34A" stroke-width="2.3" marker-end="url(#validArrow)"/>
  <path d="M684 398V414" fill="none" stroke="#16A34A" stroke-width="2.3" marker-end="url(#validArrow)"/>

  <rect x="176" y="414" width="280" height="132" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="202" y="450" class="heading" fill="#1E3A8A">微批次 A</text>
  <text x="202" y="482" class="body">损失和 Σℓ = 7.2</text>
  <text x="202" y="514" class="body">有效监督 Token 数 = 4</text>

  <rect x="544" y="414" width="280" height="132" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="570" y="450" class="heading" fill="#5B21B6">微批次 B</text>
  <text x="570" y="482" class="body">损失和 Σℓ = 5.0</text>
  <text x="570" y="514" class="body">有效监督 Token 数 = 2</text>

  <text x="500" y="490" text-anchor="middle" class="heading">+</text>
  <path d="M824 480H952" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="952" y="414" width="312" height="132" rx="18" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="978" y="450" class="heading" fill="#166534">统一按有效 Token 归约</text>
  <text x="978" y="486" class="body">L = (7.2 + 5.0) / (4 + 2)</text>
  <text x="978" y="518" class="body">不是 mean(7.2 / 4, 5.0 / 2)</text>
</svg>
