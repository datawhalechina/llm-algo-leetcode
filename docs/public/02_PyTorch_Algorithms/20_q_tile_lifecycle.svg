<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">一个 Q 分块遍历全部 K/V 分块的生命周期</title>
  <desc id="desc">固定 Q 分块，初始化在线状态，顺序处理每个 K/V 分块，循环更新状态后写回输出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#486581"/></marker>
    <style>.title{font:700 25px sans-serif;fill:#102a43}.node{fill:#fff;stroke:#477a9e;stroke-width:2}.fixed{fill:#eaf3fb;stroke:#5684aa;stroke-width:2}.tile{fill:#fff6e8;stroke:#c9852f;stroke-width:2}.state{fill:#f2edfb;stroke:#8066b3;stroke-width:2}.result{fill:#eaf7ef;stroke:#4e8a68;stroke-width:2}.diamond{fill:#fff;stroke:#477a9e;stroke-width:2}.label{font:700 16px sans-serif;fill:#17324d}.small{font:14px sans-serif;fill:#365269}.formula{font:15px monospace;fill:#294861}.edge{fill:none;stroke:#486581;stroke-width:2.4;marker-end:url(#arrow)}.loop{fill:none;stroke:#8066b3;stroke-width:2.4;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" class="title">一个 Q 分块的生命周期：顺序吸收全部 K/V 分块，再写回一次输出</text>

  <rect x="36" y="142" width="184" height="96" rx="14" class="fixed"/>
  <text x="128" y="176" text-anchor="middle" class="label">固定 Q 分块</text>
  <text x="128" y="202" text-anchor="middle" class="formula">Q_i：最多 B_q 行</text>
  <text x="128" y="224" text-anchor="middle" class="small">遍历 K/V 时保持不变</text>

  <rect x="276" y="142" width="184" height="96" rx="14" class="state"/>
  <text x="368" y="176" text-anchor="middle" class="label">初始化在线状态</text>
  <text x="368" y="201" text-anchor="middle" class="formula">m_i = −∞，l_i = 0</text>
  <text x="368" y="224" text-anchor="middle" class="formula">O_i = 0</text>

  <rect x="516" y="142" width="196" height="96" rx="14" class="tile"/>
  <text x="614" y="176" text-anchor="middle" class="label">读取第 j 个 K/V 分块</text>
  <text x="614" y="202" text-anchor="middle" class="formula">K_j、V_j：最多 B_k 行</text>
  <text x="614" y="224" text-anchor="middle" class="small">尾部分块可以更短</text>

  <rect x="516" y="258" width="196" height="96" rx="14" class="node"/>
  <text x="614" y="292" text-anchor="middle" class="label">局部分数与掩码</text>
  <text x="614" y="318" text-anchor="middle" class="formula">S_ij = Q_iK_jᵀ/√D</text>
  <text x="614" y="340" text-anchor="middle" class="small">因果约束使用全局位置</text>

  <rect x="756" y="258" width="196" height="96" rx="14" class="state"/>
  <text x="854" y="292" text-anchor="middle" class="label">更新在线状态</text>
  <text x="854" y="318" text-anchor="middle" class="formula">m_i、l_i、O_i</text>
  <text x="854" y="340" text-anchor="middle" class="small">重标定历史与当前贡献</text>

  <path d="M220 190 H276" class="edge"/>
  <path d="M460 190 H516" class="edge"/>
  <path d="M614 238 V258" class="edge"/>
  <path d="M712 306 H756" class="edge"/>

  <polygon points="1060,244 1140,306 1060,368 980,306" class="diamond"/>
  <text x="1060" y="298" text-anchor="middle" class="label">还有 K/V</text>
  <text x="1060" y="321" text-anchor="middle" class="label">分块吗？</text>
  <path d="M952 306 H980" class="edge"/>
  <path d="M1140 306 H1170 V86 H614 V142" class="loop"/>
  <text x="1154" y="290" text-anchor="middle" class="small">有</text>

  <rect x="924" y="402" width="272" height="78" rx="14" class="result"/>
  <text x="1060" y="433" text-anchor="middle" class="label">写回当前输出分块</text>
  <text x="1060" y="459" text-anchor="middle" class="formula">输出分块 i = O_i</text>
  <path d="M1060 368 V402" class="edge"/>
  <text x="1077" y="391" class="small">没有</text>

  <text x="600" y="508" text-anchor="middle" class="small">外层循环切换到下一个 Q 分块；当前 Q 分块只在遍历完全部 K/V 后写回一次结果</text>
</svg>
