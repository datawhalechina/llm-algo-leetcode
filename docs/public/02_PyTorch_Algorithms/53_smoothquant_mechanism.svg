<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
 <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker></defs><rect width="1200" height="430" rx="20" fill="#f8fafc"/>
 <text x="48" y="51" font-family="Arial" font-size="26" font-weight="700" fill="#172554">等价变换：先平滑通道，再分别量化输入与权重</text>
 <g font-family="Arial" font-size="19" text-anchor="middle" fill="#1e293b"><rect x="75" y="125" width="210" height="82" rx="14" fill="#fee2e2" stroke="#f87171"/><text x="180" y="158" font-weight="700">X：激活</text><text x="180" y="186">某些通道范围很大</text><rect x="75" y="275" width="210" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="180" y="308" font-weight="700">W：权重</text><text x="180" y="336">通常更易量化</text><rect x="445" y="195" width="250" height="92" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="570" y="231" font-weight="700">通道 scale s</text><text x="570" y="260">由校准范围与 α 决定</text><rect x="855" y="125" width="245" height="82" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="978" y="158" font-weight="700">X′ = X / s</text><text x="978" y="186">激活范围更平滑</text><rect x="855" y="275" width="245" height="82" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="978" y="308" font-weight="700">W′ = W × s</text><text x="978" y="336">保持 XW = X′W′</text></g>
 <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M285 166 H365 V220 H445"/><path d="M285 316 H365 V263 H445"/><path d="M695 220 H775 V166 H855"/><path d="M695 263 H775 V316 H855"/></g>
</svg>
