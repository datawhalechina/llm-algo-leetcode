<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">通信线索如何进入单项调整与同负载复测</title><desc id="desc">三条并列路径分别解释rank滞后、通信暴露和跨rank路由压力。每条路径选择一个候选动作并记录可能的新代价，再在同模型和负载下配对复测完成时间、质量与容量，决定保留、继续调整或补采信息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.group{font-size:18px;font-weight:700}.head{font-size:17px;font-weight:700}.body{font-size:15px;font-weight:400}.sub{font-size:16px;fill:#475569}.flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">缓解通信热点：选一个动作，同时检查它引入了什么代价</text>
<text x="55" y="80" class="sub" text-anchor="start">下面三行是不同线索的候选方向；每轮选一个动作，在同模型、同负载下做配对比较。</text>
<text x="55" y="117" class="group" text-anchor="start">观察到的线索</text>
<text x="405" y="117" class="group" text-anchor="start">单项候选动作</text>
<text x="755" y="117" class="group" text-anchor="start">一起检查的新代价</text>
<g id="signal-0">
<rect x="55" y="135" width="280" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="195" y="164" class="head" text-anchor="middle">rank到达／完成时间不同</text>
<text x="195" y="190" class="body" text-anchor="middle">已采集各rank耗时</text>
</g>
<g id="action-0">
<rect x="405" y="135" width="280" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="545" y="164" class="head" text-anchor="middle">调整切分或专家放置</text>
<text x="545" y="190" class="body" text-anchor="middle">优先平衡最慢rank</text>
</g>
<g id="cost-0">
<rect x="755" y="135" width="280" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="895" y="164" class="head" text-anchor="middle">跨rank载荷可能增加</text>
<text x="895" y="190" class="body" text-anchor="middle">检查额外搬运与容量</text>
</g>
<path id="signal-to-action-0" d="M335 175H405" class="flow"/>
<path id="action-to-cost-0" d="M685 175H755" class="flow"/>
<g id="signal-1">
<rect x="55" y="290" width="280" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="195" y="319" class="head" text-anchor="middle">暴露高、重叠比例低</text>
<text x="195" y="345" class="body" text-anchor="middle">通信落在计算空档</text>
</g>
<g id="action-1">
<rect x="405" y="290" width="280" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="545" y="319" class="head" text-anchor="middle">调整同步时点或bucket</text>
<text x="545" y="345" class="body" text-anchor="middle">选一项改变调度粒度</text>
</g>
<g id="cost-1">
<rect x="755" y="290" width="280" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="895" y="319" class="head" text-anchor="middle">驻留与同步次数可能变化</text>
<text x="895" y="345" class="body" text-anchor="middle">检查峰值显存和同步</text>
</g>
<path id="signal-to-action-1" d="M335 330H405" class="flow"/>
<path id="action-to-cost-1" d="M685 330H755" class="flow"/>
<g id="signal-2">
<rect x="55" y="445" width="280" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="node"/>
<text x="195" y="474" class="head" text-anchor="middle">All-to-All路由流量大</text>
<text x="195" y="500" class="body" text-anchor="middle">跨rank比例与bytes较高</text>
</g>
<g id="action-2">
<rect x="405" y="445" width="280" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="node"/>
<text x="545" y="474" class="head" text-anchor="middle">调整专家放置或分组</text>
<text x="545" y="500" class="body" text-anchor="middle">尝试增加本地命中</text>
</g>
<g id="cost-2">
<rect x="755" y="445" width="280" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="node"/>
<text x="895" y="474" class="head" text-anchor="middle">专家负载可能更偏斜</text>
<text x="895" y="500" class="body" text-anchor="middle">核对overflow与任务质量</text>
</g>
<path id="signal-to-action-2" d="M335 485H405" class="flow"/>
<path id="action-to-cost-2" d="M685 485H755" class="flow"/>
<g id="paired-retest">
<rect x="1175" y="290" width="270" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="node"/>
<text x="1310" y="319" class="head" text-anchor="middle">同模型、同负载配对复测</text>
<text x="1310" y="345" class="body" text-anchor="middle">完成时间、质量／容量及新代价</text>
</g>
<path id="rank-path-to-retest" d="M1035 175H1105V310H1175" class="flow"/>
<path id="overlap-path-to-retest" d="M1035 330H1175" class="flow"/>
<path id="routing-path-to-retest" d="M1035 485H1105V350H1175" class="flow"/>
<g id="followup">
<rect x="1175" y="445" width="270" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
<text x="1310" y="474" class="head" text-anchor="middle">保留、继续调整或补采数据</text>
<text x="1310" y="500" class="body" text-anchor="middle">按完整收益与约束判断</text>
</g>
<path id="retest-to-followup" d="M1310 370V445" class="flow"/>
<text x="55" y="588" class="sub" text-anchor="start">把暴露时间、payload与各rank耗时带回对照；同时检查整轮完成时间和结果是否满足原任务要求。</text></svg>
