<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Pre-Norm and Post-Norm residual paths</title>
  <desc id="desc">Pre-Norm normalizes before a sublayer; Post-Norm normalizes after residual addition. Both use the same sublayer and residual add.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#475569"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:24px;font-weight:700;fill:#172554}.head{font-size:19px;font-weight:700;fill:#1e3a8a}.label{font-size:16px;font-weight:600;fill:#1e293b}.small{font-size:14px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.norm{fill:#ecfeff;stroke:#06b6d4;stroke-width:2}.sum{fill:#fff7ed;stroke:#f97316;stroke-width:2}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <text x="600" y="38" text-anchor="middle" class="title">Norm position changes the order of sublayer and residual update</text>
  <rect x="95" y="75" width="455" height="335" rx="18" class="group"/><text x="322" y="110" text-anchor="middle" class="head">Pre-Norm</text>
  <rect x="280" y="140" width="85" height="45" rx="8" class="node"/><text x="322" y="168" text-anchor="middle" class="label">x</text>
  <rect x="255" y="220" width="135" height="48" rx="8" class="norm"/><text x="322" y="250" text-anchor="middle" class="label">Norm(x)</text>
  <rect x="255" y="302" width="135" height="48" rx="8" class="node"/><text x="322" y="332" text-anchor="middle" class="label">Sublayer</text>
  <circle cx="455" cy="326" r="28" class="sum"/><text x="455" y="332" text-anchor="middle" class="label">+</text>
  <rect x="413" y="375" width="85" height="45" rx="8" class="node"/><text x="455" y="403" text-anchor="middle" class="label">x′</text>
  <path d="M322 185 V220" class="line"/><path d="M322 268 V302" class="line"/><path d="M390 326 H427" class="line"/><path d="M365 162 H455 V298" class="line"/><path d="M455 354 V375" class="line"/>
  <text x="160" y="392" class="small">x bypasses the sublayer</text>

  <rect x="650" y="75" width="455" height="335" rx="18" class="group"/><text x="877" y="110" text-anchor="middle" class="head">Post-Norm</text>
  <rect x="835" y="140" width="85" height="45" rx="8" class="node"/><text x="877" y="168" text-anchor="middle" class="label">x</text>
  <rect x="810" y="220" width="135" height="48" rx="8" class="node"/><text x="877" y="250" text-anchor="middle" class="label">Sublayer(x)</text>
  <circle cx="1010" cy="244" r="28" class="sum"/><text x="1010" y="250" text-anchor="middle" class="label">+</text>
  <rect x="943" y="302" width="135" height="48" rx="8" class="norm"/><text x="1010" y="332" text-anchor="middle" class="label">Norm(·)</text>
  <rect x="968" y="375" width="85" height="45" rx="8" class="node"/><text x="1010" y="403" text-anchor="middle" class="label">x′</text>
  <path d="M877 185 V220" class="line"/><path d="M945 244 H982" class="line"/><path d="M920 162 H1010 V216" class="line"/><path d="M1010 272 V302" class="line"/><path d="M1010 350 V375" class="line"/>
  <text x="715" y="392" class="small">normalize after residual add</text>
</svg>
