<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Pre-Norm 与 Post-Norm 的残差路径</title>
  <desc id="desc">Pre-Norm 在子层前归一化并保留恒等残差路径，Post-Norm 在子层输出与残差相加后归一化。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#52657a"/></marker><style>.t{font:700 24px sans-serif;fill:#17324d}.h{font:700 20px sans-serif;fill:#17324d}.n{font:600 17px sans-serif;fill:#17324d}.s{font:15px sans-serif;fill:#40566d}.panel{fill:#f3f6fa;stroke:#bcc9d8;stroke-width:2}.box{fill:#fff;stroke:#8297b2;stroke-width:2}.norm{fill:#e8f8fb;stroke:#1598ac;stroke-width:2}.add{fill:#fff4df;stroke:#d97816;stroke-width:2}.l{fill:none;stroke:#52657a;stroke-width:2.5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" class="t">归一化位置改变子层与残差更新的先后关系</text>
  <rect x="65" y="80" width="500" height="410" rx="18" class="panel"/><text x="315" y="118" text-anchor="middle" class="h">Pre-Norm</text>
  <rect x="255" y="145" width="120" height="54" rx="11" class="box"/><text x="315" y="178" text-anchor="middle" class="n">输入 x</text>
  <rect x="235" y="235" width="160" height="58" rx="11" class="norm"/><text x="315" y="271" text-anchor="middle" class="n">归一化</text>
  <rect x="235" y="335" width="160" height="58" rx="11" class="box"/><text x="315" y="371" text-anchor="middle" class="n">Attention / FFN</text>
  <circle cx="470" cy="364" r="31" class="add"/><text x="470" y="371" text-anchor="middle" class="h">+</text>
  <path d="M315 199 V235" class="l"/><path d="M315 293 V335" class="l"/><path d="M395 364 H439" class="l"/><path d="M375 172 H470 V333" class="l"/>
  <text x="315" y="445" text-anchor="middle" class="s">恒等路径绕过子层，子层接收归一化输入</text>
  <rect x="635" y="80" width="500" height="410" rx="18" class="panel"/><text x="885" y="118" text-anchor="middle" class="h">Post-Norm</text>
  <rect x="825" y="145" width="120" height="54" rx="11" class="box"/><text x="885" y="178" text-anchor="middle" class="n">输入 x</text>
  <rect x="805" y="235" width="160" height="58" rx="11" class="box"/><text x="885" y="271" text-anchor="middle" class="n">Attention / FFN</text>
  <circle cx="1040" cy="264" r="31" class="add"/><text x="1040" y="271" text-anchor="middle" class="h">+</text>
  <rect x="960" y="345" width="160" height="58" rx="11" class="norm"/><text x="1040" y="381" text-anchor="middle" class="n">归一化</text>
  <path d="M885 199 V235" class="l"/><path d="M965 264 H1009" class="l"/><path d="M945 172 H1040 V233" class="l"/><path d="M1040 295 V345" class="l"/>
  <text x="885" y="445" text-anchor="middle" class="s">子层与残差先相加，再对更新后的状态归一化</text>
</svg>
