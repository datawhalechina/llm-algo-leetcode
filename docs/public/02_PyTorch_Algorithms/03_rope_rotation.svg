<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">RoPE的二维旋转与相对相位</title><desc id="desc">在单个通道对中取q和k均为单位横向向量，频率pi/6。位置1的q旋转30度，位置2的k旋转60度，内积为cos30度，取决于相对角而不是裸位置差。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">每个通道对是一张旋转平面，相对角还要乘对应频率</text>
<text x="55" y="80" class="sub" text-anchor="start">示例：q=k=(1,0)，ω=π/6，位置m=1、n=2；虚线为原向量，彩色实线为旋转后向量。</text>
<rect x="55" y="115" width="470" height="285" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="565" y="115" width="470" height="285" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="1080" y="115" width="365" height="285" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="275" y="147" class="head" text-anchor="middle">Query：mω=30°</text>
<g data-layout-role="glyph-group"><line x1="145" y1="290" x2="420" y2="290" stroke="#cbd5e1" stroke-width="1.5"/><line x1="245" y1="365" x2="245" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="245" y1="290" x2="375" y2="290" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<line data-angle-rad="0.5235987755982988" x1="245" y1="290" x2="357.58330249197707" y2="225" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M310 290 A65 65 0 0 0 301.29165124598853 257.5" fill="none" stroke="#2563eb" stroke-width="2"/></g>
<text x="405" y="319" class="small" text-anchor="middle">(1,0)</text>
<text x="227" y="316" class="small" text-anchor="middle">0</text>
<text x="785" y="147" class="head" text-anchor="middle">Key：nω=60°</text>
<g data-layout-role="glyph-group"><line x1="655" y1="290" x2="930" y2="290" stroke="#cbd5e1" stroke-width="1.5"/><line x1="755" y1="365" x2="755" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="755" y1="290" x2="885" y2="290" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<line data-angle-rad="1.0471975511965976" x1="755" y1="290" x2="820" y2="177.416697508023" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M820 290 A65 65 0 0 0 787.5 233.7083487540115" fill="none" stroke="#d97706" stroke-width="2"/></g>
<text x="915" y="319" class="small" text-anchor="middle">(1,0)</text>
<text x="737" y="316" class="small" text-anchor="middle">0</text>
<text x="1262" y="159" class="head" text-anchor="middle">相对旋转角</text>
<text x="1262" y="201" class="body" text-anchor="middle">(n−m)ω = π/6</text>
<text x="1262" y="252" class="body" text-anchor="middle">qᵀ R((n−m)ω) k</text>
<text x="1262" y="301" class="body" text-anchor="middle">内积 = cos(π/6)</text>
<text x="1262" y="342" class="head" text-anchor="middle">≈ 0.866025</text>
<text x="55" y="442" class="sub" text-anchor="start">这里展示一个通道对；完整向量由多组不同频率的旋转共同组成。</text>
</svg>
