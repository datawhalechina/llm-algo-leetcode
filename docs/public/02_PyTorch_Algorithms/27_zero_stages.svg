<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">ZeRO各阶段的一次更新</title><desc id="desc">三条并列路径分别展示ZeRO-1、2、3的典型同步与参数更新。图示教学路径不代表CPU模拟已执行通信。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.save{stroke:#15803d;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">梯度怎样到达owner，更新后的参数怎样可见</text>
<text x="55" y="80" class="sub" text-anchor="start">教学通信路径；框内列出主要动作。owner是负责对应参数分片更新的rank。</text>
<text x="55" y="190" class="head" text-anchor="start">ZeRO-1</text>
<rect x="220" y="145" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="350" y="174" class="head" text-anchor="middle">完整参数计算</text>
<text x="350" y="200" class="body" text-anchor="middle">各rank得到局部梯度</text>
<path id="ZeRO-1-0" d="M480 185H530" class="flow"/>
<rect x="530" y="145" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="660" y="174" class="head" text-anchor="middle">同步完整梯度</text>
<text x="660" y="200" class="body" text-anchor="middle">例如 All-Reduce</text>
<path id="ZeRO-1-1" d="M790 185H840" class="flow"/>
<rect x="840" y="145" width="260" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="970" y="174" class="head" text-anchor="middle">owner局部更新</text>
<text x="970" y="200" class="body" text-anchor="middle">只维护本地优化器状态</text>
<path id="ZeRO-1-2" d="M1100 185H1150" class="flow"/>
<rect x="1150" y="145" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1280" y="174" class="head" text-anchor="middle">同步更新后分片</text>
<text x="1280" y="200" class="body" text-anchor="middle">All-Gather → 完整参数</text>
<text x="55" y="345" class="head" text-anchor="start">ZeRO-2</text>
<rect x="220" y="300" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="350" y="329" class="head" text-anchor="middle">完整参数计算</text>
<text x="350" y="355" class="body" text-anchor="middle">逐桶产生局部梯度</text>
<path id="ZeRO-2-0" d="M480 340H530" class="flow"/>
<rect x="530" y="300" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="660" y="329" class="head" text-anchor="middle">梯度 Reduce-Scatter</text>
<text x="660" y="355" class="body" text-anchor="middle">owner保留同步后分片</text>
<path id="ZeRO-2-1" d="M790 340H840" class="flow"/>
<rect x="840" y="300" width="260" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="970" y="329" class="head" text-anchor="middle">owner局部更新</text>
<text x="970" y="355" class="body" text-anchor="middle">更新本地参数及状态</text>
<path id="ZeRO-2-2" d="M1100 340H1150" class="flow"/>
<rect x="1150" y="300" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1280" y="329" class="head" text-anchor="middle">同步更新后分片</text>
<text x="1280" y="355" class="body" text-anchor="middle">All-Gather → 完整参数</text>
<text x="55" y="500" class="head" text-anchor="start">ZeRO-3</text>
<rect x="220" y="455" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="350" y="484" class="head" text-anchor="middle">按层收集参数</text>
<text x="350" y="510" class="body" text-anchor="middle">All-Gather → 计算视图</text>
<path id="ZeRO-3-0" d="M480 495H530" class="flow"/>
<rect x="530" y="455" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="660" y="484" class="head" text-anchor="middle">计算与归约梯度</text>
<text x="660" y="510" class="body" text-anchor="middle">Reduce-Scatter → owner</text>
<path id="ZeRO-3-1" d="M790 495H840" class="flow"/>
<rect x="840" y="455" width="260" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="970" y="484" class="head" text-anchor="middle">owner局部更新</text>
<text x="970" y="510" class="body" text-anchor="middle">参数及状态继续分片</text>
<path id="ZeRO-3-2" d="M1100 495H1150" class="flow"/>
<rect x="1150" y="455" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1280" y="484" class="head" text-anchor="middle">下一次按层取用</text>
<text x="1280" y="510" class="body" text-anchor="middle">All-Gather → 计算视图</text>
<text x="55" y="588" class="sub" text-anchor="start">ZeRO-3的计算视图按层收集、使用后释放；这里省略了桶划分与通信重叠。</text>
</svg>
