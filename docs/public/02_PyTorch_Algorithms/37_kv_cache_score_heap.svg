<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">安全回收：先保护活动状态，再决定能否接纳新工作</title><desc id="desc">空闲容量不足时，仅回收没有活动引用且访问已结束的缓存；仍不足时由调度层排队、抢占或拒绝。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52657a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#365269}.box{stroke-width:2;rx:15}.edge{fill:none;stroke:#52657a;stroke-width:2.4;marker-end:url(#arrow)}</style></defs><rect width="1200" height="520" fill="#f8fafc"/>
<text x="600" y="44" text-anchor="middle" class="title">安全回收：先保护活动状态，再决定能否接纳新工作</text>
<rect x="35" y="130" width="200" height="110" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="135" y="162" text-anchor="middle" class="label">需要新增物理块</text><text x="135" y="191" text-anchor="middle" class="small">明确本次申请数量</text>
<rect x="290" y="130" width="235" height="110" class="box" fill="#eaf3fb" stroke="#5684aa"/><text x="407.5" y="162" text-anchor="middle" class="label">检查当前空闲块</text><text x="407.5" y="191" text-anchor="middle" class="small">足够时无需驱逐</text>
<rect x="590" y="130" width="250" height="110" class="box" fill="#f2edfb" stroke="#8066b3"/><text x="715" y="162" text-anchor="middle" class="label">不足时筛选可回收缓存</text><text x="715" y="191" text-anchor="middle" class="small">无活动引用且访问已结束</text>
<rect x="905" y="130" width="260" height="110" class="box" fill="#fff6e8" stroke="#c9852f"/><text x="1035" y="162" text-anchor="middle" class="label">按顺序回收直到足够</text><text x="1035" y="191" text-anchor="middle" class="small">先少命中，再更早访问</text>
<rect x="290" y="365" width="300" height="105" class="box" fill="#eaf7ef" stroke="#4e8a68"/><text x="440" y="397" text-anchor="middle" class="label">容量足够：允许分配</text><text x="440" y="426" text-anchor="middle" class="small">更新请求与物理块账本</text>
<rect x="820" y="365" width="345" height="105" class="box" fill="#fff0ea" stroke="#c56f43"/><text x="992.5" y="397" text-anchor="middle" class="label">仍不足：不覆盖活动状态</text><text x="992.5" y="426" text-anchor="middle" class="small">交给调度层排队、抢占或拒绝</text>
<path d="M235 185H290" class="edge"/>
<path d="M525 185H590" class="edge"/>
<path d="M840 185H905" class="edge"/>
<path d="M407 240V365" class="edge"/>
<path d="M1035 240V295H500V365" class="edge"/>
<path d="M1080 240V365" class="edge"/>
<text x="530" y="283" class="small">回收后足够</text><text x="1090" y="305" class="small">仍不足</text><text x="600" y="510" text-anchor="middle" class="small">容量压力说明何时需要回收，引用与在途访问条件决定是否允许回收</text>
</svg>
