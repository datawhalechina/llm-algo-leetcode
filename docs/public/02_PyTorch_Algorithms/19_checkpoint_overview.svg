<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">训练一步中的 Activation Checkpointing</title>
  <desc id="desc">一次训练步骤先通过前向产生 activation，再选择直接保存或 checkpoint 保存边界；反向阶段分别读取或重算这些状态以计算梯度。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
      .title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#475569}
      .head{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.small{font-size:14px;fill:#475569}
      .box{stroke-width:2;rx:16}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:11}
      .flow{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .guide{stroke:#94a3b8;stroke-width:2;fill:none}.tag{font-size:13px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="60" y="45" class="title">训练一步：activation 保存与 checkpoint 重算</text>
  <text x="60" y="74" class="sub">前向产生 activation；Checkpoint 改变其保存方式，使反向阶段以重算换取更少的中间状态驻留</text>

  <rect x="55" y="238" width="205" height="116" class="box" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="157" y="276" text-anchor="middle" class="head">训练前向</text>
  <text x="157" y="306" text-anchor="middle" class="label">产生 activation</text>
  <text x="157" y="331" text-anchor="middle" class="small">反向传播需要这些中间状态</text>

  <path d="M260 296H295V205H330" class="flow"/>
  <path d="M260 296H295V405H330" class="flow"/>
  <text x="300" y="286" text-anchor="middle" class="small">activation 处理选择</text>

  <rect x="330" y="135" width="485" height="145" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="355" y="168" class="head">直接保存</text>
  <rect x="355" y="188" width="185" height="58" class="node"/>
  <text x="447" y="213" text-anchor="middle" class="label">保留中间状态</text>
  <text x="447" y="234" text-anchor="middle" class="small">保存范围较大</text>
  <path d="M540 217H585" class="flow"/>
  <rect x="585" y="188" width="200" height="58" class="node"/>
  <text x="685" y="213" text-anchor="middle" class="label">反向直接读取</text>
  <text x="685" y="234" text-anchor="middle" class="small">显存高 · 重算少</text>

  <rect x="330" y="335" width="485" height="145" class="box" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="355" y="368" class="head">Checkpoint 重算</text>
  <rect x="355" y="388" width="185" height="58" class="node"/>
  <text x="447" y="413" text-anchor="middle" class="label">只保留区段边界</text>
  <text x="447" y="434" text-anchor="middle" class="small">释放内部状态</text>
  <path d="M540 417H585" class="flow"/>
  <rect x="585" y="388" width="200" height="58" class="node"/>
  <text x="685" y="413" text-anchor="middle" class="label">反向重算区段</text>
  <text x="685" y="434" text-anchor="middle" class="small">显存低 · 重算多</text>

  <path d="M815 217H855V285H895" class="flow"/>
  <path d="M815 417H855V355H895" class="flow"/>

  <rect x="895" y="245" width="250" height="180" class="box" fill="#ecfccb" stroke="#84cc16"/>
  <text x="1020" y="280" text-anchor="middle" class="head">反向完成</text>
  <rect x="925" y="302" width="190" height="88" class="node"/>
  <text x="1020" y="327" text-anchor="middle" class="label">得到输出与梯度</text>
  <text x="1020" y="351" text-anchor="middle" class="small">两条路径应得到等价结果</text>
  <text x="1020" y="373" text-anchor="middle" class="small">测试时额外检查随机状态</text>
</svg>
