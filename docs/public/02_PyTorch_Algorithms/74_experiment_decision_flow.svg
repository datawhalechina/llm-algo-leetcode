<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">训练对照与激活显存对照分别判断</title>
  <desc id="desc">完整训练检查收益与质量；减少其他状态干扰的激活实验只记录对应条件下的结果，再用目标任务复测。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#475569"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .title{font-size:27px;font-weight:700}.sub{font-size:15px;fill:#475569}.lane{font-size:18px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:14px;fill:#334155}
      .box{stroke-width:2;rx:13}.flow{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="650" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="43" text-anchor="middle" class="title">先确认实验条件，再判断策略是否满足目标</text>
  <text x="750" y="72" text-anchor="middle" class="sub">两条路径分别记录优化器、输入与测量方法</text>

  <rect x="25" y="117" width="1450" height="185" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="55" y="150" class="lane" fill="#0369a1">完整训练对照</text>
  <rect x="55" y="174" width="250" height="88" class="box" fill="#ffffff" stroke="#60a5fa"/>
  <text x="180" y="208" text-anchor="middle" class="head">固定训练配置</text>
  <text x="180" y="237" text-anchor="middle" class="body">优化器 · 长度 · 更新方式</text>
  <rect x="370" y="174" width="280" height="88" class="box" fill="#ffffff" stroke="#60a5fa"/>
  <text x="510" y="208" text-anchor="middle" class="head">同任务比较策略与基线</text>
  <text x="510" y="237" text-anchor="middle" class="body">重复测量显存与吞吐</text>
  <rect x="715" y="174" width="280" height="88" class="box" fill="#ffffff" stroke="#60a5fa"/>
  <text x="855" y="208" text-anchor="middle" class="head">显存节省达到要求？</text>
  <text x="855" y="237" text-anchor="middle" class="body">同时核对时间、吞吐与损失</text>
  <rect x="1060" y="174" width="350" height="88" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="1235" y="208" text-anchor="middle" class="head">按当前训练条件判断</text>
  <text x="1235" y="237" text-anchor="middle" class="body">满足全部目标再采用</text>
  <path d="M305 218H370" class="flow"/><path d="M650 218H715" class="flow"/><path d="M995 218H1060" class="flow"/>

  <rect x="25" y="328" width="1450" height="275" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="55" y="362" class="lane" fill="#a16207">激活显存对照</text>
  <rect x="55" y="388" width="230" height="92" class="box" fill="#ffffff" stroke="#f59e0b"/>
  <text x="170" y="423" text-anchor="middle" class="head">减少其他状态干扰</text>
  <text x="170" y="452" text-anchor="middle" class="body">无动量SGD等隔离条件</text>
  <rect x="335" y="388" width="230" height="92" class="box" fill="#ffffff" stroke="#f59e0b"/>
  <text x="450" y="423" text-anchor="middle" class="head">逐个长度完成对照</text>
  <text x="450" y="452" text-anchor="middle" class="body">记录成功长度与停止原因</text>
  <rect x="615" y="388" width="250" height="92" class="box" fill="#ffffff" stroke="#f59e0b"/>
  <text x="740" y="423" text-anchor="middle" class="head">比较激活保存与重算</text>
  <text x="740" y="452" text-anchor="middle" class="body">已测容量与额外计算</text>
  <rect x="915" y="388" width="230" height="92" class="box" fill="#ffffff" stroke="#f59e0b"/>
  <text x="1030" y="423" text-anchor="middle" class="head">记录本组是否达标</text>
  <text x="1030" y="452" text-anchor="middle" class="body">保留优化器与长度条件</text>
  <rect x="1195" y="388" width="235" height="92" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="1312" y="423" text-anchor="middle" class="head">显存余量触发停止时</text>
  <text x="1312" y="452" text-anchor="middle" class="body">保留尚未运行的长度</text>
  <path d="M285 434H335" class="flow"/><path d="M565 434H615" class="flow"/><path d="M865 434H915" class="flow"/>
  <path d="M450 388V368H1312V388" class="flow" stroke-dasharray="6 5"/>

  <rect x="615" y="515" width="815" height="58" class="box" fill="#ecfdf5" stroke="#34d399"/>
  <text x="1022" y="550" text-anchor="middle" class="head">保留已测结果，按目标训练配置安排下一项对照</text>
  <path d="M1030 480V515" class="flow"/>
  <path d="M1312 480V515" class="flow"/>
</svg>
