<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">按结构改动查找测试结果</title><desc id="desc">Decoder层、KV保存方式、历史状态和访问范围分别需要对应的任务与运行测试；四条关系独立，不表示顺序依赖。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.h{font-size:16px;font-weight:700;text-anchor:middle}.b{font-size:13px;text-anchor:middle;fill:#475569}.node{stroke-width:1.8;rx:12}.edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style>
<marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1100" height="330" fill="#f8fafc"/><text x="40" y="38" class="title">按结构改动查找需要的测试结果</text>
<path d="M140 168V210" class="edge"/>
<rect x="20" y="78" width="240" height="90" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="140" y="114" class="h">Decoder层结构</text><text x="140" y="140" class="b">层数与前馈宽度</text>
<rect x="20" y="210" width="240" height="100" class="node" fill="#DCFCE7" stroke="#16A34A"/><text x="140" y="250" class="h">块级任务测试</text><text x="140" y="280" class="b">得分、耗时与失败原因</text>
<path d="M415 168V210" class="edge"/>
<rect x="295" y="78" width="240" height="90" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="415" y="114" class="h">KV保存方式</text><text x="415" y="140" class="b">头数或低维表示</text>
<rect x="295" y="210" width="240" height="100" class="node" fill="#DCFCE7" stroke="#16A34A"/><text x="415" y="250" class="h">状态与运行测试</text><text x="415" y="280" class="b">保存量、实际显存与耗时</text>
<path d="M685 168V210" class="edge"/>
<rect x="565" y="78" width="240" height="90" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="685" y="114" class="h">历史状态</text><text x="685" y="140" class="b">逐词KV、递推或混合</text>
<rect x="565" y="210" width="240" height="100" class="node" fill="#DCFCE7" stroke="#16A34A"/><text x="685" y="250" class="h">逐长度任务测试</text><text x="685" y="280" class="b">答案、耗时与失败长度</text>
<path d="M960 168V210" class="edge"/>
<rect x="840" y="78" width="240" height="90" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="960" y="114" class="h">允许读取的位置</text><text x="960" y="140" class="b">窗口、分块或全局</text>
<rect x="840" y="210" width="240" height="100" class="node" fill="#DCFCE7" stroke="#16A34A"/><text x="960" y="250" class="h">访问与后端测试</text><text x="960" y="280" class="b">可见位置、内核与回退</text>
</svg>
