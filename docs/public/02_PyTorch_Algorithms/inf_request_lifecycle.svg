<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">请求状态、输出事件与统一终止出口</title>
  <desc id="desc">到达事件使请求进入排队，准入、输入就绪和首个词元依次推进状态。后续词元不改变解码状态。所有未终止状态都可以进入取消、超时或失败出口，异常类型不与阶段固定配对。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#0f172a}
      .title{font-size:26px;font-weight:700}.head{font-size:17px;font-weight:700}
      .sub{font-size:14px;fill:#475569}.event{font-size:14px;fill:#334155}
      .line{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#b45309;stroke-width:2;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">请求在事件发生时切换状态</text>
  <rect x="82" y="82" width="218" height="210" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="316" y="82" width="860" height="210" rx="20" fill="#f0fdf4" stroke="#86efac"/>
  <text x="108" y="111" class="head">排队与准入</text>
  <text x="340" y="111" class="head">输入准备与模型执行（示例顺序）</text>
  <g fill="#fff" stroke-width="2">
    <rect x="100" y="170" width="160" height="82" rx="14" stroke="#60a5fa"/>
    <rect x="330" y="170" width="160" height="82" rx="14" stroke="#4ade80"/>
    <rect x="560" y="170" width="160" height="82" rx="14" stroke="#f59e0b"/>
    <rect x="790" y="170" width="160" height="82" rx="14" stroke="#a855f7"/>
    <rect x="1030" y="170" width="120" height="82" rx="14" stroke="#64748b"/>
  </g>
  <g text-anchor="middle">
    <text x="180" y="203" class="head">排队等待</text><text x="180" y="230" class="sub">等待调度器准入</text>
    <text x="410" y="203" class="head">输入准备</text><text x="410" y="230" class="sub">分词与输入搬运</text>
    <text x="640" y="203" class="head">预填充</text><text x="640" y="230" class="sub">建立首轮 KV 状态</text>
    <text x="870" y="203" class="head">解码迭代</text><text x="870" y="230" class="sub">继续生成与输出</text>
    <text x="1090" y="203" class="head">已完成</text><text x="1090" y="230" class="sub">正常终止</text>
  </g>
  <path d="M24 211H100" class="line"/><text x="54" y="195" text-anchor="middle" class="event">到达</text>
  <path d="M260 211H330" class="line"/><text x="295" y="196" text-anchor="middle" class="event">准入</text>
  <path d="M490 211H560" class="line"/><text x="525" y="196" text-anchor="middle" class="event">输入就绪</text>
  <path d="M720 211H790" class="line"/><text x="755" y="196" text-anchor="middle" class="event">首个词元</text>
  <path d="M950 211H1030" class="line"/><text x="990" y="196" text-anchor="middle" class="event">完成</text>
  <path d="M830 170V142H910V170" class="line"/><text x="870" y="132" text-anchor="middle" class="event">后续词元：状态不变</text>
  <path d="M180 252V340H870V252M410 252V340M640 252V340" class="branch"/>
  <path d="M600 340V392" class="line"/>
  <rect x="340" y="392" width="520" height="92" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="600" y="424" text-anchor="middle" class="head">取消 ／ 超时 ／ 失败</text>
  <text x="600" y="453" text-anchor="middle" class="sub">记录终止类型与发生阶段，不再接受后续事件</text>
  <text x="650" y="371" class="event">任一未终止状态均可异常终止</text>
</svg>
