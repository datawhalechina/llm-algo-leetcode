<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">同一微批次的Pipeline前向与反向</title><desc id="desc">同一微批次前向依次经过stage0到2，loss启动stage2反向，梯度返回stage1与stage0。每stage保存自己的激活到本地反向完成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.save{stroke:#15803d;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="650" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">同一个微批次：激活向后传，梯度沿相反方向返回</text>
<text x="55" y="80" class="sub" text-anchor="start">以微批次0为例；其余微批次遵守相同依赖，具体交错顺序见下一图。</text>
<rect x="160" y="119" width="320" height="430" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="580" y="119" width="320" height="430" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="1000" y="119" width="320" height="430" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="320" y="150" class="head" text-anchor="middle">Stage 0</text>
<rect x="180" y="190" width="280" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="320" y="219" class="head" text-anchor="middle">前向 F₀</text>
<text x="320" y="245" class="body" text-anchor="middle">前段模型层</text>
<rect x="180" y="420" width="280" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="320" y="449" class="head" text-anchor="middle">反向 B₀</text>
<text x="320" y="475" class="body" text-anchor="middle">本地反向完成后释放激活</text>
<g data-layout-role="glyph-group"><rect x="200" y="305" width="240" height="68" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="320" y="332" class="body" text-anchor="middle">保留本stage激活</text>
<text x="320" y="357" class="small" text-anchor="middle">用于微批次0的反向</text>
</g>
<path id="save-activation-0" d="M320 270V305" class="save"/>
<path id="read-activation-0" d="M320 373V420" class="save"/>
<path id="activation-0" d="M460 230H600" class="flow"/>
<text x="530" y="212" class="small" text-anchor="middle">激活</text>
<path id="gradient-0" d="M600 460H460" class="flow"/>
<text x="530" y="489" class="small" text-anchor="middle">输入激活的梯度</text>
<text x="740" y="150" class="head" text-anchor="middle">Stage 1</text>
<rect x="600" y="190" width="280" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="740" y="219" class="head" text-anchor="middle">前向 F₀</text>
<text x="740" y="245" class="body" text-anchor="middle">中段模型层</text>
<rect x="600" y="420" width="280" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="740" y="449" class="head" text-anchor="middle">反向 B₀</text>
<text x="740" y="475" class="body" text-anchor="middle">本地反向完成后释放激活</text>
<g data-layout-role="glyph-group"><rect x="620" y="305" width="240" height="68" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="740" y="332" class="body" text-anchor="middle">保留本stage激活</text>
<text x="740" y="357" class="small" text-anchor="middle">用于微批次0的反向</text>
</g>
<path id="save-activation-1" d="M740 270V305" class="save"/>
<path id="read-activation-1" d="M740 373V420" class="save"/>
<path id="activation-1" d="M880 230H1020" class="flow"/>
<text x="950" y="212" class="small" text-anchor="middle">激活</text>
<path id="gradient-1" d="M1020 460H880" class="flow"/>
<text x="950" y="489" class="small" text-anchor="middle">输入激活的梯度</text>
<text x="1160" y="150" class="head" text-anchor="middle">Stage 2</text>
<rect x="1020" y="190" width="280" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1160" y="219" class="head" text-anchor="middle">前向 F₀</text>
<text x="1160" y="245" class="body" text-anchor="middle">后段模型层与损失</text>
<rect x="1020" y="420" width="280" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="1160" y="449" class="head" text-anchor="middle">反向 B₀</text>
<text x="1160" y="475" class="body" text-anchor="middle">本地反向完成后释放激活</text>
<g data-layout-role="glyph-group"><rect x="1040" y="305" width="240" height="68" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="1160" y="332" class="body" text-anchor="middle">保留本stage激活</text>
<text x="1160" y="357" class="small" text-anchor="middle">用于微批次0的反向</text>
</g>
<path id="save-activation-2" d="M1160 270V305" class="save"/>
<path id="read-activation-2" d="M1160 373V420" class="save"/>
<path id="loss-to-backward" d="M1300 230H1410V460H1300" class="flow"/>
<text x="1400" y="350" class="small" text-anchor="end">损失回传</text>
<text x="55" y="600" class="sub" text-anchor="start">实线传递计算结果；虚线表示本地保存与读取。每个微批次完成所有stage的反向后，才具备本轮更新所需梯度。</text>
</svg>
