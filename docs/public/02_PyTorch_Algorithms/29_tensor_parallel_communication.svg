<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">先检查Head映射再执行Attention TP</title><desc id="desc">Q头数8，KV头数2，TP为4时，每rank分配2个Q头，KV头各复制到两个rank；各rank本地Attention及输出投影后归约。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.save{stroke:#15803d;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="620" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">先确定Head能怎样分配，再进入本地Attention</text>
<text x="55" y="80" class="sub" text-anchor="start">具体示例：8个Query Head、2个KV Head、4个TP rank。KV Head数小于rank数，采用复制映射。</text>
<rect x="55" y="145" width="260" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="185" y="174" class="head" text-anchor="middle">检查Head数量</text>
<text x="185" y="200" class="body" text-anchor="middle">Q可均分；KV可分片或复制</text>
<rect x="405" y="145" width="310" height="80" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="560" y="174" class="head" text-anchor="middle">本例映射通过</text>
<text x="560" y="200" class="body" text-anchor="middle">每rank 2个Q头、1个KV头</text>
<path id="validate-to-plan" d="M315 185H405" class="flow"/>
<text x="55" y="263" class="small" text-anchor="start">无法均匀映射的配置在这里报错</text>
<rect x="55" y="315" width="310" height="210" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="210" y="348" class="head" text-anchor="middle">rank 0</text>
<text x="210" y="383" class="head" text-anchor="middle">Q0、Q1 → KV0</text>
<text x="210" y="421" class="body" text-anchor="middle">本地Attention → 输出投影分片</text>
<rect x="75" y="440" width="270" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" data-layout-role="glyph-group"/>
<text x="210" y="474" class="body" text-anchor="middle">局部输出部分和 Y₀</text>
<rect x="415" y="315" width="310" height="210" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="570" y="348" class="head" text-anchor="middle">rank 1</text>
<text x="570" y="383" class="head" text-anchor="middle">Q2、Q3 → KV0</text>
<text x="570" y="421" class="body" text-anchor="middle">本地Attention → 输出投影分片</text>
<rect x="435" y="440" width="270" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" data-layout-role="glyph-group"/>
<text x="570" y="474" class="body" text-anchor="middle">局部输出部分和 Y₁</text>
<rect x="775" y="315" width="310" height="210" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="930" y="348" class="head" text-anchor="middle">rank 2</text>
<text x="930" y="383" class="head" text-anchor="middle">Q4、Q5 → KV1</text>
<text x="930" y="421" class="body" text-anchor="middle">本地Attention → 输出投影分片</text>
<rect x="795" y="440" width="270" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" data-layout-role="glyph-group"/>
<text x="930" y="474" class="body" text-anchor="middle">局部输出部分和 Y₂</text>
<rect x="1135" y="315" width="310" height="210" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="1290" y="348" class="head" text-anchor="middle">rank 3</text>
<text x="1290" y="383" class="head" text-anchor="middle">Q6、Q7 → KV1</text>
<text x="1290" y="421" class="body" text-anchor="middle">本地Attention → 输出投影分片</text>
<rect x="1155" y="440" width="270" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" data-layout-role="glyph-group"/>
<text x="1290" y="474" class="body" text-anchor="middle">局部输出部分和 Y₃</text>
<text x="850" y="275" class="small" text-anchor="middle">映射展开如下；同号KV在不同rank保存副本</text>
<rect x="480" y="548" width="540" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" data-layout-role="glyph-group"/>
<text x="750" y="578" class="head" text-anchor="middle">All-Reduce求和 → 每rank的完整输出</text>
<path id="reduce-rank-0" d="M210 494V520H520V548" class="flow"/>
<path id="reduce-rank-1" d="M570 494V520H670V548" class="flow"/>
<path id="reduce-rank-2" d="M930 494V520H830V548" class="flow"/>
<path id="reduce-rank-3" d="M1290 494V520H980V548" class="flow"/>
<text x="750" y="616" class="small" text-anchor="middle">对照：KV头可均分时采用分片；复制倍数由TP大小与KV头数共同决定。</text>
</svg>
