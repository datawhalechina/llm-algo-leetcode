<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
<title id="title">访问规则变了，三类结果都要核对</title><desc id="desc">基线与候选先核对模型和固定条件，再分别取得访问语义、质量与后端执行记录，共同用于采用判断。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#475569}.h{font-size:16px;font-weight:700;text-anchor:middle}.b{font-size:14px;text-anchor:middle}.small{font-size:13px;fill:#475569}.node{stroke-width:1.8;rx:12}.edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.warn{stroke:#b45309;marker-end:url(#warning)}.fail{stroke:#be123c;marker-end:url(#failure)}</style>
<marker id="arrow" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="warning" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
<marker id="failure" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be123c"/></marker>
</defs><rect width="1120" height="590" fill="#f8fafc"/>
<text x="40" y="48" class="title">访问规则变了，三类结果都要核对</text>
<text x="40" y="77" class="sub">比较同一批长上下文请求；列出两组的模型版本、运行设置与同时发生的变化。</text>
<path d="M250 170H275V250H300" class="edge "/>
<path d="M250 360H275V300H300" class="edge "/>
<path d="M520 245H545V145H570" class="edge "/>
<path d="M520 275H570" class="edge "/>
<path d="M520 305H545V405H570" class="edge "/>
<path d="M790 145H835V245H870" class="edge "/>
<path d="M790 275H870" class="edge "/>
<path d="M790 405H835V305H870" class="edge "/>
<g><rect x="30" y="130" width="220" height="80" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="140" y="159" class="h">基线：全局访问</text><text x="140" y="183" class="b">固定模型与原有后端</text></g>
<g><rect x="30" y="320" width="220" height="80" class="node" fill="#DCFCE7" stroke="#16A34A"/><text x="140" y="349" class="h">候选：稀疏访问</text><text x="140" y="373" class="b">窗口／块／选择性规则</text></g>
<g><rect x="300" y="225" width="220" height="100" class="node" fill="#FEF3C7" stroke="#D97706"/><text x="410" y="254" class="h">比较条件</text><text x="410" y="278" class="b">版本、设置相同：方案对照</text><text x="410" y="299" class="b">换权重：分别报告表现</text></g>
<g><rect x="570" y="105" width="220" height="80" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="680" y="134" class="h">允许的连接</text><text x="680" y="158" class="b">连接数量与远处可见位置</text></g>
<g><rect x="570" y="235" width="220" height="80" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="680" y="264" class="h">任务结果</text><text x="680" y="288" class="b">得分、错误输出与请求失败</text></g>
<g><rect x="570" y="365" width="220" height="80" class="node" fill="#DBEAFE" stroke="#2563EB"/><text x="680" y="394" class="h">实际计算</text><text x="680" y="418" class="b">内核、回退、耗时与显存</text></g>
<g><rect x="870" y="225" width="220" height="100" class="node" fill="#EDE9FE" stroke="#7C3AED"/><text x="980" y="254" class="h">方案选择</text><text x="980" y="278" class="b">先处理失败与缺失</text><text x="980" y="299" class="b">再比较得分、耗时和显存</text></g>
<text x="40" y="500" class="small">三类记录须对应同一方案和请求集；分别检查允许的连接、答案和实际计算。</text>
<text x="40" y="530" class="small">按两组的实际配置逐项比较，而不是只读取“改变了什么”的说明。</text>
</svg>
