<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="1120" height="450" rx="24" fill="#f8fafc"/>
  <text x="56" y="54" font-size="28" font-family="sans-serif" font-weight="700" fill="#0f172a">线性 Attention：按 token 更新固定形状状态</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="56" y="125" width="180" height="92" rx="16" fill="#dbeafe" stroke="#60a5fa"/><text x="146" y="163" font-size="19" font-weight="700" fill="#1e3a8a">kₜ, vₜ</text><text x="146" y="190" font-size="15" fill="#334155">当前写入</text>
    <rect x="316" y="105" width="250" height="132" rx="18" fill="#dcfce7" stroke="#4ade80"/><text x="441" y="148" font-size="20" font-weight="700" fill="#166534">累计状态</text><text x="441" y="181" font-size="16" fill="#334155">Sₜ = Sₜ₋₁ + φ(kₜ)vₜᵀ</text><text x="441" y="210" font-size="16" fill="#334155">zₜ = zₜ₋₁ + φ(kₜ)</text>
    <rect x="646" y="125" width="180" height="92" rx="16" fill="#fef3c7" stroke="#fbbf24"/><text x="736" y="163" font-size="19" font-weight="700" fill="#92400e">qₜ</text><text x="736" y="190" font-size="15" fill="#334155">当前读取</text>
    <rect x="886" y="105" width="178" height="132" rx="18" fill="#ede9fe" stroke="#a78bfa"/><text x="975" y="148" font-size="20" font-weight="700" fill="#5b21b6">输出 yₜ</text><text x="975" y="181" font-size="15" fill="#334155">φ(qₜ)ᵀSₜ</text><text x="975" y="207" font-size="15" fill="#334155">÷ φ(qₜ)ᵀzₜ</text>
  </g>
  <path d="M236 171H316" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M566 171H886" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M826 171H886" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <path d="M441 237V316H310V171H316" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="560" y="374" text-anchor="middle" font-size="17" font-family="sans-serif" fill="#64748b">状态形状不随序列长度增长，但累计状态不能直接还原任意历史 token。</text>
</svg>
