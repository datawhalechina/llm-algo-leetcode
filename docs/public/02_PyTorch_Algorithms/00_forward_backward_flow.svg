<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">Linear与ReLU前向保存及局部反向</title><desc id="desc">本页局部Function前向保存输入x、权重W与正值掩码；上游梯度先经ReLU门控形成G_z，线性局部反向读取x与W并返回输入、权重和偏置梯度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.saved{stroke:#15803d;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">前向保存x、W与mask，反向据此形成三类梯度</text>
<text x="55" y="80" class="sub" text-anchor="start">实线：数值或梯度；虚线：保存与读取。x形状为[N,Dᵢₙ]，W形状为[Dₒᵤₜ,Dᵢₙ]。</text>
<rect x="55" y="110" width="260" height="70" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="185" y="137" class="head" text-anchor="middle">输入与参数</text>
<text x="185" y="162" class="body" text-anchor="middle">x、W、b</text>
<rect x="400" y="110" width="260" height="70" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="530" y="137" class="head" text-anchor="middle">线性变换</text>
<text x="530" y="162" class="body" text-anchor="middle">z = x Wᵀ + b</text>
<rect x="745" y="110" width="260" height="70" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="875" y="137" class="head" text-anchor="middle">ReLU</text>
<text x="875" y="162" class="body" text-anchor="middle">y = max(0, z)</text>
<rect x="1090" y="110" width="260" height="70" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1220" y="137" class="head" text-anchor="middle">输出给后续网络</text>
<text x="1220" y="162" class="body" text-anchor="middle">y</text>
<path id="inputs-to-linear" d="M315 145H400" class="flow"/>
<path id="linear-to-relu" d="M660 145H745" class="flow"/>
<path id="relu-to-output" d="M1005 145H1090" class="flow"/>
<rect x="55" y="220" width="260" height="70" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="185" y="247" class="head" text-anchor="middle">保存x与W</text>
<text x="185" y="272" class="body" text-anchor="middle">供线性层局部反向读取</text>
<rect x="745" y="220" width="260" height="70" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="875" y="247" class="head" text-anchor="middle">保存mask = (z &gt; 0)</text>
<text x="875" y="272" class="body" text-anchor="middle">供ReLU反向读取</text>
<path id="save-input-weight" d="M185 180V220" class="saved"/>
<path id="save-relu-mask" d="M875 180V220" class="saved"/>
<rect x="1090" y="335" width="260" height="80" class="node" fill="#fee2e2" stroke="#e11d48"/>
<text x="1220" y="362" class="head" text-anchor="middle">接收上游梯度 Gᵧ</text>
<text x="1220" y="387" class="body" text-anchor="middle">由外部损失与后续网络回传</text>
<rect x="745" y="335" width="260" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="875" y="362" class="head" text-anchor="middle">ReLU局部反向</text>
<text x="875" y="387" class="body" text-anchor="middle">G_z = Gᵧ ⊙ mask</text>
<rect x="400" y="335" width="260" height="80" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="530" y="362" class="head" text-anchor="middle">线性层局部反向</text>
<text x="530" y="387" class="body" text-anchor="middle">读取G_z、x与W</text>
<path id="upstream-to-gate" d="M1090 375H1005" class="flow"/>
<path id="gate-to-linear-backward" d="M745 375H660" class="flow"/>
<path id="mask-to-backward" d="M875 290V335" class="saved"/>
<path id="x-weight-to-backward" d="M315 255H530V335" class="saved"/>
<rect x="55" y="330" width="260" height="115" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="185" y="355" class="head" text-anchor="middle">返回x、W、b的梯度</text>
<text x="185" y="381" class="body" text-anchor="middle">G_x = G_z W</text>
<text x="185" y="405" class="body" text-anchor="middle">G_W = G_zᵀ x</text>
<text x="185" y="429" class="body" text-anchor="middle">G_b = Σₙ G_z</text>
<path id="return-three-gradients" d="M400 375H315" class="flow"/>
</svg>
