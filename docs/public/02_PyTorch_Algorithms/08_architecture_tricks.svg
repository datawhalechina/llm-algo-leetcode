<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">从具体配置追踪参数共享与归一化缩放</title><desc id="desc">绑定实例检查两个模块是否引用同一Parameter，V8、D4时共享32个参数；GemmaRMSNorm的weight零初始化使1加weight有效缩放为1。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker><marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.read{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#blue)}.grad{stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}.control{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#purple)}</style></defs>
<rect width="1600" height="650" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="52" class="title" text-anchor="start">把配置落实到参数对象和前向表达式，再解释结构变化</text>
<text x="55" y="87" class="sub" text-anchor="start">本页两个可运行例子：词嵌入／LM Head共享参数，以及Gemma风格的1+weight缩放。</text>
<text x="55" y="143" class="head" text-anchor="start">例一：权重绑定；取词表V=8、隐藏维D=4</text>
<rect x="55" y="180" width="275" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="192.5" y="209" class="head" text-anchor="middle">声明采用权重绑定</text>
<text x="192.5" y="236" class="body" text-anchor="middle">tie_word_embeddings = true</text>
<path id="tying-0" d="M330 225H420" class="flow"/>
<rect x="420" y="180" width="300" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="570" y="209" class="head" text-anchor="middle">两个模块引用同一W</text>
<text x="570" y="236" class="body" text-anchor="middle">检查Parameter对象身份</text>
<path id="tying-1" d="M720 225H810" class="flow"/>
<rect x="810" y="180" width="300" height="90" class="node" fill="#dcfce7" stroke="#15803d"/>
<text x="960" y="209" class="head" text-anchor="middle">词表参数计数只计一份</text>
<text x="960" y="236" class="body" text-anchor="middle">8 × 4 = 32</text>
<path id="tying-2" d="M1110 225H1200" class="flow"/>
<rect x="1200" y="180" width="320" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1360" y="209" class="head" text-anchor="middle">两路梯度归属同一参数</text>
<text x="1360" y="236" class="body" text-anchor="middle">累积到W.grad</text>
<text x="55" y="365" class="head" text-anchor="start">例二：Gemma风格RMSNorm；有效通道缩放为1+weight</text>
<rect x="55" y="410" width="275" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="192.5" y="439" class="head" text-anchor="middle">通道参数零初始化</text>
<text x="192.5" y="466" class="body" text-anchor="middle">weight = 0</text>
<path id="scale-0" d="M330 455H420" class="flow"/>
<rect x="420" y="410" width="300" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="570" y="439" class="head" text-anchor="middle">读取实际模块表达式</text>
<text x="570" y="466" class="body" text-anchor="middle">n × (1 + weight)</text>
<path id="scale-1" d="M720 455H810" class="flow"/>
<rect x="810" y="410" width="300" height="90" class="node" fill="#fef3c7" stroke="#d97706"/>
<text x="960" y="439" class="head" text-anchor="middle">初始有效缩放为1</text>
<text x="960" y="466" class="body" text-anchor="middle">归一化输出乘单位缩放</text>
<path id="scale-2" d="M1110 455H1200" class="flow"/>
<rect x="1200" y="410" width="320" height="90" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1360" y="439" class="head" text-anchor="middle">按表达式核对数值</text>
<text x="1360" y="466" class="body" text-anchor="middle">修改weight后重新比较输出</text>
<text x="55" y="595" class="sub" text-anchor="start">参数共享要检查对象身份；归一化缩放要把初始值和生效公式一起阅读。</text>
</svg>
