<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">训练状态字节与运行显存峰值</title>
<desc id="desc">参数、梯度与优化器张量可以逐项计数字节；实测峰值由同一时刻存活的这些状态、激活和临时工作区共同决定，不能只用静态大小代替。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#52606d"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#344563}.box{stroke-width:2;rx:12}.edge{stroke:#52606d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="620" fill="#f7f9fc"/>
<text x="600" y="45" text-anchor="middle" class="title">状态张量有多大，与训练峰值有多高，分别记录</text>
<text x="600" y="83" text-anchor="middle" class="small">先按元素数与类型计数，再沿训练时间观察哪些对象同时存活</text>
<path d="M340 195H400V230H460" class="edge"/>
<path d="M340 345H400V280H460" class="edge"/>
<path d="M740 255H860" class="edge"/>
<path d="M740 447H800V285H860" class="edge"/>
<path d="M1000 405V305" class="edge"/>
<g text-anchor="middle">
<rect x="70" y="150" width="270" height="90" class="box" fill="#e7f0ff" stroke="#2563eb"/>
<text x="205" y="187" class="head">参数与梯度</text><text x="205" y="217" class="body">权重张量、已有梯度张量</text>
<rect x="70" y="300" width="270" height="90" class="box" fill="#e7f0ff" stroke="#2563eb"/>
<text x="205" y="337" class="head">优化器状态</text><text x="205" y="367" class="body">动量、二阶矩等张量</text>
<rect x="460" y="205" width="280" height="100" class="box" fill="#e3fcef" stroke="#16a34a"/>
<text x="600" y="242" class="head">逐项统计状态字节</text><text x="600" y="275" class="body">元素数量 × 每元素字节数</text>
<rect x="860" y="205" width="280" height="100" class="box" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1000" y="242" class="head">测量训练显存峰值</text><text x="1000" y="275" class="body">窗口内同时占用的最高值</text>
<rect x="460" y="405" width="280" height="85" class="box" fill="#fff3d6" stroke="#d97706"/>
<text x="600" y="440" class="head">激活值</text><text x="600" y="470" class="body">随保存、反向与释放变化</text>
<rect x="860" y="405" width="280" height="85" class="box" fill="#fff3d6" stroke="#d97706"/>
<text x="1000" y="440" class="head">临时张量与工作区</text><text x="1000" y="470" class="body">随算子与更新阶段变化</text>
<text x="800" y="237" class="small">参与占用</text>
<text x="600" y="555" class="small">减少前向保存的激活后，更新阶段仍可能决定整步峰值</text>
<text x="600" y="583" class="small">活跃张量占用与分配器预留分别报告，静态状态计数不等于实测峰值</text>
</g>
</svg>
