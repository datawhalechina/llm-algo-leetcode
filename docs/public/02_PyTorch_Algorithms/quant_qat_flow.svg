<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">浮点主权重更新后，再转换与验证</title><desc id="desc">浮点主权重经伪量化前向影响损失，STE提供近似梯度回到主权重；训练后从更新后的权重转换，并检查目标表示和后端。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1080" height="460" fill="#f8fafc"/><text x="540" y="43" text-anchor="middle" class="title">浮点主权重更新后，再转换与验证</text>
<rect x="35" y="90" width="220" height="80" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="145" y="122" text-anchor="middle" class="h">浮点主权重</text><text x="145" y="149" text-anchor="middle">优化器更新的对象</text>
<rect x="430" y="90" width="220" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="540" y="122" text-anchor="middle" class="h">伪量化前向</text><text x="540" y="149" text-anchor="middle">缩放、裁剪、舍入与恢复</text>
<rect x="825" y="90" width="220" height="80" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="935" y="122" text-anchor="middle" class="h">任务损失</text><text x="935" y="149" text-anchor="middle">看到量化造成的误差</text>
<path d="M255 130H430" class="e"/>
<path d="M650 130H825" class="e"/>
<rect x="430" y="235" width="220" height="80" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="540" y="267" text-anchor="middle" class="h">STE 近似梯度</text><text x="540" y="294" text-anchor="middle">反向沿连续路径</text>
<path d="M935 170V275H650" class="d"/>
<path d="M430 275H145V170" class="d"/>
<rect x="35" y="365" width="220" height="75" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="145" y="408.5" text-anchor="middle" class="h">转换权重与参数</text>
<rect x="430" y="365" width="220" height="75" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="540" y="408.5" text-anchor="middle" class="h">转换后质量评估</text>
<rect x="825" y="365" width="220" height="75" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="935" y="408.5" text-anchor="middle" class="h">目标后端验证</text>
<path d="M80 170V365" class="e"/>
<path d="M255 402H430" class="e"/>
<path d="M650 402H825" class="e"/>
<text x="680" y="342" text-anchor="middle" class="s">虚线：反向更新；实线：前向或训练后转换</text>
</svg>
