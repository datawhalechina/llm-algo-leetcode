<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">共享参数的读取与梯度归属</title><desc id="desc">左侧两算子读取同一W并各自将梯度回传到同一W.grad；右侧读取独立W_in与W_out并分别回传。蓝色实线读取，红色虚线回传。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e11d48"/></marker><marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.read{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#blue)}.grad{stroke:#e11d48;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#red)}.control{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#purple)}</style></defs>
<rect width="1600" height="650" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="52" class="title" text-anchor="start">读取同一参数，与把两路梯度累积到同一位置，是两种关系</text>
<text x="55" y="87" class="sub" text-anchor="start">蓝色实线：参数送入计算；红色虚线：反向梯度回到参数。示例V=8、D=4。</text>
<rect x="55" y="115" width="710" height="475" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<rect x="825" y="115" width="720" height="475" rx="12" fill="#fff" stroke="#cbd5e1" data-layout-role="panel"/>
<text x="410" y="151" class="head" text-anchor="middle">绑定：一份W，32个参数</text>
<text x="1185" y="151" class="head" text-anchor="middle">未绑定：W_in与W_out，共64个参数</text>
<rect x="285" y="190" width="260" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="415" y="219" class="head" text-anchor="middle">共享参数 W · [V,D]</text>
<text x="415" y="246" class="body" text-anchor="middle">两路梯度累积到W.grad</text>
<rect x="95" y="365" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="215" y="394" class="head" text-anchor="middle">词嵌入查表</text>
<text x="215" y="421" class="body" text-anchor="middle">W[token_id]</text>
<rect x="485" y="365" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="605" y="394" class="head" text-anchor="middle">LM Head投影</text>
<text x="605" y="421" class="body" text-anchor="middle">hidden · Wᵀ</text>
<path id="shared-read-embedding" d="M340 270V315H215V365" class="read"/>
<path id="shared-read-head" d="M490 270V315H605V365" class="read"/>
<path id="shared-grad-embedding" d="M155 365V230H285" class="grad"/>
<path id="shared-grad-head" d="M665 365V230H545" class="grad"/>
<rect x="865" y="190" width="240" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="985" y="219" class="head" text-anchor="middle">参数 W_in</text>
<text x="985" y="246" class="body" text-anchor="middle">独立的32个参数</text>
<rect x="1245" y="190" width="240" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1365" y="219" class="head" text-anchor="middle">参数 W_out</text>
<text x="1365" y="246" class="body" text-anchor="middle">独立的32个参数</text>
<rect x="865" y="365" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="985" y="394" class="head" text-anchor="middle">词嵌入查表</text>
<text x="985" y="421" class="body" text-anchor="middle">W_in[token_id]</text>
<rect x="1245" y="365" width="240" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1365" y="394" class="head" text-anchor="middle">LM Head投影</text>
<text x="1365" y="421" class="body" text-anchor="middle">hidden · W_outᵀ</text>
<path id="untied-read-embedding" d="M1010 270V365" class="read"/>
<path id="untied-grad-embedding" d="M930 365V270" class="grad"/>
<path id="untied-read-head" d="M1390 270V365" class="read"/>
<path id="untied-grad-head" d="M1310 365V270" class="grad"/>
<text x="410" y="534" class="body" text-anchor="middle">同一个Parameter同时被两个模块引用</text>
<text x="1185" y="534" class="body" text-anchor="middle">两个Parameter各自保存数值与梯度</text>
<text x="55" y="625" class="small" text-anchor="start">共享布局中的两条读取边都来自W；红色边表示梯度归属，而不是前向的Token数据流。</text>
</svg>
