<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 560" role="img" aria-labelledby="title desc"><title id="title">权重绑定的参数归属与梯度路径</title><desc id="desc">展示 embedding 与 LM Head 在 tied 和 untied 情况下的参数矩阵和梯度归属差异。</desc><defs><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:500 16px sans-serif;fill:#475569}.h{font:700 18px sans-serif;fill:#0f172a}.b{font:500 15px sans-serif;fill:#334155}.x{stroke-width:2.5;rx:18}.a{stroke:#64748b;stroke-width:3.5;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1420" height="560" fill="#f8fafc"/><text x="55" y="58" class="t">Weight tying：两条计算路径是否指向同一份词表参数</text><text x="55" y="88" class="s">配置项只是声明；需要同时检查实际 Parameter 指针、参数账本和反向梯度归属。</text><rect x="80" y="150" width="520" height="290" class="x" fill="#eff6ff" stroke="#2563eb"/><text x="110" y="192" class="h">tied：共享一份 W ∈ R^(V×D)</text><rect x="120" y="240" width="150" height="82" class="x" fill="#dbeafe" stroke="#60a5fa"/><text x="145" y="273" class="b">Embedding</text><text x="145" y="299" class="b">lookup W</text><rect x="385" y="240" width="150" height="82" class="x" fill="#dbeafe" stroke="#60a5fa"/><text x="414" y="273" class="b">LM Head</text><text x="414" y="299" class="b">project with W</text><rect x="290" y="355" width="130" height="52" class="x" fill="#bfdbfe" stroke="#3b82f6"/><text x="315" y="388" class="b">same data_ptr</text><path d="M270 281H385" class="a"/><path d="M195 322V355H290" class="a"/><path d="M460 322V355H420" class="a"/><rect x="820" y="150" width="520" height="290" class="x" fill="#fff7ed" stroke="#d97706"/><text x="850" y="192" class="h">untied：两份独立词表矩阵</text><rect x="860" y="240" width="150" height="82" class="x" fill="#ffedd5" stroke="#fb923c"/><text x="885" y="273" class="b">Embedding W_in</text><text x="885" y="299" class="b">输入查表</text><rect x="1120" y="240" width="150" height="82" class="x" fill="#ffedd5" stroke="#fb923c"/><text x="1145" y="273" class="b">LM Head W_out</text><text x="1145" y="299" class="b">输出投影</text><rect x="1025" y="355" width="150" height="52" class="x" fill="#fed7aa" stroke="#f97316"/><text x="1050" y="388" class="b">two parameters</text><path d="M935 322V355H1025" class="a"/><path d="M1195 322V355H1175" class="a"/><text x="82" y="510" class="s">tied 会节省一份 V×D 参数，并让两条路径的梯度累积到同一 Parameter；是否适合仍取决于模型配置和训练目标。</text></svg>
