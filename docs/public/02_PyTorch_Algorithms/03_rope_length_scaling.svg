<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">固定频率下的位置插值</title><desc id="desc">原位置范围0到4扩展至0到8，插值因子2时，旋转角由m乘omega变为m除2乘omega；图比较映射变化，不代表模型质量验证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:18px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#475569}.node{stroke-width:2;rx:12}.flow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="470" fill="#f8fafc" data-layout-role="decoration"/>
<text x="55" y="48" class="title" text-anchor="start">位置插值把更长的位置范围，映射到原来的旋转角范围</text>
<text x="55" y="80" class="sub" text-anchor="start">固定一个通道对的频率ω：原位置范围0–4，目标范围0–8，插值因子s=2。</text>
<g data-layout-role="glyph-group"><rect x="200" y="120" width="425" height="260" fill="#eff6ff"/><rect x="625" y="120" width="425" height="260" fill="#fff7ed"/><line x1="200" y1="380" x2="1050" y2="380" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="175" y="385" class="small" text-anchor="middle">0</text>
<line x1="200" y1="315" x2="1050" y2="315" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="175" y="320" class="small" text-anchor="middle">2</text>
<line x1="200" y1="250" x2="1050" y2="250" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="175" y="255" class="small" text-anchor="middle">4</text>
<line x1="200" y1="185" x2="1050" y2="185" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="175" y="190" class="small" text-anchor="middle">6</text>
<line x1="200" y1="120" x2="1050" y2="120" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="175" y="125" class="small" text-anchor="middle">8</text>
<text x="200" y="405" class="small" text-anchor="middle">0</text>
<text x="412.5" y="405" class="small" text-anchor="middle">2</text>
<text x="625" y="405" class="small" text-anchor="middle">4</text>
<text x="837.5" y="405" class="small" text-anchor="middle">6</text>
<text x="1050" y="405" class="small" text-anchor="middle">8</text>
<line x1="200" y1="380" x2="1065" y2="380" stroke="#64748b" stroke-width="2"/><line x1="200" y1="380" x2="200" y2="110" stroke="#64748b" stroke-width="2"/>
<line x1="625" y1="120" x2="625" y2="380" stroke="#94a3b8" stroke-dasharray="7 5"/>
<path data-mapping="original" d="M200 380L1050 120" fill="none" stroke="#2563eb" stroke-width="3"/>
<path data-mapping="interpolation" d="M200 380L1050 250" fill="none" stroke="#7c3aed" stroke-width="3"/></g>
<text x="100" y="140" class="body" text-anchor="middle">角度 / ω</text>
<text x="412" y="108" class="small" text-anchor="middle">原位置范围</text>
<text x="837" y="108" class="small" text-anchor="middle">扩展部分</text>
<rect x="1110" y="140" width="330" height="80" class="node" fill="#dbeafe" stroke="#2563eb"/>
<text x="1275" y="169" class="head" text-anchor="middle">原映射：mω</text>
<text x="1275" y="197" class="body" text-anchor="middle">m=8 → 8ω</text>
<rect x="1110" y="270" width="330" height="80" class="node" fill="#ede9fe" stroke="#7c3aed"/>
<text x="1275" y="299" class="head" text-anchor="middle">位置插值：(m/2)ω</text>
<text x="1275" y="327" class="body" text-anchor="middle">m=8 → 4ω</text>
<path d="M1050 120L1110 180" stroke="#64748b" stroke-width="2" fill="none" data-layout-role="decoration"/><path d="M1050 250L1110 310" stroke="#64748b" stroke-width="2" fill="none" data-layout-role="decoration"/><text x="625" y="434" class="body" text-anchor="middle">位置 m</text>
<text x="55" y="462" class="small" text-anchor="start">插值同时压缩相邻位置的相位间隔；短程与长程任务质量需要另行验证。</text>
</svg>
