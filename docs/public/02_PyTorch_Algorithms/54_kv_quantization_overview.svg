<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
 <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker></defs><rect width="1200" height="470" rx="20" fill="#f8fafc"/>
 <text x="52" y="52" font-family="Arial" font-size="27" font-weight="700" fill="#172554">KV Cache 量化：K 与 V 的分布不同，量化粒度也可以不同</text>
 <g font-family="Arial" text-anchor="middle" fill="#1e293b"><rect x="70" y="123" width="215" height="90" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="178" y="160" font-size="20" font-weight="700">每次 Decode</text><text x="178" y="190" font-size="17">追加新的 K / V 状态</text><rect x="395" y="112" width="250" height="110" rx="14" fill="#ede9fe" stroke="#8b5cf6"/><text x="520" y="151" font-size="20" font-weight="700">Key：按通道观察</text><text x="520" y="181" font-size="17">跨 token 共享通道范围</text><rect x="395" y="274" width="250" height="110" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="520" y="313" font-size="20" font-weight="700">Value：按 token 观察</text><text x="520" y="343" font-size="17">每个 token 独立范围</text><rect x="770" y="193" width="210" height="94" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="875" y="231" font-size="20" font-weight="700">量化值 + scale</text><text x="875" y="260" font-size="17">降低每 token 字节数</text><rect x="1040" y="193" width="118" height="94" rx="14" fill="#fff" stroke="#94a3b8"/><text x="1099" y="231" font-size="19" font-weight="700">Attention</text><text x="1099" y="260" font-size="17">读取恢复</text></g>
 <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M285 168 H340 V167 H395"/><path d="M285 168 H340 V329 H395"/><path d="M645 167 H705 V240 H770"/><path d="M645 329 H705 V240 H770"/><path d="M980 240 H1040"/></g>
 <text x="600" y="433" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">KIVI 是这种“按 K / V 分布选择不同粒度”的代表；实际 backend 仍需独立验证。</text>
</svg>
