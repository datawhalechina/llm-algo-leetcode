<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">先核对同一份产物，再验证目标后端加载</title><desc id="desc">候选包经过文件与配置、候选质量检查，再实际加载；通过后生成可用于部署比较的引用。</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52657a"/></marker>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:400;fill:#334e68}.title{font-size:25px;font-weight:700;fill:#18324b}.h{font-size:18px;font-weight:600;fill:#18324b}.s{font-size:14px}.e{stroke:#52657a;stroke-width:2.5;fill:none;marker-end:url(#a)}.d{stroke:#7657a5;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs><rect width="1120" height="540" fill="#f8fafc"/><text x="560" y="43" text-anchor="middle" class="title">先核对同一份产物，再验证目标后端加载</text>
<rect x="40" y="125" width="250" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="165" y="157" text-anchor="middle" class="h">候选包</text><text x="165" y="184" text-anchor="middle">模型、量化配置与文件清单</text>
<rect x="420" y="125" width="270" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="555" y="157" text-anchor="middle" class="h">文件与配置</text><text x="555" y="184" text-anchor="middle">角色、大小与内容摘要</text>
<rect x="800" y="125" width="270" height="90" rx="13" fill="#fff3df" stroke="#b7791f" stroke-width="2"/><text x="935" y="157" text-anchor="middle" class="h">已有质量记录</text><text x="935" y="184" text-anchor="middle">划分、指标方向与门槛</text>
<path d="M290 170H420" class="e"/>
<path d="M690 170H800" class="e"/>
<rect x="800" y="335" width="270" height="90" rx="13" fill="#f1edfb" stroke="#7657a5" stroke-width="2"/><text x="935" y="367" text-anchor="middle" class="h">真实加载</text><text x="935" y="394" text-anchor="middle">读取产物并往返生成</text>
<rect x="420" y="335" width="270" height="90" rx="13" fill="#e8f6f1" stroke="#3f8b72" stroke-width="2"/><text x="555" y="367" text-anchor="middle" class="h">形成产物引用</text><text x="555" y="394" text-anchor="middle">各项检查均通过</text>
<rect x="40" y="335" width="250" height="90" rx="13" fill="#e8f1fb" stroke="#3f78a8" stroke-width="2"/><text x="165" y="367" text-anchor="middle" class="h">进入部署比较</text><text x="165" y="394" text-anchor="middle">浮点与量化的实际请求</text>
<path d="M935 215V335" class="e"/>
<path d="M800 380H690" class="e"/>
<path d="M420 380H290" class="e"/>
<text x="560" y="487" text-anchor="middle" class="s">文件完整、选择质量和加载成功分别记录；部署性能通过后续请求比较测量</text>
</svg>
