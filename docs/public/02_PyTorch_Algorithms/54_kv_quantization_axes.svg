<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
 <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker></defs><rect width="1200" height="430" rx="20" fill="#f8fafc"/>
 <text x="50" y="52" font-family="Arial" font-size="26" font-weight="700" fill="#172554">两种 scale 轴：比较误差、元数据和追加成本</text>
 <g font-family="Arial" fill="#1e293b" text-anchor="middle"><rect x="90" y="115" width="340" height="230" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="260" y="153" font-size="21" font-weight="700">Key：per-channel</text><text x="260" y="185" font-size="17">固定 channel 跨 token 共享 scale</text><path d="M155 220H365M155 265H365M155 310H365M205 198V327M260 198V327M315 198V327" stroke="#a78bfa" stroke-width="3"/><text x="260" y="375" font-size="17">scale 形状：… × head_dim</text><rect x="770" y="115" width="340" height="230" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="940" y="153" font-size="21" font-weight="700">Value：per-token</text><text x="940" y="185" font-size="17">每个 token 在 channel 内共享 scale</text><path d="M835 220H1045M835 265H1045M835 310H1045M885 198V327M940 198V327M995 198V327" stroke="#fbbf24" stroke-width="3"/><text x="940" y="375" font-size="17">scale 形状：… × tokens × 1</text></g>
 <path d="M430 230H770" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">同一 KV 状态，选择不同量化轴</text>
