<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">前四个 Program ID 的二维位置与输入足迹</title><desc id="desc">左侧行优先映射的前四个Program在同一输出块行，涉及一个A子块和四个B子块。右侧两行分组前四个Program构成二乘二区域，涉及两个A和两个B子块。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#475569}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">前四个 Program ID 的二维位置与输入足迹</text><text x="45" y="88" class="small" text-anchor="start">输出块网格为 4 × 4；格内为 Program ID，绿色突出前四个。足迹不等于缓存命中测量。</text>
