<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">补齐位置不写回，也可能先污染归一化分母</title><desc id="desc">三列全负常量行补齐到四列。负无穷的指数为零，输出各三分之一；补零后多出的指数一进入分母，即使第四列不写出，有效输出仍错误。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#475569}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">补齐位置不写回，也可能先污染归一化分母</text><text x="45" y="88" class="small" text-anchor="start">同一输入行 (−2, −2, −2)；两路都只写前三列，区别在于第四列是否参与了指数和。</text>
<rect x="45" y="135" width="350" height="95" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="220.0" y="174" class="head" text-anchor="middle">补齐值：−∞</text><text x="220.0" y="209" class="body" text-anchor="middle">(−2, −2, −2, −∞)</text><rect x="575" y="135" width="350" height="95" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="750.0" y="174" class="head" text-anchor="middle">指数：(1, 1, 1, 0)</text><text x="750.0" y="209" class="body" text-anchor="middle">分母 = 3</text><rect x="1105" y="135" width="350" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="1280.0" y="174" class="head" text-anchor="middle">三个有效输出各为 1/3</text><text x="1280.0" y="209" class="body" text-anchor="middle">第四列不写回</text><path d="M395 182.5H575" class="edge"/><path d="M925 182.5H1105" class="edge"/><text x="485" y="164" class="small" text-anchor="middle">m = −2</text><rect x="45" y="315" width="350" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="220.0" y="354" class="head" text-anchor="middle">反例补齐值：0</text><text x="220.0" y="389" class="body" text-anchor="middle">(−2, −2, −2, 0)</text><rect x="575" y="315" width="350" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="750.0" y="354" class="head" text-anchor="middle">指数：(e⁻², e⁻², e⁻², 1)</text><text x="750.0" y="389" class="body" text-anchor="middle">分母 = 3e⁻² + 1</text><rect x="1105" y="315" width="350" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="1280.0" y="354" class="head" text-anchor="middle">三个有效输出各为</text><text x="1280.0" y="389" class="body" text-anchor="middle">1 / (3 + e²)，不再是 1/3</text><path d="M395 362.5H575" class="edge"/><path d="M925 362.5H1105" class="edge"/><text x="485" y="344" class="small" text-anchor="middle">m = 0</text>
</svg>
