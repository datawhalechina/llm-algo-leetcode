<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">同一 Program 换 tile 时清零，同一 tile 沿 K 累加</title><desc id="desc">五个Program时Program零先处理tile零，再处理tile五。每个tile开始时清零部分和，K等于六十一时累加两段，写回后下一tile重新开始。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:23px}.small{font-size:21px;fill:#475569}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">同一 Program 换 tile 时清零，同一 tile 沿 K 累加</text><text x="45" y="88" class="small" text-anchor="start">P = 5，K = 61，K 子块宽为 32；展开 Program 0 的前两个任务，不表示时间比例。</text>
<rect x="45" y="135" width="250" height="95" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="170.0" y="174" class="head" text-anchor="middle">开始 tile 0</text><text x="170.0" y="209" class="body" text-anchor="middle">FP32 累加器置零</text><rect x="425" y="135" width="250" height="95" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="550.0" y="174" class="head" text-anchor="middle">第一段 K</text><text x="550.0" y="209" class="body" text-anchor="middle">累加位置 0–31 的乘积</text><rect x="815" y="135" width="250" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="940.0" y="174" class="head" text-anchor="middle">第二段 K</text><text x="940.0" y="209" class="body" text-anchor="middle">累加 32–60；尾部补零</text><rect x="1210" y="135" width="245" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="1332.5" y="174" class="head" text-anchor="middle">写出 tile 0</text><text x="1332.5" y="209" class="body" text-anchor="middle">只保存本块有效输出</text><path d="M295 182.5H425" class="edge"/><path d="M675 182.5H815" class="edge"/><path d="M1065 182.5H1210" class="edge"/><rect x="45" y="325" width="250" height="95" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="170.0" y="364" class="head" text-anchor="middle">开始 tile 5</text><text x="170.0" y="399" class="body" text-anchor="middle">FP32 累加器置零</text><rect x="425" y="325" width="250" height="95" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="550.0" y="364" class="head" text-anchor="middle">第一段 K</text><text x="550.0" y="399" class="body" text-anchor="middle">累加位置 0–31 的乘积</text><rect x="815" y="325" width="250" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="940.0" y="364" class="head" text-anchor="middle">第二段 K</text><text x="940.0" y="399" class="body" text-anchor="middle">累加 32–60；尾部补零</text><rect x="1210" y="325" width="245" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="1332.5" y="364" class="head" text-anchor="middle">写出 tile 5</text><text x="1332.5" y="399" class="body" text-anchor="middle">只保存本块有效输出</text><path d="M295 372.5H425" class="edge"/><path d="M675 372.5H815" class="edge"/><path d="M1065 372.5H1210" class="edge"/><path d="M1332 230V275H170V325" class="edge"/><text x="460" y="263" class="small" text-anchor="start">Program 0 领取 tile 5；不能沿用 tile 0 的部分和</text>
</svg>
