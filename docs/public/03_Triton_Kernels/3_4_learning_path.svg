<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">3.4 推理侧 Triton kernel 分支</title><desc id="desc">权重量化、Multi-LoRA 路由和 KV Cache 量化是三个相互独立的推理计算对象，共享 Triton 基础，按工作负载选择学习。</desc>
  <defs><style>.title{font:700 25px sans-serif;fill:#0f172a}.sub{font:16px sans-serif;fill:#475569}.head{font:700 19px sans-serif;fill:#172033}.body{font:15px sans-serif;fill:#334155}</style></defs>
  <rect width="1200" height="410" rx="24" fill="#f8fafc"/><text x="40" y="48" class="title">按推理时处理的对象选择 kernel 路线</text><text x="40" y="78" class="sub">三条路线共享 3.1–3.2 的索引与计算基础，但彼此不是前置步骤。</text>
  <rect x="55" y="145" width="315" height="170" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="82" y="184" class="head">14 · 权重量化</text><text x="82" y="221" class="body">INT8 权重 + scale</text><text x="82" y="250" class="body">即时反量化 GEMM</text><text x="82" y="285" class="body">证据：输出误差与容量</text>
  <rect x="445" y="145" width="315" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="472" y="184" class="head">15 · Multi-LoRA</text><text x="472" y="221" class="body">Token → LoRA 参数池</text><text x="472" y="250" class="body">两次低秩乘法与路由</text><text x="472" y="285" class="body">证据：逐 Token 输出</text>
  <rect x="835" y="145" width="315" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="862" y="184" class="head">16 · KV 量化解码</text><text x="862" y="221" class="body">INT8 K/V + 向量 scale</text><text x="862" y="250" class="body">反量化后进入注意力</text><text x="862" y="285" class="body">证据：误差与缓存字节</text>
  <text x="55" y="365" class="body">共同基础：Triton Program、tile、mask 与正确性对照</text><text x="835" y="365" class="body">完成任一路线后，可按需进入 3.5 集成</text>
</svg>
