<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">首次捕获与已有图版本的复用</title>
  <desc id="desc">输入先检查版本适用条件。命中已有版本时直接执行图调用体；没有适用版本时，Dynamo捕获FX图并调用记录后端，后端返回图调用体供执行。本图的后端不生成GPU代码。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>
    text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.sub{font-size:19px;fill:#475569}.head{font-size:22px;font-weight:700}.body{font-size:19px}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.label{font-size:18px;fill:#475569}
  </style>
  <rect width="1500" height="470" rx="22" fill="#f8fafc" data-layout-role="panel"/>
  <text x="40" y="48" class="title">同一个函数：先检查版本条件，再选择捕获或复用</text>
  <text x="40" y="82" class="sub">固定计算：x + bias → ReLU；记录后端接收FX图，返回该图的CPU调用体</text>
  <rect x="40" y="190" width="240" height="100" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="229" class="head" text-anchor="middle">当前输入</text><text x="160" y="263" class="body" text-anchor="middle">形状、步长、类型</text>
  <rect x="350" y="190" width="240" height="100" rx="15" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="470" y="229" class="head" text-anchor="middle">版本适用条件检查</text><text x="470" y="263" class="body" text-anchor="middle">guard</text>
  <rect x="710" y="125" width="280" height="100" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="850" y="164" class="head" text-anchor="middle">已有适用版本</text><text x="850" y="198" class="body" text-anchor="middle">不新增后端回调</text>
  <rect x="710" y="325" width="280" height="100" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="850" y="364" class="head" text-anchor="middle">捕获FX图</text><text x="850" y="398" class="body" text-anchor="middle">加法节点 → ReLU节点</text>
  <rect x="1110" y="325" width="310" height="100" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1265" y="364" class="head" text-anchor="middle">记录后端接收图</text><text x="1265" y="398" class="body" text-anchor="middle">记录一次，返回调用体</text>
  <rect x="1110" y="125" width="310" height="100" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1265" y="164" class="head" text-anchor="middle">执行图调用体</text><text x="1265" y="198" class="body" text-anchor="middle">增加执行计数，核对输出</text>
  <path d="M280 240H350" class="edge"/>
  <path d="M590 215H650V175H710" class="edge"/><text x="614" y="153" class="label">命中</text>
  <path d="M470 290V375H710" class="edge"/><text x="495" y="352" class="label">无适用版本</text>
  <path d="M990 375H1110" class="edge"/>
  <path d="M990 175H1110" class="edge"/>
  <path d="M1265 325V225" class="edge"/><text x="1282" y="280" class="label">新调用体</text>
</svg>
