<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">相同输出块，两种 Program 分工</title>
<desc id="desc">普通网格中七个 Program 各处理一个 tile；有限网格中三个 Program 按编号加三领取任务，分别处理零三六、一四、二五。箭头表示各 Program 内的任务先后，不表示 SM 绑定或 CPU 逐 tile 启动。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:23px;fill:#1e293b}.title{font-size:30px;font-weight:700}.label{font-weight:700}.small{font-size:21px}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="53" class="title">相同输出块，两种 Program 分工</text>
<text x="45" y="95" class="small">一个 kernel 处理全部输出；图示任务归属与 Program 内次序，不表示 SM 绑定</text>
