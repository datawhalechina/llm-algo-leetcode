<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">先准备候选，再比较稳态耗时</title><desc id="desc">编译、搜索与预热在稳态窗口之前。候选搜索会多次运行同一计算，性能基准随后按相同协议比较两条路径。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:24px;fill:#1e293b}.title{font-size:30px;font-weight:700}.small{font-size:21px}.label{font-size:23px;font-weight:700}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="45" y="54" class="title">先准备候选，再比较稳态耗时</text><rect x="45" y="185" width="270" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="225" text-anchor="middle" class="label">生成候选代码</text><text x="180" y="262" text-anchor="middle" class="small">配置常量参与编译</text><rect x="425" y="185" width="270" height="110" rx="12" fill="#fef3c7" stroke="#94a3b8"/><text x="560" y="225" text-anchor="middle" class="label">搜索配置</text><text x="560" y="262" text-anchor="middle" class="small">固定输入键，重复试跑</text><rect x="805" y="185" width="270" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="940" y="225" text-anchor="middle" class="label">统一预热</text><text x="940" y="262" text-anchor="middle" class="small">确认使用已准备的路径</text><rect x="1185" y="185" width="270" height="110" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="1320" y="225" text-anchor="middle" class="label">稳态计时</text><text x="1320" y="262" text-anchor="middle" class="small">同输入比较 Triton / PyTorch</text><path d="M315 240 H425" class="edge"/><path d="M695 240 H805" class="edge"/><path d="M1075 240 H1185" class="edge"/><path d="M45 350 V365 H1075 V350" fill="none" stroke="#b45309" stroke-width="3"/><text x="560" y="405" text-anchor="middle" class="small">准备成本：本页基准没有单独记录编译与搜索时间</text><path d="M1185 350 V365 H1455 V350" fill="none" stroke="#15803d" stroke-width="3"/><text x="1320" y="405" text-anchor="middle" class="small">本页记录的计时窗口</text></svg>
