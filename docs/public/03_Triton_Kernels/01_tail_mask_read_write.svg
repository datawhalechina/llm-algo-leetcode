<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
<title id="title">同一个有效条件，分别保护读取与写回</title><desc id="desc">长度十时，位置九读取两路输入并写回位置九；位置十不发起输入读取，只在局部使用填充值，且不写回输出。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#475569}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="520" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">同一个有效条件，分别保护读取与写回</text><text x="45" y="88" class="small" text-anchor="start">N = 10；上行是有效位置，下行是补齐位置。箭头表示局部数据流，不表示越界地址被访问。</text>
<text x="45" y="145" class="head" text-anchor="start">i = 9，mask = 真</text><rect x="45" y="165" width="350" height="75" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="220.0" y="196" class="head" text-anchor="middle">读取 x、y</text><text x="220.0" y="223" class="body" text-anchor="middle">x[9]、y[9]</text><rect x="575" y="165" width="350" height="75" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="750.0" y="196" class="head" text-anchor="middle">逐元素相加</text><text x="750.0" y="223" class="body" text-anchor="middle">x[9] + y[9]</text><rect x="1105" y="165" width="350" height="75" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="1280.0" y="196" class="head" text-anchor="middle">写回 z[9]</text><text x="1280.0" y="223" class="body" text-anchor="middle">位于已分配的输出范围内</text><path d="M395 202.5H575" class="edge"/><path d="M925 202.5H1105" class="edge"/><text x="45" y="335" class="head" text-anchor="start">i = 10，mask = 假</text><rect x="45" y="355" width="350" height="75" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="220.0" y="386" class="head" text-anchor="middle">关闭两路读取</text><text x="220.0" y="413" class="body" text-anchor="middle">局部值使用填充的 0、0</text><rect x="575" y="355" width="350" height="75" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="750.0" y="386" class="head" text-anchor="middle">逐元素相加</text><text x="750.0" y="413" class="body" text-anchor="middle">0 + 0；不是合法输出</text><rect x="1105" y="355" width="350" height="75" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="1280.0" y="386" class="head" text-anchor="middle">关闭输出写回</text><text x="1280.0" y="413" class="body" text-anchor="middle">即使算出 0，也不写 z[10]</text><path d="M395 392.5H575" class="edge"/><path d="M925 392.5H1105" class="edge"/>
</svg>
