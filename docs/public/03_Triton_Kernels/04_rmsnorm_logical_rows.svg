<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">把多维张量展开为逻辑行，不改变行内列数</title><desc id="desc">形状二三四在连续化后对应六行，每行四个元素。Program零到五的起点是零四八十二十六二十，不能以首维步长十二作为每行间隔。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#475569}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">把多维张量展开为逻辑行，不改变行内列数</text><text x="45" y="88" class="small" text-anchor="start">格内数字为连续副本中的元素偏移；只画行地址对应，不表示物理线程或实际访存事务。</text>
<text x="70" y="128" class="head" text-anchor="start">原张量：2 批 × 3 行 × 4 列</text><text x="850" y="128" class="head" text-anchor="start">六个 Program，各读取连续四列</text><rect x="45" y="140" width="520" height="130" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="2" data-layout-role="panel"/><text x="65" y="215" class="head" text-anchor="start">批 0</text><rect x="200" y="150" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="235" y="174" class="body" text-anchor="middle">0</text><rect x="278" y="150" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="313" y="174" class="body" text-anchor="middle">1</text><rect x="356" y="150" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="391" y="174" class="body" text-anchor="middle">2</text><rect x="434" y="150" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="469" y="174" class="body" text-anchor="middle">3</text><rect x="850" y="150" width="605" height="32" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="875" y="174" class="body" text-anchor="start">Program 0：起点 0，读取偏移 0–3</text><path d="M504 166H850" class="edge"/><rect x="200" y="188" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="235" y="212" class="body" text-anchor="middle">4</text><rect x="278" y="188" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="313" y="212" class="body" text-anchor="middle">5</text><rect x="356" y="188" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="391" y="212" class="body" text-anchor="middle">6</text><rect x="434" y="188" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="469" y="212" class="body" text-anchor="middle">7</text><rect x="850" y="188" width="605" height="32" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="875" y="212" class="body" text-anchor="start">Program 1：起点 4，读取偏移 4–7</text><path d="M504 204H850" class="edge"/><rect x="200" y="226" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="235" y="250" class="body" text-anchor="middle">8</text><rect x="278" y="226" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="313" y="250" class="body" text-anchor="middle">9</text><rect x="356" y="226" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="391" y="250" class="body" text-anchor="middle">10</text><rect x="434" y="226" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="469" y="250" class="body" text-anchor="middle">11</text><rect x="850" y="226" width="605" height="32" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="875" y="250" class="body" text-anchor="start">Program 2：起点 8，读取偏移 8–11</text><path d="M504 242H850" class="edge"/><rect x="45" y="290" width="520" height="130" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="2" data-layout-role="panel"/><text x="65" y="365" class="head" text-anchor="start">批 1</text><rect x="200" y="300" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="235" y="324" class="body" text-anchor="middle">12</text><rect x="278" y="300" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="313" y="324" class="body" text-anchor="middle">13</text><rect x="356" y="300" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="391" y="324" class="body" text-anchor="middle">14</text><rect x="434" y="300" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="469" y="324" class="body" text-anchor="middle">15</text><rect x="850" y="300" width="605" height="32" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="875" y="324" class="body" text-anchor="start">Program 3：起点 12，读取偏移 12–15</text><path d="M504 316H850" class="edge"/><rect x="200" y="338" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="235" y="362" class="body" text-anchor="middle">16</text><rect x="278" y="338" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="313" y="362" class="body" text-anchor="middle">17</text><rect x="356" y="338" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="391" y="362" class="body" text-anchor="middle">18</text><rect x="434" y="338" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="469" y="362" class="body" text-anchor="middle">19</text><rect x="850" y="338" width="605" height="32" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="875" y="362" class="body" text-anchor="start">Program 4：起点 16，读取偏移 16–19</text><path d="M504 354H850" class="edge"/><rect x="200" y="376" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="235" y="400" class="body" text-anchor="middle">20</text><rect x="278" y="376" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="313" y="400" class="body" text-anchor="middle">21</text><rect x="356" y="376" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="391" y="400" class="body" text-anchor="middle">22</text><rect x="434" y="376" width="70" height="32" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="469" y="400" class="body" text-anchor="middle">23</text><rect x="850" y="376" width="605" height="32" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2" data-layout-role="glyph-group"/><text x="875" y="400" class="body" text-anchor="start">Program 5：起点 20，读取偏移 20–23</text><path d="M504 392H850" class="edge"/><text x="70" y="442" class="small" text-anchor="start">图示连续化后的元素偏移；相邻逻辑行差 4，首维步长 12 跨过的是整批三行。</text>
</svg>
