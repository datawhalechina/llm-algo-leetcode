<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">K尺度影响分数，V尺度影响被加权的数据</title><desc id="desc">同一有效位置的K、V各有尺度；恢复后才进行FP32注意力计算。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#475569}.node{stroke:#94a3b8;stroke-width:2;rx:12}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">K尺度影响分数，V尺度影响被加权的数据</text>
<text x="45" y="88" class="small" text-anchor="start">同一有效位置的K、V各有尺度；恢复后才进行FP32注意力计算。</text>
<rect x="45" y="125" width="330" height="100" class="node" fill="#dbeafe"/>
<text x="210.0" y="162" class="head" text-anchor="middle">K编码 × K尺度</text>
<text x="210.0" y="197" class="body" text-anchor="middle">恢复用于打分的键</text>
<rect x="45" y="295" width="330" height="100" class="node" fill="#dbeafe"/>
<text x="210.0" y="332" class="head" text-anchor="middle">V编码 × V尺度</text>
<text x="210.0" y="367" class="body" text-anchor="middle">恢复被加权的值</text>
<rect x="565" y="125" width="380" height="100" class="node" fill="#fef3c7"/>
<text x="755.0" y="162" class="head" text-anchor="middle">Q点积 → 有效位置Softmax</text>
<text x="755.0" y="197" class="body" text-anchor="middle">形成每个位置的权重</text>
<rect x="1125" y="210" width="330" height="100" class="node" fill="#dcfce7"/>
<text x="1290.0" y="247" class="head" text-anchor="middle">权重 × 重建 V</text>
<text x="1290.0" y="282" class="body" text-anchor="middle">沿有效位置归约</text>
<path d="M375 175H565" class="edge"/>
<path d="M945 175H1035V235H1125" class="edge"/>
<path d="M375 345H1290V310" class="edge"/>
<text x="45" y="440" class="body" text-anchor="start">K/V尺度不能互换；补齐分数不进入分母，位置与特征加载均有掩码。</text>
</svg>
