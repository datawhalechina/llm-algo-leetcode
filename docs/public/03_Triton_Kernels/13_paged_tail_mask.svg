<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">尾页空槽不进入注意力，未使用表项也不读取</title><desc id="desc">请求页表为 [5, 1, 7]，有效上下文长度为 6；图中不展开头与特征维。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#475569}.node{stroke:#94a3b8;stroke-width:2;rx:12}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">尾页空槽不进入注意力，未使用表项也不读取</text>
<text x="45" y="88" class="small" text-anchor="start">请求页表为 [5, 1, 7]，有效上下文长度为 6；图中不展开头与特征维。</text>
<text x="45" y="150" class="head" text-anchor="start">逻辑块 0 → 物理页 5</text>
<rect x="45" y="190" width="100" height="100" class="node" fill="#dcfce7"/>
<text x="95.0" y="227" class="head" text-anchor="middle">0</text>
<text x="95.0" y="262" class="body" text-anchor="middle">有效</text>
<rect x="155" y="190" width="100" height="100" class="node" fill="#dcfce7"/>
<text x="205.0" y="227" class="head" text-anchor="middle">1</text>
<text x="205.0" y="262" class="body" text-anchor="middle">有效</text>
<rect x="265" y="190" width="100" height="100" class="node" fill="#dcfce7"/>
<text x="315.0" y="227" class="head" text-anchor="middle">2</text>
<text x="315.0" y="262" class="body" text-anchor="middle">有效</text>
<rect x="375" y="190" width="100" height="100" class="node" fill="#dcfce7"/>
<text x="425.0" y="227" class="head" text-anchor="middle">3</text>
<text x="425.0" y="262" class="body" text-anchor="middle">有效</text>
<text x="45" y="330" class="small" text-anchor="start">逻辑位置 0–3 全部参与</text>
<text x="555" y="150" class="head" text-anchor="start">逻辑块 1 → 物理页 1</text>
<rect x="555" y="190" width="100" height="100" class="node" fill="#dcfce7"/>
<text x="605.0" y="227" class="head" text-anchor="middle">0</text>
<text x="605.0" y="262" class="body" text-anchor="middle">有效</text>
<rect x="665" y="190" width="100" height="100" class="node" fill="#dcfce7"/>
<text x="715.0" y="227" class="head" text-anchor="middle">1</text>
<text x="715.0" y="262" class="body" text-anchor="middle">有效</text>
<rect x="775" y="190" width="100" height="100" class="node" fill="#e2e8f0"/>
<text x="825.0" y="227" class="head" text-anchor="middle">2</text>
<text x="825.0" y="262" class="body" text-anchor="middle">无效</text>
<rect x="885" y="190" width="100" height="100" class="node" fill="#e2e8f0"/>
<text x="935.0" y="227" class="head" text-anchor="middle">3</text>
<text x="935.0" y="262" class="body" text-anchor="middle">无效</text>
<text x="555" y="330" class="small" text-anchor="start">逻辑位置 4、5 参与；6、7 排除</text>
<rect x="1155" y="190" width="300" height="100" class="node" fill="#e2e8f0"/>
<text x="1305.0" y="227" class="head" text-anchor="middle">页表剩余列：页 7</text>
<text x="1305.0" y="262" class="body" text-anchor="middle">不查询，也不读取</text>
<text x="45" y="405" class="body" text-anchor="start">C = 4，L = 6：有效页数为 2，尾页只使用前 2 个槽位。</text>
<text x="45" y="440" class="body" text-anchor="start">分数屏蔽使用 ℓC + r ＜ L；只检查 r ＜ C 无法排除尾页空槽。</text>
</svg>
