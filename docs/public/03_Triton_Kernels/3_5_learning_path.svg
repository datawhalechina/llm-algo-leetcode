<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">3.5 编译观察、调试与集成入口</title>
  <desc id="desc">21在CPU上观察图捕获与版本复用；按需回补Triton基础后，18核对设备产物与实际执行。19检查框架接入，20核对组件替换，17用于地址与边界问题。虚线表示按问题进入，不是代码依赖或必经步骤。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>
    text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:15px;fill:#475569}.branch{fill:none;stroke:#475569;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="500" rx="24" fill="#f8fafc" data-layout-role="panel"/>
  <text x="40" y="48" class="title">图捕获可以提前学，产物、调试与集成按问题进入</text>
  <text x="40" y="80" class="sub">虚线表示阅读衔接；21与18独立构造输入，不是同一次编译的上下游记录。</text>
  <rect x="45" y="135" width="300" height="115" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="175" class="head" text-anchor="middle">21 · 图捕获与版本复用</text>
  <text x="195" y="211" class="body" text-anchor="middle">CPU输入变化 → FX图与复用</text>
  <rect x="450" y="135" width="300" height="115" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="175" class="head" text-anchor="middle">18 · 设备产物与执行</text>
  <text x="600" y="211" class="body" text-anchor="middle">Triton特化 → 产物与CUDA调用</text>
  <rect x="855" y="135" width="300" height="115" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1005" y="175" class="head" text-anchor="middle">19 · PyTorch算子接入</text>
  <text x="1005" y="211" class="body" text-anchor="middle">前向、梯度与整图调用</text>
  <rect x="450" y="340" width="300" height="115" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="380" class="head" text-anchor="middle">17 · 内存与边界调试</text>
  <text x="600" y="416" class="body" text-anchor="middle">定位步长、掩码与尾块错误</text>
  <rect x="855" y="340" width="300" height="115" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1005" y="380" class="head" text-anchor="middle">20 · 同权重Block复测</text>
  <text x="1005" y="416" class="body" text-anchor="middle">Attention替换 → 完整调用</text>
  <path d="M345 192H450" class="branch"/><text x="353" y="170" class="label">查设备实现</text>
  <path d="M750 192H855" class="branch"/><text x="758" y="170" class="label">需框架接入</text>
  <path d="M1005 250V340" class="branch"/><text x="1022" y="298" class="label">需组件复测</text>
  <path d="M600 250V340" class="branch"/><text x="617" y="298" class="label">出现地址错误</text>
  <path d="M855 397H750" class="branch"/><text x="758" y="375" class="label">查布局错误</text>
</svg>
