<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">3.5 Triton 调试与集成路径</title><desc id="desc">17 提供索引、stride 和 mask 调试；19 检查单算子接入 PyTorch、自动微分和编译图；20 检查共享 Attention helper 在固定权重 Block 中的集成；FAQ 为按需查阅参考。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font:700 25px sans-serif;fill:#0f172a}.sub{font:16px sans-serif;fill:#475569}.head{font:700 18px sans-serif;fill:#172033}.body{font:15px sans-serif;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.optional{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="500" rx="24" fill="#f8fafc"/><text x="40" y="48" class="title">先定位 kernel 问题，再选择集成验证层级</text><text x="40" y="78" class="sub">单算子框架接入与模型组件配对验证是不同出口，不互相替代。</text>
  <rect x="55" y="145" width="250" height="145" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="80" y="183" class="head">17 · 内存与调试</text><text x="80" y="219" class="body">索引 / stride / mask</text><text x="80" y="252" class="body">定位地址与边界故障</text>
