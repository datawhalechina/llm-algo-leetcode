  <rect x="475" y="305" width="295" height="105" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="500" y="344" class="head">20 · 固定权重 Block</text><text x="500" y="376" class="body">Attention helper 的配对集成</text>
