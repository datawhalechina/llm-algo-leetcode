<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">缩放与Softmax的前向状态和反向梯度</title><desc id="desc">前向读取输入并产生独立输出，缩放保存系数，Softmax保存概率。后续损失传回实际梯度，反向读取同一次前向的状态并生成输入梯度。虚线表示保存状态。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17324d}.title{font-size:28px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:20px}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.state{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 5;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="40" y="48" class="title">前向保存所需状态，反向结合实际上游梯度传回输入</text>
<text x="40" y="87" class="body">缩放保留α；Softmax保留概率y。虚线表示保存状态，实线表示输入、输出与梯度。</text>
<rect x="50" y="130" width="300" height="100" rx="10" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/><text x="200" y="169" text-anchor="middle" class="head">输入 x</text><text x="200" y="206" text-anchor="middle" class="body">保留原存储</text>
<rect x="575" y="130" width="300" height="100" rx="10" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/><text x="725" y="169" text-anchor="middle" class="head">前向算子</text><text x="725" y="206" text-anchor="middle" class="body">αx 或按行Softmax</text>
<rect x="1100" y="130" width="300" height="100" rx="10" fill="#dbeafe" stroke="#829ab1" stroke-width="2"/><text x="1250" y="169" text-anchor="middle" class="head">输出 y</text><text x="1250" y="206" text-anchor="middle" class="body">交给后续计算</text>
<rect x="1100" y="320" width="300" height="100" rx="10" fill="#dcfce7" stroke="#829ab1" stroke-width="2"/><text x="1250" y="359" text-anchor="middle" class="head">实际上游梯度 g</text><text x="1250" y="396" text-anchor="middle" class="body">切片、常量或零</text>
<rect x="575" y="320" width="300" height="100" rx="10" fill="#dcfce7" stroke="#829ab1" stroke-width="2"/><text x="725" y="359" text-anchor="middle" class="head">反向规则</text><text x="725" y="396" text-anchor="middle" class="body">结合保存状态与实际g</text>
<rect x="50" y="320" width="300" height="100" rx="10" fill="#dcfce7" stroke="#829ab1" stroke-width="2"/><text x="200" y="359" text-anchor="middle" class="head">输入梯度</text><text x="200" y="396" text-anchor="middle" class="body">与输入形状对应</text>
<path d="M350 180H575" class="edge"/>
<path d="M875 180H1100" class="edge"/>
<path d="M1250 230V320" class="edge"/>
<text x="1268" y="281" class="body">损失求导</text>
<path d="M725 230V320" class="state"/><text x="744" y="281" class="body">保存α或概率y</text>
<path d="M1100 370H875" class="edge"/>
<path d="M575 370H350" class="edge"/>
</svg>
