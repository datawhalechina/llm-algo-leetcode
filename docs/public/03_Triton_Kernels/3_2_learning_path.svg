<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">3.2 基本计算与条件扩展</title><desc id="desc">按计算结构选择SwiGLU、RMSNorm、Softmax与GEMM。需要跨Program汇总时进入22，需要反向时进入08，需要任务循环时进入06；09可从任一正确内核进入，图中以03为例表示这一入口。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:16px}.label{font-size:15px;fill:#475569}.branch{fill:none;stroke:#475569;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
  <rect width="1200" height="470" rx="24" fill="#f8fafc" data-layout-role="panel"/>
  <text x="40" y="48" class="title">先选计算结构，再按问题进入归约、反向或任务分工</text>
  <text x="40" y="80" class="sub">上排四种计算按需选择；09可从任一已实现内核进入，图中以03为例。虚线表示条件扩展。</text>
  <rect x="45" y="125" width="245" height="125" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="67" y="163" class="head">03 · SwiGLU</text><text x="67" y="197" class="body">逐元素融合</text><text x="67" y="230" class="body">中间值与尾块</text>
  <rect x="345" y="125" width="245" height="125" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="367" y="163" class="head">04 · RMSNorm</text><text x="367" y="197" class="body">行内平方和归约</text><text x="367" y="230" class="body">共享归一化尺度</text>
  <rect x="645" y="125" width="245" height="125" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="667" y="163" class="head">07 · Softmax</text><text x="667" y="197" class="body">稳定行归约</text><text x="667" y="230" class="body">最大值与指数和</text>
  <rect x="945" y="125" width="245" height="125" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="967" y="163" class="head">05 · GEMM</text><text x="967" y="197" class="body">M/N分块与K累加</text><text x="967" y="230" class="body">输入复用与资源</text>
  <rect x="45" y="335" width="245" height="95" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="67" y="372" class="head">09 · 自动调优</text><text x="67" y="405" class="body">比较配置与准备成本</text><path d="M167 250V335" class="branch"/><text x="183" y="298" class="label">正确后调优</text>
  <rect x="345" y="335" width="245" height="95" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="367" y="372" class="head">22 · 两阶段归约</text><text x="367" y="405" class="body">部分和 → 最终总和</text><path d="M467 250V335" class="branch"/><text x="483" y="298" class="label">跨Program汇总</text>
  <rect x="645" y="335" width="245" height="95" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="667" y="372" class="head">08 · Softmax反向</text><text x="667" y="405" class="body">行点积与梯度修正</text><path d="M767 250V335" class="branch"/><text x="783" y="298" class="label">需要反向</text>
  <rect x="945" y="335" width="245" height="95" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="967" y="372" class="head">06 · 持久化GEMM</text><text x="967" y="405" class="body">有限Program循环领块</text><path d="M1067 250V335" class="branch"/><text x="1083" y="298" class="label">改变任务分工</text>
</svg>
