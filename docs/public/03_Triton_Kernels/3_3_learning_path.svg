<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">3.3 多查询前向与单查询解码</title><desc id="desc">RoPE为查询键提供位置变换；FlashAttention展示多查询分块前向。变长GQA与PagedAttention分别为当前单查询读取连续缓存或分页缓存。虚线是可组合或表示对照，而非代码依赖。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:16px}.compare{fill:none;stroke:#475569;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
  <rect width="1200" height="440" rx="24" fill="#f8fafc" data-layout-role="panel"/>
  <text x="40" y="48" class="title">分清位置变换、多查询前向与单查询缓存读取</text>
  <text x="40" y="80" class="sub">进入11前回补GEMM与Softmax；12、13各自构造输入，按寻址方式对照。</text>
  <rect x="45" y="135" width="300" height="230" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="180" class="head">10 · RoPE</text><text x="70" y="224" class="body">位置 × 特征对</text><text x="70" y="260" class="body">Query/Key旋转</text><text x="70" y="310" class="body">位置变换分支</text>
  <rect x="440" y="135" width="300" height="230" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="465" y="180" class="head">11 · FlashAttention</text><text x="465" y="224" class="body">多个Q位置 × K/V分块</text><text x="465" y="260" class="body">在线Softmax与输出累积</text><text x="465" y="310" class="body">多查询前向分支</text>
  <rect x="835" y="125" width="320" height="115" rx="17" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="860" y="162" class="head">12 · 变长GQA解码</text><text x="860" y="198" class="body">当前Q → 连续、补齐KV</text><text x="860" y="225" class="body">有效长度与共享KV头</text>
  <rect x="835" y="300" width="320" height="115" rx="17" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="860" y="337" class="head">13 · 分页解码</text><text x="860" y="373" class="body">当前Q → 页表 → 物理KV页</text><text x="860" y="400" class="body">按页读取与跨页归一化</text>
  <path d="M345 250H440" class="compare"/><text x="354" y="228" class="body">可组合</text>
  <path d="M995 240V300" class="compare"/><text x="1012" y="277" class="body">表示对照</text>
</svg>
