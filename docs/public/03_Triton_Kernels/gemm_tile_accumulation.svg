<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">一个输出块，沿 K 分段累加</title><desc id="desc">A 和 B 的当前子块形成部分乘积，累加器跨 K 轮次保留，归约结束后写回一个输出块。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;font-size:24px;fill:#1e293b}.title{font-size:30px;font-weight:700}.small{font-size:21px}.label{font-size:23px;font-weight:700}.edge{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/><text x="45" y="54" class="title">一个输出块，沿 K 分段累加</text><rect x="45" y="130" width="260" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="175" y="170" text-anchor="middle" class="label">A 当前子块</text><text x="175" y="207" text-anchor="middle" class="small">16 行 × 16 个 K</text><rect x="45" y="300" width="260" height="105" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="175" y="340" text-anchor="middle" class="label">B 当前子块</text><text x="175" y="377" text-anchor="middle" class="small">16 个 K × 16 列</text><rect x="445" y="215" width="250" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="570" y="255" text-anchor="middle" class="label">本轮矩阵乘积</text><text x="570" y="292" text-anchor="middle" class="small">贡献到 16 × 16 个输出</text><rect x="835" y="215" width="250" height="110" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="960" y="255" text-anchor="middle" class="label">FP32 累加器</text><text x="960" y="292" text-anchor="middle" class="small">保留此前各轮的部分和</text><rect x="1210" y="215" width="245" height="110" rx="12" fill="#dbeafe" stroke="#94a3b8"/><text x="1332.5" y="255" text-anchor="middle" class="label">输出子块</text><text x="1332.5" y="292" text-anchor="middle" class="small">归约结束后写回</text><path d="M305 182 H370 V245 H445" class="edge"/><path d="M305 352 H390 V295 H445" class="edge"/><path d="M695 270 H835" class="edge"/><text x="765" y="250" class="small" text-anchor="middle">累加</text><path d="M1085 270 H1210" class="edge"/><text x="1145" y="250" class="small" text-anchor="middle">完成 K</text><rect x="835" y="105" width="250" height="65" rx="12" fill="#dcfce7" stroke="#94a3b8"/><text x="960" y="147" text-anchor="middle" class="label">此前 K 轮次的部分和</text><path d="M960 170 V215" class="edge"/></svg>
