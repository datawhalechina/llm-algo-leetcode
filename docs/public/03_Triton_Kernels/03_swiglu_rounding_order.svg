<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
<title id="title">同一条计算链，舍入位置不同会改变结果</title><desc id="desc">上路以FP32完成Sigmoid及第一次乘法，再将SiLU舍入到FP16并乘第二路输入；下路先将Sigmoid舍入到FP16，因此后续中间值可能不同。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#475569}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1500" height="470" fill="#f8fafc"/>
<text x="45" y="52" class="title" text-anchor="start">同一条计算链，舍入位置不同会改变结果</text><text x="45" y="88" class="small" text-anchor="start">以 FP16 输入为例；颜色区分参考对应路径与提前舍入反例，不是性能比较。</text>
<rect x="45" y="135" width="250" height="95" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="170.0" y="174" class="head" text-anchor="middle">输入 x 转 FP32</text><text x="170.0" y="209" class="body" text-anchor="middle">FP16 只作为存储类型</text><rect x="425" y="135" width="250" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="550.0" y="174" class="head" text-anchor="middle">FP32 计算 SiLU</text><text x="550.0" y="209" class="body" text-anchor="middle">x × σ(x)</text><rect x="815" y="135" width="250" height="95" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="940.0" y="174" class="head" text-anchor="middle">SiLU 转回 FP16</text><text x="940.0" y="209" class="body" text-anchor="middle">与参考中间张量对应</text><rect x="1210" y="135" width="245" height="95" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/><text x="1332.5" y="174" class="head" text-anchor="middle">乘对应 y 并写回</text><text x="1332.5" y="209" class="body" text-anchor="middle">最终结果存为 FP16</text><path d="M295 182.5H425" class="edge"/><path d="M675 182.5H815" class="edge"/><path d="M1065 182.5H1210" class="edge"/><rect x="45" y="315" width="250" height="95" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="170.0" y="354" class="head" text-anchor="middle">输入 x 转 FP32</text><text x="170.0" y="389" class="body" text-anchor="middle">FP16 只作为存储类型</text><rect x="425" y="315" width="250" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="550.0" y="354" class="head" text-anchor="middle">Sigmoid 提前舍入</text><text x="550.0" y="389" class="body" text-anchor="middle">σ(x) 先转 FP16</text><rect x="815" y="315" width="250" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="940.0" y="354" class="head" text-anchor="middle">使用已舍入的门控</text><text x="940.0" y="389" class="body" text-anchor="middle">再计算 x × 门控</text><rect x="1210" y="315" width="245" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/><text x="1332.5" y="354" class="head" text-anchor="middle">输出可能变化</text><text x="1332.5" y="389" class="body" text-anchor="middle">舍入位置已经不同</text><path d="M295 362.5H425" class="edge"/><path d="M675 362.5H815" class="edge"/><path d="M1065 362.5H1210" class="edge"/><text x="45" y="120" class="small" text-anchor="start">与本题参考舍入顺序对应</text><text x="45" y="300" class="small" text-anchor="start">反例：把舍入提前到 Sigmoid 后</text>
</svg>
