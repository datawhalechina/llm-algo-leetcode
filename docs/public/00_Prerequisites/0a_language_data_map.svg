<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0A：数据与函数 → 数组维度 → 对象状态 → 运行文件</title><desc id="desc">01检查数据结构与函数输入；02检查广播、变形和Einsum；03管理对象跨调用的累计与重置；04管理一次运行的配置和文件。箭头是推荐阅读顺序，不是程序执行数据流。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/>
<text x="640" y="45" text-anchor="middle" class="title">0A：数据与函数 → 数组维度 → 对象状态 → 运行文件</text>
<text x="640" y="76" text-anchor="middle" class="subtitle">箭头表示推荐阅读顺序；对象中的累计状态与外部运行文件分别检查</text>
<rect x="40" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="160" y="237" text-anchor="middle" class="head">01 数据与函数</text><text x="160" y="264" text-anchor="middle" class="body">序列、字段与输入校验</text><text x="160" y="291" text-anchor="middle" class="body">逐条读取样本</text>
<rect x="360" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="480" y="237" text-anchor="middle" class="head">02 数组与维度</text><text x="480" y="264" text-anchor="middle" class="body">广播、变形与收缩</text><text x="480" y="291" text-anchor="middle" class="body">核对元素位置</text>
<rect x="680" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="800" y="237" text-anchor="middle" class="head">03 对象与状态</text><text x="800" y="264" text-anchor="middle" class="body">累计、查询与重置</text><text x="800" y="291" text-anchor="middle" class="body">检查跨调用变化</text>
<rect x="1000" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1120" y="237" text-anchor="middle" class="head">04 配置与文件</text><text x="1120" y="264" text-anchor="middle" class="body">配置覆盖与资源定位</text><text x="1120" y="291" text-anchor="middle" class="body">记录输入、缓存和输出</text>
<path d="M280 260H360" class="edge"/>
<path d="M600 260H680" class="edge"/>
<path d="M920 260H1000" class="edge"/>
</svg>
