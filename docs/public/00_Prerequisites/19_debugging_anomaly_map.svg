<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">从异常现象到运行有效性结论</title>
  <desc id="desc">异常先分到张量契约、数值传播和梯度链路，定位第一失败点并形成最小复现，最后输出是否允许继续解释性能的有效性结论。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.group{font-size:18px;font-weight:700}.head{font-size:16px;font-weight:700}.body{font-size:13px;fill:#475569}.panel{stroke-width:2;rx:16}.node{fill:#fff;stroke-width:2;rx:12}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="600" fill="#f8fafc"/>
  <text x="55" y="48" class="title">运行有效性：先定位第一失败点，再决定是否继续分析</text>
  <text x="55" y="77" class="sub">结构、数值和梯度路径使用不同检查工具；任一检查失败时停止性能解释并保留复现条件</text>

  <rect x="525" y="105" width="350" height="75" fill="#fee2e2" stroke="#fb7185" class="panel"/>
  <text x="700" y="136" text-anchor="middle" class="head">异常现象</text>
  <text x="700" y="160" text-anchor="middle" class="body">报错 · 结果异常 · NaN / Inf · 梯度缺失</text>

  <rect x="45" y="235" width="400" height="205" fill="#ecfdf5" stroke="#4ade80" class="panel"/>
  <text x="70" y="267" class="group">张量契约路径</text>
  <rect x="85" y="292" width="320" height="55" stroke="#4ade80" class="node"/>
  <text x="245" y="325" text-anchor="middle" class="head">形状 · 数据类型 · 设备 · 内存布局</text>
  <rect x="85" y="365" width="320" height="50" stroke="#4ade80" class="node"/>
  <text x="245" y="396" text-anchor="middle" class="body">输出：首个不满足的契约字段</text>

  <rect x="500" y="235" width="400" height="205" fill="#fff7ed" stroke="#fb923c" class="panel"/>
  <text x="525" y="267" class="group">数值传播路径</text>
  <rect x="540" y="292" width="320" height="55" stroke="#fb923c" class="node"/>
  <text x="700" y="325" text-anchor="middle" class="head">有限值检查 · 模块钩子</text>
  <rect x="540" y="365" width="320" height="50" stroke="#fb923c" class="node"/>
  <text x="700" y="396" text-anchor="middle" class="body">输出：第一处非有限张量或模块</text>

  <rect x="955" y="235" width="400" height="205" fill="#f5f3ff" stroke="#a78bfa" class="panel"/>
  <text x="980" y="267" class="group">梯度链路路径</text>
  <rect x="995" y="292" width="320" height="55" stroke="#a78bfa" class="node"/>
  <text x="1155" y="325" text-anchor="middle" class="head">grad=None · grad=0 · 参数注册</text>
  <rect x="995" y="365" width="320" height="50" stroke="#a78bfa" class="node"/>
  <text x="1155" y="396" text-anchor="middle" class="body">输出：断开、未保留或未注册位置</text>

  <path d="M625 180V205H245V235" class="line"/>
  <path d="M700 180V235" class="line"/>
  <path d="M775 180V205H1155V235" class="line"/>

  <rect x="420" y="485" width="560" height="95" fill="#e0f2fe" stroke="#38bdf8" class="panel"/>
  <text x="700" y="516" text-anchor="middle" class="head">最小复现与有效性结论</text>
  <text x="700" y="541" text-anchor="middle" class="body">随机种子 · 输入与契约 · 最小操作 · 首个失败点 · 框架版本</text>
  <text x="700" y="564" text-anchor="middle" class="body">valid → 采集性能证据　　invalid → 停止解释并继续定位</text>
  <path d="M245 440V465H565V485" class="line"/>
  <path d="M700 440V485" class="line"/>
  <path d="M1155 440V465H835V485" class="line"/>
</svg>
