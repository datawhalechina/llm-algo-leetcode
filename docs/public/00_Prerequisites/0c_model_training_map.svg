<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">0C PyTorch 模型与训练生命周期</title>
  <desc id="desc">模块对象分别进入完整状态恢复与有效参数更新两条支路，随后在通用 batch 契约、训练、验证和评价中汇合。</desc>
  <defs>
    <marker id="arrow0c" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#52627a"/></marker>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.note{font-size:15px;fill:#475569}.group{fill:#f7f9fc;stroke:#a8b3c7;stroke-width:2}.node{fill:#fff;stroke:#8fa0ba;stroke-width:2}.line{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow0c)}
    </style>
  </defs>
  <rect width="1280" height="560" fill="#fbfcfe"/>
  <text x="640" y="48" text-anchor="middle" class="title">0C · 从模型对象到训练生命周期</text>

  <rect x="450" y="82" width="380" height="94" rx="14" fill="#e9e7fb" class="node"/>
  <text x="640" y="119" text-anchor="middle" class="label">09 · nn.Module 与运行状态</text>
  <text x="640" y="148" text-anchor="middle" class="note">注册字段 · 运行模式 · 参数冻结</text>

  <rect x="95" y="238" width="450" height="160" rx="16" class="group" data-layout-role="panel"/>
  <text x="123" y="272" class="label">状态支路</text>
  <rect x="145" y="298" width="350" height="72" rx="11" fill="#e4f1fb" class="node"/>
  <text x="320" y="327" text-anchor="middle" class="label">10 · 模型产物与训练检查点</text>
  <text x="320" y="352" text-anchor="middle" class="note">独立快照 · 状态恢复 · 下一步更新一致</text>

  <rect x="735" y="238" width="450" height="160" rx="16" class="group" data-layout-role="panel"/>
  <text x="763" y="272" class="label">更新支路</text>
  <rect x="785" y="298" width="350" height="72" rx="11" fill="#e8f7ed" class="node"/>
  <text x="960" y="327" text-anchor="middle" class="label">11 · 损失、优化器与更新时钟</text>
  <text x="960" y="352" text-anchor="middle" class="note">微步 · 更新尝试 · 有效更新 · 学习率推进</text>

  <rect x="400" y="452" width="480" height="82" rx="14" fill="#fff2cf" class="node"/>
  <text x="640" y="484" text-anchor="middle" class="label">12 · 数据接口与训练生命周期</text>
  <text x="640" y="510" text-anchor="middle" class="note">批次输入 → 训练 → 独立验证 → 指标汇总</text>

  <path d="M550 176V208H320V298" class="line"/>
  <path d="M730 176V208H960V298" class="line"/>
  <path d="M320 370V420H540V452" class="line"/>
  <path d="M960 370V420H740V452" class="line"/>
</svg>
