<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">训练内存对象的生命周期与运行时对账</title>
  <desc id="desc">沿加载、前向、反向和更新阶段记录存活对象，按同一阶段对照估算与分配器快照；区间峰值需另记时刻，不能直接相减解释缓存。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#475569}.head{font-size:17px;font-weight:700}.body{font-size:13px;fill:#475569}.phase{stroke-width:2;rx:15}.evidence{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:13}.line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="560" fill="#f8fafc"/>
  <text x="55" y="48" class="title">训练内存：先看对象何时重叠，再解释峰值</text>
  <text x="55" y="77" class="sub">先按生命周期估算，再对照同一阶段的快照；真实实验还需记录区间峰值和整卡占用</text>

  <rect x="55" y="130" width="270" height="150" fill="#e0f2fe" stroke="#38bdf8" class="phase"/>
  <text x="190" y="165" text-anchor="middle" class="head">1. 加载后</text>
  <text x="190" y="202" text-anchor="middle" class="body">参数</text>
  <text x="190" y="232" text-anchor="middle" class="body">模型状态的最低驻留要求</text>

  <rect x="390" y="130" width="270" height="150" fill="#dcfce7" stroke="#4ade80" class="phase"/>
  <text x="525" y="165" text-anchor="middle" class="head">2. 前向峰值候选</text>
  <text x="525" y="202" text-anchor="middle" class="body">参数 · 优化器状态 · 保存的激活</text>
  <text x="525" y="232" text-anchor="middle" class="body">算子临时缓冲可能短暂加入</text>

  <rect x="725" y="130" width="270" height="150" fill="#fef3c7" stroke="#f59e0b" class="phase"/>
  <text x="860" y="165" text-anchor="middle" class="head">3. 反向峰值候选</text>
  <text x="860" y="202" text-anchor="middle" class="body">前向存活对象 · 梯度</text>
  <text x="860" y="232" text-anchor="middle" class="body">激活在使用后逐步释放</text>

  <rect x="1060" y="130" width="285" height="150" fill="#fce7f3" stroke="#f472b6" class="phase"/>
  <text x="1202" y="165" text-anchor="middle" class="head">4. 更新后</text>
  <text x="1202" y="202" text-anchor="middle" class="body">参数 · 梯度 · 优化器状态</text>
  <text x="1202" y="232" text-anchor="middle" class="body">等待下一次清梯度或前向</text>

  <path d="M325 205H380" class="line"/><path d="M660 205H715" class="line"/><path d="M995 205H1050" class="line"/>

  <rect x="135" y="365" width="300" height="105" class="evidence"/>
  <text x="285" y="400" text-anchor="middle" class="head">理论候选峰值</text>
  <text x="285" y="430" text-anchor="middle" class="body">按阶段汇总当时仍存活的已知对象</text>

  <rect x="550" y="365" width="300" height="105" class="evidence"/>
  <text x="700" y="400" text-anchor="middle" class="head">同一时刻 allocated</text>
  <text x="700" y="430" text-anchor="middle" class="body">分配器记录的活跃张量占用</text>

  <rect x="965" y="365" width="300" height="105" class="evidence"/>
  <text x="1115" y="400" text-anchor="middle" class="head">reserved / 容量预算</text>
  <text x="1115" y="430" text-anchor="middle" class="body">区分进程预算余量与整卡空闲量</text>

  <path d="M860 280V325H285V365" class="line"/>
  <text x="575" y="316" text-anchor="middle" class="body">按阶段汇总仍存活的已知对象</text>
  <path d="M435 417H540" class="line"/><path d="M850 417H955" class="line"/>
  <text x="487" y="398" text-anchor="middle" class="body">查遗漏对象</text>
  <text x="902" y="398" text-anchor="middle" class="body">查保留空间</text>
</svg>
