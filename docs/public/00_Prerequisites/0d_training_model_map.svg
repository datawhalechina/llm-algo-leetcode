<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">0D：先看完整 Block，再按问题展开三个组件</title><desc id="desc">13建立Block主路径与两次残差更新总览，然后分别进入14激活与门控、15归一化或16Attention。连线表示组件阅读分支，不表示前向计算顺序。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.reading{stroke-dasharray:7 5}.node{stroke-width:2}</style></defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">0D：先看完整 Block，再按问题展开三个组件</text>
<text class="note" x="640" y="76" text-anchor="middle">箭头表示阅读关系；Block 内部的计算顺序与残差连接见 13 总览页。</text>
<rect class="node" x="460" y="130" width="360" height="80" rx="12" fill="#faf5ff" stroke="#a78bfa"/><text class="head" x="640" y="162" text-anchor="middle">13 Block 与残差通路</text><text class="note" x="640" y="188" text-anchor="middle">主路径状态与两次分支增量</text>
<rect class="node" x="40" y="330" width="350" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="215" y="362" text-anchor="middle">14 激活与门控</text><text class="note" x="215" y="388" text-anchor="middle">MLP 的非线性与通道变换</text>
<rect class="node" x="465" y="330" width="350" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="640" y="362" text-anchor="middle">15 归一化</text><text class="note" x="640" y="388" text-anchor="middle">统计轴、数值尺度与放置位置</text>
<rect class="node" x="890" y="330" width="350" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="1065" y="362" text-anchor="middle">16 Attention</text><text class="note" x="1065" y="388" text-anchor="middle">匹配、可见性与信息聚合</text>
<path class="edge" d="M520 210V270H215V330"/>
<path class="edge" d="M640 210V330"/>
<path class="edge" d="M760 210V270H1065V330"/>
</svg>
