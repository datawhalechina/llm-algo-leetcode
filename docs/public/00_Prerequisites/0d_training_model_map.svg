<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">0D：先看完整 Block，再按问题展开三个组件</title><desc id="desc">13建立Block主路径与两次残差更新总览，然后按问题进入14激活与门控、15归一化、16Attention。三条边表示组件阅读分支，不表示模型前向计算顺序。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text x="640" y="45" text-anchor="middle" class="title">0D：先看完整 Block，再按问题展开三个组件</text>
<text x="640" y="76" text-anchor="middle" class="subtitle">箭头表示阅读关系；Block 内部的计算顺序与残差连接见总览页</text>
<rect x="460" y="115" width="360" height="100" rx="14" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/><text x="640" y="147" text-anchor="middle" class="head">13 Block 与残差通路</text><text x="640" y="174" text-anchor="middle" class="body">主路径状态与两次分支增量</text>
<rect x="70" y="350" width="340" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="240" y="382" text-anchor="middle" class="head">14 激活与门控</text><text x="240" y="409" text-anchor="middle" class="body">MLP 的非线性与通道变换</text>
<rect x="470" y="350" width="340" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="640" y="382" text-anchor="middle" class="head">15 归一化</text><text x="640" y="409" text-anchor="middle" class="body">统计轴、数值尺度与放置位置</text>
<rect x="870" y="350" width="340" height="100" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1040" y="382" text-anchor="middle" class="head">16 Attention</text><text x="1040" y="409" text-anchor="middle" class="body">匹配、可见性与信息聚合</text>
<path d="M520 215V285H240V350" class="edge"/>
<path d="M640 215V350" class="edge"/>
<path d="M760 215V285H1040V350" class="edge"/>
