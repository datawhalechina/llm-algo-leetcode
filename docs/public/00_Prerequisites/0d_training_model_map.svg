<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">0D Transformer Block 数据流与组件基础</title>
  <desc id="desc">Hidden state 在 Transformer Block 中依次经过 Norm、Attention、Residual add、Norm、MLP 和 Residual add；页码标明各组件的主要学习入口。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#52627a"/></marker>
    <style>
      text{font-family:'Noto Sans CJK SC',sans-serif}.title{font-size:28px;font-weight:700;fill:#172033}.subtitle{font-size:15px;fill:#475569}.frame{fill:#f7f9fc;stroke:#a8b3c7;stroke-width:2}.node{fill:#fff;stroke:#8fa0ba;stroke-width:2}.residual{fill:#eeeafd}.norm{fill:#fff2cf}.attn{fill:#e4f1fb}.mlp{fill:#e8f7ed}.text{font-size:17px;font-weight:600;fill:#172033}.small{font-size:14px;fill:#475569}.line{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.guide{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="620" fill="#fbfcfe"/>
  <text x="640" y="45" text-anchor="middle" class="title">0D · Transformer Block 数据流与组件基础</text>
  <text x="640" y="72" text-anchor="middle" class="subtitle">13 提供 residual 骨架；14–16 分别展开 MLP、Norm 与 Attention</text>

  <rect x="25" y="157" width="140" height="78" rx="13" class="node residual"/>
  <text x="95" y="188" text-anchor="middle" class="text">Hidden state</text>
  <text x="95" y="214" text-anchor="middle" class="small">[B, S, H]</text>

  <rect x="195" y="105" width="875" height="250" rx="18" class="frame"/>
  <text x="220" y="137" class="text">13 · 一个 Block 对同一条 residual stream 执行两次增量更新</text>

  <rect x="225" y="167" width="105" height="62" rx="11" class="node norm"/>
  <text x="277" y="193" text-anchor="middle" class="text">Norm</text>
  <text x="277" y="214" text-anchor="middle" class="small">15</text>
  <rect x="360" y="167" width="130" height="62" rx="11" class="node attn"/>
  <text x="425" y="193" text-anchor="middle" class="text">Attention</text>
  <text x="425" y="214" text-anchor="middle" class="small">16 · token mixing</text>
  <rect x="520" y="167" width="110" height="62" rx="11" class="node residual"/>
  <text x="575" y="193" text-anchor="middle" class="text">Residual add</text>
  <text x="575" y="214" text-anchor="middle" class="small">13</text>
  <rect x="660" y="167" width="105" height="62" rx="11" class="node norm"/>
  <text x="712" y="193" text-anchor="middle" class="text">Norm</text>
  <text x="712" y="214" text-anchor="middle" class="small">15</text>
  <rect x="795" y="167" width="100" height="62" rx="11" class="node mlp"/>
  <text x="845" y="193" text-anchor="middle" class="text">MLP</text>
  <text x="845" y="214" text-anchor="middle" class="small">14</text>
  <rect x="925" y="167" width="110" height="62" rx="11" class="node residual"/>
  <text x="980" y="193" text-anchor="middle" class="text">Residual add</text>
  <text x="980" y="214" text-anchor="middle" class="small">13</text>

  <path d="M165 196H225" class="line"/><path d="M330 198H360" class="line"/><path d="M490 198H520" class="line"/><path d="M630 198H660" class="line"/><path d="M765 198H795" class="line"/><path d="M895 198H925" class="line"/>
  <path d="M95 235V310H550V229" class="guide"/>
  <text x="325" y="337" text-anchor="middle" class="small">保留原始输入</text>
  <path d="M600 229V285H980V229" class="guide"/>
  <text x="805" y="312" text-anchor="middle" class="small">保留第一次更新后的状态</text>

  <rect x="1100" y="157" width="145" height="78" rx="13" class="node residual"/>
  <text x="1172" y="188" text-anchor="middle" class="text">Next state</text>
  <text x="1172" y="214" text-anchor="middle" class="small">[B, S, H]</text>
  <path d="M1035 198H1100" class="line"/>

  <rect x="95" y="425" width="250" height="115" rx="15" class="node residual"/>
  <text x="220" y="456" text-anchor="middle" class="text">13 · Block / Residual</text>
  <text x="220" y="483" text-anchor="middle" class="small">主路径 · 两次更新</text>
  <text x="220" y="507" text-anchor="middle" class="small">层间 hidden contract</text>
  <rect x="390" y="425" width="250" height="115" rx="15" class="node mlp"/>
  <text x="515" y="456" text-anchor="middle" class="text">14 · MLP / Activation</text>
  <text x="515" y="483" text-anchor="middle" class="small">H → H_ffn → H</text>
  <text x="515" y="507" text-anchor="middle" class="small">非线性 · 门控</text>
  <rect x="685" y="425" width="250" height="115" rx="15" class="node norm"/>
  <text x="810" y="456" text-anchor="middle" class="text">15 · Normalization</text>
  <text x="810" y="483" text-anchor="middle" class="small">统计轴 · 公式</text>
  <text x="810" y="507" text-anchor="middle" class="small">Pre/Post-Norm</text>
  <rect x="980" y="425" width="205" height="115" rx="15" class="node attn"/>
  <text x="1082" y="456" text-anchor="middle" class="text">16 · Attention</text>
  <text x="1082" y="483" text-anchor="middle" class="small">QKV · mask · heads</text>
  <text x="1082" y="507" text-anchor="middle" class="small">匹配与聚合</text>
</svg>
