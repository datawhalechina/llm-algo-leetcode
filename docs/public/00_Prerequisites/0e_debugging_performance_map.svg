<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">0E：运行有效后，按耗时或容量问题选择检查</title><desc id="desc">19检查运行有效性，无效时定位复现并返回检查；有效时按耗时或容量问题选择17或18，再进入20实验比较。17实际采集CPU记录，18估算容量并使用构造快照，20练习比较示例记录。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.reading{stroke-dasharray:7 5}.node{stroke-width:2}</style></defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">0E：运行有效后，按耗时或容量问题选择检查</text>
<text class="note" x="640" y="76" text-anchor="middle">17 实际采集 CPU 记录；18 估算容量并使用构造快照；20 练习比较示例记录。</text>
<rect class="node" x="430" y="110" width="420" height="80" rx="12" fill="#faf5ff" stroke="#a78bfa"/><text class="head" x="640" y="142" text-anchor="middle">19 检查运行有效性</text><text class="note" x="640" y="168" text-anchor="middle">输出、有限值与梯度</text>
<rect class="node" x="40" y="280" width="260" height="80" rx="12" fill="#fef2f2" stroke="#f87171"/><text class="head" x="170" y="312" text-anchor="middle">定位并最小复现</text><text class="note" x="170" y="338" text-anchor="middle">固定条件，修复首个失败点</text>
<rect class="node" x="420" y="280" width="320" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="580" y="312" text-anchor="middle">17 耗时检查</text><text class="note" x="580" y="338" text-anchor="middle">CPU 计时、轨迹与阶段事件</text>
<rect class="node" x="880" y="280" width="360" height="80" rx="12" fill="#fffbeb" stroke="#fbbf24"/><text class="head" x="1060" y="312" text-anchor="middle">18 容量检查</text><text class="note" x="1060" y="338" text-anchor="middle">对象容量估算与构造快照</text>
<rect class="node" x="430" y="450" width="420" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text class="head" x="640" y="482" text-anchor="middle">20 固定条件比较</text><text class="note" x="640" y="508" text-anchor="middle">检查质量、失败率与尾延迟</text>
<path class="edge" d="M490 190V230H170V280"/>
<text class="note" x="300" y="218" text-anchor="middle">运行无效</text>
<path class="edge" d="M580 190V280"/>
<text class="note" x="660" y="247" text-anchor="middle">有效：耗时问题</text>
<path class="edge" d="M760 190V230H1060V280"/>
<text class="note" x="974" y="218" text-anchor="middle">有效：容量问题</text>
<path class="edge reading" d="M40 320H20V150H430"/>
<text class="note" x="234" y="137" text-anchor="middle">修复后重新检查</text>
<path class="edge" d="M580 360V450"/>
<path class="edge" d="M1060 360V410H750V450"/>
</svg>
