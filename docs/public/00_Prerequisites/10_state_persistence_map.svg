<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">模型产物与训练 checkpoint 的两条恢复路径</title>
  <desc id="desc">模型产物保存模型配置与模型状态并检查结构兼容；训练 checkpoint 额外保存更新、随机、进度和验证状态，并通过恢复后继续一步验证轨迹。</desc>
  <defs>
    <marker id="arrow10" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.subtitle{font-size:14px;fill:#475569}.heading{font-size:17px;font-weight:700}.label{font-size:15px;font-weight:700}.note{font-size:13px;fill:#475569}.panel{stroke:#94a3b8;stroke-width:2}.node{fill:#fff;stroke:#a8b3c7;stroke-width:1.7}.line{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow10)}
    </style>
  </defs>
  <rect width="1200" height="460" fill="#f8fafc"/>
  <text x="600" y="40" text-anchor="middle" class="title">持久化：发布模型与恢复训练需要不同状态</text>
  <text x="600" y="67" text-anchor="middle" class="subtitle">模型产物回答“怎样重建模型”，训练 checkpoint 还要回答“怎样从同一时间点继续”</text>

  <rect x="35" y="105" width="1130" height="130" rx="16" fill="#e0f2fe" class="panel" data-layout-role="panel"/>
  <text x="62" y="137" class="heading">模型产物</text>
  <rect x="180" y="135" width="225" height="70" rx="10" class="node"/><text x="292" y="163" text-anchor="middle" class="label">模型配置 + model state</text><text x="292" y="185" text-anchor="middle" class="note">格式版本、构造参数、parameter / buffer</text>
  <rect x="505" y="135" width="225" height="70" rx="10" class="node"/><text x="617" y="163" text-anchor="middle" class="label">结构兼容检查</text><text x="617" y="185" text-anchor="middle" class="note">strict 或 missing / unexpected keys</text>
  <rect x="830" y="135" width="225" height="70" rx="10" class="node"/><text x="942" y="163" text-anchor="middle" class="label">新模型实例</text><text x="942" y="185" text-anchor="middle" class="note">状态与前向结果可核验</text>
  <path d="M405 170H500" class="line"/><path d="M730 170H825" class="line"/>

  <rect x="35" y="260" width="1130" height="165" rx="16" fill="#dcfce7" class="panel" data-layout-role="panel"/>
  <text x="62" y="292" class="heading">训练 checkpoint</text>
  <rect x="180" y="290" width="260" height="105" rx="10" class="node"/>
  <text x="310" y="317" text-anchor="middle" class="label">同一保存时刻的完整状态</text>
  <text x="310" y="341" text-anchor="middle" class="note">模型 · 优化器 · 调度器</text>
  <text x="310" y="363" text-anchor="middle" class="note">随机状态 · 训练进度 · 验证状态</text>
  <rect x="515" y="290" width="220" height="105" rx="10" class="node"/><text x="625" y="323" text-anchor="middle" class="label">恢复全部对象</text><text x="625" y="349" text-anchor="middle" class="note">epoch / micro-step</text><text x="625" y="371" text-anchor="middle" class="note">optimizer-step 对齐</text>
  <rect x="810" y="290" width="245" height="105" rx="10" class="node"/><text x="932" y="323" text-anchor="middle" class="label">继续执行一步</text><text x="932" y="349" text-anchor="middle" class="note">随机输入、损失与参数</text><text x="932" y="371" text-anchor="middle" class="note">和未中断路径一致</text>
  <path d="M440 342H510" class="line"/><path d="M735 342H805" class="line"/>
</svg>
