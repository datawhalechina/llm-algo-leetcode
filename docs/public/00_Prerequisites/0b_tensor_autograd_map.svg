<text class="note" x="242" y="290" text-anchor="middle">参与前向计算</text>
<text class="note" x="630" y="328" text-anchor="middle">07 自动求导：从前向追踪到反向</text>
<text class="note" x="1115" y="328" text-anchor="middle">08 梯度控制</text>
<rect class="node" x="40" y="360" width="250" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text class="head" x="165" y="392" text-anchor="middle">前向运算</text><text class="note" x="165" y="418" text-anchor="middle">输入与参数形成输出</text>
<rect class="node" x="350" y="360" width="250" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text class="head" x="475" y="392" text-anchor="middle">计算图</text><text class="note" x="475" y="418" text-anchor="middle">记录可求导运算关系</text>
<rect class="node" x="680" y="360" width="250" height="80" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text class="head" x="805" y="392" text-anchor="middle">反向传播</text><text class="note" x="805" y="418" text-anchor="middle">沿图传递并汇合梯度</text>
<rect class="node" x="990" y="360" width="250" height="80" rx="12" fill="#faf5ff" stroke="#a78bfa"/><text class="head" x="1115" y="392" text-anchor="middle">梯度控制</text><text class="note" x="1115" y="418" text-anchor="middle">累积、清理、冻结与关闭</text>
