<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">0B：张量与存储 → 布局与索引 → 反向传播 → 梯度控制</title><desc id="desc">05检查张量属性、共享与复制；06检查布局和索引；07追踪局部反向和分支梯度汇合；08检查累积、清理、冻结与关闭梯度。箭头表示推荐阅读顺序。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="520" fill="#f8fafc"/>
<text x="640" y="45" text-anchor="middle" class="title">0B：张量与存储 → 布局与索引 → 反向传播 → 梯度控制</text>
<text x="640" y="76" text-anchor="middle" class="subtitle">先核对数据内容和位置，再追踪梯度来源与控制方式</text>
<rect x="40" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="160" y="237" text-anchor="middle" class="head">05 张量与存储</text><text x="160" y="264" text-anchor="middle" class="body">形状、类型、设备</text><text x="160" y="291" text-anchor="middle" class="body">共享还是复制</text>
<rect x="360" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="480" y="237" text-anchor="middle" class="head">06 布局与索引</text><text x="480" y="264" text-anchor="middle" class="body">步长、连续性与掩码</text><text x="480" y="291" text-anchor="middle" class="body">形状和元素往返</text>
<rect x="680" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="800" y="237" text-anchor="middle" class="head">07 反向传播</text><text x="800" y="264" text-anchor="middle" class="body">局部导数与保存张量</text><text x="800" y="291" text-anchor="middle" class="body">分支梯度汇合</text>
<rect x="1000" y="205" width="240" height="110" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1120" y="237" text-anchor="middle" class="head">08 梯度控制</text><text x="1120" y="264" text-anchor="middle" class="body">累积、清理与冻结</text><text x="1120" y="291" text-anchor="middle" class="body">检查计算图连接</text>
<path d="M280 260H360" class="edge"/>
<path d="M600 260H680" class="edge"/>
<path d="M920 260H1000" class="edge"/>
</svg>
