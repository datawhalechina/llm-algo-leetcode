<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">0B：先检查张量，再追踪计算图与梯度</title><desc id="desc">上层依次阅读05张量属性、共享复制和06布局索引；张量用于前向计算，下层追踪07计算图与反向传播，以及08梯度控制。虚线是阅读顺序，实线是参与计算或梯度处理关系。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627a"/></marker><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.note{font-size:15px;fill:#475569}.head{font-size:18px;font-weight:700}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}.reading{stroke-dasharray:7 5}.node{stroke-width:2}</style></defs>
<rect width="1280" height="560" fill="#f8fafc"/>
<text class="title" x="640" y="45" text-anchor="middle">0B：先检查张量，再追踪计算图与梯度</text>
<text class="note" x="640" y="76" text-anchor="middle">虚线：推荐阅读；实线：参与计算或梯度处理。上下两层分别回答数据与梯度问题。</text>
<text class="note" x="320" y="125" text-anchor="middle">05 张量基础</text>
<text class="note" x="960" y="125" text-anchor="middle">06 布局与索引</text>
<rect class="node" x="40" y="150" width="250" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="165" y="182" text-anchor="middle">张量属性</text><text class="note" x="165" y="208" text-anchor="middle">形状、数据类型与设备</text>
<rect class="node" x="350" y="150" width="250" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="475" y="182" text-anchor="middle">共享与复制</text><text class="note" x="475" y="208" text-anchor="middle">修改是否影响原张量</text>
<rect class="node" x="680" y="150" width="250" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="805" y="182" text-anchor="middle">张量布局</text><text class="note" x="805" y="208" text-anchor="middle">步长、转置与连续性</text>
<rect class="node" x="990" y="150" width="250" height="80" rx="12" fill="#eff6ff" stroke="#60a5fa"/><text class="head" x="1115" y="182" text-anchor="middle">索引结果</text><text class="note" x="1115" y="208" text-anchor="middle">取出位置与形状往返</text>
